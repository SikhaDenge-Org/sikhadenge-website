name: WhatsApp Agent Restore Last Working Runtime Temp

on:
  push:
    branches:
      - release/whatsapp-instagram-agent-flow-20260731
    paths:
      - ".github/workflows/whatsapp-agent-restore-last-working-runtime-temp.yml"

permissions:
  contents: read

concurrency:
  group: whatsapp-agent-production
  cancel-in-progress: false

jobs:
  restore-last-working-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
      EXPECTED_OLD_SOURCE_SHA: 28b813ca9936fe0b9d3874f7ebf6b0dfeef0b242
      EXPECTED_OLD_RUNTIME_BUILD: ZvzV6QBBngX3s_X5xxUnk

    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          for v in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_HOST_KEY; do
            test -n "${!v:-}" || { echo "Missing $v" >&2; exit 2; }
          done
          if [[ -z "${SSH_PORT:-}" ]]; then echo 'SSH_PORT=22' >> "$GITHUB_ENV"; SSH_PORT=22; fi
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"
          fi
          chmod 600 "$KEY"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          test -n "$key_material"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$KEY" >/dev/null

      - name: Canonical application rollback to exact last-working runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" \
            "EXPECTED_OLD_SOURCE_SHA='$EXPECTED_OLD_SOURCE_SHA' EXPECTED_OLD_RUNTIME_BUILD='$EXPECTED_OLD_RUNTIME_BUILD' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          LIVE_APP=/var/www/sikhadenge-whatsapp-agent/source/apps/whatsapp-agent-dashboard
          BACKUP_DIR=/root/sikhadenge-backups/engageos-github-34947108888-1
          PUBLIC_URL=https://whatsapp.sikhadenge.in
          ROLLBACK_SCRIPT="$LIVE_APP/scripts/engageos-production-rollback.sh"

          test -f "$BACKUP_DIR/deploy-state.txt"
          test -x "$ROLLBACK_SCRIPT" || test -f "$ROLLBACK_SCRIPT"

          state_value() {
            local key="$1"
            awk -F= -v key="$key" '$1 == key {sub($1 "=", ""); print; exit}' "$BACKUP_DIR/deploy-state.txt"
          }

          old_source_sha="$(state_value OLD_SOURCE_SHA)"
          old_runtime_build="$(state_value OLD_RUNTIME_BUILD_ID)"
          runtime_app="$(state_value RUNTIME_APP)"
          runtime_old_next="$(state_value RUNTIME_OLD_NEXT)"

          echo "ROLLBACK_OLD_SOURCE_SHA=$old_source_sha"
          echo "ROLLBACK_OLD_RUNTIME_BUILD_ID=$old_runtime_build"
          echo "ROLLBACK_RUNTIME_APP=$runtime_app"
          echo "ROLLBACK_RUNTIME_OLD_NEXT=$runtime_old_next"

          test "$old_source_sha" = "$EXPECTED_OLD_SOURCE_SHA"
          test "$old_runtime_build" = "$EXPECTED_OLD_RUNTIME_BUILD"
          test "$runtime_app" = "/var/www/sikhadenge-whatsapp-agent/releases/reconcile-clean-28b813ca-20260915T043800Z/apps/whatsapp-agent-dashboard"
          test -d "$runtime_old_next"
          test -f "$runtime_old_next/BUILD_ID"
          test "$(cat "$runtime_old_next/BUILD_ID")" = "$EXPECTED_OLD_RUNTIME_BUILD"
          echo 'PASS: EXACT_LAST_WORKING_ROLLBACK_ARTIFACT_VERIFIED'

          LIVE_APP="$LIVE_APP" \
          BACKUP_DIR="$BACKUP_DIR" \
          PUBLIC_URL="$PUBLIC_URL" \
          bash "$ROLLBACK_SCRIPT"

          PM2_JSON=$(mktemp)
          pm2 jlist > "$PM2_JSON"
          pm2_status=$(node - "$PM2_JSON" <<'NODE'
          const fs = require('node:fs');
          const file = process.argv[2];
          const app = JSON.parse(fs.readFileSync(file, 'utf8')).find(x => x.name === 'sikhadenge-whatsapp-agent');
          if (!app) process.exit(3);
          process.stdout.write(String(app.pm2_env?.status || ''));
          NODE
          )
          pm2_cwd=$(node - "$PM2_JSON" <<'NODE'
          const fs = require('node:fs');
          const file = process.argv[2];
          const app = JSON.parse(fs.readFileSync(file, 'utf8')).find(x => x.name === 'sikhadenge-whatsapp-agent');
          if (!app?.pm2_env?.pm_cwd) process.exit(3);
          process.stdout.write(String(app.pm2_env.pm_cwd));
          NODE
          )
          rm -f "$PM2_JSON"

          runtime_build="$(cat "$pm2_cwd/.next/BUILD_ID")"
          source_sha="$(git -C "$LIVE_APP" rev-parse HEAD)"
          local_login=$(curl --max-time 15 -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/login)
          local_inbox=$(curl --max-time 15 -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/inbox)
          public_login=$(curl --max-time 15 -sS -L -o /dev/null -w '%{http_code}' "$PUBLIC_URL/login?restore-last-working=1")
          public_inbox=$(curl --max-time 15 -sS -o /dev/null -w '%{http_code}' "$PUBLIC_URL/inbox?restore-last-working=1")

          echo "RESTORED_PM2_STATUS=$pm2_status"
          echo "RESTORED_PM2_CWD=$pm2_cwd"
          echo "RESTORED_RUNTIME_BUILD=$runtime_build"
          echo "RESTORED_SOURCE_SHA=$source_sha"
          echo "LOCAL_LOGIN=$local_login"
          echo "LOCAL_INBOX=$local_inbox"
          echo "PUBLIC_LOGIN=$public_login"
          echo "PUBLIC_INBOX=$public_inbox"

          test "$pm2_status" = online
          test "$runtime_build" = "$EXPECTED_OLD_RUNTIME_BUILD"
          test "$source_sha" = "$EXPECTED_OLD_SOURCE_SHA"
          test "$local_login" = 200
          case "$local_inbox" in 200|301|302|303|307|308) ;; *) exit 41 ;; esac
          test "$public_login" = 200
          case "$public_inbox" in 200|301|302|303|307|308) ;; *) exit 42 ;; esac
          echo 'PASS: LAST_WORKING_WHATSAPP_RUNTIME_RESTORED_EXACTLY'
          REMOTE

      - name: Final public health
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(curl --max-time 15 -sS -L -o /dev/null -w '%{http_code}' 'https://whatsapp.sikhadenge.in/login?last-working-final=1')" = 200
          code=$(curl --max-time 15 -sS -o /dev/null -w '%{http_code}' 'https://whatsapp.sikhadenge.in/inbox?last-working-final=1')
          case "$code" in 200|301|302|303|307|308) ;; *) exit 1 ;; esac
          echo "PASS: LAST_WORKING_PUBLIC_HEALTHY inbox=$code"
