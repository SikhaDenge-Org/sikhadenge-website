name: Phase17 Production Runtime Login Marker Readonly

on:
  push:
    branches: [phase17-stage2-governance-v15-20260913]
    paths:
      - ".github/workflows/phase17-prod-runtime-login-marker-readonly.yml"

permissions:
  contents: read

jobs:
  inspect-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
      EXPECTED_LIVE_SHA: f651d0182861c191c041b36e96902f20d5a6da2b
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          for v in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_HOST_KEY; do test -n "${!v:-}"; done
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; echo SSH_PORT=22 >> "$GITHUB_ENV"; fi
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Inspect runtime login markers read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "EXPECTED_LIVE_SHA='$EXPECTED_LIVE_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          A=/var/www/sikhadenge-whatsapp-agent/source/apps/whatsapp-agent-dashboard
          root="$(git -C "$A" rev-parse --show-toplevel)"
          test "$(git -C "$root" rev-parse HEAD)" = "$EXPECTED_LIVE_SHA"
          tmp="$(mktemp)"; trap 'rm -f "$tmp"' EXIT
          code="$(curl -sS -L -o "$tmp" -w '%{http_code}' https://whatsapp.sikhadenge.in/login)"
          printf 'PUBLIC_LOGIN_HTTP=%s\n' "$code"
          printf 'PUBLIC_HAS_V17_SHELL=%s\n' "$(grep -q 'page01-hero-v17-shell' "$tmp" && echo true || echo false)"
          printf 'PUBLIC_HAS_V17_VERSION=%s\n' "$(grep -q '20260913-211322' "$tmp" && echo true || echo false)"
          printf 'PUBLIC_HAS_HQ_V11=%s\n' "$(grep -q 'page01-left-hq-v11' "$tmp" && echo true || echo false)"
          printf 'PUBLIC_HAS_SECURE_TEAM_ACCESS_TITLECASE=%s\n' "$(grep -q 'Secure Team Access' "$tmp" && echo true || echo false)"
          printf 'PUBLIC_HAS_SECURE_TEAM_ACCESS_UPPER=%s\n' "$(grep -q 'SECURE TEAM ACCESS' "$tmp" && echo true || echo false)"
          if [[ -f "$A/.next/BUILD_ID" ]]; then
            printf 'NEXT_BUILD_ID='; cat "$A/.next/BUILD_ID"; printf '\n'
            stat -c 'NEXT_BUILD_ID_MTIME=%y' "$A/.next/BUILD_ID"
          else
            printf 'NEXT_BUILD_ID=missing\n'
          fi
          printf 'NEXT_HAS_V17_VERSION=%s\n' "$(grep -R -q --binary-files=without-match '20260913-211322' "$A/.next" 2>/dev/null && echo true || echo false)"
          printf 'NEXT_HAS_V17_SHELL=%s\n' "$(grep -R -q --binary-files=without-match 'page01-hero-v17-shell' "$A/.next" 2>/dev/null && echo true || echo false)"
          pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"[]").find(x=>x.name==="sikhadenge-whatsapp-agent"); console.log(`PM2_STATUS=${p?.pm2_env?.status||"missing"}`); console.log(`PM2_UPTIME=${p?.pm2_env?.pm_uptime||""}`); console.log(`PM2_RESTART_TIME=${p?.pm2_env?.restart_time??""}`);})'
          REMOTE
