name: Phase17 Operator Readiness Readonly Temp

on:
  push:
    branches:
      - ops/phase17-operator-readiness-readonly-20260917-v2
    paths:
      - ".github/workflows/phase17-operator-readiness-readonly-temp.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: whatsapp-agent-production
    concurrency:
      group: whatsapp-agent-production-readonly-audit
      cancel-in-progress: false
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
      WORKSPACE_ID: engagews_default

    steps:
      - name: Configure pinned production SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          for v in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_HOST_KEY; do test -n "${!v:-}"; done
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; echo "SSH_PORT=22" >> "$GITHUB_ENV"; fi
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$key" >/dev/null

      - name: Audit exact-live Phase17 governance readiness read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "WORKSPACE_ID='$WORKSPACE_ID' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/var/www/sikhadenge-whatsapp-agent/source
          A="$ROOT/apps/whatsapp-agent-dashboard"
          E="$A/.env"

          envv() {
            node - "$E" "$1" <<'NODE'
          const fs=require('node:fs'); const [file,key]=process.argv.slice(2);
          for(const raw of fs.readFileSync(file,'utf8').split(/\r?\n/)){
            let line=raw.trim(); if(!line||line.startsWith('#')) continue;
            if(line.startsWith('export ')) line=line.slice(7).trim();
            const i=line.indexOf('='); if(i<1||line.slice(0,i).trim()!==key) continue;
            let v=line.slice(i+1).trim();
            if(v.length>=2&&((v.startsWith('"')&&v.endsWith('"'))||(v.startsWith("'")&&v.endsWith("'")))) v=v.slice(1,-1);
            process.stdout.write(v); process.exit(0);
          }
          process.exit(1);
          NODE
          }

          cd "$A"
          live_sha="$(git rev-parse HEAD)"
          release_sha="$(git -C "$ROOT" ls-remote origin refs/heads/release/whatsapp-instagram-agent-flow-20260731 | awk '{print $1}')"
          dirty="$(git status --porcelain --untracked-files=no | sed '/^$/d' | wc -l | tr -d ' ')"
          printf 'LIVE_SHA=%s\nRELEASE_SHA=%s\nLIVE_EQUALS_RELEASE=%s\nTRACKED_DIRTY_COUNT=%s\n' \
            "$live_sha" "$release_sha" "$([[ "$live_sha" = "$release_sha" ]] && echo true || echo false)" "$dirty"

          outbound="$(envv WHATSAPP_OUTBOUND_MODE 2>/dev/null || echo disabled)"
          cutover="$(envv WHATSAPP_CUTOVER_APPROVED 2>/dev/null || echo false)"
          live_ack="$(envv WHATSAPP_OUTBOUND_LIVE_ACK 2>/dev/null || true)"
          kill="$(envv WHATSAPP_OUTBOUND_KILL_SWITCH 2>/dev/null || echo on)"
          printf 'OUTBOUND_MODE=%s\nCUTOVER_APPROVED=%s\nLIVE_ACK_SET=%s\nPROVIDER_KILL_SWITCH=%s\n' \
            "$outbound" "$cutover" "$([[ -n "$live_ack" ]] && echo true || echo false)" "$kill"

          pm2_state="$(pm2 jlist 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"[]").find(x=>x.name==="sikhadenge-whatsapp-agent");process.stdout.write(String(p?.pm2_env?.status||"missing"))})')"
          pm2_cwd="$(pm2 jlist 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"[]").find(x=>x.name==="sikhadenge-whatsapp-agent");process.stdout.write(String(p?.pm2_env?.pm_cwd||""))})')"
          runtime_sha="missing"
          runtime_dirty="missing"
          if [[ -n "$pm2_cwd" && -d "$pm2_cwd/.git" ]]; then
            runtime_sha="$(git -C "$pm2_cwd" rev-parse HEAD)"
            runtime_dirty="$(git -C "$pm2_cwd" status --porcelain --untracked-files=no | sed '/^$/d' | wc -l | tr -d ' ')"
          fi
          login_http="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 https://whatsapp.sikhadenge.in/login || true)"
          printf 'PM2_STATE=%s\nLOGIN_HTTP=%s\nRUNTIME_SHA=%s\nRUNTIME_TRACKED_DIRTY_COUNT=%s\n' "$pm2_state" "$login_http" "$runtime_sha" "$runtime_dirty"

          database_url="$(envv DATABASE_URL)"
          test -n "$database_url"
          dburl="$(node scripts/prisma-postgres-cli-url.mjs "$database_url")"

          controlled="$(psql "$dburl" -X -Atqc "SELECT \"stage\"||'|'||\"mode\"||'|'||\"writePolicy\"||'|'||\"externalWritesAllowed\"||'|'||\"version\" FROM \"EngageControlledLaunchState\" WHERE \"workspaceId\"='$WORKSPACE_ID';")"
          transitions="$(psql "$dburl" -X -Atqc "SELECT COUNT(*) FROM \"EngageControlledLaunchTransition\" WHERE \"workspaceId\"='$WORKSPACE_ID';")"
          candidate_id="$(psql "$dburl" -X -Atqc "SELECT COALESCE(\"scope\"->'connectedAccountIds'->>0,'') FROM \"EngageControlledLaunchState\" WHERE \"workspaceId\"='$WORKSPACE_ID';")"
          printf 'CONTROLLED=%s\nTRANSITIONS=%s\nCANDIDATE_PRESENT=%s\n' "$controlled" "$transitions" "$([[ -n "$candidate_id" ]] && echo true || echo false)"

          if [[ -n "$candidate_id" ]]; then
            candidate="$(psql "$dburl" -X -Atqc "SELECT \"channel\"||'|'||\"status\"||'|permissionsVerified='||COALESCE(\"capabilities\"->'evidence'->>'permissionsVerified','')||'|apiVerifiedAt='||CASE WHEN COALESCE(\"capabilities\"->'evidence'->>'apiVerifiedAt','')<>'' THEN 'present' ELSE 'missing' END||'|webhookVerifiedAt='||CASE WHEN COALESCE(\"capabilities\"->'evidence'->>'webhookVerifiedAt','')<>'' THEN 'present' ELSE 'missing' END FROM \"EngageChannelConnection\" WHERE id='$candidate_id' AND \"workspaceId\"='$WORKSPACE_ID';")"
            printf 'CANDIDATE_CONNECTION=%s\n' "$candidate"
          fi

          queued="$(psql "$dburl" -X -Atqc "SELECT COUNT(*) FROM \"WhatsAppMessage\" WHERE direction='OUTBOUND' AND status='QUEUED';")"
          approvals="$(psql "$dburl" -X -Atqc "SELECT COUNT(*) FROM \"EngageControlledLaunchOutboundApproval\" WHERE \"workspaceId\"='$WORKSPACE_ID' AND \"consumedAt\" IS NULL AND \"revokedAt\" IS NULL AND \"expiresAt\">CURRENT_TIMESTAMP;")"
          printf 'QUEUED_OUTBOUND=%s\nACTIVE_EXACT_MESSAGE_APPROVALS=%s\n' "$queued" "$approvals"

          prod_ev="$(psql "$dburl" -X -Atqc "SELECT COUNT(*) FROM \"EngageSecurityAuditEvent\" WHERE \"workspaceId\"='$WORKSPACE_ID' AND action='PHASE17_PRODUCTION_EVIDENCE_RECORDED' AND outcome='VERIFIED' AND \"entityType\"='CONTROLLED_LAUNCH_GOVERNANCE' AND \"entityId\"='$live_sha' AND \"reasonCode\"='MACHINE_VERIFIED_EXACT_SHA' AND \"actorId\" IS NULL AND COALESCE(metadata->>'liveSha','')='$live_sha';")"
          policy_ev="$(psql "$dburl" -X -Atqc "SELECT COUNT(*) FROM \"EngageSecurityAuditEvent\" WHERE \"workspaceId\"='$WORKSPACE_ID' AND action='PHASE17_POLICY_VERIFIED' AND outcome='VERIFIED' AND \"entityType\"='CONTROLLED_LAUNCH_GOVERNANCE' AND \"entityId\"='$live_sha' AND \"reasonCode\"='MACHINE_VERIFIED_EXACT_SHA' AND \"actorId\" IS NULL AND COALESCE(metadata->>'liveSha','')='$live_sha';")"
          printf 'MACHINE_PRODUCTION_EVIDENCE=%s\nMACHINE_POLICY_EVIDENCE=%s\n' "$prod_ev" "$policy_ev"

          base="\"workspaceId\"='$WORKSPACE_ID' AND outcome='VERIFIED' AND \"entityType\"='CONTROLLED_LAUNCH_GOVERNANCE' AND \"entityId\"='$live_sha' AND \"reasonCode\"='OPERATOR_VERIFIED_EXACT_SHA' AND \"actorId\" IS NOT NULL AND COALESCE(\"requestId\",'')<>'' AND COALESCE(metadata->>'liveSha','')='$live_sha' AND COALESCE(metadata->>'proofRef','')<>'' AND COALESCE(metadata->>'verifiedAt','')<>''"
          critical="$(psql "$dburl" -X -Atqc "SELECT COUNT(*) FROM \"EngageSecurityAuditEvent\" WHERE $base AND action='PHASE17_CRITICAL_INCIDENT_REVIEW' AND COALESCE(metadata->>'unresolvedCriticalIncidents','')='0';")"
          duplicate="$(psql "$dburl" -X -Atqc "SELECT COUNT(*) FROM \"EngageSecurityAuditEvent\" WHERE $base AND action='PHASE17_DUPLICATE_SEND_REVIEW' AND COALESCE(metadata->>'unexplainedDuplicateSends','')='0';")"
          rollback="$(psql "$dburl" -X -Atqc "SELECT COUNT(*) FROM \"EngageSecurityAuditEvent\" WHERE $base AND action='PHASE17_ROLLBACK_REHEARSAL' AND COALESCE(metadata->>'result','')='PASS';")"
          monitoring="$(psql "$dburl" -X -Atqc "SELECT COUNT(*) FROM \"EngageSecurityAuditEvent\" WHERE $base AND action='PHASE17_MONITORING_ACTIVE' AND COALESCE(metadata->>'monitoringStatus','')='ACTIVE';")"
          scope="$(psql "$dburl" -X -Atqc "SELECT COUNT(*) FROM \"EngageSecurityAuditEvent\" WHERE $base AND action='PHASE17_STAGE2_SCOPE_APPROVED' AND COALESCE(metadata->>'candidateId','')='$candidate_id' AND COALESCE(metadata->>'decision','')='APPROVED';")"
          smoke="$(psql "$dburl" -X -Atqc "SELECT COUNT(*) FROM \"EngageSecurityAuditEvent\" WHERE $base AND action='PHASE17_AUTHENTICATED_SMOKE' AND COALESCE(metadata->>'result','')='PASS' AND COALESCE(metadata->>'authenticated','')='true' AND COALESCE(metadata->>'readOnly','')='true' AND COALESCE(metadata->>'externalWritesAttempted','')='false';")"
          runbook="$(psql "$dburl" -X -Atqc "SELECT COUNT(*) FROM \"EngageSecurityAuditEvent\" WHERE $base AND action='PHASE17_SUPPORT_RUNBOOK_ACTIVE' AND COALESCE(metadata->>'runbookStatus','')='ACTIVE';")"
          observation="$(psql "$dburl" -X -Atqc "SELECT COUNT(*) FROM \"EngageSecurityAuditEvent\" WHERE $base AND action='PHASE17_OBSERVATION_WINDOW_COMPLETE' AND COALESCE(metadata->>'complete','')='true' AND COALESCE(metadata->>'windowStartedAt','')<>'' AND COALESCE(metadata->>'windowEndedAt','')<>'';")"
          printf 'OPERATOR_CRITICAL_INCIDENT_REVIEW=%s\nOPERATOR_DUPLICATE_SEND_REVIEW=%s\nOPERATOR_ROLLBACK_REHEARSAL=%s\nOPERATOR_MONITORING_ACTIVE=%s\nOPERATOR_STAGE2_SCOPE_APPROVED=%s\nOPERATOR_AUTHENTICATED_SMOKE=%s\nOPERATOR_SUPPORT_RUNBOOK_ACTIVE=%s\nOPERATOR_OBSERVATION_WINDOW_COMPLETE=%s\n' \
            "$critical" "$duplicate" "$rollback" "$monitoring" "$scope" "$smoke" "$runbook" "$observation"

          operator_valid_total=$(( critical>0 ? 1 : 0 ))
          operator_valid_total=$(( operator_valid_total + (duplicate>0 ? 1 : 0) + (rollback>0 ? 1 : 0) + (monitoring>0 ? 1 : 0) + (scope>0 ? 1 : 0) + (smoke>0 ? 1 : 0) + (runbook>0 ? 1 : 0) + (observation>0 ? 1 : 0) ))
          printf 'OPERATOR_VALID_GATES=%s/8\n' "$operator_valid_total"

          sent6="$(psql "$dburl" -X -Atqc "SELECT COUNT(*) FROM \"WhatsAppMessage\" WHERE direction='OUTBOUND' AND status IN ('SENT','DELIVERED','READ') AND \"createdAt\">=CURRENT_TIMESTAMP-INTERVAL '6 hours';")"
          failed6="$(psql "$dburl" -X -Atqc "SELECT COUNT(*) FROM \"WhatsAppMessage\" WHERE direction='OUTBOUND' AND status='FAILED' AND \"createdAt\">=CURRENT_TIMESTAMP-INTERVAL '6 hours';")"
          dup_meta6="$(psql "$dburl" -X -Atqc "SELECT COUNT(*) FROM (SELECT \"metaMessageId\" FROM \"WhatsAppMessage\" WHERE direction='OUTBOUND' AND \"metaMessageId\" IS NOT NULL AND \"createdAt\">=CURRENT_TIMESTAMP-INTERVAL '6 hours' GROUP BY \"metaMessageId\" HAVING COUNT(*)>1) d;")"
          dup_shape6="$(psql "$dburl" -X -Atqc "SELECT COUNT(*) FROM (SELECT \"conversationId\",COALESCE(text,''),date_trunc('second',\"messageTimestamp\") FROM \"WhatsAppMessage\" WHERE direction='OUTBOUND' AND status IN ('SENT','DELIVERED','READ') AND \"createdAt\">=CURRENT_TIMESTAMP-INTERVAL '6 hours' GROUP BY \"conversationId\",COALESCE(text,''),date_trunc('second',\"messageTimestamp\") HAVING COUNT(*)>1) d;")"
          security_bad6="$(psql "$dburl" -X -Atqc "SELECT COUNT(*) FROM \"EngageSecurityAuditEvent\" WHERE \"workspaceId\"='$WORKSPACE_ID' AND outcome IN ('DENIED','FAILED') AND \"occurredAt\">=CURRENT_TIMESTAMP-INTERVAL '6 hours';")"
          webhook_errors6="$(psql "$dburl" -X -Atqc "SELECT COUNT(*) FROM \"WebhookEvent\" WHERE \"processingError\" IS NOT NULL AND \"receivedAt\">=CURRENT_TIMESTAMP-INTERVAL '6 hours';")"
          printf 'FORENSIC_WINDOW_HOURS=6\nOUTBOUND_SENTLIKE_6H=%s\nOUTBOUND_FAILED_6H=%s\nDUPLICATE_META_ID_GROUPS_6H=%s\nDUPLICATE_SAME_CONVERSATION_TEXT_SECOND_GROUPS_6H=%s\nSECURITY_DENIED_OR_FAILED_6H=%s\nWEBHOOK_PROCESSING_ERRORS_6H=%s\n' \
            "$sent6" "$failed6" "$dup_meta6" "$dup_shape6" "$security_bad6" "$webhook_errors6"

          printf 'SUPPORT_RUNBOOK_FILE=%s\nROLLBACK_SCRIPT_FILE=%s\nREADINESS_SCRIPT_FILE=%s\nOPERATOR_RECORDER_FILE=%s\n' \
            "$([[ -f docs/engageos/PHASE_17_STAGE2_SUPPORT_RUNBOOK.md ]] && echo present || echo missing)" \
            "$([[ -f scripts/engageos-production-rollback.sh ]] && echo present || echo missing)" \
            "$([[ -f scripts/engageos-phase17-production-readiness.sh ]] && echo present || echo missing)" \
            "$([[ -f scripts/engageos-phase17-stage2-record-operator-evidence.ts ]] && echo present || echo missing)"

          printf 'STATE_MUTATED=false\nOPERATOR_EVIDENCE_RECORDED=false\nSTATE_TRANSITIONED=false\nEXACT_MESSAGE_APPROVAL_CREATED=false\nEXTERNAL_WHATSAPP_WRITE_SENT=false\n'
          REMOTE