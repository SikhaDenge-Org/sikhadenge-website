name: WhatsApp Agent Email Inbound Activate

on:
  push:
    branches:
      - release/whatsapp-instagram-agent-flow-20260731
    paths:
      - "apps/whatsapp-agent-dashboard/docs/email-inbound-live-activation-trigger.md"
  workflow_dispatch:
    inputs:
      deployed_sha:
        description: Optional exact deployed SHA assertion; leave empty to discover live runtime
        required: false
        type: string

permissions:
  contents: read

jobs:
  email-inbound-activate:
    concurrency:
      group: whatsapp-agent-production
      cancel-in-progress: false

    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
      REQUESTED_DEPLOYED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.deployed_sha || '' }}
      ACTIVATION_RUN_ID: email-inbound-activate-${{ github.run_id }}-${{ github.run_attempt }}
      ACTIVATION_ACCOUNT: support@sikhadenge.in
      ACTIVATION_WORKSPACE_ID: engagews_default
    steps:
      - name: Checkout reviewed release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build critical Email runtime parity manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          declare -A files=(
            [EXPECTED_ACTIVATE_SH]="apps/whatsapp-agent-dashboard/scripts/email-inbound-production-activate.sh"
            [EXPECTED_ACTIVATE_TS]="apps/whatsapp-agent-dashboard/scripts/email-inbound-production-activate.ts"
            [EXPECTED_READINESS_TS]="apps/whatsapp-agent-dashboard/scripts/email-inbound-production-readiness.ts"
            [EXPECTED_GMAIL_SERVICE]="apps/whatsapp-agent-dashboard/modules/email-automation/inbound/gmail-inbound-service.ts"
            [EXPECTED_GMAIL_ADAPTER]="apps/whatsapp-agent-dashboard/modules/email-automation/providers/gmail/gmail-adapter.ts"
            [EXPECTED_EMAIL_SCHEDULER]="apps/whatsapp-agent-dashboard/modules/email-automation/automation/scheduler.ts"
            [EXPECTED_PROCESS_ROUTE]="apps/whatsapp-agent-dashboard/app/api/internal/email/automation/process/route.ts"
            [EXPECTED_SCHEDULER_VERIFY]="apps/whatsapp-agent-dashboard/scripts/email-automation-scheduler-verify.sh"
          )
          for variable_name in "${!files[@]}"; do
            file="${files[$variable_name]}"
            test -f "$file"
            blob="$(git hash-object "$file")"
            [[ "$blob" =~ ^[0-9a-f]{40}$ ]]
            printf '%s=%s\n' "$variable_name" "$blob" >> "$GITHUB_ENV"
          done

      - name: Validate trigger and production secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -n "$REQUESTED_DEPLOYED_SHA" ]]; then
            [[ "$REQUESTED_DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]]
          fi
          [[ "$ACTIVATION_ACCOUNT" == "support@sikhadenge.in" ]]
          [[ "$ACTIVATION_WORKSPACE_ID" == "engagews_default" ]]
          missing=0
          for variable_name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_HOST_KEY; do
            [[ -n "${!variable_name:-}" ]] || { echo "Missing production secret: $variable_name" >&2; missing=1; }
          done
          test "$missing" = "0"
          if [[ -z "${SSH_PORT:-}" ]]; then echo 'SSH_PORT=22' >> "$GITHUB_ENV"; fi

      - name: Configure pinned SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$key" >/dev/null

      - name: Activate guarded Gmail inbound
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "REQUESTED_DEPLOYED_SHA='$REQUESTED_DEPLOYED_SHA' RUN_ID='$ACTIVATION_RUN_ID' ACCOUNT='$ACTIVATION_ACCOUNT' WORKSPACE_ID='$ACTIVATION_WORKSPACE_ID' EXPECTED_ACTIVATE_SH='$EXPECTED_ACTIVATE_SH' EXPECTED_ACTIVATE_TS='$EXPECTED_ACTIVATE_TS' EXPECTED_READINESS_TS='$EXPECTED_READINESS_TS' EXPECTED_GMAIL_SERVICE='$EXPECTED_GMAIL_SERVICE' EXPECTED_GMAIL_ADAPTER='$EXPECTED_GMAIL_ADAPTER' EXPECTED_EMAIL_SCHEDULER='$EXPECTED_EMAIL_SCHEDULER' EXPECTED_PROCESS_ROUTE='$EXPECTED_PROCESS_ROUTE' EXPECTED_SCHEDULER_VERIFY='$EXPECTED_SCHEDULER_VERIFY' bash -s" <<'REMOTE' | tee email-inbound-activation.log
          set -Eeuo pipefail
          APP=/var/www/sikhadenge-whatsapp-agent/source/apps/whatsapp-agent-dashboard
          test "$(id -u)" = "0"
          cd "$APP"

          DEPLOYED_SHA="$(git rev-parse HEAD)"
          [[ "$DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ -n "${REQUESTED_DEPLOYED_SHA:-}" ]]; then
            test "$DEPLOYED_SHA" = "$REQUESTED_DEPLOYED_SHA"
          fi

          latest_evidence=""
          latest_mtime=0
          shopt -s nullglob
          for candidate in /root/sikhadenge-backups/engageos-github-*/post-deploy-evidence.txt; do
            candidate_mtime="$(stat -c %Y "$candidate" 2>/dev/null || printf '0')"
            if [[ "$candidate_mtime" =~ ^[0-9]+$ ]] && (( candidate_mtime > latest_mtime )); then
              latest_mtime="$candidate_mtime"
              latest_evidence="$candidate"
            fi
          done
          shopt -u nullglob
          test -n "$latest_evidence"
          read_evidence_value() {
            local key="$1"
            awk -F= -v key="$key" '$1 == key {sub(/^[^=]*=/, ""); print; exit}' "$latest_evidence"
          }
          CERTIFIED_RELEASE_SHA="$(read_evidence_value RELEASE_SHA)"
          CERTIFIED_BUILD_ID="$(read_evidence_value BUILD_ID)"
          CERTIFIED_PM2_STATUS="$(read_evidence_value PM2_STATUS)"
          CERTIFIED_PM2_CWD="$(read_evidence_value PM2_CWD)"
          test "$CERTIFIED_RELEASE_SHA" = "$DEPLOYED_SHA"
          test -n "$CERTIFIED_BUILD_ID"
          test "$CERTIFIED_PM2_STATUS" = "online"
          test "$(cat "$APP/.next/BUILD_ID")" = "$CERTIFIED_BUILD_ID"

          PM2_SNAPSHOT="$(mktemp)"
          trap 'rm -f "$PM2_SNAPSHOT"' EXIT
          pm2 jlist > "$PM2_SNAPSHOT"
          IFS='|' read -r START_PM2_PID START_PM2_STATUS START_PM2_CWD < <(
            node - "$PM2_SNAPSHOT" <<'NODE'
          const fs=require('node:fs');
          const rows=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const p=rows.find(x=>x.name==='sikhadenge-whatsapp-agent');
          process.stdout.write(p ? [p.pid||'',p.pm2_env?.status||'',p.pm2_env?.pm_cwd||''].join('|') + '\n' : '||\n');
          NODE
          )
          test "$START_PM2_STATUS" = "online"
          test -n "$START_PM2_PID"
          test "$START_PM2_CWD" = "$CERTIFIED_PM2_CWD"
          test "$(cat "$START_PM2_CWD/.next/BUILD_ID")" = "$CERTIFIED_BUILD_ID"
          printf 'DISCOVERED_DEPLOYED_SHA=%s\n' "$DEPLOYED_SHA"
          printf 'CERTIFIED_BUILD_ID=%s\n' "$CERTIFIED_BUILD_ID"
          printf 'START_PM2_PID=%s\n' "$START_PM2_PID"

          declare -A critical_files=(
            [EXPECTED_ACTIVATE_SH]="scripts/email-inbound-production-activate.sh"
            [EXPECTED_ACTIVATE_TS]="scripts/email-inbound-production-activate.ts"
            [EXPECTED_READINESS_TS]="scripts/email-inbound-production-readiness.ts"
            [EXPECTED_GMAIL_SERVICE]="modules/email-automation/inbound/gmail-inbound-service.ts"
            [EXPECTED_GMAIL_ADAPTER]="modules/email-automation/providers/gmail/gmail-adapter.ts"
            [EXPECTED_EMAIL_SCHEDULER]="modules/email-automation/automation/scheduler.ts"
            [EXPECTED_PROCESS_ROUTE]="app/api/internal/email/automation/process/route.ts"
            [EXPECTED_SCHEDULER_VERIFY]="scripts/email-automation-scheduler-verify.sh"
          )
          parity_failures=0
          for variable_name in "${!critical_files[@]}"; do
            relative="${critical_files[$variable_name]}"
            expected="${!variable_name:-}"
            actual="$(git hash-object "$relative" 2>/dev/null || true)"
            if [[ ! "$expected" =~ ^[0-9a-f]{40}$ || "$actual" != "$expected" ]]; then
              printf 'CRITICAL_PARITY=FAIL variable=%s file=%s expected=%s actual=%s\n' "$variable_name" "$relative" "$expected" "$actual"
              parity_failures=$((parity_failures+1))
            else
              printf 'CRITICAL_PARITY=PASS file=%s blob=%s\n' "$relative" "$actual"
            fi
          done
          (( parity_failures == 0 )) || exit 43
          printf 'CRITICAL_EMAIL_RUNTIME_PARITY=PASS\n'

          APPLY=1 LIVE_APP="$APP" ENV_FILE="$APP/.env" EXPECTED_RELEASE_SHA="$DEPLOYED_SHA" RUN_ID="$RUN_ID" \
            EMAIL_INBOUND_ACTIVATION_ACCOUNT="$ACCOUNT" EMAIL_INBOUND_ACTIVATION_WORKSPACE_ID="$WORKSPACE_ID" bash scripts/email-inbound-production-activate.sh
          REMOTE

      - name: Collect protected activation evidence
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p email-inbound-activation-evidence
          for file_name in inbound-activation-result.txt inbound-activation.json inbound-runtime-health.json post-activation-readiness.json; do
            scp -P "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ConnectionAttempts=1 \
              "$SSH_USER@$SSH_HOST:/root/sikhadenge-backups/${ACTIVATION_RUN_ID}/${file_name}" "email-inbound-activation-evidence/${file_name}" >/dev/null 2>&1 || true
          done
          chmod -R go-rwx email-inbound-activation-evidence 2>/dev/null || true

      - name: Verify activation evidence integrity
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          dir="email-inbound-activation-evidence"
          result="$dir/inbound-activation-result.txt"
          activation="$dir/inbound-activation.json"
          health="$dir/inbound-runtime-health.json"
          post="$dir/post-activation-readiness.json"
          test -s "$result"
          test -s "$activation"
          test -s "$health"
          test -s "$post"
          grep -qx 'STATUS=PASS_EMAIL_INBOUND_ENABLED' "$result"
          jq -e --arg account "$ACTIVATION_ACCOUNT" --arg workspace "$ACTIVATION_WORKSPACE_ID" '
            .status == "PASS" and
            .account == $account and
            .activationWorkspaceId == $workspace and
            .workspaceId == $workspace and
            (.initialization.persisted == true) and
            (.initialization.historyId | type == "string" and length > 0) and
            (.sync.discovered | type == "number") and
            (.sync.imported | type == "number") and
            (.sync.replayed | type == "number")
          ' "$activation" >/dev/null
          jq -e '
            .runtimeMode == "DRY_RUN" and
            .externalWritesEnabled == false and
            .inboundSyncEnabled == true
          ' "$health" >/dev/null
          jq -e --arg account "$ACTIVATION_ACCOUNT" --arg workspace "$ACTIVATION_WORKSPACE_ID" '
            .status == "READY" and
            .activationAccount == $account and
            .activationWorkspaceId == $workspace and
            .inboundSyncEnabled == true and
            .runtimeMode == "DRY_RUN" and
            .externalWritesEnabled == false and
            .checks.gmailInboundReadAccess == true and
            (.activationCursorReadyConnections == 1)
          ' "$post" >/dev/null
          printf 'PASS: EMAIL_INBOUND_ACTIVATION_EVIDENCE_VERIFIED\n'

      - name: Publish activation summary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          dir="email-inbound-activation-evidence"
          {
            echo "## Email inbound production activation"
            echo
            discovered_sha="$(awk -F= '/^DISCOVERED_DEPLOYED_SHA=/{print $2}' email-inbound-activation.log | tail -1 || true)"
            if [[ -z "$discovered_sha" ]]; then discovered_sha="${REQUESTED_DEPLOYED_SHA:-unknown}"; fi
            echo "- Target SHA: \`$discovered_sha\`"
            echo "- Activation account: \`$ACTIVATION_ACCOUNT\`"
            echo "- Activation workspace: \`$ACTIVATION_WORKSPACE_ID\`"
            if [[ -s "$dir/inbound-activation-result.txt" ]]; then
              echo "- Result: \`$(tr '\n' ' ' < "$dir/inbound-activation-result.txt" | sed 's/[[:space:]]*$//')\`"
            else
              echo "- Result: \`NO_EVIDENCE\`"
            fi
            if [[ -s "$dir/inbound-activation.json" ]]; then
              echo "- Mode: \`$(jq -r '.inboundMode // "unknown"' "$dir/inbound-activation.json")\`"
              echo "- Cursor persisted: \`$(jq -r '.initialization.persisted // false' "$dir/inbound-activation.json")\`"
              echo "- Imported: \`$(jq -r '.sync.imported // 0' "$dir/inbound-activation.json")\`"
              echo "- Replayed: \`$(jq -r '.sync.replayed // 0' "$dir/inbound-activation.json")\`"
            fi
            if [[ -s "$dir/inbound-runtime-health.json" ]]; then
              echo "- Runtime mode: \`$(jq -r '.runtimeMode // "unknown"' "$dir/inbound-runtime-health.json")\`"
              echo "- External writes: \`$(jq -r '.externalWritesEnabled // "unknown"' "$dir/inbound-runtime-health.json")\`"
              echo "- Inbound sync enabled: \`$(jq -r '.inboundSyncEnabled // "unknown"' "$dir/inbound-runtime-health.json")\`"
            fi
            if [[ -s "$dir/post-activation-readiness.json" ]]; then
              echo "- Post-activation readiness: \`$(jq -r '.status // "unknown"' "$dir/post-activation-readiness.json")\`"
              echo "- Gmail read access: \`$(jq -r '.checks.gmailInboundReadAccess // false' "$dir/post-activation-readiness.json")\`"
              echo "- Activation cursor ready: \`$(jq -r '.activationCursorReadyConnections // 0' "$dir/post-activation-readiness.json")\`"
              echo "- Cursor-ready Gmail connections (all): \`$(jq -r '.cursorReadyGmailConnections // 0' "$dir/post-activation-readiness.json")\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload protected activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-agent-email-inbound-activation-${{ env.ACTIVATION_RUN_ID }}
          path: |
            email-inbound-activation.log
            email-inbound-activation-evidence
          if-no-files-found: error
          retention-days: 14
