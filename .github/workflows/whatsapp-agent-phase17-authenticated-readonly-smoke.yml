name: WhatsApp Agent Phase17 Authenticated Readonly Smoke

on:
  workflow_dispatch:
    inputs:
      expected_live_sha:
        description: Exact production release SHA to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  authenticated-readonly-smoke:
    concurrency:
      group: whatsapp-agent-production
      cancel-in-progress: false
    runs-on: [self-hosted, Linux, X64, sikhadenge-ci]
    timeout-minutes: 10
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
      EXPECTED_LIVE_SHA: ${{ inputs.expected_live_sha }}
      RELEASE_BRANCH: release/whatsapp-instagram-agent-flow-20260731

    steps:
      - name: Validate exact SHA against approved release tip
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$EXPECTED_LIVE_SHA" =~ ^[0-9a-f]{40}$ ]]
          release_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/$RELEASE_BRANCH" --jq '.commit.sha')"
          test "$release_sha" = "$EXPECTED_LIVE_SHA"
          printf 'APPROVED_RELEASE_SHA=%s\n' "$release_sha"

      - name: Configure pinned production SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          for v in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_HOST_KEY; do test -n "${!v:-}"; done
          if [[ -z "${SSH_PORT:-}" ]]; then echo SSH_PORT=22 >> "$GITHUB_ENV"; SSH_PORT=22; fi
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$key" >/dev/null

      - name: Run authenticated readonly analytics smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "EXPECTED_LIVE_SHA='$EXPECTED_LIVE_SHA' bash -s" <<'REMOTE' | tee authenticated-readonly-smoke.txt
          set -Eeuo pipefail
          APP=/var/www/sikhadenge-whatsapp-agent/source/apps/whatsapp-agent-dashboard
          ENV_FILE="$APP/.env"
          PUBLIC_URL=https://whatsapp.sikhadenge.in

          read_env() {
            node - "$ENV_FILE" "$1" <<'NODE'
          const fs=require('node:fs'); const [file,key]=process.argv.slice(2);
          for(const raw of fs.readFileSync(file,'utf8').split(/\r?\n/)){
            let line=raw.trim(); if(!line||line.startsWith('#')) continue;
            if(line.startsWith('export ')) line=line.slice(7).trim();
            const i=line.indexOf('='); if(i<1||line.slice(0,i).trim()!==key) continue;
            let value=line.slice(i+1).trim();
            if(value.length>=2&&((value.startsWith('"')&&value.endsWith('"'))||(value.startsWith("'")&&value.endsWith("'")))) value=value.slice(1,-1);
            process.stdout.write(value); process.exit(0);
          }
          process.exit(1);
          NODE
          }

          live_sha="$(git -C "$APP" rev-parse HEAD)"
          dirty="$(git -C "$APP" status --porcelain --untracked-files=no | sed '/^$/d' | wc -l | tr -d ' ')"
          test "$live_sha" = "$EXPECTED_LIVE_SHA"
          test "$dirty" = "0"

          token="$(read_env WHATSAPP_ANALYTICS_TOKEN 2>/dev/null || true)"
          if [[ -z "$token" ]]; then token="$(read_env WHATSAPP_AGENT_ANALYTICS_TOKEN 2>/dev/null || true)"; fi
          test -n "$token"

          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          http="$(curl -sS -o "$tmp" -w '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/json' \
            "$PUBLIC_URL/api/analytics/overview")"
          test "$http" = "200"

          node - "$tmp" <<'NODE'
          const fs=require('node:fs');
          const body=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if (!body || typeof body !== 'object') process.exit(1);
          if (!Number.isInteger(body.periodDays) || body.periodDays !== 30) process.exit(1);
          if (!body.totals || typeof body.totals !== 'object') process.exit(1);
          if (typeof body.generatedAt !== 'string' || !Number.isFinite(Date.parse(body.generatedAt))) process.exit(1);
          NODE

          pm2_state="$(pm2 jlist 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"[]").find(x=>x.name==="sikhadenge-whatsapp-agent");process.stdout.write(String(p?.pm2_env?.status||"missing"))})')"
          test "$pm2_state" = "online"

          printf 'LIVE_SHA=%s\n' "$live_sha"
          printf 'TRACKED_DIRTY_COUNT=%s\n' "$dirty"
          printf 'PM2_STATE=%s\n' "$pm2_state"
          printf 'AUTHENTICATED=true\n'
          printf 'READ_ONLY=true\n'
          printf 'HTTP_METHOD=GET\n'
          printf 'HTTP_STATUS=%s\n' "$http"
          printf 'ENDPOINT=/api/analytics/overview\n'
          printf 'EXTERNAL_WRITES_ATTEMPTED=false\n'
          printf 'RESULT=PASS\n'
          printf 'PASS: PHASE17_AUTHENTICATED_READONLY_SMOKE\n'
          REMOTE

      - name: Publish smoke summary
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo "## Phase17 authenticated read-only smoke"
            echo
            sed 's/^/    /' authenticated-readonly-smoke.txt
            echo
            echo "This workflow performs a single authenticated GET request to the analytics overview endpoint. It does not create a dashboard session and does not send WhatsApp messages."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase17-authenticated-readonly-smoke-${{ inputs.expected_live_sha }}
          path: authenticated-readonly-smoke.txt
          if-no-files-found: error
          retention-days: 30
