name: WhatsApp Agent Phase17 Stage2 Release Readonly Audit

on:
  push:
    branches:
      - release/whatsapp-instagram-agent-flow-20260731
    paths:
      - ".github/workflows/whatsapp-agent-phase17-stage2-readonly-audit-release.yml"

permissions:
  contents: read

concurrency:
  group: whatsapp-agent-phase17-stage2-release-readonly-audit
  cancel-in-progress: false

jobs:
  audit-stage2-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
      EXPECTED_LIVE_SHA: 37ef3b22e10c5684722d699fd3d92aa7e1d0128e

    steps:
      - name: Configure pinned production SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          for variable_name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_HOST_KEY; do test -n "${!variable_name:-}"; done
          if [[ -z "${SSH_PORT:-}" ]]; then printf 'SSH_PORT=22\n' >> "$GITHUB_ENV"; fi
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$key" >/dev/null
          printf 'PASS: STAGE2_PROBE_SSH_READY\n'

      - name: Probe Stage2 Meta candidates read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "EXPECTED_LIVE_SHA='$EXPECTED_LIVE_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          LIVE_APP=/var/www/sikhadenge-whatsapp-agent/source/apps/whatsapp-agent-dashboard
          ENV_FILE="$LIVE_APP/.env"
          WORKSPACE_ID=engagews_default

          read_env_value() {
            node - "$ENV_FILE" "$1" <<'NODE'
          const fs = require('node:fs');
          const [file, key] = process.argv.slice(2);
          const text = fs.readFileSync(file, 'utf8');
          for (const raw of text.split(/\r?\n/)) {
            const line = raw.trim(); if (!line || line.startsWith('#')) continue;
            const normalized = line.startsWith('export ') ? line.slice(7).trim() : line;
            const i = normalized.indexOf('='); if (i < 1 || normalized.slice(0, i).trim() !== key) continue;
            let value = normalized.slice(i + 1).trim();
            if (value.length >= 2 && ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'")))) value = value.slice(1, -1);
            process.stdout.write(value); process.exit(0);
          }
          process.exit(1);
          NODE
          }
          env_present() { if value="$(read_env_value "$1" 2>/dev/null)" && [[ -n "$value" ]]; then printf 'true'; else printf 'false'; fi; }
          token_shape() {
            local value=""; value="$(read_env_value "$1" 2>/dev/null || true)"
            node - "$value" <<'NODE'
          const v = process.argv[2] || '';
          const category = /^EA[A-Za-z0-9_-]+$/.test(v) ? 'META_EA' : /^IG[A-Za-z0-9_-]+$/.test(v) ? 'INSTAGRAM_IG' : /^[A-Za-z0-9._-]+$/.test(v) ? 'OPAQUE' : v ? 'NONSTANDARD' : 'EMPTY';
          process.stdout.write(`length=${v.length},category=${category},hasWhitespace=${/\s/.test(v)}`);
          NODE
          }

          live_sha="$(git -C "$LIVE_APP" rev-parse HEAD)"
          dirty_count="$(git -C "$LIVE_APP" status --porcelain --untracked-files=no | sed '/^$/d' | wc -l | tr -d ' ')"
          printf 'LIVE_SHA=%s\nTRACKED_DIRTY_COUNT=%s\n' "$live_sha" "$dirty_count"
          test "$live_sha" = "$EXPECTED_LIVE_SHA"; test "$dirty_count" = "0"

          DATABASE_URL="$(read_env_value DATABASE_URL)"
          DATABASE_CLI_URL="$(node "$LIVE_APP/scripts/prisma-postgres-cli-url.mjs" "$DATABASE_URL")"
          psql_scalar() { psql "$DATABASE_CLI_URL" -X -v ON_ERROR_STOP=1 -Atqc "$1"; }
          psql_rows() { psql "$DATABASE_CLI_URL" -X -v ON_ERROR_STOP=1 -A -F '|' -t -c "$1"; }
          state="$(psql_rows "SELECT \"stage\",\"mode\",\"writePolicy\",CASE WHEN \"externalWritesAllowed\" THEN 'true' ELSE 'false' END,\"version\" FROM \"EngageControlledLaunchState\" WHERE \"workspaceId\"='${WORKSPACE_ID}';")"
          printf 'CONTROLLED_STATE=%s\n' "$state"; test "$state" = "INTERNAL_TEST_IDENTITIES|SHADOW|NO_EXTERNAL_WRITES|false|1"

          printf 'META_ENV_KEY_NAMES_BEGIN\n'
          node - "$ENV_FILE" <<'NODE'
          const fs=require('node:fs'); const text=fs.readFileSync(process.argv[2],'utf8');
          const keys=[]; for(const raw of text.split(/\r?\n/)){let line=raw.trim(); if(!line||line.startsWith('#'))continue; if(line.startsWith('export '))line=line.slice(7).trim(); const i=line.indexOf('='); if(i<1)continue; const k=line.slice(0,i).trim(); if(/(INSTAGRAM|WHATSAPP|MESSENGER|META).*(TOKEN|SECRET|ID|VERSION)|^(INSTAGRAM|WHATSAPP|MESSENGER|META)_/.test(k))keys.push(k)}
          [...new Set(keys)].sort().forEach(k=>console.log(k));
          NODE
          printf 'META_ENV_KEY_NAMES_END\n'

          for key in INSTAGRAM_ACCESS_TOKEN INSTAGRAM_ACCOUNT_ID INSTAGRAM_GRAPH_VERSION WHATSAPP_ACCESS_TOKEN META_WHATSAPP_ACCESS_TOKEN WHATSAPP_PHONE_NUMBER_ID META_WHATSAPP_PHONE_NUMBER_ID WHATSAPP_GRAPH_VERSION META_GRAPH_API_VERSION; do
            printf '%s_PRESENT=%s\n' "$key" "$(env_present "$key")"
          done
          printf 'INSTAGRAM_ACCESS_TOKEN_SHAPE=%s\n' "$(token_shape INSTAGRAM_ACCESS_TOKEN)"
          if [[ "$(env_present WHATSAPP_ACCESS_TOKEN)" = true ]]; then printf 'WHATSAPP_ACCESS_TOKEN_SHAPE=%s\n' "$(token_shape WHATSAPP_ACCESS_TOKEN)"; fi
          if [[ "$(env_present META_WHATSAPP_ACCESS_TOKEN)" = true ]]; then printf 'META_WHATSAPP_ACCESS_TOKEN_SHAPE=%s\n' "$(token_shape META_WHATSAPP_ACCESS_TOKEN)"; fi

          psql_rows "SELECT \"id\",\"channel\",\"status\",CASE WHEN length(\"externalAccountId\")<=4 THEN repeat('*',length(\"externalAccountId\")) ELSE repeat('*',length(\"externalAccountId\")-4)||right(\"externalAccountId\",4) END,COALESCE(\"capabilities\"->>'apiVerifiedAt',''),COALESCE(\"capabilities\"->>'webhookVerifiedAt',''),COALESCE(\"capabilities\"->>'permissionsVerified','') FROM \"EngageChannelConnection\" WHERE \"workspaceId\"='${WORKSPACE_ID}' AND \"channel\" IN ('INSTAGRAM','WHATSAPP') ORDER BY \"channel\";" | while IFS='|' read -r id channel status masked api webhook permission; do printf 'CONNECTION id=%s channel=%s status=%s external=%s apiVerifiedAt=%s webhookVerifiedAt=%s permissionsVerified=%s\n' "$id" "$channel" "$status" "$masked" "$api" "$webhook" "$permission"; done

          export IG_TOKEN="$(read_env_value INSTAGRAM_ACCESS_TOKEN 2>/dev/null || true)"
          export IG_ID="$(read_env_value INSTAGRAM_ACCOUNT_ID 2>/dev/null || true)"
          export IG_VERSION="$(read_env_value INSTAGRAM_GRAPH_VERSION 2>/dev/null || true)"
          export WA_TOKEN="$(read_env_value WHATSAPP_ACCESS_TOKEN 2>/dev/null || read_env_value META_WHATSAPP_ACCESS_TOKEN 2>/dev/null || true)"
          export WA_ID="$(read_env_value WHATSAPP_PHONE_NUMBER_ID 2>/dev/null || read_env_value META_WHATSAPP_PHONE_NUMBER_ID 2>/dev/null || true)"
          export WA_VERSION="$(read_env_value WHATSAPP_GRAPH_VERSION 2>/dev/null || read_env_value META_GRAPH_API_VERSION 2>/dev/null || true)"
          node <<'NODE'
          const safe=v=>String(v||'verification failed').replace(/\s+/g,' ').slice(0,180);
          const out=(k,v)=>console.log(`${k}=${v}`);
          async function probe(prefix, token, id, version, fields){
            if(!token||!id||!version){out(`${prefix}_IDENTITY_VERIFIED`,false); out(`${prefix}_REASON`,'required configuration missing'); return;}
            const u=new URL(`https://graph.facebook.com/${encodeURIComponent(version)}/${encodeURIComponent(id)}`); u.searchParams.set('fields',fields);
            const c=new AbortController(); const t=setTimeout(()=>c.abort(),10000);
            try { const r=await fetch(u,{method:'GET',headers:{Authorization:`Bearer ${token}`,Accept:'application/json'},redirect:'error',cache:'no-store',signal:c.signal}); let b={}; try{b=await r.json()}catch{}; out(`${prefix}_IDENTITY_HTTP`,r.status); out(`${prefix}_IDENTITY_VERIFIED`,r.ok&&String(b?.id||'')===id); out(`${prefix}_EXTERNAL_WRITE_SENT`,false); if(!(r.ok&&String(b?.id||'')===id))out(`${prefix}_REASON`,safe(b?.error?.message||'identity mismatch')); }
            catch(e){out(`${prefix}_IDENTITY_VERIFIED`,false);out(`${prefix}_EXTERNAL_WRITE_SENT`,false);out(`${prefix}_REASON`,safe(e?.name==='AbortError'?'probe timed out':e?.message));} finally{clearTimeout(t)}
          }
          (async()=>{await probe('INSTAGRAM',process.env.IG_TOKEN,process.env.IG_ID,process.env.IG_VERSION,'id'); await probe('WHATSAPP',process.env.WA_TOKEN,process.env.WA_ID,process.env.WA_VERSION,'id,display_phone_number,verified_name');})();
          NODE
          unset IG_TOKEN IG_ID IG_VERSION WA_TOKEN WA_ID WA_VERSION
          printf 'PASS: PHASE17_STAGE2_META_CANDIDATE_DIAGNOSTIC_COMPLETE\n'
          REMOTE
