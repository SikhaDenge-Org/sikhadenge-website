name: Restore Last Best Funnel UI 20260910

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/funnel-final-readonly-audit-20260903.yml'

permissions:
  contents: read

jobs:
  restore:
    runs-on: [self-hosted, Linux, X64, sikhadenge-ci]
    environment: whatsapp-agent-production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Configure production SSH
        env:
          SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
          SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
          SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"
          fi
          chmod 600 "$KEY"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = 'ssh-ed25519'
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy guarded restore script
        env:
          SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
          SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
        run: |
          set -Eeuo pipefail
          REMOTE_SCRIPT="/tmp/restore-last-best-funnels-${GITHUB_SHA}.sh"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes .github/scripts/restore-last-best-funnels-20260910.sh "$SSH_USER@$SSH_HOST:$REMOTE_SCRIPT"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "chmod 700 '$REMOTE_SCRIPT' && bash '$REMOTE_SCRIPT'; rc=\$?; rm -f '$REMOTE_SCRIPT'; exit \$rc"

# restore revision: diagnostic QA v3
