name: Verify Page 02 Live Asset Forensics

on:
  push:
    branches:
      - release/whatsapp-instagram-agent-flow-20260731
    paths:
      - ".github/workflows/whatsapp-agent-page02-live-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${SSH_PORT:-}" ]]; then echo 'SSH_PORT=22' >> "$GITHUB_ENV"; SSH_PORT=22; fi
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$KEY" >/dev/null

      - name: Inspect compiled and served Page 02 assets read only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          PM2=sikhadenge-whatsapp-agent
          J=$(mktemp); pm2 jlist > "$J"
          RUNTIME=$(node - "$PM2" "$J" <<'NODE'
          const fs=require('node:fs'); const [n,f]=process.argv.slice(2); const p=JSON.parse(fs.readFileSync(f,'utf8')).find(x=>x.name===n); if(!p?.pm2_env?.pm_cwd) process.exit(2); process.stdout.write(p.pm2_env.pm_cwd);
          NODE
          ); rm -f "$J"
          echo "RUNTIME=$RUNTIME"
          echo "BUILD_ID=$(cat "$RUNTIME/.next/BUILD_ID")"
          echo "SOURCE_HEAD=$(git -C "$RUNTIME" rev-parse HEAD 2>/dev/null || true)"
          echo "STATIC_CSS_COUNT=$(find "$RUNTIME/.next/static/css" -type f -name '*.css' 2>/dev/null | wc -l)"
          echo 'V22_CSS_MATCHES_BEGIN'
          grep -RIl --include='*.css' 'sx-workspace-v22' "$RUNTIME/.next/static/css" 2>/dev/null || true
          echo 'V22_CSS_MATCHES_END'
          echo 'V22_GRID_MATCHES_BEGIN'
          grep -RIn --include='*.css' 'grid-template-columns:340px minmax(0,1fr) 320px' "$RUNTIME/.next/static/css" 2>/dev/null | head -n 10 || true
          echo 'V22_GRID_MATCHES_END'
          echo 'INBOX_MANIFEST_MATCHES_BEGIN'
          for f in "$RUNTIME/.next/app-build-manifest.json" "$RUNTIME/.next/build-manifest.json" "$RUNTIME/.next/server/app/inbox/page_client-reference-manifest.js" "$RUNTIME/.next/server/app/inbox/page.js"; do
            if [[ -f "$f" ]]; then
              echo "FILE=$f"
              grep -oE 'static/css/[A-Za-z0-9._/-]+\.css' "$f" 2>/dev/null | sort -u || true
            fi
          done
          echo 'INBOX_MANIFEST_MATCHES_END'
          echo 'CSS_FILES_SHA_BEGIN'
          find "$RUNTIME/.next/static/css" -type f -name '*.css' -print0 2>/dev/null | sort -z | xargs -0 sha256sum 2>/dev/null | head -n 80 || true
          echo 'CSS_FILES_SHA_END'
          echo "SW_CACHE_NAME=$(grep -o 'sikhadenge-agent-shell-v[0-9]*' "$RUNTIME/public/sw.js" 2>/dev/null | head -n1 || true)"
          echo "SW_STATIC_CACHE_FIRST=$(grep -c '/_next/static/' "$RUNTIME/public/sw.js" 2>/dev/null || true)"
          REMOTE
