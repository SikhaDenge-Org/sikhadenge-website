name: Restore Page 02 Exact Known Good ZVZ

on:
  push:
    branches:
      - release/whatsapp-instagram-agent-flow-20260731
    paths:
      - ".github/workflows/whatsapp-agent-page02-live-verify.yml"

permissions:
  contents: read

concurrency:
  group: whatsapp-agent-production
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
      RESTORE_RUN_ID: page02-zvz-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${SSH_PORT:-}" ]]; then echo 'SSH_PORT=22' >> "$GITHUB_ENV"; SSH_PORT=22; fi
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$KEY" >/dev/null

      - name: Atomically restore preserved ZVZ build only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" "RUN_ID='$RESTORE_RUN_ID' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          NAME=sikhadenge-whatsapp-agent
          LIVE=/var/www/sikhadenge-whatsapp-agent/releases/reconcile-clean-28b813ca-20260915T043800Z/apps/whatsapp-agent-dashboard
          BACKUP="$LIVE/.next-before-engageos-github-34950409366-1"
          KNOWN_GOOD=ZvzV6QBBngX3s_X5xxUnk
          STAGE="$LIVE/.next-restore-$RUN_ID"
          CURRENT_SAVE="$LIVE/.next-before-zvz-restore-$RUN_ID"

          test -d "$LIVE/.next"
          CURRENT_BUILD="$(cat "$LIVE/.next/BUILD_ID")"
          test -d "$BACKUP"
          test "$(cat "$BACKUP/BUILD_ID")" = "$KNOWN_GOOD"
          test -f "$BACKUP/routes-manifest.json"
          test -d "$BACKUP/server"
          test -d "$BACKUP/static"
          test ! -e "$STAGE"
          test ! -e "$CURRENT_SAVE"

          J=$(mktemp); pm2 jlist > "$J"
          node - "$J" "$LIVE" <<'NODE'
          const fs=require('node:fs'); const [f,expected]=process.argv.slice(2); const p=JSON.parse(fs.readFileSync(f,'utf8')).find(x=>x.name==='sikhadenge-whatsapp-agent'); if(!p || p.pm2_env?.status!=='online' || p.pm2_env?.pm_cwd!==expected) process.exit(2);
          NODE
          rm -f "$J"

          cp -a "$BACKUP" "$STAGE"
          test "$(cat "$STAGE/BUILD_ID")" = "$KNOWN_GOOD"

          rollback() {
            set +e
            if [[ -d "$CURRENT_SAVE" ]]; then
              rm -rf "$LIVE/.next"
              mv "$CURRENT_SAVE" "$LIVE/.next"
              pm2 restart "$NAME" >/dev/null 2>&1 || true
            fi
          }
          trap rollback ERR

          mv "$LIVE/.next" "$CURRENT_SAVE"
          mv "$STAGE" "$LIVE/.next"
          test "$(cat "$LIVE/.next/BUILD_ID")" = "$KNOWN_GOOD"
          pm2 restart "$NAME"

          ok=0
          for _ in $(seq 1 25); do
            LOGIN=$(curl --max-time 5 -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/login || true)
            INBOX=$(curl --max-time 5 -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/inbox || true)
            if [[ "$LOGIN" = 200 && "$INBOX" = 307 ]]; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1
          test "$(cat "$LIVE/.next/BUILD_ID")" = "$KNOWN_GOOD"
          pm2 save >/dev/null
          trap - ERR

          echo "PASS: PAGE02_ZVZ_EXACT_RESTORE"
          echo "PREVIOUS_BUILD=$CURRENT_BUILD"
          echo "ACTIVE_BUILD=$(cat "$LIVE/.next/BUILD_ID")"
          echo "LOGIN=$LOGIN INBOX=$INBOX"
          echo "PREVIOUS_BUILD_PRESERVED=$CURRENT_SAVE"
          REMOTE
