name: WA Restart Source Readonly 20260913

on:
  push:
    branches:
      - ops/wa-restart-forensics-20260913
    paths:
      - '.github/workflows/wa-restart-source-readonly-20260913.yml'

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: whatsapp-agent-production
    timeout-minutes: 8
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"
          fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read-only production restart-source inspection
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          echo '=== MODE ==='
          echo 'MODE=READ_ONLY'
          echo 'DB_MUTATION=NONE'
          echo 'PM2_MUTATION=NONE'
          echo 'SYSTEMD_MUTATION=NONE'
          echo 'ENV_MUTATION=NONE'

          echo '=== SYSTEMD TIMER ==='
          systemctl cat sikhadenge-funnel-golden-guard.timer || true
          systemctl show sikhadenge-funnel-golden-guard.timer \
            -p ActiveState -p SubState -p Unit -p NextElapseUSecRealtime -p LastTriggerUSec -p Triggers || true

          echo '=== SYSTEMD SERVICE ==='
          systemctl cat sikhadenge-funnel-golden-guard.service || true
          systemctl show sikhadenge-funnel-golden-guard.service \
            -p ActiveState -p SubState -p ExecMainStartTimestamp -p ExecMainExitTimestamp -p ExecMainStatus -p Result || true

          echo '=== INSTALLED GUARD ==='
          test -r /usr/local/sbin/sikhadenge-funnel-golden-guard
          sha256sum /usr/local/sbin/sikhadenge-funnel-golden-guard
          grep -nE 'restart_app\(|pm2 restart|app_online|AI_APP|CLAUDE_APP|AI_PORT|CLAUDE_PORT' /usr/local/sbin/sikhadenge-funnel-golden-guard || true

          echo '=== GOLDEN STATE SAFE KEYS ==='
          STATE='/var/lib/sikhadenge-funnel-golden-lock/current/state.env'
          if [[ -r "$STATE" ]]; then
            grep -E '^(SEALED_AT|AI_APP|CLAUDE_APP|AI_PORT|CLAUDE_PORT)=' "$STATE" || true
          else
            echo 'STATE_ENV=UNREADABLE'
          fi

          echo '=== GOLDEN GUARD RECENT EVENTS ==='
          LOG='/var/log/sikhadenge-funnel-golden-lock.log'
          if [[ -r "$LOG" ]]; then
            tail -500 "$LOG" | grep -E 'REPAIR pm2 restart|DRIFT .*origin|PASS seal=|CRITICAL|PUBLIC_MISMATCH|ASSET_MISMATCH' | tail -160 || true
          else
            echo 'GUARD_LOG=UNREADABLE'
          fi

          echo '=== SYSTEMD UNIT JOURNAL ==='
          journalctl -u sikhadenge-funnel-golden-guard.service --since '2026-09-13 16:00:00' --no-pager -o short-iso | tail -220 || true

          echo '=== PM2 SAFE APP STATE ==='
          pm2 jlist | python3 -c '
import json,sys
rows=json.load(sys.stdin)
for p in rows:
    n=p.get("name","")
    if n in {"sikhadenge-whatsapp-agent","sikhadenge-dashboard-revenue"} or "claude" in n.lower() or "video" in n.lower() or "funnel" in n.lower():
        e=p.get("pm2_env") or {}
        print("|".join([
            "name="+n,
            "pid="+str(p.get("pid")),
            "status="+str(e.get("status")),
            "restarts="+str(e.get("restart_time")),
            "unstable_restarts="+str(e.get("unstable_restarts")),
            "cwd="+str(e.get("pm_cwd"))
        ]))
'

          echo '=== FINAL ==='
          echo 'READ_ONLY_FORENSICS=PASS'
          REMOTE
