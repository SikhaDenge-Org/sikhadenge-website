name: WA Restart Source Readonly 20260913

on:
  push:
    branches:
      - ops/wa-restart-forensics-20260913
    paths:
      - '.github/workflows/wa-restart-source-readonly-20260913.yml'

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: whatsapp-agent-production
    timeout-minutes: 5
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"
          fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read-only deployment command provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          redact() {
            sed -E \
              -e 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/IP_REDACTED/g' \
              -e 's#(postgres(ql)?://)[^[:space:]]+#\1REDACTED#g' \
              -e 's#(Bearer[[:space:]]+)[A-Za-z0-9._~+/-]+#\1REDACTED#g' \
              -e 's#((TOKEN|SECRET|PASSWORD|PASS|API_KEY|ACCESS_KEY|DATABASE_URL)[A-Za-z0-9_]*[=:][[:space:]]*)[^[:space:]]+#\1REDACTED#gI'
          }

          echo '========================================='
          echo '=== DEPLOYMENT COMMAND PROVENANCE AUDIT ==='
          echo '========================================='
          echo 'MODE=READ_ONLY'
          echo 'DB_MUTATION=NONE'
          echo 'PM2_MUTATION=NONE'
          echo 'CODE_MUTATION=NONE'
          echo 'ENV_MUTATION=NONE'

          echo '=== ROOT HISTORY RELEVANT COMMANDS ONLY ==='
          if [[ -r /root/.bash_history ]]; then
            nl -ba /root/.bash_history | grep -Ei \
              'sikhadenge-whatsapp-agent|APP=|PROCESS=|pm2[[:space:]]+(restart|reload|start|stop|show|describe)|prisma generate|pnpm (exec prisma|run build)|NODE_ENV=production|login-right-panel|login-page01|git (status|diff|checkout|switch|pull|fetch|reset|rev-parse)|next build|release/whatsapp-instagram-agent-flow' | \
              tail -260 | redact || true
          fi

          SRC='/var/www/sikhadenge-whatsapp-agent/source'
          APP="$SRC/apps/whatsapp-agent-dashboard"

          echo '=== SOURCE TRACKED DIFF NAMES / STATS ==='
          git -C "$SRC" status --short --untracked-files=no 2>/dev/null || true
          git -C "$SRC" diff --stat -- apps/whatsapp-agent-dashboard 2>/dev/null || true
          git -C "$SRC" diff --name-status -- apps/whatsapp-agent-dashboard 2>/dev/null || true

          echo '=== SOURCE RELEVANT DIFF HUNKS — STRUCTURAL ONLY ==='
          git -C "$SRC" diff -U0 -- apps/whatsapp-agent-dashboard/app/layout.tsx apps/whatsapp-agent-dashboard/app/login/page.tsx apps/whatsapp-agent-dashboard/app/login-page01-left-image.css 2>/dev/null | \
            grep -E '^(diff --git|index |--- |\+\+\+ |@@)' | head -160 || true

          echo '=== RECENT APP FILE MTIMES ==='
          for f in \
            "$APP/app/login-right-panel-v16.css" \
            "$APP/app/login-page01-left-image.css" \
            "$APP/app/layout.tsx" \
            "$APP/app/login/page.tsx"; do
            [[ -e "$f" ]] && stat -c '%y|%s|%n' "$f" | sed "s#${SRC}#SOURCE#g"
          done

          echo '=== ACTIVE ROOT PTS SESSION SAFE STATE ==='
          ps -eo pid=,ppid=,user=,lstart=,etimes=,tty=,args= | grep -E '[s]shd: root@pts/[0-9]+|[p]m2 .*sikhadenge-whatsapp-agent|[p]npm .*build|[p]risma .*generate' | tail -100 | redact || true

          echo '=== CURRENT WA PM2 SAFE STATE ==='
          pm2 jlist | node -e 'let b="";process.stdin.on("data",d=>b+=d);process.stdin.on("end",()=>{const p=JSON.parse(b).find(x=>x.name==="sikhadenge-whatsapp-agent");const e=p?.pm2_env||{};console.log(["status="+e.status,"pid="+p?.pid,"restarts="+e.restart_time,"unstable_restarts="+e.unstable_restarts,"cwd="+e.pm_cwd].join("|"));});'

          echo 'READ_ONLY_COMMAND_PROVENANCE=PASS'
          REMOTE
