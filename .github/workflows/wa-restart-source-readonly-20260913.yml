name: WA Restart Source Readonly 20260913

on:
  push:
    branches:
      - ops/wa-restart-forensics-20260913
    paths:
      - '.github/workflows/wa-restart-source-readonly-20260913.yml'

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: whatsapp-agent-production
    timeout-minutes: 11
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"
          fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Focused read-only provider-session attribution
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          redact() {
            sed -E \
              -e 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/IP_REDACTED/g' \
              -e 's#(postgres(ql)?://)[^[:space:]]+#\1REDACTED#g' \
              -e 's#(Bearer[[:space:]]+)[A-Za-z0-9._~+/-]+#\1REDACTED#g' \
              -e 's#((TOKEN|SECRET|PASSWORD|PASS|API_KEY|ACCESS_KEY|DATABASE_URL)[A-Za-z0-9_]*[=:][[:space:]]*)[^[:space:]]+#\1REDACTED#gI'
          }

          wa_state() {
            pm2 jlist | node -e 'let b="";process.stdin.on("data",d=>b+=d);process.stdin.on("end",()=>{const p=JSON.parse(b).find(x=>x.name==="sikhadenge-whatsapp-agent");if(!p)process.exit(2);const e=p.pm2_env||{};console.log([p.pid,e.status,e.restart_time,e.unstable_restarts,e.pm_uptime,e.pm_cwd].join("|"));});'
          }

          ak_count() {
            grep -Ev '^[[:space:]]*(#|$)' /root/.ssh/authorized_keys 2>/dev/null | wc -l
          }

          is_descendant_of() {
            local p="$1" ancestor="$2" i=0
            while [[ "$p" =~ ^[0-9]+$ ]] && (( p > 1 )) && (( i < 16 )); do
              [[ "$p" == "$ancestor" ]] && return 0
              p="$(awk '{print $4}' "/proc/$p/stat" 2>/dev/null || echo 0)"
              i=$((i+1))
            done
            return 1
          }

          print_chain() {
            local p="$1" i=0
            while [[ "$p" =~ ^[0-9]+$ ]] && (( p > 1 )) && (( i < 12 )); do
              ps -o pid=,ppid=,user=,lstart=,etimes=,args= -p "$p" 2>/dev/null | redact || true
              p="$(awk '{print $4}' "/proc/$p/stat" 2>/dev/null || echo 0)"
              i=$((i+1))
            done
          }

          newest_root_pts_sshd() {
            ps -eo pid=,etimes=,args= 2>/dev/null | awk '/sshd: root@pts\/[0-9]+/ {if(min=="" || $2<min){min=$2;pid=$1}} END{if(pid)print pid}'
          }

          echo '=================================================='
          echo '=== FOCUSED PROVIDER SESSION ATTRIBUTION CAPTURE ==='
          echo '=================================================='
          echo 'MODE=READ_ONLY'
          echo 'DB_MUTATION=NONE'
          echo 'PM2_MUTATION=NONE'
          echo 'SYSTEMD_MUTATION=NONE'
          echo 'SSH_CONFIG_MUTATION=NONE'
          echo 'AUTHORIZED_KEYS_MUTATION=NONE'
          echo 'ENV_MUTATION=NONE'
          echo 'CAPTURE_WINDOW_SECONDS=480'

          START_ISO="$(date --iso-8601=seconds)"
          END_EPOCH=$(( $(date +%s) + 480 ))
          BASE_WA="$(wa_state)"
          BASE_RESTARTS="$(cut -d'|' -f3 <<<"$BASE_WA")"
          LAST_RESTARTS="$BASE_RESTARTS"
          LAST_AK_SHA="$(sha256sum /root/.ssh/authorized_keys | awk '{print $1}')"
          LAST_AK_COUNT="$(ak_count)"
          PM2LOG_LINE="$(wc -l < /root/.pm2/pm2.log)"
          SUSPECT_SSHD=''
          PROVIDER_KEY_FP=''
          PROVIDER_SESSION_SEEN=0
          DESCENDANT_MATCHES=0
          AK_EVENTS=0
          WA_EVENTS=0
          declare -A SEEN_PIDS=()

          echo "START_ISO=$START_ISO"
          echo "BASE_WA_STATE=$BASE_WA"
          echo "BASE_AK_SHA256=$LAST_AK_SHA"
          echo "BASE_AK_RECORDS=$LAST_AK_COUNT"

          while (( $(date +%s) < END_EPOCH )); do
            CUR_AK_SHA="$(sha256sum /root/.ssh/authorized_keys 2>/dev/null | awk '{print $1}' || true)"
            if [[ -n "$CUR_AK_SHA" && "$CUR_AK_SHA" != "$LAST_AK_SHA" ]]; then
              AK_EVENTS=$((AK_EVENTS+1))
              CUR_AK_COUNT="$(ak_count)"
              echo "=== AUTHORIZED_KEYS_CHANGE #$AK_EVENTS @ $(date --iso-8601=seconds) ==="
              echo "AK_SHA_BEFORE=$LAST_AK_SHA"
              echo "AK_SHA_AFTER=$CUR_AK_SHA"
              echo "AK_RECORDS_BEFORE=$LAST_AK_COUNT"
              echo "AK_RECORDS_AFTER=$CUR_AK_COUNT"
              stat -c 'AK_META=mode:%a|size:%s|mtime:%y|ctime:%z' /root/.ssh/authorized_keys

              if (( CUR_AK_COUNT > LAST_AK_COUNT )); then
                PROVIDER_KEY_FP="$(tail -n 1 /root/.ssh/authorized_keys | ssh-keygen -lf - 2>/dev/null | awk '{print $2}' || true)"
                echo "INJECTED_KEY_FINGERPRINT=${PROVIDER_KEY_FP:-UNKNOWN}"
                echo '--- QEMU GA +/- RECENT ---'
                journalctl -u qemu-guest-agent.service --since '-20 seconds' --no-pager -o short-iso 2>/dev/null | tail -120 | redact || true
                echo '--- SSH ACCEPT RECENT ---'
                journalctl --since '-20 seconds' --no-pager -o short-iso 2>/dev/null | grep -Ei 'Accepted publickey for root|Accepted password for root|sshd.*session' | tail -80 | redact || true
              fi

              LAST_AK_SHA="$CUR_AK_SHA"
              LAST_AK_COUNT="$CUR_AK_COUNT"
            fi

            if [[ -z "$SUSPECT_SSHD" && -n "$PROVIDER_KEY_FP" ]]; then
              CAND="$(newest_root_pts_sshd || true)"
              if [[ -n "$CAND" ]]; then
                if journalctl --since "$START_ISO" --no-pager 2>/dev/null | grep -Fq "$PROVIDER_KEY_FP"; then
                  SUSPECT_SSHD="$CAND"
                  PROVIDER_SESSION_SEEN=1
                  echo "=== PROVIDER_ROOT_SESSION_BOUND @ $(date --iso-8601=seconds) ==="
                  echo "PROVIDER_KEY_FINGERPRINT=$PROVIDER_KEY_FP"
                  echo "SUSPECT_SSHD_PID=$SUSPECT_SSHD"
                  print_chain "$SUSPECT_SSHD"
                fi
              fi
            fi

            if [[ -n "$SUSPECT_SSHD" && -d "/proc/$SUSPECT_SSHD" ]]; then
              while read -r pid ppid user etimes args; do
                [[ "$pid" =~ ^[0-9]+$ ]] || continue
                [[ -z "${SEEN_PIDS[$pid]:-}" ]] || continue
                case "$args" in
                  *pm2*|*PM2*|*sikhadenge-whatsapp-agent*) ;;
                  *) continue ;;
                esac
                if is_descendant_of "$pid" "$SUSPECT_SSHD"; then
                  SEEN_PIDS[$pid]=1
                  DESCENDANT_MATCHES=$((DESCENDANT_MATCHES+1))
                  echo "=== SUSPECT_SESSION_PROCESS #$DESCENDANT_MATCHES @ $(date --iso-8601=seconds) ==="
                  print_chain "$pid"
                fi
              done < <(ps -eo pid=,ppid=,user=,etimes=,args= 2>/dev/null)
            fi

            CUR_WA="$(wa_state 2>/dev/null || true)"
            if [[ -n "$CUR_WA" ]]; then
              CUR_RESTARTS="$(cut -d'|' -f3 <<<"$CUR_WA")"
              if [[ "$CUR_RESTARTS" =~ ^[0-9]+$ ]] && (( CUR_RESTARTS > LAST_RESTARTS )); then
                WA_EVENTS=$((WA_EVENTS+1))
                echo "=== WA_RESTART_EVENT #$WA_EVENTS @ $(date --iso-8601=seconds) ==="
                echo "WA_BEFORE_RESTARTS=$LAST_RESTARTS"
                echo "WA_AFTER_STATE=$CUR_WA"
                echo '--- SUSPECT SESSION TREE ---'
                [[ -n "$SUSPECT_SSHD" ]] && ps -eo pid=,ppid=,user=,lstart=,etimes=,args= --forest | grep -E "(^|[[:space:]])($SUSPECT_SSHD|sshd: root@pts|pm2|sikhadenge-whatsapp-agent)" | tail -120 | redact || true
                echo '--- RECENT SSH/QEMU ---'
                journalctl --since '-90 seconds' --no-pager -o short-iso 2>/dev/null | grep -Ei 'Accepted publickey for root|Accepted password for root|sshd.*session|qemu-ga.*(sshd -T|ssh|authorized)' | tail -120 | redact || true
                LAST_RESTARTS="$CUR_RESTARTS"
              fi
            fi

            sleep 0.05
          done

          END_ISO="$(date --iso-8601=seconds)"
          FINAL_WA="$(wa_state)"
          FINAL_RESTARTS="$(cut -d'|' -f3 <<<"$FINAL_WA")"
          FINAL_AK_SHA="$(sha256sum /root/.ssh/authorized_keys | awk '{print $1}')"
          echo '=== POST WINDOW ==='
          echo "END_ISO=$END_ISO"
          echo '--- PM2 WA EVENTS ---'
          sed -n "$((PM2LOG_LINE+1)),\$p" /root/.pm2/pm2.log 2>/dev/null | grep -E 'sikhadenge-whatsapp-agent|Stopping app:' | tail -100 || true
          echo '--- SSH/QEMU EVENTS ---'
          journalctl --since "$START_ISO" --until "$END_ISO" --no-pager -o short-iso 2>/dev/null | grep -Ei 'Accepted publickey for root|Accepted password for root|pam_unix\(sshd:session\)|qemu-ga.*(sshd -T|ssh|authorized)' | tail -200 | redact || true
          echo "FINAL_WA_STATE=$FINAL_WA"
          echo "FINAL_AK_SHA256=$FINAL_AK_SHA"
          echo "AUTHORIZED_KEYS_CHANGE_EVENTS=$AK_EVENTS"
          echo "PROVIDER_SESSION_SEEN=$PROVIDER_SESSION_SEEN"
          echo "SUSPECT_SESSION_PROCESS_MATCHES=$DESCENDANT_MATCHES"
          echo "WA_RESTART_EVENTS=$WA_EVENTS"
          echo "WA_RESTART_COUNTER_DELTA=$((FINAL_RESTARTS-BASE_RESTARTS))"
          echo 'READ_ONLY_FOCUSED_ATTRIBUTION=PASS'
          REMOTE
