name: WA Restart Source Readonly 20260913

on:
  push:
    branches:
      - ops/wa-restart-forensics-20260913
    paths:
      - '.github/workflows/wa-restart-source-readonly-20260913.yml'

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: whatsapp-agent-production
    timeout-minutes: 11
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"
          fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Live read-only restart attribution capture
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          redact() {
            sed -E \
              -e 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/IP_REDACTED/g' \
              -e 's#(postgres(ql)?://)[^[:space:]]+#\1REDACTED#g' \
              -e 's#(Bearer[[:space:]]+)[A-Za-z0-9._~+/-]+#\1REDACTED#g' \
              -e 's#((TOKEN|SECRET|PASSWORD|PASS|API_KEY|ACCESS_KEY|DATABASE_URL)[A-Za-z0-9_]*[=:][[:space:]]*)[^[:space:]]+#\1REDACTED#gI'
          }

          wa_state() {
            pm2 jlist | node -e 'let b="";process.stdin.on("data",d=>b+=d);process.stdin.on("end",()=>{const p=JSON.parse(b).find(x=>x.name==="sikhadenge-whatsapp-agent");if(!p){process.exit(2)};const e=p.pm2_env||{};console.log([p.pid,e.status,e.restart_time,e.unstable_restarts,e.pm_uptime,e.pm_cwd].join("|"));});'
          }

          key_snapshot() {
            local f='/root/.ssh/authorized_keys'
            [[ -r "$f" ]] || { echo 'AUTHORIZED_KEYS=UNREADABLE'; return; }
            stat -c 'AK_META=owner:%U:%G|mode:%a|size:%s|mtime:%y|ctime:%z' "$f"
            local n=0 line fp
            while IFS= read -r line || [[ -n "$line" ]]; do
              [[ -n "${line//[[:space:]]/}" ]] || continue
              [[ "$line" =~ ^[[:space:]]*# ]] && continue
              n=$((n+1))
              fp="$(printf '%s\n' "$line" | ssh-keygen -lf - 2>/dev/null || true)"
              [[ -n "$fp" ]] && printf 'AK_FP_%02d=%s\n' "$n" "$(awk '{print $2"|"$1"|"$NF}' <<<"$fp")"
            done < "$f"
            echo "AK_RECORDS=$n"
          }

          ancestor_chain() {
            local p="$1" i=0
            while [[ "$p" =~ ^[0-9]+$ ]] && (( p > 1 )) && (( i < 10 )); do
              ps -o pid=,ppid=,user=,lstart=,etimes=,args= -p "$p" 2>/dev/null | redact || true
              p="$(ps -o ppid= -p "$p" 2>/dev/null | tr -d ' ' || true)"
              i=$((i+1))
            done
          }

          echo '=========================================='
          echo '=== LIVE WA RESTART ATTRIBUTION CAPTURE ==='
          echo '=========================================='
          echo 'MODE=READ_ONLY'
          echo 'DB_MUTATION=NONE'
          echo 'PM2_MUTATION=NONE'
          echo 'SYSTEMD_MUTATION=NONE'
          echo 'SSH_CONFIG_MUTATION=NONE'
          echo 'AUTHORIZED_KEYS_MUTATION=NONE'
          echo 'ENV_MUTATION=NONE'
          echo 'CAPTURE_WINDOW_SECONDS=480'

          START_ISO="$(date --iso-8601=seconds)"
          START_EPOCH="$(date +%s)"
          END_EPOCH=$((START_EPOCH+480))
          BASE_WA="$(wa_state)"
          BASE_RESTARTS="$(cut -d'|' -f3 <<<"$BASE_WA")"
          LAST_RESTARTS="$BASE_RESTARTS"
          LAST_AK_SHA="$(sha256sum /root/.ssh/authorized_keys 2>/dev/null | awk '{print $1}' || true)"
          LAST_PM2LOG_LINES="$(wc -l < /root/.pm2/pm2.log 2>/dev/null || echo 0)"
          echo "START_ISO=$START_ISO"
          echo "BASE_WA_STATE=$BASE_WA"
          echo "BASE_AK_SHA256=$LAST_AK_SHA"
          key_snapshot

          declare -A SEEN=()
          EVENT_COUNT=0
          PM2_CLI_HITS=0
          AK_CHANGE_COUNT=0
          RESTART_DELTA_EVENTS=0

          while (( $(date +%s) < END_EPOCH )); do
            while IFS= read -r pid; do
              [[ "$pid" =~ ^[0-9]+$ ]] || continue
              [[ -z "${SEEN[$pid]:-}" ]] || continue
              cmd="$(tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null || true)"
              [[ -n "$cmd" ]] || continue
              if grep -Eqi '(^|[ /])pm2([ /]|$)|PM2' <<<"$cmd"; then
                if grep -Eqi 'sikhadenge-whatsapp-agent|restart|reload|stop|start|delete' <<<"$cmd"; then
                  SEEN[$pid]=1
                  PM2_CLI_HITS=$((PM2_CLI_HITS+1))
                  EVENT_COUNT=$((EVENT_COUNT+1))
                  echo "=== EVENT PM2_CLI_DETECTED #$EVENT_COUNT @ $(date --iso-8601=seconds) ==="
                  ancestor_chain "$pid"
                fi
              fi
            done < <(pgrep -f 'pm2|PM2' 2>/dev/null || true)

            CUR_AK_SHA="$(sha256sum /root/.ssh/authorized_keys 2>/dev/null | awk '{print $1}' || true)"
            if [[ "$CUR_AK_SHA" != "$LAST_AK_SHA" ]]; then
              EVENT_COUNT=$((EVENT_COUNT+1))
              AK_CHANGE_COUNT=$((AK_CHANGE_COUNT+1))
              echo "=== EVENT AUTHORIZED_KEYS_CHANGED #$EVENT_COUNT @ $(date --iso-8601=seconds) ==="
              echo "AK_SHA_BEFORE=$LAST_AK_SHA"
              echo "AK_SHA_AFTER=$CUR_AK_SHA"
              key_snapshot
              echo '--- ACTIVE ROOT SSH SESSIONS ---'
              ps -eo pid=,ppid=,user=,lstart=,etimes=,args= | grep -E '[s]shd: root|[s]shd.*root@' | tail -40 | redact || true
              echo '--- QEMU RECENT ---'
              journalctl -u qemu-guest-agent.service --since '-90 seconds' --no-pager -o short-iso 2>/dev/null | tail -80 | redact || true
              LAST_AK_SHA="$CUR_AK_SHA"
            fi

            NOW="$(date +%s)"
            if (( NOW % 2 == 0 )); then
              CUR_WA="$(wa_state || true)"
              if [[ -n "$CUR_WA" ]]; then
                CUR_RESTARTS="$(cut -d'|' -f3 <<<"$CUR_WA")"
                if [[ "$CUR_RESTARTS" =~ ^[0-9]+$ ]] && [[ "$LAST_RESTARTS" =~ ^[0-9]+$ ]] && (( CUR_RESTARTS > LAST_RESTARTS )); then
                  EVENT_COUNT=$((EVENT_COUNT+1))
                  RESTART_DELTA_EVENTS=$((RESTART_DELTA_EVENTS+1))
                  echo "=== EVENT WA_RESTART_COUNTER_CHANGED #$EVENT_COUNT @ $(date --iso-8601=seconds) ==="
                  echo "WA_BEFORE_RESTARTS=$LAST_RESTARTS"
                  echo "WA_AFTER_STATE=$CUR_WA"
                  echo '--- ACTIVE SSHD TREE ---'
                  ps -eo pid=,ppid=,user=,lstart=,etimes=,args= --forest | grep -E '[s]shd|[p]m2|sikhadenge-whatsapp-agent|[b]ash -s' | tail -100 | redact || true
                  echo '--- RECENT PM2 LOG ---'
                  tail -80 /root/.pm2/pm2.log 2>/dev/null | grep -E 'sikhadenge-whatsapp-agent|Stopping app:' | tail -40 || true
                  echo '--- RECENT SSH/QEMU JOURNAL ---'
                  journalctl --since '-90 seconds' --no-pager -o short-iso 2>/dev/null | grep -Ei 'Accepted publickey for root|Accepted password for root|sshd.*session|qemu-ga.*sshd -T' | tail -100 | redact || true
                  LAST_RESTARTS="$CUR_RESTARTS"
                fi
              fi
            fi

            sleep 0.20
          done

          echo '=== POST-WINDOW CORRELATION ==='
          END_ISO="$(date --iso-8601=seconds)"
          echo "END_ISO=$END_ISO"
          echo '--- PM2 WA EVENTS IN WINDOW ---'
          sed -n "$((LAST_PM2LOG_LINES+1)),\$p" /root/.pm2/pm2.log 2>/dev/null | grep -E 'sikhadenge-whatsapp-agent|Stopping app:' | tail -120 || true
          echo '--- SSH/QEMU EVENTS IN WINDOW ---'
          journalctl --since "$START_ISO" --until "$END_ISO" --no-pager -o short-iso 2>/dev/null | grep -Ei 'Accepted publickey for root|Accepted password for root|pam_unix\(sshd:session\)|qemu-ga.*(sshd -T|authorized|ssh)' | tail -220 | redact || true

          FINAL_WA="$(wa_state)"
          FINAL_AK_SHA="$(sha256sum /root/.ssh/authorized_keys 2>/dev/null | awk '{print $1}' || true)"
          FINAL_RESTARTS="$(cut -d'|' -f3 <<<"$FINAL_WA")"
          echo "FINAL_WA_STATE=$FINAL_WA"
          echo "FINAL_AK_SHA256=$FINAL_AK_SHA"
          echo "PM2_CLI_HITS=$PM2_CLI_HITS"
          echo "AUTHORIZED_KEYS_CHANGE_EVENTS=$AK_CHANGE_COUNT"
          echo "WA_RESTART_DELTA_EVENTS=$RESTART_DELTA_EVENTS"
          if [[ "$FINAL_RESTARTS" =~ ^[0-9]+$ ]] && [[ "$BASE_RESTARTS" =~ ^[0-9]+$ ]]; then
            echo "WA_RESTART_COUNTER_DELTA=$((FINAL_RESTARTS-BASE_RESTARTS))"
          fi
          echo 'READ_ONLY_LIVE_ATTRIBUTION=PASS'
          REMOTE
