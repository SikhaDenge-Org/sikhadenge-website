name: WA Restart Source Readonly 20260913

on:
  push:
    branches:
      - ops/wa-restart-forensics-20260913
    paths:
      - '.github/workflows/wa-restart-source-readonly-20260913.yml'

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: whatsapp-agent-production
    timeout-minutes: 10
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"
          fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read-only production restart-source inspection
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          redact() {
            sed -E \
              -e 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/IP_REDACTED/g' \
              -e 's#(postgres(ql)?://)[^[:space:]]+#\1REDACTED#g' \
              -e 's#(Bearer[[:space:]]+)[A-Za-z0-9._~+/-]+#\1REDACTED#g' \
              -e 's#((TOKEN|SECRET|PASSWORD|PASS|API_KEY|ACCESS_KEY|DATABASE_URL)[A-Za-z0-9_]*[=:][[:space:]]*)[^[:space:]]+#\1REDACTED#gI'
          }

          echo '=== MODE ==='
          echo 'MODE=READ_ONLY'
          echo 'DB_MUTATION=NONE'
          echo 'PM2_MUTATION=NONE'
          echo 'SYSTEMD_MUTATION=NONE'
          echo 'ENV_MUTATION=NONE'

          echo '=== GOLDEN GUARD EXCLUSION CHECK ==='
          STATE='/var/lib/sikhadenge-funnel-golden-lock/current/state.env'
          if [[ -r "$STATE" ]]; then
            grep -E '^(SEALED_AT|AI_APP|CLAUDE_APP|AI_PORT|CLAUDE_PORT)=' "$STATE" || true
          fi
          LOG='/var/log/sikhadenge-funnel-golden-lock.log'
          if [[ -r "$LOG" ]]; then
            tail -700 "$LOG" | grep -E 'REPAIR pm2 restart|DRIFT .*origin|CRITICAL|PASS seal=' | tail -80 || true
          fi

          echo '=== WA PM2 CURRENT STATE ==='
          pm2 jlist | node -e 'let b="";process.stdin.on("data",d=>b+=d);process.stdin.on("end",()=>{const p=JSON.parse(b).find(x=>x.name==="sikhadenge-whatsapp-agent");if(!p){console.log("WA_PM2=MISSING");process.exit(2)};const e=p.pm2_env||{};console.log(["pid="+p.pid,"status="+e.status,"restarts="+e.restart_time,"unstable_restarts="+e.unstable_restarts,"uptime="+e.pm_uptime,"watch="+e.watch,"cron_restart="+(e.cron_restart??"unset"),"cwd="+e.pm_cwd].join("|"));});'

          echo '=== PM2 MASTER LOG — RECENT WA CONTROL EVENTS ==='
          PM2LOG='/root/.pm2/pm2.log'
          if [[ -r "$PM2LOG" ]]; then
            grep -E 'sikhadenge-whatsapp-agent|App \[[^]]+:.*\] (starting|online|exited)|Stopping app:' "$PM2LOG" | tail -180 | redact || true
          else
            echo 'PM2_MASTER_LOG=UNREADABLE'
          fi

          echo '=== EXACT WA STOP TIMESTAMPS ==='
          if [[ -r "$PM2LOG" ]]; then
            grep 'Stopping app:sikhadenge-whatsapp-agent' "$PM2LOG" | tail -30 || true
          fi

          echo '=== ROOT HISTORY — EXPLICIT WA PM2 COMMANDS ONLY ==='
          if [[ -r /root/.bash_history ]]; then
            grep -Ein 'pm2[[:space:]]+(restart|reload|start|stop|delete).*sikhadenge-whatsapp-agent|sikhadenge-whatsapp-agent.*pm2' /root/.bash_history | tail -80 | redact || true
          fi

          echo '=== ALL LOCAL SHELL HISTORIES — EXPLICIT WA PM2 COMMANDS ONLY ==='
          for H in /root/.bash_history /home/*/.bash_history; do
            [[ -r "$H" ]] || continue
            MATCH="$(grep -Ein 'pm2[[:space:]]+(restart|reload|start|stop|delete).*sikhadenge-whatsapp-agent|sikhadenge-whatsapp-agent.*pm2' "$H" 2>/dev/null | tail -40 || true)"
            if [[ -n "$MATCH" ]]; then
              echo "HISTORY_FILE=$H"
              printf '%s\n' "$MATCH" | redact
            fi
          done

          echo '=== SYSTEMD / CRON REFERENCES TO WA PROCESS ==='
          grep -RInE --exclude='*.journal' --exclude='*.log' 'sikhadenge-whatsapp-agent|pm2[[:space:]]+(restart|reload).*(whatsapp|agent)' \
            /etc/systemd/system /etc/cron.d /etc/crontab /usr/local/sbin /usr/local/bin 2>/dev/null | head -240 | redact || true

          echo '=== SERVER SCRIPT REFERENCES TO EXPLICIT WA RESTART ==='
          find /root /opt /var/www/sikhadenge-whatsapp-agent \
            -xdev -maxdepth 6 \
            \( -path '*/node_modules' -o -path '*/node_modules/*' -o -path '*/.next' -o -path '*/.next/*' -o -path '*/.git' -o -path '*/.git/*' -o -path '*/migration-evidence' -o -path '*/migration-evidence/*' \) -prune -o \
            -type f -size -2M \
            \( -name '*.sh' -o -name '*.bash' -o -name '*.js' -o -name '*.mjs' -o -name '*.cjs' -o -name '*.ts' -o -name '*.service' -o -name '*.timer' -o -name 'ecosystem*.config.*' -o -name 'package.json' \) \
            -print0 2>/dev/null | \
          xargs -0 -r grep -HnE 'pm2[[:space:]]+(restart|reload|start|stop|delete)[[:space:]]+.*sikhadenge-whatsapp-agent|sikhadenge-whatsapp-agent.*pm2[[:space:]]+(restart|reload|start|stop|delete)' 2>/dev/null | head -240 | redact || true

          echo '=== SSH / SUDO / CRON CORRELATION SINCE 17:25 IST ==='
          journalctl --since '2026-09-13 17:25:00' --no-pager -o short-iso 2>/dev/null | \
            grep -Ei 'sshd|sudo|CRON|session opened|session closed|pm2|whatsapp-agent' | \
            tail -420 | redact || true

          echo '=== ROOT LOGIN WINDOWS ==='
          last -F root 2>/dev/null | head -25 | redact || true

          echo '=== PROCESSES WITH WA/PM2 CONTROL SIGNATURES ==='
          ps -eo pid=,ppid=,user=,lstart=,etimes=,args= | \
            grep -Ei '[p]m2|sikhadenge-whatsapp-agent|whatsapp.*(restart|reload)|(?:restart|reload).*whatsapp' | \
            tail -80 | redact || true

          echo '=== FINAL WA PM2 STATE ==='
          pm2 jlist | node -e 'let b="";process.stdin.on("data",d=>b+=d);process.stdin.on("end",()=>{const p=JSON.parse(b).find(x=>x.name==="sikhadenge-whatsapp-agent");const e=p?.pm2_env||{};console.log("status="+e.status+"|pid="+p?.pid+"|restarts="+e.restart_time+"|unstable_restarts="+e.unstable_restarts);});'

          echo 'READ_ONLY_FORENSICS=PASS'
          REMOTE
