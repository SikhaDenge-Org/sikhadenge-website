name: WA Restart Source Readonly 20260913

on:
  push:
    branches:
      - ops/wa-restart-forensics-20260913
    paths:
      - '.github/workflows/wa-restart-source-readonly-20260913.yml'

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: whatsapp-agent-production
    timeout-minutes: 10
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"
          fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read-only production SSH-key and exec correlation
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          redact() {
            sed -E \
              -e 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/IP_REDACTED/g' \
              -e 's#(postgres(ql)?://)[^[:space:]]+#\1REDACTED#g' \
              -e 's#(Bearer[[:space:]]+)[A-Za-z0-9._~+/-]+#\1REDACTED#g' \
              -e 's#((TOKEN|SECRET|PASSWORD|PASS|API_KEY|ACCESS_KEY|DATABASE_URL)[A-Za-z0-9_]*[=:][[:space:]]*)[^[:space:]]+#\1REDACTED#gI'
          }

          echo '=== MODE ==='
          echo 'MODE=READ_ONLY'
          echo 'DB_MUTATION=NONE'
          echo 'PM2_MUTATION=NONE'
          echo 'SYSTEMD_MUTATION=NONE'
          echo 'SSH_CONFIG_MUTATION=NONE'
          echo 'AUTHORIZED_KEYS_MUTATION=NONE'
          echo 'ENV_MUTATION=NONE'

          echo '=== ROOT AUTHORIZED KEYS FINGERPRINTS ONLY ==='
          ROOT_AK='/root/.ssh/authorized_keys'
          if [[ -r "$ROOT_AK" ]]; then
            stat -c 'path=%n|owner=%U:%G|mode=%a|size=%s|mtime=%y|ctime=%z' "$ROOT_AK"
            n=0
            while IFS= read -r line || [[ -n "$line" ]]; do
              [[ -n "${line//[[:space:]]/}" ]] || continue
              [[ "$line" =~ ^[[:space:]]*# ]] && continue
              n=$((n+1))
              fp="$(printf '%s\n' "$line" | ssh-keygen -lf - 2>/dev/null || true)"
              if [[ -n "$fp" ]]; then
                bits="$(awk '{print $1}' <<<"$fp")"
                fingerprint="$(awk '{print $2}' <<<"$fp")"
                alg="$(sed -n 's/.*(\([^)]*\)).*/\1/p' <<<"$fp")"
                printf 'line=%s|bits=%s|fingerprint=%s|algorithm=%s\n' "$n" "$bits" "$fingerprint" "$alg"
              else
                printf 'line=%s|fingerprint=UNPARSEABLE_OR_OPTIONS_PREFIXED\n' "$n"
              fi
            done < "$ROOT_AK"
            echo "AUTHORIZED_KEY_RECORDS=$n"
          else
            echo 'ROOT_AUTHORIZED_KEYS=UNREADABLE_OR_MISSING'
          fi

          echo '=== EFFECTIVE SSHD AUTHORIZATION SETTINGS ==='
          sshd -T 2>/dev/null | grep -Ei '^(authorizedkeysfile|authorizedkeyscommand|authorizedkeyscommanduser|trustedusercakeys|pubkeyauthentication|passwordauthentication|authenticationmethods|permitrootlogin|usepam|pubkeyacceptedalgorithms) ' | redact || true

          echo '=== SSHD CONFIG SOURCES FOR AUTHORIZED KEYS / MATCH ==='
          grep -RInE '^[[:space:]]*(Include|Match|AuthorizedKeysFile|AuthorizedKeysCommand|AuthorizedKeysCommandUser|TrustedUserCAKeys|PubkeyAuthentication|PermitRootLogin|AuthenticationMethods)[[:space:]]' /etc/ssh/sshd_config /etc/ssh/sshd_config.d 2>/dev/null | redact || true

          echo '=== SSH AUTH KEY PROVIDER / GUEST AGENT UNITS ==='
          systemctl list-unit-files --no-pager 2>/dev/null | grep -Ei 'qemu|guest|cloud|ssh|hostinger|agent' | head -120 || true
          ps -eo pid=,ppid=,user=,lstart=,args= | grep -Ei '[q]emu-ga|[g]uest-agent|[c]loud-init|[h]ostinger|authorized.*key' | head -120 | redact || true

          echo '=== QEMU GUEST AGENT JOURNAL AROUND RESTART WINDOW ==='
          for UNIT in qemu-guest-agent.service qemu-ga.service; do
            if systemctl status "$UNIT" >/dev/null 2>&1; then
              echo "UNIT=$UNIT"
              journalctl -u "$UNIT" --since '2026-09-13 17:15:00' --until '2026-09-13 18:05:00' --no-pager -o short-iso 2>/dev/null | tail -260 | redact || true
            fi
          done

          echo '=== JOURNAL: SSH KEY FINGERPRINT CORRELATION ==='
          journalctl --since '2026-09-13 17:15:00' --until '2026-09-13 18:05:00' --no-pager -o short-iso 2>/dev/null | \
            grep -Ei 'Accepted publickey for|Accepted password for|pam_unix\(sshd:session\)|guest-exec called: "sshd -T"' | tail -320 | redact || true

          echo '=== PM2 EXACT WHATSAPP CONTROL EVENTS ==='
          PM2LOG='/root/.pm2/pm2.log'
          if [[ -r "$PM2LOG" ]]; then
            grep -E '2026-09-13T(17:20:39|17:26:47|17:33:57|17:34:06|17:36:08|17:41:36|17:48:10).*sikhadenge-whatsapp-agent' "$PM2LOG" || true
          fi

          echo '=== AUDITD / EXEC ACCOUNTING AVAILABILITY ==='
          command -v auditctl >/dev/null 2>&1 && echo 'AUDITCTL=AVAILABLE' || echo 'AUDITCTL=UNAVAILABLE'
          command -v ausearch >/dev/null 2>&1 && echo 'AUSEARCH=AVAILABLE' || echo 'AUSEARCH=UNAVAILABLE'
          command -v lastcomm >/dev/null 2>&1 && echo 'LASTCOMM=AVAILABLE' || echo 'LASTCOMM=UNAVAILABLE'
          systemctl is-active auditd 2>/dev/null | sed 's/^/AUDITD_ACTIVE=/' || true
          systemctl is-active acct 2>/dev/null | sed 's/^/ACCT_ACTIVE=/' || true
          systemctl is-active psacct 2>/dev/null | sed 's/^/PSACCT_ACTIVE=/' || true

          if command -v ausearch >/dev/null 2>&1; then
            echo '=== AUDIT SEARCH PM2/NODE/BASH 17:15-18:05 ==='
            ausearch -ts 17:15:00 -te 18:05:00 -m EXECVE 2>/dev/null | \
              grep -Ei 'pm2|sikhadenge-whatsapp-agent|node|bash' | tail -240 | redact || true
          fi

          if command -v lastcomm >/dev/null 2>&1; then
            echo '=== PROCESS ACCOUNTING PM2/NODE/BASH ==='
            lastcomm 2>/dev/null | grep -Ei 'pm2|node|bash|ssh' | head -240 | redact || true
          fi

          echo '=== PROVIDER / CLOUD KEY-INJECTION REFERENCES ==='
          grep -RInE 'authorized_keys|AuthorizedKeysCommand|ssh.*key|qemu.*guest|guest.*ssh|inject.*key|temporary.*key|ephemeral.*key' \
            /etc/systemd/system /usr/lib/systemd/system /etc/cloud /usr/local/bin /usr/local/sbin /opt 2>/dev/null | \
            grep -Ev '/node_modules/|/\.git/|/\.next/' | head -320 | redact || true

          echo '=== WA PM2 FINAL SAFE STATE ==='
          pm2 jlist | node -e 'let b="";process.stdin.on("data",d=>b+=d);process.stdin.on("end",()=>{const p=JSON.parse(b).find(x=>x.name==="sikhadenge-whatsapp-agent");if(!p){console.log("WA_PM2=MISSING");process.exit(2)};const e=p.pm2_env||{};console.log(["pid="+p.pid,"status="+e.status,"restarts="+e.restart_time,"unstable_restarts="+e.unstable_restarts,"watch="+e.watch,"cron_restart="+(e.cron_restart??"unset"),"cwd="+e.pm_cwd].join("|"));});'

          echo 'READ_ONLY_KEY_MAPPING=PASS'
          REMOTE
