name: UI Static Protected Audit 20260922

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          test "$kt" = ssh-ed25519
          port="${SSH_PORT:-22}"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$port" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read-only UI static alignment audit
        shell: bash
        run: |
          set -Eeuo pipefail
          port="${SSH_PORT:-22}"
          ssh -p "$port" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' > ui-static-audit.txt <<'REMOTE'
          set -Eeuo pipefail
          export HOME=/root PM2_HOME=/root/.pm2

          echo '=== HOST ==='
          hostname; date; df -h /

          APP='sikhadenge-checkout-hotfix-3955-20260831-210229'
          PID="$(pm2 pid "$APP" | tail -1 || true)"
          echo "APP=$APP PID=$PID"
          [[ "$PID" =~ ^[0-9]+$ ]] && [ "$PID" -gt 1 ]
          LIVE="$(readlink -f "/proc/$PID/cwd")"
          echo "LIVE=$LIVE"
          echo -n 'LIVE_BUILD_ID='; cat "$LIVE/.next/BUILD_ID" 2>/dev/null || true
          echo -n 'LIVE_STATIC_FILES='; find "$LIVE/.next/static" -type f 2>/dev/null | wc -l || true
          du -sh "$LIVE/.next/static" 2>/dev/null || true

          echo '=== NGINX ==='
          nginx -T 2>/dev/null | grep -nE 'server_name.*sikhadenge\.in|location .*_next|/_next/static|alias .*\.next|root /var/www/sikhadenge\.in|proxy_pass.*3955|proxy_pass.*3930' | head -320 || true

          PUB="$(mktemp)"; DIR="$(mktemp)"
          curl -kfsSL --max-time 20 'https://sikhadenge.in/?ui_audit=20260922' -o "$PUB"
          curl -fsSL -H 'Host: sikhadenge.in' --max-time 20 'http://127.0.0.1:3955/?ui_audit=20260922' -o "$DIR"

          python3 - "$PUB" "$DIR" <<'PY'
          import re,json,html,sys
          for label,path in [('PUBLIC',sys.argv[1]),('DIRECT',sys.argv[2])]:
              s=open(path,errors='replace').read()
              print(label+'_BYTES',len(s))
              m=re.search(r'<script id="__NEXT_DATA__" type="application/json">(.*?)</script>',s,re.S)
              if m:
                  d=json.loads(html.unescape(m.group(1)))
                  print(label+'_BUILD_ID',d.get('buildId'),'PAGE',d.get('page'))
              css=re.findall(r'<link[^>]+href=["\']([^"\']+\.css(?:\?[^"\']*)?)["\']',s)
              js=re.findall(r'<script[^>]+src=["\']([^"\']+\.js(?:\?[^"\']*)?)["\']',s)
              print(label+'_CSS',*css,sep='\n')
              print(label+'_JS',*js,sep='\n')
          PY

          echo '=== BROKEN ASSET MATRIX ==='
          for u in             '/_next/static/css/a27533918508dbe3.css'             '/_next/static/css/e69e5f6c5b9af5ee.css'             '/_next/static/chunks/main-app-acedf842f6d2ac77.js'             '/_next/static/chunks/1691-8607b324693e1ba4.js'             '/_next/static/chunks/8332-8a8426f82f83b0cc.js'             '/_next/static/chunks/app/page-0aa0d32a71eb4a20.js'             '/_next/static/chunks/8378-3f07c1be38ef164c.js'             '/_next/static/chunks/polyfills-42372ed130431b0a.js'             '/_next/static/chunks/webpack-306a82c98f4f7895.js'
          do
            rel="${u#/_next/}"
            pub="$(curl -ksS -o /dev/null -w '%{http_code}|%{content_type}|%{size_download}' --max-time 10 "https://sikhadenge.in$u" || true)"
            direct="$(curl -sS -o /dev/null -w '%{http_code}|%{content_type}|%{size_download}' -H 'Host: sikhadenge.in' --max-time 10 "http://127.0.0.1:3955$u" || true)"
            disk='MISSING'
            [ ! -f "$LIVE/.next/$rel" ] || disk="$(stat -c '%s' "$LIVE/.next/$rel")"
            echo "$u PUBLIC=$pub DIRECT=$direct LIVE_DISK=$disk"
          done

          echo '=== ASSET COPIES ELSEWHERE ==='
          for f in a27533918508dbe3.css e69e5f6c5b9af5ee.css main-app-acedf842f6d2ac77.js page-0aa0d32a71eb4a20.js webpack-306a82c98f4f7895.js; do
            echo "--- $f"
            find /var/www/sikhadenge.in /var/backups/sikhadenge /var/tmp /opt -type f -name "$f" -printf '%p|%s\n' 2>/dev/null | head -80 || true
          done

          echo '=== RECENT STATIC ERRORS ==='
          tail -n 2500 /var/log/nginx/error.log 2>/dev/null | grep -E '_next/static|400' | tail -160 || true

          rm -f "$PUB" "$DIR"
          echo 'UI_STATIC_AUDIT_COMPLETE=1'
          REMOTE
          cat ui-static-audit.txt

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: ui-static-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ui-static-audit.txt
          if-no-files-found: error
          retention-days: 7
