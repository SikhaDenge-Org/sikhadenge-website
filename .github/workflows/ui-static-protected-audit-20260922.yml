name: VPS Fast Service Recovery 20260922

on:
  workflow_dispatch:
    inputs:
      execute:
        description: 'Free safe disk space and recover VPS web services'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  recover-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
      EXECUTE: ${{ inputs.execute }}

    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          test "$kt" = ssh-ed25519
          port="${SSH_PORT:-22}"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$port" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Free safe space and recover all web services
        shell: bash
        run: |
          set -Eeuo pipefail
          port="${SSH_PORT:-22}"
          ssh -p "$port" -i "$HOME/.ssh/prod" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "EXECUTE='$EXECUTE' bash -s" > vps-global-recovery.txt <<'REMOTE'
          set -Eeuo pipefail
          export HOME=/root PM2_HOME=/root/.pm2

          avail_kb() { df -Pk / | awk 'NR==2{print $4}'; }
          show_disk() {
            echo "DISK_AVAILABLE_KB=$(avail_kb)"
            df -hT /
            df -ih /
          }

          echo '=== VPS GLOBAL RECOVERY START ==='
          hostname
          date
          show_disk
          free -h || true
          echo "EXECUTE=$EXECUTE"

          if [ "$EXECUTE" != 'true' ]; then
            echo 'EXECUTION_SKIPPED=1'
            exit 20
          fi

          echo '=== SAFE ENOSPC RECLAIM ==='
          before="$(avail_kb)"
          echo "BEFORE_AVAILABLE_KB=$before"

          # Runtime logs only. No application/database/user data.
          if [ -d /root/.pm2/logs ]; then
            echo -n 'PM2_LOGS_BEFORE='; du -sh /root/.pm2/logs 2>/dev/null || true
            find /root/.pm2/logs -xdev -type f -name '*.log' -exec truncate -s 0 {} + 2>/dev/null || true
          fi
          if [ -d /var/log/nginx ]; then
            echo -n 'NGINX_LOGS_BEFORE='; du -sh /var/log/nginx 2>/dev/null || true
            find /var/log/nginx -xdev -type f -name '*.log' -exec truncate -s 0 {} + 2>/dev/null || true
          fi

          # Rotated/compressed logs and package caches are reproducible data.
          find /var/log -xdev -type f \( -name '*.gz' -o -name '*.old' -o -name '*.1' -o -name '*.2' -o -name '*.3' \) -mtime +1 -delete 2>/dev/null || true
          apt-get clean >/dev/null 2>&1 || true
          rm -rf /var/cache/apt/archives/* 2>/dev/null || true

          # NPM cache is fully reproducible and can be rebuilt.
          if [ -d /root/.npm/_cacache ]; then
            echo -n 'NPM_CACHE_BEFORE='; du -sh /root/.npm/_cacache 2>/dev/null || true
            rm -rf /root/.npm/_cacache 2>/dev/null || true
          fi

          # Known one-shot recovery temp directories only.
          find /var/tmp /tmp -maxdepth 1 -mindepth 1 -type d \
            \( -name 'sd-ui-recovery-*' -o -name 'sikhadenge-ui-v2-production-*' \) \
            -mmin +20 -print0 2>/dev/null |
            while IFS= read -r -d '' d; do
              echo "SAFE_TEMP_DELETE=$d"
              rm -rf --one-file-system -- "$d" || true
            done

          # BuildKit cache only; running containers, images in use, volumes and DB data are preserved.
          if command -v docker >/dev/null 2>&1 && [ "$(avail_kb)" -lt 1048576 ]; then
            docker builder prune -af >/dev/null 2>&1 || true
          fi

          journalctl --vacuum-size=100M >/dev/null 2>&1 || true
          sync || true

          after="$(avail_kb)"
          echo "AFTER_SAFE_RECLAIM_AVAILABLE_KB=$after"
          show_disk
          [ "$after" -gt 262144 ]

          echo '=== FAST RECOVERY MODE: DEEP DISK SCAN DEFERRED ==='
          echo "FAST_RECOVERY_AVAILABLE_KB=$(avail_kb)"
          df -hT /

          echo '=== NGINX / PM2 BASELINE ==='
          nginx -t
          systemctl is-active nginx || true
          if command -v pm2 >/dev/null 2>&1; then
            pm2 ping || true
            pm2 ls || true
          fi
          if command -v docker >/dev/null 2>&1; then
            systemctl is-active docker || true
            docker ps -a --format 'DOCKER|{{.Names}}|{{.Status}}|{{.Ports}}' || true
          fi

          echo '=== RECOVER PM2 ==='
          if command -v pm2 >/dev/null 2>&1; then
            count="$(pm2 jlist 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).length)}catch(e){console.log(0)}})" || echo 0)"
            echo "PM2_PROCESS_COUNT=$count"
            if [ "$count" -eq 0 ] && [ -s /root/.pm2/dump.pm2 ]; then
              pm2 resurrect || true
              sleep 4
            fi
            pm2 restart all --update-env || true
            sleep 8
            pm2 save || true
            pm2 ls || true
          fi

          echo '=== RECOVER NGINX ==='
          nginx -t
          systemctl restart nginx
          sleep 3
          systemctl is-active nginx

          echo '=== FAILED SYSTEMD SERVICES ==='
          systemctl --failed --no-legend --plain || true

          echo '=== LISTENERS ==='
          ss -ltnp | head -200 || true

          echo '=== NGINX SERVER NAMES ==='
          nginx -T 2>/dev/null | awk '
            $1=="server_name" {
              for(i=2;i<=NF;i++){
                gsub(/;/,"",$i);
                if($i ~ /sikhadenge\.in$/ || $i=="sikhadenge.in") print $i
              }
            }' | sort -u > /tmp/sd-hosts.txt
          cat /tmp/sd-hosts.txt

          echo '=== LOCAL ORIGIN HOST PROBES ==='
          local_fail=0
          while IFS= read -r h; do
            [ -n "$h" ] || continue
            case "$h" in
              '~'*|'*'*) continue ;;
            esac
            code="$(curl -k -sS -L --connect-timeout 4 --max-time 12 \
              --resolve "$h:443:127.0.0.1" -o /dev/null -w '%{http_code}' "https://$h/" || true)"
            echo "LOCAL_HTTPS|$h|$code"
            case "$code" in 2??|3??|401|403|404) ;; *) local_fail=$((local_fail+1)) ;; esac
          done < /tmp/sd-hosts.txt
          echo "LOCAL_HOST_FAILURES=$local_fail"

          echo '=== CRITICAL PUBLIC PROBES ==='
          public_fail=0
          for url in \
            https://sikhadenge.in/ \
            https://seo.sikhadenge.in/seo \
            https://b2b.sikhadenge.in/b2b \
            https://whatsapp.sikhadenge.in/inbox
          do
            code=''
            for i in 1 2 3 4; do
              code="$(curl -k -sS -L --connect-timeout 5 --max-time 20 -o /dev/null -w '%{http_code}' "$url" || true)"
              echo "PUBLIC_TRY_$i|$url|$code"
              case "$code" in 2??|3??|401|403|404) break ;; esac
              sleep 2
            done
            case "$code" in 2??|3??|401|403|404) ;; *) public_fail=$((public_fail+1)) ;; esac
          done
          echo "CRITICAL_PUBLIC_FAILURES=$public_fail"

          echo '=== FINAL DISK ==='
          show_disk
          echo "VPS_GLOBAL_RECOVERY_COMPLETED=1"

          if [ "$public_fail" -gt 0 ]; then
            echo 'PUBLIC_RECOVERY_INCOMPLETE=1'
            exit 41
          fi
          REMOTE
          cat vps-global-recovery.txt

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vps-global-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: vps-global-recovery.txt
          if-no-files-found: error
          retention-days: 7
