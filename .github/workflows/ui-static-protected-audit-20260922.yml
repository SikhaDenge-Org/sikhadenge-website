name: Main Site 502 Emergency Recovery 20260922

on:
  workflow_dispatch:
    inputs:
      execute:
        description: 'Restart/recover main site origin if unhealthy'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
      EXECUTE: ${{ inputs.execute }}

    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          test "$kt" = ssh-ed25519
          port="${SSH_PORT:-22}"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$port" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Diagnose and recover main site origin
        shell: bash
        run: |
          set -Eeuo pipefail
          port="${SSH_PORT:-22}"
          ssh -p "$port" -i "$HOME/.ssh/prod" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "EXECUTE='$EXECUTE' bash -s" > main-site-502-recovery.txt <<'REMOTE'
          set -Eeuo pipefail
          export HOME=/root PM2_HOME=/root/.pm2

          APP='sikhadenge-checkout-hotfix-3955-20260831-210229'
          PORT=3955
          TS="$(date +%Y%m%d-%H%M%S)"
          ENVFILE="/root/.cache/main-site-502-env-$TS.sh"
          mkdir -p /root/.cache
          chmod 700 /root/.cache
          trap 'rm -f "$ENVFILE"' EXIT

          echo '=== HOST ==='
          hostname
          date
          df -h /
          free -h || true
          echo "EXECUTE=$EXECUTE"

          echo '=== NGINX ==='
          nginx -t
          systemctl is-active nginx || true

          echo '=== PM2 BEFORE ==='
          pm2 jlist > /tmp/main-site-pm2-before.json
          node - /tmp/main-site-pm2-before.json "$APP" <<'NODE'
          const fs=require('fs');
          const [file,name]=process.argv.slice(2);
          const p=JSON.parse(fs.readFileSync(file,'utf8')).find(x=>x.name===name);
          if(!p){ console.log('PM2_PRESENT=false'); process.exit(0); }
          const e=p.pm2_env||{};
          console.log('PM2_PRESENT=true');
          console.log('PM2_STATUS='+(e.status||''));
          console.log('PM2_CWD='+(e.pm_cwd||''));
          console.log('PM2_RESTARTS='+(e.restart_time??''));
          console.log('PM2_UNSTABLE_RESTARTS='+(e.unstable_restarts??''));
          console.log('PM2_PID='+(p.pid||0));
          NODE

          PM2_STATUS="$(node - /tmp/main-site-pm2-before.json "$APP" <<'NODE'
          const fs=require('fs'); const [f,n]=process.argv.slice(2);
          const p=JSON.parse(fs.readFileSync(f,'utf8')).find(x=>x.name===n);
          process.stdout.write(String(p?.pm2_env?.status||'missing'));
          NODE
          )"
          PM2_CWD="$(node - /tmp/main-site-pm2-before.json "$APP" <<'NODE'
          const fs=require('fs'); const [f,n]=process.argv.slice(2);
          const p=JSON.parse(fs.readFileSync(f,'utf8')).find(x=>x.name===n);
          process.stdout.write(String(p?.pm2_env?.pm_cwd||''));
          NODE
          )"
          PID="$(pm2 pid "$APP" | tail -1 || true)"
          PROC_CWD=''
          if [[ "$PID" =~ ^[0-9]+$ ]] && [ "$PID" -gt 1 ]; then
            PROC_CWD="$(readlink "/proc/$PID/cwd" 2>/dev/null || true)"
          fi
          echo "PROC_CWD=$PROC_CWD"

          echo '=== CANDIDATE RELEASES ==='
          mapfile -t CANDS < <(find /var/www/sikhadenge.in/releases -maxdepth 1 -mindepth 1 -type d -name 'ui-static-recovery-*' -printf '%T@|%p\n' 2>/dev/null | sort -nr | cut -d'|' -f2-)
          TARGET=''
          if [ -n "$PM2_CWD" ] && [ -d "$PM2_CWD" ] && [ -f "$PM2_CWD/.next/BUILD_ID" ] && [ -x "$PM2_CWD/node_modules/.bin/next" ]; then
            TARGET="$PM2_CWD"
          else
            for d in "${CANDS[@]}"; do
              if [ -f "$d/.next/BUILD_ID" ] && [ -d "$d/.next/static" ] && [ -x "$d/node_modules/.bin/next" ]; then
                TARGET="$d"; break
              fi
            done
          fi
          echo "TARGET=$TARGET"
          test -n "$TARGET"
          echo -n 'TARGET_BUILD_ID='; cat "$TARGET/.next/BUILD_ID"
          echo -n 'TARGET_STATIC_FILES='; find "$TARGET/.next/static" -type f | wc -l

          probe_direct() {
            curl -sS -H 'Host: sikhadenge.in' --connect-timeout 3 --max-time 8 -o /tmp/main-home.html -w '%{http_code}' "http://127.0.0.1:$PORT/?origin_probe=$TS" 2>/dev/null || true
          }
          DIRECT_BEFORE="$(probe_direct)"
          echo "DIRECT_BEFORE=$DIRECT_BEFORE"

          HEALTHY=false
          if [ "$PM2_STATUS" = 'online' ] && [ "$DIRECT_BEFORE" = '200' ] && [ -d "$TARGET" ]; then HEALTHY=true; fi
          echo "ORIGIN_HEALTHY_BEFORE=$HEALTHY"

          if [ "$HEALTHY" != 'true' ]; then
            echo '=== ERROR LOG TAIL BEFORE RECOVERY ==='
            pm2 logs "$APP" --lines 80 --nostream 2>&1 | tail -160 || true

            if [ "$EXECUTE" != 'true' ]; then
              echo 'RECOVERY_REQUIRED=true EXECUTION_SKIPPED=true'
              exit 20
            fi

            echo '=== CAPTURE PM2 ENV ==='
            node - /tmp/main-site-pm2-before.json "$APP" "$ENVFILE" <<'NODE'
            const fs=require('fs'), sh=require('node:util');
            const [file,name,out]=process.argv.slice(2);
            const p=JSON.parse(fs.readFileSync(file,'utf8')).find(x=>x.name===name);
            const e=p?.pm2_env||{};
            const skip=new Set(['PWD','OLDPWD','SHLVL','_','PORT','PM2_HOME']);
            const q=s=>"'"+String(s).replace(/'/g,"'\\''")+"'";
            const lines=['set -a']; let n=0;
            for(const [k,v] of Object.entries(e)){
              if(!/^[A-Z_][A-Z0-9_]*$/.test(k) || skip.has(k)) continue;
              if(typeof v!=='string' && typeof v!=='number' && typeof v!=='boolean') continue;
              lines.push(k+'='+q(v)); n++;
            }
            lines.push('set +a');
            fs.writeFileSync(out,lines.join('\n')+'\n',{mode:0o600});
            console.log('ENV_KEYS_CAPTURED='+n);
            NODE

            echo '=== FIRST RECOVERY: PM2 RESTART ==='
            if pm2 describe "$APP" >/dev/null 2>&1; then
              pm2 restart "$APP" --update-env || true
              for i in $(seq 1 25); do
                code="$(probe_direct)"
                echo "RESTART_PROBE_$i=$code"
                [ "$code" = '200' ] && break
                sleep 1
              done
            fi

            code="$(probe_direct)"
            if [ "$code" != '200' ]; then
              echo '=== SECOND RECOVERY: RECREATE PM2 FROM VALIDATED RELEASE ==='
              pm2 delete "$APP" >/dev/null 2>&1 || true
              if [ -s "$ENVFILE" ]; then source "$ENVFILE"; fi
              export PORT=3955
              pm2 start "$TARGET/node_modules/next/dist/bin/next" \
                --name "$APP" --cwd "$TARGET" -- start -p 3955
              for i in $(seq 1 30); do
                code="$(probe_direct)"
                echo "RECREATE_PROBE_$i=$code"
                [ "$code" = '200' ] && break
                sleep 1
              done
            fi

            test "$(probe_direct)" = '200'
            pm2 save
          fi

          echo '=== DIRECT CONTENT / ASSET QA ==='
          curl -fsS -H 'Host: sikhadenge.in' --max-time 10 "http://127.0.0.1:$PORT/?direct_qa=$TS" -o /tmp/main-direct.html
          python3 - /tmp/main-direct.html "$PORT" <<'PY'
          import re,subprocess,sys
          s=open(sys.argv[1],errors='replace').read(); port=sys.argv[2]
          for marker in ['Become an AI Expert','AI Tools You Will Master']:
              if marker not in s: raise SystemExit('missing '+marker)
          assets=[]
          assets+=re.findall(r'<link[^>]+href=["\']([^"\']+\.css(?:\?[^"\']*)?)["\']',s)
          assets+=re.findall(r'<script[^>]+src=["\']([^"\']+\.js(?:\?[^"\']*)?)["\']',s)
          fails=[]
          for a in dict.fromkeys(assets):
              if a.startswith('http') or a.startswith('/cdn-cgi/'): continue
              p=subprocess.run(['curl','-sS','-o','/dev/null','-w','%{http_code}','-H','Host: sikhadenge.in','--max-time','8',f'http://127.0.0.1:{port}{a}'],capture_output=True,text=True)
              if p.stdout!='200': fails.append((a,p.stdout))
          print('DIRECT_ASSET_COUNT',len(list(dict.fromkeys(assets))))
          print('DIRECT_ASSET_FAILURES',len(fails))
          if fails: print(fails); raise SystemExit(1)
          PY

          for img in \
            /assets/home/ai-jobs-data-banner/ai-jobs-data-banner-desktop.webp \
            /assets/home/process-section/process-section-ai-digital-growth-desktop.png \
            /assets/home/ai-growth-system-section/ai-growth-system-desktop.webp
          do
            c="$(curl -sS -o /dev/null -w '%{http_code}|%{content_type}|%{size_download}' -H 'Host: sikhadenge.in' --max-time 12 "http://127.0.0.1:$PORT$img" || true)"
            echo "DIRECT_IMAGE=$c $img"
            [[ "$c" == 200\|image/* ]]
          done

          echo '=== PUBLIC QA ==='
          public_code=''
          for i in $(seq 1 10); do
            public_code="$(curl -k -sS -L --connect-timeout 5 --max-time 15 -o /tmp/main-public.html -w '%{http_code}' "https://sikhadenge.in/?public_qa=$TS" || true)"
            echo "PUBLIC_PROBE_$i=$public_code"
            [ "$public_code" = '200' ] && break
            sleep 3
          done
          if [ "$public_code" != '200' ] && [ "$EXECUTE" = 'true' ]; then
            echo 'PUBLIC_STILL_BAD_RELOADING_NGINX=1'
            nginx -t
            systemctl reload nginx
            sleep 3
            for i in $(seq 1 8); do
              public_code="$(curl -k -sS -L --connect-timeout 5 --max-time 15 -o /tmp/main-public.html -w '%{http_code}' "https://sikhadenge.in/?public_qa_reload=$TS" || true)"
              echo "PUBLIC_RELOAD_PROBE_$i=$public_code"
              [ "$public_code" = '200' ] && break
              sleep 3
            done
          fi
          test "$public_code" = '200'

          echo '=== PM2 AFTER ==='
          pm2 jlist > /tmp/main-site-pm2-after.json
          node - /tmp/main-site-pm2-after.json "$APP" <<'NODE'
          const fs=require('fs'); const [f,n]=process.argv.slice(2);
          const p=JSON.parse(fs.readFileSync(f,'utf8')).find(x=>x.name===n);
          if(!p) process.exit(2);
          const e=p.pm2_env||{};
          console.log('FINAL_PM2_STATUS='+(e.status||''));
          console.log('FINAL_PM2_CWD='+(e.pm_cwd||''));
          console.log('FINAL_PM2_PID='+(p.pid||0));
          console.log('FINAL_RESTARTS='+(e.restart_time??''));
          if(e.status!=='online') process.exit(3);
          NODE
          echo "FINAL_DIRECT=$(probe_direct)"
          echo "FINAL_PUBLIC=$public_code"
          echo 'MAIN_SITE_502_RECOVERY_OK=1'
          REMOTE
          cat main-site-502-recovery.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-site-502-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: main-site-502-recovery.txt
          if-no-files-found: error
          retention-days: 7
