name: UI Static Protected Audit Dispatcher 20260922

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui-static-protected-audit-20260922.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch protected production UI audit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh workflow run ui-static-protected-audit-20260922.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref ops/emergency-disk-deep-audit-20260922
          echo 'PROTECTED_UI_STATIC_AUDIT_DISPATCHED=1'
