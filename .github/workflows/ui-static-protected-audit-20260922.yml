name: Emergency VPS Deep Disk Audit 20260922

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          test "$kt" = ssh-ed25519
          port="${SSH_PORT:-22}"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$port" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Stream read-only deep disk audit
        shell: bash
        run: |
          set -Eeuo pipefail
          port="${SSH_PORT:-22}"
          ssh -p "$port" -i "$HOME/.ssh/prod" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set +e
          export HOME=/root PM2_HOME=/root/.pm2
          echo '===== HOST / TIME ====='
          hostname
          date
          uptime

          echo '===== FILESYSTEM CAPACITY ====='
          df -hT /
          df -B1 /
          df -ih /
          mount | grep ' on / ' || true

          echo '===== TOP-LEVEL DIRECTORY BYTES ====='
          for d in /var /opt /root /home /tmp /usr /srv /mnt; do
            [ -e "$d" ] || continue
            echo "--- $d"
            du -x -B1 -d1 "$d" 2>/dev/null | sort -nr | head -40
          done

          echo '===== /var/www BREAKDOWN ====='
          du -x -B1 -d2 /var/www 2>/dev/null | sort -nr | head -120

          echo '===== /var/lib BREAKDOWN ====='
          du -x -B1 -d2 /var/lib 2>/dev/null | sort -nr | head -120

          echo '===== /var/log BREAKDOWN ====='
          du -x -B1 -d2 /var/log 2>/dev/null | sort -nr | head -100

          echo '===== /var/backups + /root BACKUPS/CACHES ====='
          for d in /var/backups /root/sikhadenge-backups /root/.cache /root/.npm /root/.pm2 /var/tmp /tmp; do
            [ -e "$d" ] || continue
            echo "--- $d"
            du -x -B1 -d2 "$d" 2>/dev/null | sort -nr | head -100
          done

          echo '===== SIKHADENGE MAIN RELEASES ====='
          if [ -d /var/www/sikhadenge.in ]; then
            du -x -B1 -d3 /var/www/sikhadenge.in 2>/dev/null | sort -nr | head -160
          fi

          echo '===== WHATSAPP TREE ====='
          if [ -d /var/www/sikhadenge-whatsapp-agent ]; then
            du -x -B1 -d3 /var/www/sikhadenge-whatsapp-agent 2>/dev/null | sort -nr | head -160
          fi

          echo '===== OPT RELEASE TREES ====='
          du -x -B1 -d3 /opt 2>/dev/null | sort -nr | head -180

          echo '===== LARGE FILES > 1 GiB ON ROOT FS ====='
          find / -xdev -type f -size +1G -printf '%s|%p\n' 2>/dev/null | sort -nr | head -120

          echo '===== LARGE FILES > 500 MiB ON ROOT FS ====='
          find / -xdev -type f -size +500M -printf '%s|%p\n' 2>/dev/null | sort -nr | head -160

          echo '===== DELETED-OPEN FILES ====='
          if command -v lsof >/dev/null 2>&1; then
            lsof -nP +L1 2>/dev/null | head -240
          else
            echo 'LSOF_NOT_INSTALLED'
          fi

          echo '===== SYSTEMD JOURNAL ====='
          journalctl --disk-usage 2>/dev/null || true

          echo '===== DOCKER STORAGE ====='
          if command -v docker >/dev/null 2>&1; then
            docker system df 2>/dev/null || true
            echo '--- docker verbose ---'
            docker system df -v 2>/dev/null | head -300 || true
          else
            echo 'DOCKER_NOT_INSTALLED'
          fi

          echo '===== APT / PACKAGE CACHES ====='
          du -x -B1 -d2 /var/cache 2>/dev/null | sort -nr | head -100
          du -x -B1 -d2 /var/lib/apt 2>/dev/null | sort -nr | head -100

          echo '===== PM2 PROCESS SUMMARY ====='
          pm2 ls 2>/dev/null || true

          echo '===== LISTENING PORTS ====='
          ss -lntp 2>/dev/null | head -220 || true

          echo '===== AUDIT COMPLETE ====='
          REMOTE
