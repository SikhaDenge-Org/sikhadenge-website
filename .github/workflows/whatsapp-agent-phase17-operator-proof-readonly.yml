name: WhatsApp Agent Phase17 Operator Proof Readonly Screen

on:
  push:
    branches: [phase17-stage2-governance-v15-20260913]
    paths:
      - ".github/workflows/whatsapp-agent-phase17-operator-proof-readonly.yml"

permissions:
  contents: read

concurrency:
  group: whatsapp-agent-production
  cancel-in-progress: false

jobs:
  operator-proof-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
      RELEASE_BRANCH: release/whatsapp-instagram-agent-flow-20260731

    steps:
      - name: Configure pinned production SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          for v in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_HOST_KEY; do test -n "${!v:-}"; done
          if [[ -z "${SSH_PORT:-}" ]]; then printf 'SSH_PORT=22\n' >> "$GITHUB_ENV"; SSH_PORT=22; fi
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$key" >/dev/null

      - name: Screen current production incident and duplicate-send signals read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "RELEASE_BRANCH='$RELEASE_BRANCH' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          A=/var/www/sikhadenge-whatsapp-agent/source/apps/whatsapp-agent-dashboard
          E="$A/.env"

          envv() {
            node - "$E" "$1" <<'NODE'
          const fs=require('node:fs'); const [file,key]=process.argv.slice(2);
          for(const raw of fs.readFileSync(file,'utf8').split(/\r?\n/)){
            let line=raw.trim(); if(!line||line.startsWith('#')) continue;
            if(line.startsWith('export ')) line=line.slice(7).trim();
            const i=line.indexOf('='); if(i<1||line.slice(0,i).trim()!==key) continue;
            let value=line.slice(i+1).trim();
            if(value.length>=2&&((value.startsWith('"')&&value.endsWith('"'))||(value.startsWith("'")&&value.endsWith("'")))) value=value.slice(1,-1);
            process.stdout.write(value); process.exit(0);
          }
          process.exit(1);
          NODE
          }

          release_sha="$(git -C "$A" ls-remote origin "refs/heads/$RELEASE_BRANCH" | awk '{print $1}')"
          live_sha="$(git -C "$A" rev-parse HEAD)"
          dirty="$(git -C "$A" status --porcelain --untracked-files=no | sed '/^$/d' | wc -l | tr -d ' ')"
          printf 'RELEASE_SHA=%s\nLIVE_SHA=%s\nTRACKED_DIRTY_COUNT=%s\n' "$release_sha" "$live_sha" "$dirty"
          test "$release_sha" = "$live_sha"
          test "$dirty" = "0"

          pm2_state="$(pm2 jlist 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"[]").find(x=>x.name==="sikhadenge-whatsapp-agent");process.stdout.write(String(p?.pm2_env?.status||"missing"))})')"
          login_http="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 https://whatsapp.sikhadenge.in/login || true)"
          printf 'PM2_STATE=%s\nLOGIN_HTTP=%s\n' "$pm2_state" "$login_http"
          test "$pm2_state" = "online"
          test "$login_http" = "200"

          database_url="$(envv DATABASE_URL)"
          DB="$(node "$A/scripts/prisma-postgres-cli-url.mjs" "$database_url")"
          q(){ PGOPTIONS='-c default_transaction_read_only=on' psql "$DB" -X -v ON_ERROR_STOP=1 -Atqc "$1"; }

          outbound_1h="$(q "SELECT COUNT(*) FROM \"WhatsAppMessage\" WHERE \"direction\"='OUTBOUND' AND \"createdAt\">=now()-interval '1 hour';")"
          failed_1h="$(q "SELECT COUNT(*) FROM \"WhatsAppMessage\" WHERE \"direction\"='OUTBOUND' AND \"status\"='FAILED' AND \"createdAt\">=now()-interval '1 hour';")"
          failed_24h="$(q "SELECT COUNT(*) FROM \"WhatsAppMessage\" WHERE \"direction\"='OUTBOUND' AND \"status\"='FAILED' AND \"createdAt\">=now()-interval '24 hours';")"
          stale_queued_24h="$(q "SELECT COUNT(*) FROM \"WhatsAppMessage\" WHERE \"direction\"='OUTBOUND' AND \"status\"='QUEUED' AND \"createdAt\">=now()-interval '24 hours' AND \"createdAt\"<now()-interval '15 minutes';")"
          webhook_error_1h="$(q "SELECT COUNT(*) FROM \"WebhookEvent\" WHERE \"processingError\" IS NOT NULL AND \"receivedAt\">=now()-interval '1 hour';")"
          webhook_unresolved_24h="$(q "SELECT COUNT(*) FROM \"WebhookEvent\" WHERE \"processingError\" IS NOT NULL AND \"processedAt\" IS NULL AND \"receivedAt\">=now()-interval '24 hours';")"
          duplicate_meta_ids="$(q "SELECT COUNT(*) FROM (SELECT \"metaMessageId\" FROM \"WhatsAppMessage\" WHERE \"metaMessageId\" IS NOT NULL GROUP BY \"metaMessageId\" HAVING COUNT(*)>1) d;")"
          duplicate_webhook_keys="$(q "SELECT COUNT(*) FROM (SELECT \"eventKey\" FROM \"WebhookEvent\" GROUP BY \"eventKey\" HAVING COUNT(*)>1) d;")"
          exact_duplicate_outbound_24h="$(q "SELECT COUNT(*) FROM (SELECT \"conversationId\",COALESCE(\"text\",''),\"type\",\"messageTimestamp\" FROM \"WhatsAppMessage\" WHERE \"direction\"='OUTBOUND' AND \"createdAt\">=now()-interval '24 hours' GROUP BY \"conversationId\",COALESCE(\"text\",''),\"type\",\"messageTimestamp\" HAVING COUNT(*)>1) d;")"

          printf 'OUTBOUND_MESSAGES_LAST_1H=%s\n' "$outbound_1h"
          printf 'FAILED_OUTBOUND_LAST_1H=%s\nFAILED_OUTBOUND_LAST_24H=%s\n' "$failed_1h" "$failed_24h"
          printf 'STALE_QUEUED_OUTBOUND_LAST_24H=%s\n' "$stale_queued_24h"
          printf 'WEBHOOK_PROCESSING_ERRORS_LAST_1H=%s\nUNRESOLVED_WEBHOOK_ERRORS_LAST_24H=%s\n' "$webhook_error_1h" "$webhook_unresolved_24h"
          printf 'STRICT_DUPLICATE_META_MESSAGE_IDS=%s\nSTRICT_DUPLICATE_WEBHOOK_EVENT_KEYS=%s\n' "$duplicate_meta_ids" "$duplicate_webhook_keys"
          printf 'EXACT_DUPLICATE_OUTBOUND_GROUPS_LAST_24H=%s\n' "$exact_duplicate_outbound_24h"

          if [[ "$failed_1h" = "0" && "$stale_queued_24h" = "0" && "$webhook_error_1h" = "0" && "$webhook_unresolved_24h" = "0" ]]; then
            echo 'TECHNICAL_INCIDENT_SIGNAL_SCREEN=CLEAR'
          else
            echo 'TECHNICAL_INCIDENT_SIGNAL_SCREEN=REVIEW_REQUIRED'
          fi
          if [[ "$duplicate_meta_ids" = "0" && "$duplicate_webhook_keys" = "0" && "$exact_duplicate_outbound_24h" = "0" ]]; then
            echo 'TECHNICAL_DUPLICATE_SEND_SIGNAL_SCREEN=CLEAR'
          else
            echo 'TECHNICAL_DUPLICATE_SEND_SIGNAL_SCREEN=REVIEW_REQUIRED'
          fi
          echo 'READ_ONLY_PROBE=true'
          REMOTE
