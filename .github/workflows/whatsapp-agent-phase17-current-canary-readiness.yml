name: WhatsApp Agent Phase17 Current Canary Readiness

on:
  push:
    branches:
      - ops/phase17-canary-readiness-20260917
    paths:
      - ".github/workflows/whatsapp-agent-phase17-current-canary-readiness.yml"

permissions:
  contents: read

concurrency:
  group: whatsapp-agent-phase17-canary-readiness
  cancel-in-progress: true

jobs:
  readonly-canary-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
      EXPECTED_RELEASE_SHA: bb203d95f6fbec3d5a5ebf8e6e0db6ca03a5bb02
      RELEASE_BRANCH: release/whatsapp-instagram-agent-flow-20260731

    steps:
      - name: Checkout audit workflow branch
        uses: actions/checkout@v4

      - name: Configure pinned production SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          for v in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_HOST_KEY; do test -n "${!v:-}"; done
          if [[ -z "${SSH_PORT:-}" ]]; then echo SSH_PORT=22 >> "$GITHUB_ENV"; SSH_PORT=22; fi
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$key" >/dev/null
          printf 'PASS: PINNED_SSH_READY\n'

      - name: Run zero-external-write canary readiness audit
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "EXPECTED_RELEASE_SHA='$EXPECTED_RELEASE_SHA' RELEASE_BRANCH='$RELEASE_BRANCH' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          APP=/var/www/sikhadenge-whatsapp-agent/source/apps/whatsapp-agent-dashboard
          ENV_FILE="$APP/.env"
          WORKSPACE_ID=engagews_default

          envv() {
            node - "$ENV_FILE" "$1" <<'NODE'
          const fs=require('node:fs'); const [file,key]=process.argv.slice(2);
          for(const raw of fs.readFileSync(file,'utf8').split(/\r?\n/)){
            let line=raw.trim(); if(!line||line.startsWith('#')) continue;
            if(line.startsWith('export ')) line=line.slice(7).trim();
            const i=line.indexOf('='); if(i<1||line.slice(0,i).trim()!==key) continue;
            let value=line.slice(i+1).trim();
            if(value.length>=2&&((value.startsWith('"')&&value.endsWith('"'))||(value.startsWith("'")&&value.endsWith("'")))) value=value.slice(1,-1);
            process.stdout.write(value); process.exit(0);
          }
          process.exit(1);
          NODE
          }

          test "$(id -u)" = "0"
          test -f "$ENV_FILE"
          release_sha="$(git -C "$APP" ls-remote origin "refs/heads/$RELEASE_BRANCH" | awk '{print $1}')"
          live_sha="$(git -C "$APP" rev-parse HEAD)"
          dirty="$(git -C "$APP" status --porcelain --untracked-files=no | sed '/^$/d' | wc -l | tr -d ' ')"
          printf 'RELEASE_SHA=%s\nLIVE_SHA=%s\nTRACKED_DIRTY_COUNT=%s\n' "$release_sha" "$live_sha" "$dirty"
          test "$release_sha" = "$EXPECTED_RELEASE_SHA"
          test "$live_sha" = "$EXPECTED_RELEASE_SHA"
          test "$dirty" = "0"

          pm2_state="$(pm2 jlist 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"[]").find(x=>x.name==="sikhadenge-whatsapp-agent");process.stdout.write(String(p?.pm2_env?.status||"missing"))})')"
          login_http="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 https://whatsapp.sikhadenge.in/login || true)"
          printf 'PM2_STATE=%s\nLOGIN_HTTP=%s\n' "$pm2_state" "$login_http"
          test "$pm2_state" = "online"
          test "$login_http" = "200"

          provider_mode="$(envv WHATSAPP_OUTBOUND_MODE 2>/dev/null || true)"
          cutover="$(envv WHATSAPP_CUTOVER_APPROVED 2>/dev/null || true)"
          live_ack="$(envv WHATSAPP_OUTBOUND_LIVE_ACK 2>/dev/null || true)"
          kill="$(envv WHATSAPP_OUTBOUND_KILL_SWITCH 2>/dev/null || true)"
          printf 'WHATSAPP_OUTBOUND_MODE=%s\n' "${provider_mode:-disabled}"
          printf 'WHATSAPP_CUTOVER_APPROVED=%s\n' "${cutover:-false}"
          printf 'WHATSAPP_OUTBOUND_LIVE_ACK_SET=%s\n' "$([[ -n "$live_ack" ]] && echo true || echo false)"
          printf 'WHATSAPP_OUTBOUND_KILL_SWITCH=%s\n' "${kill:-unset}"
          test "${provider_mode:-disabled}" != "live"

          export DATABASE_URL="$(envv DATABASE_URL)"
          DB="$(node "$APP/scripts/prisma-postgres-cli-url.mjs" "$DATABASE_URL")"
          state="$(psql "$DB" -X -v ON_ERROR_STOP=1 -A -F '|' -t -c "SELECT \"stage\",\"mode\",\"writePolicy\",CASE WHEN \"externalWritesAllowed\" THEN 'true' ELSE 'false' END,COALESCE((\"scope\"->>'externalWritesRequested'),'false'),\"version\" FROM \"EngageControlledLaunchState\" WHERE \"workspaceId\"='${WORKSPACE_ID}';")"
          printf 'CONTROLLED_LAUNCH_STATE=%s\n' "$state"
          test "$state" = "ONE_CONNECTED_ACCOUNT|SHADOW|NO_EXTERNAL_WRITES|false|false|2"

          migration_count="$(psql "$DB" -X -v ON_ERROR_STOP=1 -Atqc "SELECT COUNT(*) FROM \"_prisma_migrations\" WHERE \"migration_name\" IN ('20260913113000_add_phase17_controlled_launch_state','20260916173000_add_phase17_outbound_approval_engine','20260916190000_add_phase17_g3_bounded_autopilot_recipient_ledger','20260916210000_add_phase17_g4_approved_flow_registry','20260916223000_add_phase17_g5_approved_flow_revocation_audit') AND \"finished_at\" IS NOT NULL AND \"rolled_back_at\" IS NULL;")"
          queued="$(psql "$DB" -X -v ON_ERROR_STOP=1 -Atqc "SELECT COUNT(*) FROM \"WhatsAppMessage\" WHERE \"direction\"='OUTBOUND' AND \"status\"='QUEUED';")"
          active_approvals="$(psql "$DB" -X -v ON_ERROR_STOP=1 -Atqc "SELECT COUNT(*) FROM \"EngageControlledLaunchOutboundApproval\" WHERE \"workspaceId\"='${WORKSPACE_ID}' AND \"consumedAt\" IS NULL AND \"revokedAt\" IS NULL AND \"expiresAt\">NOW();")"
          approved_flows="$(psql "$DB" -X -v ON_ERROR_STOP=1 -Atqc "SELECT COUNT(*) FROM \"EngageControlledLaunchApprovedFlow\" WHERE \"workspaceId\"='${WORKSPACE_ID}' AND \"revokedAt\" IS NULL;")"
          autopilot_recipients="$(psql "$DB" -X -v ON_ERROR_STOP=1 -Atqc "SELECT COUNT(*) FROM \"EngageControlledLaunchAutopilotRecipient\" WHERE \"workspaceId\"='${WORKSPACE_ID}';")"
          printf 'PHASE17_GOVERNANCE_MIGRATIONS_APPLIED=%s\n' "$migration_count"
          printf 'QUEUED_OUTBOUND_MESSAGES=%s\n' "$queued"
          printf 'ACTIVE_EXACT_MESSAGE_APPROVALS=%s\n' "$active_approvals"
          printf 'ACTIVE_APPROVED_FLOWS=%s\n' "$approved_flows"
          printf 'AUTOPILOT_RECIPIENT_LEDGER_COUNT=%s\n' "$autopilot_recipients"
          test "$migration_count" = "5"

          connection="$(psql "$DB" -X -v ON_ERROR_STOP=1 -A -F '|' -t -c "SELECT \"status\",COALESCE(\"capabilities\"->'evidence'->>'apiVerifiedAt',''),COALESCE(\"capabilities\"->'evidence'->>'webhookVerifiedAt',''),COALESCE(\"capabilities\"->'evidence'->>'permissionsVerified','false') FROM \"EngageChannelConnection\" WHERE \"workspaceId\"='${WORKSPACE_ID}' AND \"channel\"='WHATSAPP' LIMIT 1;")"
          printf 'WHATSAPP_CONNECTION_EVIDENCE=%s\n' "$connection"
          IFS='|' read -r connection_status api_verified webhook_verified permissions_verified <<< "$connection"
          test "$connection_status" = "CONNECTED"
          test -n "$api_verified"
          test -n "$webhook_verified"
          test "$permissions_verified" = "true"

          printf 'EXTERNAL_WRITE_SENT=false\n'
          printf 'PASS: PHASE17_CURRENT_CANARY_READINESS_AUDIT\n'
          REMOTE
