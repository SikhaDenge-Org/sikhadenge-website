# Production deploy trigger: Page 01 login UI — 2026-09-12
# Retry marker: Base64 production SSH key configured on 2026-08-03
# Retry marker: corrected public ED25519 host key configured on 2026-08-03
# Retry marker: canonical pinned host entry for alternate SSH port on 2026-08-03
# Retry marker: suppress generated staging package lock on 2026-08-03
# Email DRY_RUN preflight no-match fix deployment marker: 2026-09-15
# Email scheduler first-run evidence deployment marker: 2026-09-15
# Email scheduler CJS compatibility fix deployment marker: 2026-09-15
name: WhatsApp Agent Production Batch 1

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact merged release SHA to deploy
        required: true
        type: string
      execute:
        description: Execute the guarded production batch
        required: true
        default: false
        type: boolean
  push:
    branches:
      - release/whatsapp-instagram-agent-flow-20260731
    paths:
      - ".github/workflows/whatsapp-agent-production-batch1.yml"
      - "apps/whatsapp-agent-dashboard/scripts/engageos-production-*.sh"
      - "apps/whatsapp-agent-dashboard/scripts/prisma-postgres-cli-url.mjs"
      - "apps/whatsapp-agent-dashboard/prisma/migrations/**"

permissions:
  contents: read

concurrency:
  group: whatsapp-agent-production
  cancel-in-progress: false

jobs:
  production-batch-1:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.execute == true) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[production-batch1]'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
      TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || github.sha }}
      PRODUCTION_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout exact release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Validate release and production secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          : > production-batch.log
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

          missing=0
          for variable_name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_HOST_KEY; do
            if [[ -z "${!variable_name:-}" ]]; then
              printf 'Missing required production secret: %s\n' "$variable_name" >&2
              missing=1
            fi
          done
          test "$missing" = "0"

          if [[ -z "${SSH_PORT:-}" ]]; then
            printf 'SSH_PORT=22\n' >> "$GITHUB_ENV"
          fi
          printf 'PASS: RELEASE_AND_SECRET_GATE_COMPLETE\n'

      - name: Configure pinned SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"

          private_key_file="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$private_key_file"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$private_key_file"
          fi
          chmod 600 "$private_key_file"

          [[ "$SSH_HOST" =~ ^[^[:space:]/]+$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          (( SSH_PORT >= 1 && SSH_PORT <= 65535 ))

          read -r _ supplied_key_type supplied_key_material _ <<< "$SSH_HOST_KEY"
          test "$supplied_key_type" = "ssh-ed25519"
          test -n "$supplied_key_material"
          printf '%s %s\n' "$supplied_key_type" "$supplied_key_material" |
            ssh-keygen -lf - -E sha256 >/dev/null

          canonical_host="[$SSH_HOST]:$SSH_PORT"
          printf '%s %s %s\n' \
            "$canonical_host" \
            "$supplied_key_type" \
            "$supplied_key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          ssh-keygen -y -f "$private_key_file" >/dev/null
          ssh-keygen -F "$canonical_host" -f "$HOME/.ssh/known_hosts" >/dev/null
          printf 'PASS: PINNED_HOST_KEY_CANONICALIZED\n'
          printf 'PASS: SSH_IDENTITY_CONFIGURED\n'

      - name: Verify pinned SSH transport
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -p "$SSH_PORT" \
            -i "$HOME/.ssh/whatsapp-production" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" \
            'test "$(id -u)" = "0" && printf "PASS: PINNED_SSH_TRANSPORT_VERIFIED\n"'

      - name: Execute five-step production batch
        id: production
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          ssh \
            -p "$SSH_PORT" \
            -i "$HOME/.ssh/whatsapp-production" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "TARGET_SHA='$TARGET_SHA' RUN_ID='$PRODUCTION_RUN_ID' bash -s" <<'REMOTE' 2>&1 | tee production-batch.log
          set -Eeuo pipefail

          LIVE_APP=/var/www/sikhadenge-whatsapp-agent/source/apps/whatsapp-agent-dashboard
          RELEASE_REF=refs/remotes/origin/release/whatsapp-instagram-agent-flow-20260731
          STAGE_ROOT="/tmp/sikhadenge-github-production-${RUN_ID}"
          STAGE_APP="$STAGE_ROOT/apps/whatsapp-agent-dashboard"

          cleanup() {
            git -C "$LIVE_APP" worktree remove --force "$STAGE_ROOT" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          cd "$LIVE_APP"
          git fetch origin \
            +refs/heads/release/whatsapp-instagram-agent-flow-20260731:refs/remotes/origin/release/whatsapp-instagram-agent-flow-20260731

          repo_root="$(git rev-parse --show-toplevel)"
          live_sha="$(git rev-parse HEAD)"
          release_ref_sha="$(git rev-parse "$RELEASE_REF")"
          tracked_status="$(git status --porcelain --untracked-files=no)"
          tracked_dirty_count="$(printf '%s\n' "$tracked_status" | sed '/^$/d' | wc -l | tr -d ' ')"

          printf 'PRESTAGE_LIVE_SHA=%s\n' "$live_sha"
          printf 'PRESTAGE_RELEASE_REF_SHA=%s\n' "$release_ref_sha"
          printf 'PRESTAGE_TRACKED_DIRTY_COUNT=%s\n' "$tracked_dirty_count"

          # Read-only dirty-worktree evidence. Emit paths/status and line-count stats only;
          # never emit file contents or environment values.
          if [[ -n "$tracked_status" ]]; then
            printf 'PRESTAGE_TRACKED_STATUS_BEGIN\n'
            printf '%s\n' "$tracked_status"
            printf 'PRESTAGE_TRACKED_STATUS_END\n'
            printf 'PRESTAGE_DIFF_NUMSTAT_BEGIN\n'
            git diff HEAD --numstat --no-renames
            printf 'PRESTAGE_DIFF_NUMSTAT_END\n'

            # Batch #12 identified these exact ten tracked production-local paths. Preserve
            # a private binary-capable patch only when the current dirty set still matches
            # that reviewed allowlist exactly. Unexpected tracked paths fail closed and are
            # never copied into the recovery artifact.
            expected_dirty_paths=(
              apps/whatsapp-agent-dashboard/app/api/analytics/overview/route.ts
              apps/whatsapp-agent-dashboard/app/api/conversations/route.ts
              apps/whatsapp-agent-dashboard/app/globals.css
              apps/whatsapp-agent-dashboard/app/inbox/page.tsx
              apps/whatsapp-agent-dashboard/app/layout.tsx
              apps/whatsapp-agent-dashboard/components/inbox/InboxDashboardV2.tsx
              apps/whatsapp-agent-dashboard/lib/inbox/conversation-repository.ts
              apps/whatsapp-agent-dashboard/next-env.d.ts
              apps/whatsapp-agent-dashboard/package.json
              apps/whatsapp-agent-dashboard/scripts/masterclass-flow-worker.ts
            )
            actual_dirty_paths="$(git -C "$repo_root" diff HEAD --name-only --no-renames | LC_ALL=C sort)"
            expected_dirty_list="$(printf '%s\n' "${expected_dirty_paths[@]}" | LC_ALL=C sort)"
            if [[ "$actual_dirty_paths" != "$expected_dirty_list" ]]; then
              printf 'FAIL: PRESTAGE_DIRTY_PATH_SET_CHANGED\n' >&2
              exit 35
            fi

            recovery_dir="/root/sikhadenge-backups/engageos-${RUN_ID}"
            recovery_patch="$recovery_dir/production-dirty.patch"
            recovery_encrypted="$recovery_dir/production-dirty.patch.p7m"
            recovery_manifest="$recovery_dir/production-dirty-manifest.txt"
            recovery_cert="$recovery_dir/production-dirty-recovery-cert.pem"
            install -d -m 700 "$recovery_dir"
            git -C "$repo_root" diff HEAD --binary -- "${expected_dirty_paths[@]}" > "$recovery_patch"
            test -s "$recovery_patch"
            chmod 600 "$recovery_patch"
            patch_sha256="$(sha256sum "$recovery_patch" | awk '{print $1}')"

            command -v openssl >/dev/null
            cat > "$recovery_cert" <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIERTCCAq2gAwIBAgIUP/Ecu3Ox7+w1uM8MXSBJyadx1NgwDQYJKoZIhvcNAQEL
          BQAwMjEwMC4GA1UEAwwnRW5nYWdlT1MgUHJvZHVjdGlvbiBSZWNvdmVyeSAyMDI2
          LTA5LTEwMB4XDTI2MDkwOTIwNTMwMloXDTI2MDkxMTIwNTMwMlowMjEwMC4GA1UE
          AwwnRW5nYWdlT1MgUHJvZHVjdGlvbiBSZWNvdmVyeSAyMDI2LTA5LTEwMIIBojAN
          BgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA11Nd/5HVvgGXgNkHmy/mn/IHOscp
          1QCENwzTGTBRaIgJESRaqjy6vS5cFRRByPkEVB/CsvBe4fO6IoEkrQKHqUkqeAAk
          tYZRkg+lpYOFUNPWImfAr1ec5dLCHRAlUR+JFi1PLZYivLFTYMPE3fyY2wq8dlmY
          v5i4Hp9T6iv2FnZjM+lLo7gsavdLBcm7cy9E76QFVe7Vf34bd0dsHNxOLS+xZipv
          pQ9U9RDCmuS6S37wSr1sNlhzzZuwoox7xNVdvt8VjgSfh4k4EnJWpnOZr1YQAt/r
          VapRl+79hV4CbSthN/nXSZ14GTyYpHucbYQomINKbMyftBynwfnMI0WsgZj58Oif
          sVuPzdyLeJXCsO9vNI1b6T+EqJbjxJ8K+RRteQtjzCOXK5CXyySQ7PjF4xv2sOFs
          +r72+rNE7xK1ZJtedoJHDqDq7on9XG1feJV++Eghads7Kjkmbipzz3gMyXD042dI
          d6JHemeILbJ1HcGm8A9CTZJWV7/Ub3DM00GpAgMBAAGjUzBRMB0GA1UdDgQWBBSx
          PlI0B319pJNM+7d1wD83m0CX5zAfBgNVHSMEGDAWgBSxPlI0B319pJNM+7d1wD83
          m0CX5zAPBgNVHRMBAf8EBTADAQH/MA0GCSqGSIb3DQEBCwUAA4IBgQAxg6lHko8k
          gIktREWCjX8XQtnxNZ7e2QTYwNnRMdDCyeu/mGOnXsPrQV31R17JDvSVHeaCLKcA
          jsNX0dJsrlEXhlE2nA72eTpU80bdOrpBRVMGBAuHFcVRhft3d3nCRmL+siexG/+R
          SNbfHGMksIEBXb3RRxcNAKwzIxajtSdLQnfKmvk+lmgRWUYOSmZS2wRdl7sz3UCk
          jPqlipRN3C7rihKFOqPpjzPiCAqZ7RVDxBLNn3unJk56WeO72RJi61oElys+MLkR
          VLlx2uBsEgYnnh3aRkoi2+FxEtPsE6n8m2lMQMjqUA5MauFEzxy7joME/xIOKALN
          cDNv6n9BhUm2JKFJSZETsEOSnw1cYUecsNoh2qrQoDf+F9tiTT+mT22tnp6Vih0+
          p8JpIJEpZx8ALuN8BRZzCrwl2MYwUC4jdTsFu57ErfokBhqbDRDGFP1BfjcI4tGf
          OUIxV0IuhICSWDTud+lqh5aJ3PoAhZpJqKhAlPEiRS35HbeFhBXFhBs=
          -----END CERTIFICATE-----
          CERT
            chmod 600 "$recovery_cert"
            cert_fingerprint="$(openssl x509 -in "$recovery_cert" -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':')"
            test "$cert_fingerprint" = "B99F9B4D63D2D9D84C8931453036FD66D19816ECED878D4ECE0CB428DDB5318E"
            openssl cms -encrypt -binary -aes256 \
              -in "$recovery_patch" \
              -out "$recovery_encrypted" \
              -outform DER \
              "$recovery_cert"
            test -s "$recovery_encrypted"
            chmod 600 "$recovery_encrypted"
            openssl cms -cmsout -inform DER -in "$recovery_encrypted" -noout >/dev/null
            encrypted_sha256="$(sha256sum "$recovery_encrypted" | awk '{print $1}')"

            {
              printf 'FORMAT_VERSION=2\n'
              printf 'RUN_ID=%s\n' "$RUN_ID"
              printf 'LIVE_SHA=%s\n' "$live_sha"
              printf 'TARGET_SHA=%s\n' "$TARGET_SHA"
              printf 'DIRTY_COUNT=%s\n' "$tracked_dirty_count"
              printf 'PATCH_SHA256=%s\n' "$patch_sha256"
              printf 'ENCRYPTED_PATCH_SHA256=%s\n' "$encrypted_sha256"
              printf 'RECOVERY_CERT_SHA256_FINGERPRINT=%s\n' "$cert_fingerprint"
              printf 'TRACKED_STATUS_BEGIN\n'
              git -C "$repo_root" status --porcelain --untracked-files=no -- "${expected_dirty_paths[@]}"
              printf 'TRACKED_STATUS_END\n'
              printf 'DIFF_NUMSTAT_BEGIN\n'
              git -C "$repo_root" diff HEAD --numstat --no-renames -- "${expected_dirty_paths[@]}"
              printf 'DIFF_NUMSTAT_END\n'
            } > "$recovery_manifest"
            chmod 600 "$recovery_manifest"
            printf 'PASS: PRESTAGE_DIRTY_PATCH_PRESERVED_AND_ENCRYPTED sha256=%s encrypted_sha256=%s\n' \
              "$patch_sha256" "$encrypted_sha256"
          fi

          if [[ "$release_ref_sha" != "$TARGET_SHA" ]]; then
            printf 'FAIL: PRESTAGE_RELEASE_REF_MISMATCH\n' >&2
            exit 31
          fi
          printf 'PASS: PRESTAGE_RELEASE_REF_MATCHES_TARGET\n'
          test "$(git rev-parse "$RELEASE_REF")" = "$TARGET_SHA"

          if [[ -n "$tracked_status" ]]; then
            printf 'FAIL: PRESTAGE_TRACKED_WORKTREE_DIRTY count=%s\n' "$tracked_dirty_count" >&2
            exit 32
          fi
          printf 'PASS: PRESTAGE_TRACKED_WORKTREE_CLEAN\n'
          test -z "$(git status --porcelain --untracked-files=no)"

          if [[ ! -d "$LIVE_APP/node_modules" ]]; then
            printf 'FAIL: PRESTAGE_NODE_MODULES_MISSING\n' >&2
            exit 33
          fi
          printf 'PASS: PRESTAGE_NODE_MODULES_PRESENT\n'
          test -d "$LIVE_APP/node_modules"

          if git merge-base --is-ancestor HEAD "$TARGET_SHA"; then
            printf 'PASS: PRESTAGE_LIVE_SHA_IS_ANCESTOR\n'
          else
            printf 'FAIL: PRESTAGE_LIVE_SHA_NOT_ANCESTOR live=%s target=%s\n' "$live_sha" "$TARGET_SHA" >&2
            exit 34
          fi
          git merge-base --is-ancestor HEAD "$TARGET_SHA"

          git worktree add --detach "$STAGE_ROOT" "$TARGET_SHA"
          ln -s "$LIVE_APP/.env" "$STAGE_APP/.env"

          cd "$STAGE_APP"
          npm install --include=dev --no-audit --no-fund --package-lock=false

          LIVE_APP="$LIVE_APP" \
          STAGE_APP="$STAGE_APP" \
          RELEASE_SHA="$TARGET_SHA" \
          RUN_ID="$RUN_ID" \
          PM2_PROCESS_NAME=sikhadenge-whatsapp-agent \
          PUBLIC_URL=https://whatsapp.sikhadenge.in \
          BACKUP_ROOT=/root/sikhadenge-backups \
          ENV_FILE="$LIVE_APP/.env" \
          bash "$STAGE_APP/scripts/engageos-production-batch1.sh"
          REMOTE
          ssh_code=${PIPESTATUS[0]}
          set -e
          printf 'SSH_EXIT_CODE=%s\n' "$ssh_code" | tee -a production-batch.log
          exit "$ssh_code"

      - name: Collect protected production evidence
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p production-evidence
          for file_name in \
            production-dirty.patch.p7m \
            production-dirty-manifest.txt \
            manifest.txt \
            migration-evidence.txt \
            deploy-state.txt \
            post-deploy-evidence.txt \
            rollback-evidence.txt \
            batch-result.txt; do
            scp \
              -P "$SSH_PORT" \
              -i "$HOME/.ssh/whatsapp-production" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              "$SSH_USER@$SSH_HOST:/root/sikhadenge-backups/engageos-${PRODUCTION_RUN_ID}/${file_name}" \
              "production-evidence/${file_name}" >/dev/null 2>&1 || true
          done
          find production-evidence -maxdepth 1 -type f -print -exec chmod 600 {} \;
          exit 0

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-agent-production-${{ env.PRODUCTION_RUN_ID }}
          path: |
            production-batch.log
            production-evidence
          if-no-files-found: error
          retention-days: 14
