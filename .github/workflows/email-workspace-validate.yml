name: Email Workspace Validate

on:
  push:
    branches:
      - email-workspace-split-20260916-v6
    paths:
      - .github/workflows/email-workspace-validate.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/whatsapp-agent-dashboard
    steps:
      - uses: actions/checkout@v4
        with:
          ref: email-workspace-split-20260916-v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/whatsapp-agent-dashboard/package-lock.json
      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund --package-lock=false
      - name: Typecheck
        run: npm run typecheck
      - name: Inbox layout regression test
        run: npm run test:inbox-layout
