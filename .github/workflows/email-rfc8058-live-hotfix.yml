name: Email RFC8058 Live Hotfix

on:
  push:
    branches:
      - production/email-rfc8058-20260923
    paths:
      - .github/workflows/email-rfc8058-live-hotfix.yml

permissions:
  contents: read

concurrency:
  group: whatsapp-agent-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
      EXPECTED_OLD_SHA: 4e4bcb0119f2096ee2f95c95862c5c0d797c1021
      TARGET_REF: production/email-rfc8058-20260923
      EXPECTED_GMAIL_MIME_BLOB: e4fc52f4c353fc282862192c4c4ccef995dad0bd
      EXPECTED_UNSUB_ROUTE_BLOB: 667870f367f31e7cf3ec09e3d203cc2c45035315
      EXPECTED_UNSUB_SERVICE_BLOB: 4b302af6ce8e317251ed35a3a2dd0209077c62eb
      REVIEWED_EMAIL_INTERNAL_TEST_SHA256: d7dc9e6950379aca830830680778d71fc083bfeaa5fea67dd3117fc0696eda0e
      REVIEWED_EMAIL_READINESS_SHA256: a3c15e6b03e31ed9f4df38391a737a56a36625ae89c36f185a3d7df13fa8254c

    steps:
      - name: Configure pinned production SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          for value in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_HOST_KEY; do
            test -n "${!value:-}"
          done
          if [[ -z "${SSH_PORT:-}" ]]; then
            SSH_PORT=22
            echo 'SSH_PORT=22' >> "$GITHUB_ENV"
          fi
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/email-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy exact Email-only RFC8058 hotfix
        shell: bash
        run: |
          set -Eeuo pipefail
          target_sha="$GITHUB_SHA"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/email-production" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            "$SSH_USER@$SSH_HOST" \
            "EXPECTED_OLD_SHA='$EXPECTED_OLD_SHA' TARGET_REF='$TARGET_REF' TARGET_SHA='$target_sha' EXPECTED_GMAIL_MIME_BLOB='$EXPECTED_GMAIL_MIME_BLOB' EXPECTED_UNSUB_ROUTE_BLOB='$EXPECTED_UNSUB_ROUTE_BLOB' EXPECTED_UNSUB_SERVICE_BLOB='$EXPECTED_UNSUB_SERVICE_BLOB' REVIEWED_EMAIL_INTERNAL_TEST_SHA256='$REVIEWED_EMAIL_INTERNAL_TEST_SHA256' REVIEWED_EMAIL_READINESS_SHA256='$REVIEWED_EMAIL_READINESS_SHA256' bash -s" <<'REMOTE' | tee email-rfc8058-live-hotfix.txt
          set -Eeuo pipefail
          ROOT=/var/www/sikhadenge-whatsapp-agent/source
          APP="$ROOT/apps/whatsapp-agent-dashboard"
          PROCESS=sikhadenge-whatsapp-agent
          RUN_ID="email-rfc8058-$(date -u +%Y%m%dT%H%M%SZ)"
          BACKUP="/root/sikhadenge-backups/$RUN_ID"
          WORKTREE="/tmp/$RUN_ID"
          STAGE_APP="$WORKTREE/apps/whatsapp-agent-dashboard"
          swapped=false
          advanced=false

          cleanup_worktree() {
            git -C "$ROOT" worktree remove --force "$WORKTREE" >/dev/null 2>&1 || true
            rm -rf "$WORKTREE" >/dev/null 2>&1 || true
          }

          rollback() {
            rc=$?
            trap - ERR EXIT INT TERM
            set +e
            if [[ "$swapped" = "true" && -d "$BACKUP/.next.before" ]]; then
              rm -rf "$APP/.next"
              mv "$BACKUP/.next.before" "$APP/.next"
            fi
            if [[ "$advanced" = "true" ]]; then
              git -C "$ROOT" reset --keep "$EXPECTED_OLD_SHA" >/dev/null 2>&1 || true
            fi
            pm2 restart "$PROCESS" >/dev/null 2>&1 || true
            cleanup_worktree
            printf 'EMAIL_RFC8058_ROLLBACK=true exit_code=%s\n' "$rc"
            exit "$rc"
          }
          trap rollback ERR INT TERM

          test "$(id -u)" = "0"
          test -d "$ROOT/.git"
          test -d "$APP"
          cd "$ROOT"

          current_sha="$(git rev-parse HEAD)"
          printf 'PRE_DEPLOY_SHA=%s\n' "$current_sha"
          test "$current_sha" = "$EXPECTED_OLD_SHA"

          tracked_dirty="$(git status --porcelain --untracked-files=no | sed '/^$/d')"
          expected_dirty="$(printf '%s\n%s\n' \
            ' M apps/whatsapp-agent-dashboard/scripts/email-automation-production-internal-test.sh' \
            ' M apps/whatsapp-agent-dashboard/scripts/email-inbound-production-readiness.ts' | sort)"
          actual_dirty="$(printf '%s\n' "$tracked_dirty" | sort)"
          printf 'TRACKED_DIRTY_BEGIN\n%s\nTRACKED_DIRTY_END\n' "$actual_dirty"
          test "$(printf '%s\n' "$actual_dirty" | sed '/^$/d' | wc -l | tr -d ' ')" = "2"
          test "$actual_dirty" = "$expected_dirty"

          live_internal_test_sha="$(sha256sum "$APP/scripts/email-automation-production-internal-test.sh" | awk '{print $1}')"
          live_readiness_sha="$(sha256sum "$APP/scripts/email-inbound-production-readiness.ts" | awk '{print $1}')"
          test "$live_internal_test_sha" = "$REVIEWED_EMAIL_INTERNAL_TEST_SHA256"
          test "$live_readiness_sha" = "$REVIEWED_EMAIL_READINESS_SHA256"
          printf 'REVIEWED_EMAIL_DRIFT_PRESERVED=true\n'

          set -a
          source "$APP/.env"
          set +a
          test "${EMAIL_RUNTIME_MODE:-}" = "DRY_RUN"
          test "${EMAIL_RUNTIME_ENABLED:-false}" = "true"
          test "${EMAIL_EXTERNAL_WRITES_ENABLED:-true}" = "false"
          printf 'EMAIL_RUNTIME_PRECHECK=DRY_RUN_EXTERNAL_WRITES_OFF\n'

          pm2_json="$(pm2 jlist)"
          IFS='|' read -r app_pid app_status app_cwd < <(
            printf '%s' "$pm2_json" | node -e '
              let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                const p=JSON.parse(s||"[]").find(x=>x.name==="sikhadenge-whatsapp-agent");
                process.stdout.write(p ? [p.pid||"",p.pm2_env?.status||"",p.pm2_env?.pm_cwd||""].join("|") : "||");
              });'
          )
          test -n "$app_pid"
          test "$app_status" = "online"
          test "$app_cwd" = "$APP"
          old_build_id="$(cat "$APP/.next/BUILD_ID")"
          test -n "$old_build_id"
          printf 'PRE_DEPLOY_BUILD_ID=%s\n' "$old_build_id"

          git fetch --no-tags origin "$TARGET_REF"
          fetched_sha="$(git rev-parse FETCH_HEAD)"
          test "$fetched_sha" = "$TARGET_SHA"
          printf 'FETCHED_TARGET_SHA=%s\n' "$fetched_sha"

          actual_diff="$(git diff --name-only "$EXPECTED_OLD_SHA" "$TARGET_SHA" | sort)"
          expected_diff="$(printf '%s\n%s\n%s\n%s\n' \
            '.github/workflows/email-rfc8058-live-hotfix.yml' \
            'apps/whatsapp-agent-dashboard/app/api/email/unsubscribe/route.ts' \
            'apps/whatsapp-agent-dashboard/modules/email-automation/campaigns/unsubscribe.ts' \
            'apps/whatsapp-agent-dashboard/modules/email-automation/messaging/gmail-mime.ts' | sort)"
          printf 'HOTFIX_DIFF_BEGIN\n%s\nHOTFIX_DIFF_END\n' "$actual_diff"
          test "$actual_diff" = "$expected_diff"

          test "$(git show "$TARGET_SHA:apps/whatsapp-agent-dashboard/modules/email-automation/messaging/gmail-mime.ts" | git hash-object --stdin)" = "$EXPECTED_GMAIL_MIME_BLOB"
          test "$(git show "$TARGET_SHA:apps/whatsapp-agent-dashboard/app/api/email/unsubscribe/route.ts" | git hash-object --stdin)" = "$EXPECTED_UNSUB_ROUTE_BLOB"
          test "$(git show "$TARGET_SHA:apps/whatsapp-agent-dashboard/modules/email-automation/campaigns/unsubscribe.ts" | git hash-object --stdin)" = "$EXPECTED_UNSUB_SERVICE_BLOB"
          printf 'REVIEWED_RUNTIME_BLOBS=PASS\n'

          install -d -m 700 "$BACKUP"
          git worktree add --detach "$WORKTREE" "$TARGET_SHA" >/dev/null
          ln -s "$APP/node_modules" "$STAGE_APP/node_modules"
          ln -s "$APP/.env" "$STAGE_APP/.env"
          cd "$STAGE_APP"
          NEXT_TELEMETRY_DISABLED=1 npm run build > "$BACKUP/build.log" 2>&1
          new_build_id="$(cat "$STAGE_APP/.next/BUILD_ID")"
          test -n "$new_build_id"
          test "$new_build_id" != "$old_build_id"
          printf 'STAGED_BUILD_ID=%s\n' "$new_build_id"

          cd "$ROOT"
          git merge --ff-only "$TARGET_SHA"
          advanced=true
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git status --porcelain --untracked-files=no | sed '/^$/d' | sort)" = "$expected_dirty"

          mv "$APP/.next" "$BACKUP/.next.before"
          mv "$STAGE_APP/.next" "$APP/.next"
          swapped=true
          pm2 restart "$PROCESS" >/dev/null
          sleep 5

          pm2_json="$(pm2 jlist)"
          IFS='|' read -r post_pid post_status post_cwd < <(
            printf '%s' "$pm2_json" | node -e '
              let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                const p=JSON.parse(s||"[]").find(x=>x.name==="sikhadenge-whatsapp-agent");
                process.stdout.write(p ? [p.pid||"",p.pm2_env?.status||"",p.pm2_env?.pm_cwd||""].join("|") : "||");
              });'
          )
          test -n "$post_pid"
          test "$post_status" = "online"
          test "$post_cwd" = "$APP"
          test "$(cat "$APP/.next/BUILD_ID")" = "$new_build_id"

          set -a
          source "$APP/.env"
          set +a
          test "${EMAIL_RUNTIME_MODE:-}" = "DRY_RUN"
          test "${EMAIL_RUNTIME_ENABLED:-false}" = "true"
          test "${EMAIL_EXTERNAL_WRITES_ENABLED:-true}" = "false"

          login_code="$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/login || true)"
          case "$login_code" in 200|301|302|303|307|308) ;; *) printf 'LOGIN_HTTP=%s\n' "$login_code"; exit 31 ;; esac
          get_code="$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/api/email/unsubscribe || true)"
          test "$get_code" = "400"
          post_code="$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/x-www-form-urlencoded' --data 'List-Unsubscribe=One-Click' http://127.0.0.1:3100/api/email/unsubscribe || true)"
          test "$post_code" = "400"

          test "$(git hash-object "$APP/modules/email-automation/messaging/gmail-mime.ts")" = "$EXPECTED_GMAIL_MIME_BLOB"
          test "$(git hash-object "$APP/app/api/email/unsubscribe/route.ts")" = "$EXPECTED_UNSUB_ROUTE_BLOB"
          test "$(git hash-object "$APP/modules/email-automation/campaigns/unsubscribe.ts")" = "$EXPECTED_UNSUB_SERVICE_BLOB"
          grep -q 'List-Unsubscribe-Post: List-Unsubscribe=One-Click' "$APP/modules/email-automation/messaging/gmail-mime.ts"
          grep -q 'export async function POST' "$APP/app/api/email/unsubscribe/route.ts"

          printf 'POST_DEPLOY_SHA=%s\n' "$(git rev-parse HEAD)"
          printf 'POST_DEPLOY_BUILD_ID=%s\n' "$(cat "$APP/.next/BUILD_ID")"
          printf 'POST_DEPLOY_PM2_STATUS=%s\n' "$post_status"
          printf 'LOGIN_HTTP=%s\n' "$login_code"
          printf 'UNSUBSCRIBE_GET_NO_TOKEN_HTTP=%s\n' "$get_code"
          printf 'UNSUBSCRIBE_POST_NO_TOKEN_HTTP=%s\n' "$post_code"
          printf 'EMAIL_RUNTIME_POSTCHECK=DRY_RUN_EXTERNAL_WRITES_OFF\n'
          printf 'EXTERNAL_EMAIL_SENT=false\n'
          printf 'EMAIL_RFC8058_LIVE_DEPLOY=PASS\n'

          trap - ERR INT TERM
          swapped=false
          advanced=false
          rm -rf "$BACKUP/.next.before"
          cleanup_worktree
          REMOTE

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email-rfc8058-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: email-rfc8058-live-hotfix.txt
          if-no-files-found: error
          retention-days: 30
