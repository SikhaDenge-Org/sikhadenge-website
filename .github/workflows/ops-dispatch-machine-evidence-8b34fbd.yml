name: Ops Dispatch Machine Evidence 8b34fbd

on:
  push:
    branches:
      - ops/machine-evidence-dispatch-8b34fbd-20260914
    paths:
      - .github/workflows/ops-dispatch-machine-evidence-8b34fbd.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch-machine-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current release ref
        uses: actions/checkout@v4
        with:
          ref: release/whatsapp-instagram-agent-flow-20260731
          fetch-depth: 1

      - name: Fail closed unless release SHA is exact
        shell: bash
        run: |
          set -Eeuo pipefail
          expected="8b34fbd53cb6af874bd87984f9d46f1d13bd68e9"
          actual="$(git rev-parse HEAD)"
          printf 'EXPECTED_RELEASE_SHA=%s\n' "$expected"
          printf 'ACTUAL_RELEASE_SHA=%s\n' "$actual"
          test "$actual" = "$expected"

      - name: Dispatch exact-SHA machine evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          payload='{"ref":"release/whatsapp-instagram-agent-flow-20260731"}'
          code="$(curl --silent --show-error --output /tmp/dispatch.out --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/whatsapp-agent-phase17-stage2-machine-evidence.yml/dispatches \
            --data "$payload")"
          printf 'DISPATCH_HTTP=%s\n' "$code"
          cat /tmp/dispatch.out || true
          test "$code" = "204"
          printf 'PASS: EXACT_SHA_MACHINE_EVIDENCE_DISPATCH_ACCEPTED\n'
