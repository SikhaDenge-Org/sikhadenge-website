name: Phase17 Production Mutation Provenance Readonly

on:
  push:
    branches: [phase17-stage2-governance-v15-20260913]
    paths:
      - ".github/workflows/phase17-prod-mutation-provenance-readonly.yml"

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
    steps:
      - name: Configure pinned production SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          for v in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_HOST_KEY; do test -n "${!v:-}"; done
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; echo SSH_PORT=22 >> "$GITHUB_ENV"; fi
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Audit mutation provenance read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" bash -s <<'REMOTE'
          set -Eeuo pipefail
          APP=/var/www/sikhadenge-whatsapp-agent/source/apps/whatsapp-agent-dashboard
          ROOT="$(git -C "$APP" rev-parse --show-toplevel)"
          printf 'AUDIT_UTC=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf 'LIVE_SHA=%s\n' "$(git -C "$ROOT" rev-parse HEAD)"
          printf 'NEXT_BUILD_ID=%s\n' "$(cat "$APP/.next/BUILD_ID" 2>/dev/null || echo missing)"
          stat -c 'NEXT_BUILD_ID_MTIME=%y' "$APP/.next/BUILD_ID" 2>/dev/null || true

          printf '%s\n' '--- TARGET_FILE_TIMES ---'
          for p in \
            "$APP/app/layout.tsx" \
            "$APP/app/login-page01-left-image.css" \
            "$APP/app/login/page.tsx" \
            "$APP/next-env.d.ts" \
            "$APP/app/login-right-panel-v16.css" \
            "$APP/public/page01-hero-desktop-v17.png" \
            "$APP/public/page01-hero-tablet-v17.png" \
            "$APP/public/page01-hero-ultrawide-v17.png"; do
            [[ -e "$p" ]] && stat -c 'path=%n mtime=%y ctime=%z size=%s uid=%u gid=%g' "$p"
          done

          printf '%s\n' '--- REPO_CWD_PROCESSES ---'
          for proc in /proc/[0-9]*; do
            pid="${proc##*/}"
            cwd="$(readlink -f "$proc/cwd" 2>/dev/null || true)"
            case "$cwd" in "$ROOT"|"$ROOT"/*)
              comm="$(cat "$proc/comm" 2>/dev/null || true)"
              ppid="$(awk '/^PPid:/{print $2}' "$proc/status" 2>/dev/null || true)"
              start="$(ps -p "$pid" -o lstart= 2>/dev/null | sed 's/^ *//' || true)"
              printf 'pid=%s ppid=%s comm=%q start=%q cwd=%q\n' "$pid" "$ppid" "$comm" "$start" "$cwd"
              ;;
            esac
          done | sort -n -t= -k2,2 || true

          printf '%s\n' '--- RELEVANT_PROCESSES_SANITIZED ---'
          ps -eo pid=,ppid=,lstart=,user=,comm=,args= --sort=start_time | awk '
            BEGIN{IGNORECASE=1}
            /(next|npm|node|pnpm|yarn|pm2|git|rsync|scp|tar|sed|python|bash|sh)/ {
              line=$0
              gsub(/([A-Z_]*(TOKEN|SECRET|PASSWORD|KEY|DATABASE_URL|AUTH)[A-Z_]*=)[^ ]+/, "\\1[REDACTED]", line)
              gsub(/(postgres(ql)?:\/\/)[^ @]+@/, "\\1[REDACTED]@", line)
              print line
            }' | tail -n 120

          printf '%s\n' '--- PM2_SUMMARY ---'
          pm2 jlist 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{for(const p of JSON.parse(s||"[]")){if(p.name==="sikhadenge-whatsapp-agent") console.log(JSON.stringify({name:p.name,status:p.pm2_env?.status,restart_time:p.pm2_env?.restart_time,pm_uptime:p.pm2_env?.pm_uptime,created_at:p.pm2_env?.created_at,exec_mode:p.pm2_env?.exec_mode,node_version:p.pm2_env?.node_version}))}})' || true

          printf '%s\n' '--- PM2_DAEMON_LOG_WINDOW ---'
          PM2LOG="$HOME/.pm2/pm2.log"
          if [[ -f "$PM2LOG" ]]; then
            grep -E '2026-09-13T(16:0[0-9]|16:1[0-9]|16:2[0-5])' "$PM2LOG" | tail -n 120 | sed -E 's#(postgres(ql)?://)[^ @]+@#\1[REDACTED]@#g' || true
          else
            printf 'pm2_log_missing\n'
          fi

          printf '%s\n' '--- CRON_FILES ---'
          for d in /etc/cron.d /etc/cron.hourly /etc/cron.daily; do
            [[ -d "$d" ]] || continue
            find "$d" -maxdepth 1 -type f -printf 'path=%p mtime=%TY-%Tm-%TdT%TH:%TM:%TS size=%s\n' 2>/dev/null | sort
          done

          printf '%s\n' '--- SYSTEMD_TIMERS ---'
          systemctl list-timers --all --no-pager --no-legend 2>/dev/null | head -n 100 || true

          printf '%s\n' '--- RECENT_ROOT_LEVEL_REPO_FILE_MTIMES ---'
          find "$APP" -maxdepth 2 -type f -newermt '2026-09-13 21:35:00 +0530' ! -newermt '2026-09-13 21:55:00 +0530' \
            -not -path '*/node_modules/*' -not -path '*/.next/*' \
            -printf '%TY-%Tm-%Td %TH:%TM:%TS %p\n' 2>/dev/null | sort | tail -n 120

          printf 'PASS: READONLY_MUTATION_PROVENANCE_AUDIT_COMPLETE\n'
          REMOTE
