name: Phase17 Production V17 Quiescence Readonly

on:
  push:
    branches: [phase17-stage2-governance-v15-20260913]
    paths:
      - ".github/workflows/phase17-prod-mutation-provenance-readonly.yml"

permissions:
  contents: read

jobs:
  quiescence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
      EXPECTED_LIVE_SHA: f651d0182861c191c041b36e96902f20d5a6da2b
    steps:
      - name: Configure pinned production SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          for v in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_HOST_KEY; do test -n "${!v:-}"; done
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; echo SSH_PORT=22 >> "$GITHUB_ENV"; fi
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Verify three-snapshot production quiescence read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "EXPECTED_LIVE_SHA='$EXPECTED_LIVE_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          APP=/var/www/sikhadenge-whatsapp-agent/source/apps/whatsapp-agent-dashboard
          ROOT="$(git -C "$APP" rev-parse --show-toplevel)"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$EXPECTED_LIVE_SHA"
          files=(
            app/layout.tsx
            app/login-page01-left-image.css
            app/login/page.tsx
            next-env.d.ts
            app/login-right-panel-v16.css
            public/page01-hero-desktop-v17.png
            public/page01-hero-tablet-v17.png
            public/page01-hero-ultrawide-v17.png
          )
          snapshot() {
            local n="$1"
            printf 'SNAPSHOT_%s_UTC=%s\n' "$n" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            printf 'SNAPSHOT_%s_BUILD_ID=%s\n' "$n" "$(cat "$APP/.next/BUILD_ID")"
            printf 'SNAPSHOT_%s_PM2=' "$n"
            pm2 jlist 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"[]").find(x=>x.name==="sikhadenge-whatsapp-agent");process.stdout.write(`${p?.pm2_env?.status||"missing"}|${p?.pm2_env?.restart_time??""}|${p?.pm2_env?.pm_uptime??""}`)})'
            printf '\n'
            git -C "$ROOT" diff HEAD --name-only --no-renames | LC_ALL=C sort | sed "s#^#SNAPSHOT_${n}_DIRTY=#"
            for f in "${files[@]}"; do
              test -f "$APP/$f"
              printf 'SNAPSHOT_%s_FILE=%s|%s|%s|%s\n' "$n" "$f" "$(stat -c '%s' "$APP/$f")" "$(stat -c '%Y' "$APP/$f")" "$(sha256sum "$APP/$f" | awk '{print $1}')"
            done
          }
          signature() {
            printf 'BUILD_ID=%s\n' "$(cat "$APP/.next/BUILD_ID")"
            printf 'PM2='; pm2 jlist 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"[]").find(x=>x.name==="sikhadenge-whatsapp-agent");process.stdout.write(`${p?.pm2_env?.status||"missing"}|${p?.pm2_env?.restart_time??""}|${p?.pm2_env?.pm_uptime??""}`)})'; printf '\n'
            git -C "$ROOT" diff HEAD --name-only --no-renames | LC_ALL=C sort
            for f in "${files[@]}"; do printf '%s|%s|%s|%s\n' "$f" "$(stat -c '%s' "$APP/$f")" "$(stat -c '%Y' "$APP/$f")" "$(sha256sum "$APP/$f" | awk '{print $1}')"; done
          }
          s1="$(signature)"; snapshot 1
          sleep 20
          s2="$(signature)"; snapshot 2
          sleep 20
          s3="$(signature)"; snapshot 3
          test "$s1" = "$s2" || { printf 'QUIESCENCE=false reason=snapshot_1_2_changed\n'; exit 41; }
          test "$s2" = "$s3" || { printf 'QUIESCENCE=false reason=snapshot_2_3_changed\n'; exit 42; }
          tmp="$(mktemp)"; trap 'rm -f "$tmp"' EXIT
          test "$(curl -sS -L -o "$tmp" -w '%{http_code}' https://whatsapp.sikhadenge.in/login)" = 200
          grep -q 'page01-hero-v17-shell' "$tmp"
          printf 'QUIESCENCE=true\nPASS: THREE_SNAPSHOT_V17_QUIESCENCE\n'
          REMOTE
