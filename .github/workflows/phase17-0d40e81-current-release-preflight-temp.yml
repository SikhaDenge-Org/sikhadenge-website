name: Phase17 0d40e81 Current Release Preflight

on:
  push:
    branches:
      - ops/phase17-0d40e81-current-release-preflight-20260917
    paths:
      - ".github/workflows/phase17-0d40e81-current-release-preflight-temp.yml"

permissions:
  contents: read

jobs:
  validate-current-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact current release
        uses: actions/checkout@v4
        with:
          ref: 0d40e81f4190d547fc6cdff786b75b64f4fff10b
          fetch-depth: 0

      - name: Validate exact release Phase17 contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          expected="0d40e81f4190d547fc6cdff786b75b64f4fff10b"
          actual="$(git rev-parse HEAD)"
          printf 'EXPECTED_RELEASE_SHA=%s\nACTUAL_RELEASE_SHA=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"
          test -z "$(git status --porcelain --untracked-files=no)"

          cd apps/whatsapp-agent-dashboard
          npm install --include=dev --no-audit --no-fund --package-lock=false
          npx tsx tests/engageos-phase17-stage2-governance-evidence.test.ts
          npx tsx tests/engageos-phase17-stage2-machine-evidence-policy.test.ts
          npm run test:phase17-controlled-launch
          npm run test:phase17-production-readiness
          bash tests/engageos-phase17-runtime-identity-policy.test.sh
          npm run test:phase17-canary-target-staging
          npm run test:phase17-single-message-canary
          npx tsx tests/engageos-phase17-g2-outbound-approval.test.ts
          npx tsx tests/engageos-phase17-g5-approved-flow-governance.test.ts
          npx tsx tests/engageos-phase17-g6-governance-observability.test.ts
          npm run test:phase17-g7-release-exit-gate
          npm run typecheck

          echo 'PASS: PHASE17_0D40E81_CURRENT_RELEASE_VALIDATION'
          echo 'STATE_MUTATED=false'
          echo 'PRODUCTION_ACCESSED=false'
          echo 'EXTERNAL_WHATSAPP_WRITE_SENT=false'

  production-readonly-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: whatsapp-agent-production
    env:
      TARGET_RELEASE_SHA: 0d40e81f4190d547fc6cdff786b75b64f4fff10b
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
      WORKSPACE_ID: engagews_default
    steps:
      - name: Configure pinned production SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          for v in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_HOST_KEY; do test -n "${!v:-}"; done
          if [[ -z "${SSH_PORT:-}" ]]; then echo "SSH_PORT=22" >> "$GITHUB_ENV"; SSH_PORT=22; fi
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$key" >/dev/null

      - name: Read-only production safety and runtime audit
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "TARGET_RELEASE_SHA='$TARGET_RELEASE_SHA' WORKSPACE_ID='$WORKSPACE_ID' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          A=/var/www/sikhadenge-whatsapp-agent/source/apps/whatsapp-agent-dashboard
          E="$A/.env"

          envv() {
            node - "$E" "$1" <<'NODE'
          const fs=require('node:fs'); const [file,key]=process.argv.slice(2);
          for(const raw of fs.readFileSync(file,'utf8').split(/\r?\n/)){
            let line=raw.trim(); if(!line||line.startsWith('#')) continue;
            if(line.startsWith('export ')) line=line.slice(7).trim();
            const i=line.indexOf('='); if(i<1||line.slice(0,i).trim()!==key) continue;
            let v=line.slice(i+1).trim();
            if(v.length>=2&&((v.startsWith('"')&&v.endsWith('"'))||(v.startsWith("'")&&v.endsWith("'")))) v=v.slice(1,-1);
            process.stdout.write(v); process.exit(0);
          }
          process.exit(1);
          NODE
          }

          cd "$A"
          live_sha="$(git rev-parse HEAD)"
          dirty="$(git status --porcelain --untracked-files=no | sed '/^$/d' | wc -l | tr -d ' ')"
          printf 'TARGET_RELEASE_SHA=%s\nLIVE_SHA=%s\nTRACKED_DIRTY_COUNT=%s\n' "$TARGET_RELEASE_SHA" "$live_sha" "$dirty"
          test "$dirty" = "0"

          outbound_mode="$(envv WHATSAPP_OUTBOUND_MODE 2>/dev/null || echo disabled)"
          cutover="$(envv WHATSAPP_CUTOVER_APPROVED 2>/dev/null || echo false)"
          live_ack="$(envv WHATSAPP_OUTBOUND_LIVE_ACK 2>/dev/null || true)"
          kill_switch="$(envv WHATSAPP_OUTBOUND_KILL_SWITCH 2>/dev/null || echo on)"
          printf 'OUTBOUND_MODE=%s\nCUTOVER_APPROVED=%s\nLIVE_ACK_SET=%s\nPROVIDER_KILL_SWITCH=%s\n' "$outbound_mode" "$cutover" "$([[ -n "$live_ack" ]] && echo true || echo false)" "$kill_switch"
          test "$outbound_mode" = "disabled"
          test "$cutover" = "false"
          test -z "$live_ack"
          test "$kill_switch" = "on"

          pm2_state="$(pm2 jlist 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"[]").find(x=>x.name==="sikhadenge-whatsapp-agent");process.stdout.write(String(p?.pm2_env?.status||"missing"))})')"
          login_http="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 https://whatsapp.sikhadenge.in/login || true)"
          printf 'PM2_STATE=%s\nLOGIN_HTTP=%s\n' "$pm2_state" "$login_http"
          test "$pm2_state" = "online"
          test "$login_http" = "200"

          database_url="$(envv DATABASE_URL)"
          dburl="$(node scripts/prisma-postgres-cli-url.mjs "$database_url")"
          controlled="$(psql "$dburl" -X -v ON_ERROR_STOP=1 -Atqc "SELECT \"stage\"||'|'||\"mode\"||'|'||\"writePolicy\"||'|'||\"externalWritesAllowed\"||'|'||COALESCE(\"scope\"->>'externalWritesRequested','')||'|'||\"version\" FROM \"EngageControlledLaunchState\" WHERE \"workspaceId\"='${WORKSPACE_ID}';")"
          queued="$(psql "$dburl" -X -Atqc "SELECT COUNT(*) FROM \"WhatsAppMessage\" WHERE direction='OUTBOUND' AND status='QUEUED';")"
          approvals="$(psql "$dburl" -X -Atqc "SELECT COUNT(*) FROM \"EngageControlledLaunchOutboundApproval\" WHERE \"workspaceId\"='${WORKSPACE_ID}' AND \"consumedAt\" IS NULL AND \"revokedAt\" IS NULL AND \"expiresAt\">CURRENT_TIMESTAMP;")"
          machine_current="$(psql "$dburl" -X -Atqc "SELECT COUNT(*) FROM \"EngageSecurityAuditEvent\" WHERE \"workspaceId\"='${WORKSPACE_ID}' AND \"entityId\"='${live_sha}' AND \"reasonCode\"='MACHINE_VERIFIED_EXACT_SHA' AND outcome='VERIFIED';")"
          operator_current="$(psql "$dburl" -X -Atqc "SELECT COUNT(*) FROM \"EngageSecurityAuditEvent\" WHERE \"workspaceId\"='${WORKSPACE_ID}' AND \"entityId\"='${live_sha}' AND \"reasonCode\"='OPERATOR_VERIFIED_EXACT_SHA' AND outcome='VERIFIED';")"
          printf 'CONTROLLED=%s\nQUEUED_OUTBOUND=%s\nACTIVE_EXACT_MESSAGE_APPROVALS=%s\nCURRENT_LIVE_MACHINE_EVIDENCE=%s\nCURRENT_LIVE_OPERATOR_EVIDENCE=%s\n' "$controlled" "$queued" "$approvals" "$machine_current" "$operator_current"
          test "$controlled" = "ONE_CONNECTED_ACCOUNT|SHADOW|NO_EXTERNAL_WRITES|false|false|2"
          test "$queued" = "0"
          test "$approvals" = "0"

          if [[ -x scripts/engageos-phase17-runtime-identity-readonly.sh ]]; then
            EXPECTED_RELEASE_SHA="$live_sha" bash scripts/engageos-phase17-runtime-identity-readonly.sh
          else
            echo 'FAIL: RUNTIME_IDENTITY_VERIFIER_MISSING' >&2
            exit 41
          fi

          echo 'PASS: PHASE17_PRODUCTION_READONLY_PREFLIGHT'
          echo 'PRODUCTION_MUTATED=false'
          echo 'STATE_TRANSITIONED=false'
          echo 'EXTERNAL_WHATSAPP_WRITE_SENT=false'
          REMOTE
