name: Inspect Funnel Nginx 20260903
on:
  push:
    paths:
      - .github/workflows/inspect-funnel-nginx-20260903.yml
permissions:
  contents: read
env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64, sikhadenge-ci]
    environment: whatsapp-agent-production
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"; echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"; read -r _ kt km _ <<< "$SSH_HOST_KEY"; printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
      - name: Inspect consent contract
        shell: bash
        run: |
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -eu
          C=/var/www/sikhadenge.in/releases/sitewide-manrope-font-20260902-231335
          echo '=== CONSENT FILES ==='
          for f in "$C/lib/consent.ts" "$C/components/consent/ConsentProvider.tsx" "$C/components/consent/MetaConsentBridge.tsx" "$C/components/consent/GoogleConsentBridge.tsx"; do [ -f "$f" ] && { echo FILE=$f; sed -n '1,260p' "$f"; }; done
          echo '=== SECRET PRESENCE FAST ==='
          for f in /root/.pm2/dump.pm2 "$C/.env.local" /var/www/sikhadenge.in/.bk_admission_payment_2026-02-14-051845/.env.local; do [ -f "$f" ] || continue; echo FILE=$f; grep -Eo 'META_CAPI_ACCESS_TOKEN|META_CONVERSIONS_ACCESS_TOKEN|META_ACCESS_TOKEN|GA4_API_SECRET|SEGMENT_WRITE_KEY|NEXT_PUBLIC_SEGMENT_WRITE_KEY|GOOGLE_ADS_ACCESS_TOKEN|GOOGLE_ADS_CONVERSION_LABEL|LEAD_INGEST_WEBHOOK_SECRET' "$f" | sort -u | sed 's/$/=PRESENT/' || true; done
          echo CONSENT_INSPECT_DONE
          REMOTE
