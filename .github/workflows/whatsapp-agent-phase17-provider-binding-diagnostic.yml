name: WhatsApp Agent Phase17 Provider Binding Diagnostic

on:
  push:
    branches:
      - ops/phase17-canary-readiness-20260917
    paths:
      - ".github/workflows/whatsapp-agent-phase17-provider-binding-diagnostic.yml"

permissions:
  contents: read

concurrency:
  group: whatsapp-agent-phase17-provider-binding-diagnostic
  cancel-in-progress: true

jobs:
  readonly-provider-binding-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
      EXPECTED_LIVE_SHA: bb203d95f6fbec3d5a5ebf8e6e0db6ca03a5bb02

    steps:
      - uses: actions/checkout@v4

      - name: Configure pinned production SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          for v in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_HOST_KEY; do test -n "${!v:-}"; done
          if [[ -z "${SSH_PORT:-}" ]]; then echo SSH_PORT=22 >> "$GITHUB_ENV"; SSH_PORT=22; fi
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$key" >/dev/null

      - name: Inspect authoritative provider binding without writes
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "EXPECTED_LIVE_SHA='$EXPECTED_LIVE_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          APP=/var/www/sikhadenge-whatsapp-agent/source/apps/whatsapp-agent-dashboard
          ENV_FILE="$APP/.env"
          WORKSPACE_ID=engagews_default

          envv() {
            node - "$ENV_FILE" "$1" <<'NODE'
          const fs=require('node:fs'); const [file,key]=process.argv.slice(2);
          for(const raw of fs.readFileSync(file,'utf8').split(/\r?\n/)){
            let line=raw.trim(); if(!line||line.startsWith('#')) continue;
            if(line.startsWith('export ')) line=line.slice(7).trim();
            const i=line.indexOf('='); if(i<1||line.slice(0,i).trim()!==key) continue;
            let value=line.slice(i+1).trim();
            if(value.length>=2&&((value.startsWith('"')&&value.endsWith('"'))||(value.startsWith("'")&&value.endsWith("'")))) value=value.slice(1,-1);
            process.stdout.write(value); process.exit(0);
          }
          process.exit(1);
          NODE
          }

          live_sha="$(git -C "$APP" rev-parse HEAD)"
          dirty="$(git -C "$APP" status --porcelain --untracked-files=no | sed '/^$/d' | wc -l | tr -d ' ')"
          provider_mode="$(envv WHATSAPP_OUTBOUND_MODE 2>/dev/null || true)"
          kill="$(envv WHATSAPP_OUTBOUND_KILL_SWITCH 2>/dev/null || true)"
          phone_id="$(envv WHATSAPP_PHONE_NUMBER_ID 2>/dev/null || envv META_WHATSAPP_PHONE_NUMBER_ID 2>/dev/null || true)"
          test "$live_sha" = "$EXPECTED_LIVE_SHA"
          test "$dirty" = "0"
          test "${provider_mode:-disabled}" != "live"
          test "${kill:-on}" = "on"
          [[ "$phone_id" =~ ^[0-9]+$ ]]

          export DATABASE_URL="$(envv DATABASE_URL)"
          DB="$(node "$APP/scripts/prisma-postgres-cli-url.mjs" "$DATABASE_URL")"
          synthetic="whatsapp:${phone_id}"

          external_match_count="$(psql "$DB" -X -Atqc "SELECT COUNT(*) FROM \"EngageChannelConnection\" WHERE \"workspaceId\"='${WORKSPACE_ID}' AND \"channel\"='WHATSAPP' AND \"externalAccountId\"='${phone_id}' AND \"status\" IN ('CONNECTED','DEGRADED');")"
          synthetic_row_count="$(psql "$DB" -X -Atqc "SELECT COUNT(*) FROM \"EngageChannelConnection\" WHERE \"workspaceId\"='${WORKSPACE_ID}' AND \"channel\"='WHATSAPP' AND \"id\"='${synthetic}';")"
          scope_synthetic_count="$(psql "$DB" -X -Atqc "SELECT COUNT(*) FROM \"EngageControlledLaunchState\" WHERE \"workspaceId\"='${WORKSPACE_ID}' AND \"scope\"->'connectedAccountIds' ? '${synthetic}';")"
          scope_phone_count="$(psql "$DB" -X -Atqc "SELECT COUNT(*) FROM \"EngageControlledLaunchState\" WHERE \"workspaceId\"='${WORKSPACE_ID}' AND \"scope\"->'connectedAccountIds' ? '${phone_id}';")"
          actual_id="$(psql "$DB" -X -Atqc "SELECT \"id\" FROM \"EngageChannelConnection\" WHERE \"workspaceId\"='${WORKSPACE_ID}' AND \"channel\"='WHATSAPP' AND \"externalAccountId\"='${phone_id}' AND \"status\" IN ('CONNECTED','DEGRADED') ORDER BY \"updatedAt\" DESC LIMIT 1;")"
          if [[ -n "$actual_id" ]]; then [[ "$actual_id" =~ ^[A-Za-z0-9:_-]+$ ]]; fi

          scope_actual_count=0
          mapping_actual_count=0
          if [[ -n "$actual_id" ]]; then
            scope_actual_count="$(psql "$DB" -X -Atqc "SELECT COUNT(*) FROM \"EngageControlledLaunchState\" WHERE \"workspaceId\"='${WORKSPACE_ID}' AND \"scope\"->'connectedAccountIds' ? '${actual_id}';")"
            mapping_actual_count="$(psql "$DB" -X -Atqc "SELECT COUNT(*) FROM \"WhatsAppContact\" WHERE \"metadata\"->'engageos'->'whatsappIdentity'->>'workspaceId'='${WORKSPACE_ID}' AND \"metadata\"->'engageos'->'whatsappIdentity'->>'connectionId'='${actual_id}';")"
          fi
          mapping_synthetic_count="$(psql "$DB" -X -Atqc "SELECT COUNT(*) FROM \"WhatsAppContact\" WHERE \"metadata\"->'engageos'->'whatsappIdentity'->>'workspaceId'='${WORKSPACE_ID}' AND \"metadata\"->'engageos'->'whatsappIdentity'->>'connectionId'='${synthetic}';")"
          mapped_contact_count="$(psql "$DB" -X -Atqc "SELECT COUNT(*) FROM \"WhatsAppContact\" WHERE \"metadata\"->'engageos'->'whatsappIdentity'->>'workspaceId'='${WORKSPACE_ID}';")"
          scope_size="$(psql "$DB" -X -Atqc "SELECT COALESCE(jsonb_array_length(\"scope\"->'connectedAccountIds'),0) FROM \"EngageControlledLaunchState\" WHERE \"workspaceId\"='${WORKSPACE_ID}';")"

          printf 'LIVE_SHA_MATCH=true\n'
          printf 'OUTBOUND_LIVE_DISABLED=true\n'
          printf 'KILL_SWITCH_ON=true\n'
          printf 'DB_ACTIVE_CONNECTION_MATCHED_BY_EXTERNAL_ACCOUNT=%s\n' "$external_match_count"
          printf 'DB_SYNTHETIC_CONNECTION_ROW_EXISTS=%s\n' "$synthetic_row_count"
          printf 'CONTROLLED_SCOPE_CONNECTED_ACCOUNT_COUNT=%s\n' "$scope_size"
          printf 'CONTROLLED_SCOPE_MATCHES_SYNTHETIC_ID=%s\n' "$scope_synthetic_count"
          printf 'CONTROLLED_SCOPE_MATCHES_PHONE_ID=%s\n' "$scope_phone_count"
          printf 'CONTROLLED_SCOPE_MATCHES_ACTUAL_DB_ID=%s\n' "$scope_actual_count"
          printf 'MAPPED_CONTACT_COUNT=%s\n' "$mapped_contact_count"
          printf 'CONTACT_MAPPINGS_USE_SYNTHETIC_ID=%s\n' "$mapping_synthetic_count"
          printf 'CONTACT_MAPPINGS_USE_ACTUAL_DB_ID=%s\n' "$mapping_actual_count"
          printf 'EXTERNAL_WHATSAPP_WRITE_SENT=false\n'
          printf 'PASS: PHASE17_PROVIDER_BINDING_DIAGNOSTIC_COMPLETE\n'
          REMOTE
