name: Diagnose Claude Hydration Isolation 20260903

on:
  push:
    paths:
      - .github/workflows/diagnose-claude-hydration-isolation-20260903.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, sikhadenge-ci]
    timeout-minutes: 12
    steps:
      - name: Isolate hydration source in public live page
        shell: bash
        run: |
          set -Eeuo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent puppeteer-core
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"; export CHROME
          cat > diagnose.js <<'JS'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const b=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const cases=[
              {n:'baseline',block:()=>false},
              {n:'block_all_claude',block:u=>/\/claude-[^/]+\.js(?:\?|$)/.test(u)},
              {n:'block_claude_and_social',block:u=>/\/claude-[^/]+\.js(?:\?|$)/.test(u)||/\/api\/social-proof\/live\?widget=1/.test(u)},
              {n:'block_heading_only',block:u=>/\/claude-heading-[^/]+\.js/.test(u)},
              {n:'block_proof_only',block:u=>/\/claude-proof-[^/]+\.js/.test(u)},
              {n:'block_spacing_cleanup',block:u=>/\/claude-(?:badge|blank|community|runtime|proof-anchor)[^/]*\.js/.test(u)}
            ];
            const out={};
            for(const c of cases){
              const p=await b.newPage();
              await p.setViewport({width:1440,height:1000});
              await p.setRequestInterception(true);
              p.on('request',r=>{const u=r.url(); if(c.block(u)) r.abort(); else r.continue();});
              const errors=[];
              p.on('pageerror',e=>errors.push('page:'+String(e)));
              p.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
              await p.goto('https://sikhadenge.in/masterclass/claude/free?v=hydration-isolate-'+c.n+'-20260903',{waitUntil:'domcontentloaded',timeout:45000});
              await new Promise(r=>setTimeout(r,9000));
              const hyd=errors.filter(x=>/#418|#425|invariant=418|invariant=425/i.test(x));
              const state=await p.evaluate(()=>({
                jobs:document.querySelectorAll('#ai-video-job-impact-v80').length,
                skills:document.querySelectorAll('#ai-video-ai-opportunity-v85').length,
                root:document.querySelectorAll('#claude-ai-video-proof-v4').length,
                h1:(document.querySelector('h1')?.innerText||'').trim(),
                bodyText:(document.body.innerText||'').slice(0,180)
              }));
              out[c.n]={hydration:hyd.length,hydrationSamples:hyd.slice(0,4),state};
              await p.close();
            }
            console.log('RESULT='+JSON.stringify(out,null,2));
            require('fs').writeFileSync('hydration-isolation.json',JSON.stringify(out,null,2));
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node diagnose.js

      - name: Inspect public script order and exact route config read-only
        env:
          SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
          SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
          SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; fi
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"; read -r _ kt km _ <<< "$SSH_HOST_KEY"; printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          ssh -p "$SSH_PORT" -i "$KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'python3 - <<'"'"'PY'"'"'
          from pathlib import Path
          s=Path("/etc/nginx/sites-enabled/sikhadenge.in-ssl").read_text()
          a=s.find("location = /masterclass/claude/free {")
          b=s.find("\n    }",a)
          print("ROUTE_BEGIN")
          print(s[a:b+6] if a>=0 and b>=0 else "ROUTE_NOT_FOUND")
          print("ROUTE_END")
          PY'
          curl -fsS 'https://sikhadenge.in/masterclass/claude/free?v=script-order-20260903' | grep -oE '<script[^>]+src="[^"]+"[^>]*></script>' > script-order.txt || true
          cat script-order.txt

      - name: Upload diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: claude-hydration-isolation-20260903
          path: |
            hydration-isolation.json
            script-order.txt
          retention-days: 1
