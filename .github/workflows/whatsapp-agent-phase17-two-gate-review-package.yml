name: WhatsApp Agent Phase17 Two-Gate Operator Review Package

on:
  workflow_dispatch:
    inputs:
      expected_live_sha:
        description: Exact production SHA the evidence must prove
        required: true
        type: string
      proof_run_id:
        description: Successful Objective Operator Proof Pack run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  prepare-two-gate-review-package:
    runs-on: [self-hosted, Linux, X64, sikhadenge-ci]
    timeout-minutes: 8
    steps:
      - name: Validate inputs and freeze current release
        shell: bash
        env:
          EXPECTED_LIVE_SHA: ${{ inputs.expected_live_sha }}
          RELEASE_BRANCH: release/whatsapp-instagram-agent-flow-20260731
        run: |
          set -Eeuo pipefail
          [[ "$EXPECTED_LIVE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "${{ inputs.proof_run_id }}" =~ ^[0-9]+$ ]]
          git init -q verify
          cd verify
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch -q --depth=1 origin "$RELEASE_BRANCH"
          release_sha="$(git rev-parse FETCH_HEAD)"
          test "$release_sha" = "$EXPECTED_LIVE_SHA"
          printf 'CURRENT_RELEASE_SHA=%s\n' "$release_sha" >> "$GITHUB_ENV"

      - name: Download exact objective proof artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_LIVE_SHA: ${{ inputs.expected_live_sha }}
          PROOF_RUN_ID: ${{ inputs.proof_run_id }}
        run: |
          set -Eeuo pipefail
          artifact_name="phase17-objective-proof-$EXPECTED_LIVE_SHA"
          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PROOF_RUN_ID/artifacts?per_page=100")"
          match="$(jq -c --arg name "$artifact_name" '[.artifacts[] | select(.name==$name and .expired==false)] | if length==1 then .[0] else empty end' <<<"$artifacts")"
          test -n "$match"
          artifact_id="$(jq -r '.id' <<<"$match")"
          artifact_digest="$(jq -r '.digest // "unavailable"' <<<"$match")"
          gh run download "$PROOF_RUN_ID" --repo "$GITHUB_REPOSITORY" -n "$artifact_name" -D proof
          test -s proof/objective-proof-pack.txt
          test -s proof/phase17-stage2-support-runbook.md
          printf 'PROOF_ARTIFACT_ID=%s\n' "$artifact_id" >> "$GITHUB_ENV"
          printf 'PROOF_ARTIFACT_NAME=%s\n' "$artifact_name" >> "$GITHUB_ENV"
          printf 'PROOF_ARTIFACT_DIGEST=%s\n' "$artifact_digest" >> "$GITHUB_ENV"

      - name: Verify Critical Incident and Duplicate Send objective facts
        shell: bash
        env:
          EXPECTED_LIVE_SHA: ${{ inputs.expected_live_sha }}
          PROOF_RUN_ID: ${{ inputs.proof_run_id }}
        run: |
          set -Eeuo pipefail
          f=proof/objective-proof-pack.txt
          value() { awk -F= -v key="$1" '$1==key {print substr($0,index($0,"=")+1); exit}' "$f"; }

          test "$(value EXPECTED_LIVE_SHA)" = "$EXPECTED_LIVE_SHA"
          test "$(value RELEASE_HEAD_SHA)" = "$EXPECTED_LIVE_SHA"
          test "$(value LIVE_SHA)" = "$EXPECTED_LIVE_SHA"
          test "$(value TRACKED_DIRTY_COUNT)" = "0"
          test "$(value PM2_STATE)" = "online"
          test "$(value LOGIN_HTTP)" = "200"
          test "$(value SUPPORT_RUNBOOK_PRESENT)" = "true"
          test "$(value EXTERNAL_WRITE_ATTEMPTED_BY_COLLECTOR)" = "false"
          test "$(value PROOF_CLASSIFICATION)" = "REVIEW_READY_NOT_OPERATOR_ATTESTED"

          state="$(value CONTROLLED_LAUNCH_STATE)"
          case "$state" in
            ONE_CONNECTED_ACCOUNT\|SHADOW\|NO_EXTERNAL_WRITES\|f\|*) ;;
            *) echo "Unexpected controlled launch state: $state" >&2; exit 31 ;;
          esac

          test "$(value ENABLED_FEATURE_FLAG_COUNT)" = "0"
          test "$(value SECURITY_FAILURE_EVENT_COUNT)" = "0"
          test "$(value CRITICAL_INCIDENT_SIGNAL_COUNT)" = "0"
          test "$(value OUTBOUND_FAILED_COUNT)" = "0"
          test "$(value DUPLICATE_PROVIDER_ID_GROUP_COUNT)" = "0"
          test "$(value DUPLICATE_OUTBOUND_CANDIDATE_PAIR_COUNT)" = "0"

          started="$(value EVIDENCE_WINDOW_STARTED_AT)"
          ended="$(value EVIDENCE_WINDOW_ENDED_AT)"
          test -n "$started"
          test -n "$ended"
          printf 'EVIDENCE_WINDOW_STARTED_AT=%s\n' "$started" >> "$GITHUB_ENV"
          printf 'EVIDENCE_WINDOW_ENDED_AT=%s\n' "$ended" >> "$GITHUB_ENV"
          printf 'PASS: TWO_GATE_OBJECTIVE_FACTS_VERIFIED\n'

      - name: Build approval-ready review package
        shell: bash
        env:
          EXPECTED_LIVE_SHA: ${{ inputs.expected_live_sha }}
          PROOF_RUN_ID: ${{ inputs.proof_run_id }}
        run: |
          set -Eeuo pipefail
          mkdir -p review-package
          proof_ref="github-actions://$GITHUB_REPOSITORY/runs/$PROOF_RUN_ID/artifacts/$PROOF_ARTIFACT_ID#objective-proof-pack.txt"

          jq -n \
            --arg action "PHASE17_CRITICAL_INCIDENT_REVIEW" \
            --arg liveSha "$EXPECTED_LIVE_SHA" \
            --arg proofRef "$proof_ref" \
            --arg artifactDigest "$PROOF_ARTIFACT_DIGEST" \
            --arg windowStartedAt "$EVIDENCE_WINDOW_STARTED_AT" \
            --arg windowEndedAt "$EVIDENCE_WINDOW_ENDED_AT" \
            '{
              classification:"READY_FOR_HUMAN_REVIEW_NOT_ATTESTED",
              action:$action,
              liveSha:$liveSha,
              proofRef:$proofRef,
              artifactDigest:$artifactDigest,
              gateMetadata:{unresolvedCriticalIncidents:0},
              evidenceWindow:{startedAt:$windowStartedAt,endedAt:$windowEndedAt},
              humanFieldsRequired:["PHASE17_OPERATOR_ACTOR_ID","PHASE17_OPERATOR_VERIFIED_AT","PHASE17_OPERATOR_REQUEST_ID","PHASE17_OPERATOR_ATTESTATION"]
            }' > review-package/critical-incident-review.json

          jq -n \
            --arg action "PHASE17_DUPLICATE_SEND_REVIEW" \
            --arg liveSha "$EXPECTED_LIVE_SHA" \
            --arg proofRef "$proof_ref" \
            --arg artifactDigest "$PROOF_ARTIFACT_DIGEST" \
            --arg windowStartedAt "$EVIDENCE_WINDOW_STARTED_AT" \
            --arg windowEndedAt "$EVIDENCE_WINDOW_ENDED_AT" \
            '{
              classification:"READY_FOR_HUMAN_REVIEW_NOT_ATTESTED",
              action:$action,
              liveSha:$liveSha,
              proofRef:$proofRef,
              artifactDigest:$artifactDigest,
              gateMetadata:{unexplainedDuplicateSends:0},
              evidenceWindow:{startedAt:$windowStartedAt,endedAt:$windowEndedAt},
              humanFieldsRequired:["PHASE17_OPERATOR_ACTOR_ID","PHASE17_OPERATOR_VERIFIED_AT","PHASE17_OPERATOR_REQUEST_ID","PHASE17_OPERATOR_ATTESTATION"]
            }' > review-package/duplicate-send-review.json

          cat > review-package/README.txt <<EOF
          Phase17 two-gate operator review package
          Live SHA: $EXPECTED_LIVE_SHA
          Objective proof run: $PROOF_RUN_ID
          Objective proof artifact: $PROOF_ARTIFACT_NAME
          Objective proof artifact ID: $PROOF_ARTIFACT_ID
          Objective proof digest: $PROOF_ARTIFACT_DIGEST

          This package does NOT record operator evidence.
          This package does NOT supply a human actor, verification timestamp, request ID, or attestation.
          A real authorized operator must review the referenced evidence before any recorder commit.
          No external WhatsApp message is sent by this workflow.
          EOF

          {
            echo "## Phase17 two-gate operator review package"
            echo
            echo "- Exact live SHA: $EXPECTED_LIVE_SHA"
            echo "- Objective proof run: `$PROOF_RUN_ID`"
            echo "- Artifact ID: `$PROOF_ARTIFACT_ID`"
            echo "- Critical Incident Review: **READY FOR HUMAN REVIEW — NOT ATTESTED**"
            echo "- Duplicate Send Review: **READY FOR HUMAN REVIEW — NOT ATTESTED**"
            echo "- External message sent: **false**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload review package
        uses: actions/upload-artifact@v4
        with:
          name: phase17-two-gate-review-${{ inputs.expected_live_sha }}
          path: review-package
          if-no-files-found: error
          retention-days: 30
