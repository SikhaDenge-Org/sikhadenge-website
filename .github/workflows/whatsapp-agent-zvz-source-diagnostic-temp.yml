name: WhatsApp Agent Restore Exact Known Good ZVZ

on:
  push:
    branches:
      - release/whatsapp-instagram-agent-flow-20260731
    paths:
      - ".github/workflows/whatsapp-agent-zvz-source-diagnostic-temp.yml"

permissions:
  contents: read

concurrency:
  group: whatsapp-agent-production
  cancel-in-progress: false

jobs:
  restore-known-good:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
      RESTORE_RUN_ID: restore-zvz-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; echo "SSH_PORT=22" >> "$GITHUB_ENV"; fi
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$KEY" >/dev/null

      - name: Atomically restore exact preserved ZVZ build
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" "RUN_ID='$RESTORE_RUN_ID' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          BASE_SHA=28b813ca9936fe0b9d3874f7ebf6b0dfeef0b242
          CURRENT_BAD=kgTkJPnrPFbs9_D87sofr
          KNOWN_GOOD=ZvzV6QBBngX3s_X5xxUnk
          NAME=sikhadenge-whatsapp-agent
          LIVE=/var/www/sikhadenge-whatsapp-agent/releases/reconcile-clean-28b813ca-20260915T043800Z/apps/whatsapp-agent-dashboard
          BACKUP="$LIVE/.next-before-engageos-github-34950409366-1"
          STAGE="$LIVE/.next-restore-$RUN_ID"
          BAD_SAVE="$LIVE/.next-regressed-$RUN_ID"

          rollback() {
            set +e
            if [[ -d "$BAD_SAVE" ]]; then
              rm -rf "$LIVE/.next"
              mv "$BAD_SAVE" "$LIVE/.next"
              pm2 restart "$NAME" >/dev/null 2>&1 || true
            fi
          }

          test "$(git -C "$LIVE" rev-parse HEAD)" = "$BASE_SHA"
          test "$(cat "$LIVE/.next/BUILD_ID")" = "$CURRENT_BAD"
          test -d "$BACKUP"
          test "$(cat "$BACKUP/BUILD_ID")" = "$KNOWN_GOOD"
          test -f "$BACKUP/routes-manifest.json"
          test -d "$BACKUP/server"
          test -d "$BACKUP/static"
          test ! -e "$STAGE"
          test ! -e "$BAD_SAVE"

          J=$(mktemp); pm2 jlist > "$J"
          ACTIVE=$(node - "$J" <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync(process.argv[2],'utf8')).find(x=>x.name==='sikhadenge-whatsapp-agent');
          if(!p?.pm2_env?.pm_cwd || p.pm2_env.status!=='online') process.exit(2);
          process.stdout.write(p.pm2_env.pm_cwd);
          NODE
          )
          rm -f "$J"
          test "$ACTIVE" = "$LIVE"

          cp -a "$BACKUP" "$STAGE"
          test "$(cat "$STAGE/BUILD_ID")" = "$KNOWN_GOOD"

          mv "$LIVE/.next" "$BAD_SAVE"
          mv "$STAGE" "$LIVE/.next"
          trap rollback ERR
          pm2 restart "$NAME"

          ok=0
          for i in $(seq 1 20); do
            LOGIN=$(curl --max-time 5 -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/login || true)
            INBOX=$(curl --max-time 5 -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/inbox || true)
            if [[ "$LOGIN" = 200 && "$INBOX" = 307 ]]; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1
          test "$(cat "$LIVE/.next/BUILD_ID")" = "$KNOWN_GOOD"

          trap - ERR
          echo "PASS: EXACT_KNOWN_GOOD_ZVZ_RESTORED"
          echo "SOURCE_HEAD=$(git -C "$LIVE" rev-parse HEAD)"
          echo "PREVIOUS_REGRESSED_BUILD=$CURRENT_BAD"
          echo "ACTIVE_BUILD=$(cat "$LIVE/.next/BUILD_ID")"
          echo "REGRESSED_BUILD_PRESERVED=$BAD_SAVE"
          echo "LOGIN=$LOGIN INBOX=$INBOX"
          REMOTE
