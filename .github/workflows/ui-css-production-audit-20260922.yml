name: UI Public Asset Verify 20260922

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui-css-production-audit-20260922.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify current homepage and every linked CSS JS asset
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 2 --max-time 30 \
            -A 'SikhaDenge-PostRecovery-Verify/1.0' \
            'https://sikhadenge.in/?post_recovery_verify=20260922' -o home.html
          python3 - <<'PY'
          import re,subprocess
          s=open('home.html',errors='replace').read()
          print('HOME_BYTES',len(s))
          for marker in ['Become an AI Expert','AI Tools You Will Master']:
              ok=marker in s
              print('MARKER',repr(marker),ok)
              if not ok: raise SystemExit('missing marker '+marker)
          assets=[]
          assets += re.findall(r'<link[^>]+href=["\']([^"\']+\.css(?:\?[^"\']*)?)["\']',s)
          assets += re.findall(r'<script[^>]+src=["\']([^"\']+\.js(?:\?[^"\']*)?)["\']',s)
          seen=[]
          for a in assets:
              if a.startswith('/cdn-cgi/'): continue
              if a not in seen: seen.append(a)
          failures=[]
          for a in seen:
              url=a if a.startswith('http') else 'https://sikhadenge.in'+a
              p=subprocess.run([
                'curl','-k','-sS','-L','--retry','5','--retry-all-errors','--retry-delay','2',
                '--max-time','20','-o','/dev/null','-w','%{http_code}|%{content_type}|%{size_download}',url
              ],capture_output=True,text=True)
              print('ASSET',p.stdout,a)
              if not p.stdout.startswith('200|'): failures.append((a,p.stdout,p.stderr[-500:]))
          print('ASSET_COUNT',len(seen))
          print('ASSET_FAILURES',len(failures))
          if failures:
              print('FAILURES',failures)
              raise SystemExit(1)
          print('PUBLIC_ASSET_VERIFY_OK=1')
          PY
