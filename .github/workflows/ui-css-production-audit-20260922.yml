name: UI CSS Public Audit 20260922

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui-css-production-audit-20260922.yml'

permissions:
  contents: read

jobs:
  public-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe homepage and all linked CSS assets
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsS -L --max-time 30 -A 'SikhaDenge-UI-Audit/1.0' https://sikhadenge.in/ -o public-home.html
          python3 - <<'PY'
          import re,json,html,subprocess
          s=open('public-home.html',errors='replace').read()
          print('HOME_BYTES',len(s))
          m=re.search(r'<script id="__NEXT_DATA__" type="application/json">(.*?)</script>',s,re.S)
          if m:
              d=json.loads(html.unescape(m.group(1)))
              print('BUILD_ID',d.get('buildId'),'PAGE',d.get('page'))
          css=re.findall(r'<link[^>]+href=["\']([^"\']+\.css(?:\?[^"\']*)?)["\']',s)
          print('CSS_COUNT',len(css))
          for href in css:
              url=href if href.startswith('http') else 'https://sikhadenge.in'+href
              p=subprocess.run(['curl','-sS','-L','--max-time','20','-o','asset.css','-w','%{http_code}|%{content_type}|%{size_download}',url],capture_output=True,text=True)
              print('CSS_PROBE',p.stdout,url)
          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+\.js(?:\?[^"\']*)?)["\']',s)
          print('JS_COUNT',len(scripts))
          for href in scripts[:40]:
              url=href if href.startswith('http') else 'https://sikhadenge.in'+href
              p=subprocess.run(['curl','-sS','-L','--max-time','20','-o','asset.js','-w','%{http_code}|%{content_type}|%{size_download}',url],capture_output=True,text=True)
              print('JS_PROBE',p.stdout,url)
          PY
