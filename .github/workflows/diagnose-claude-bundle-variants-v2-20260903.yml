name: Diagnose Claude Bundle Variants V2 20260903

on:
  push:
    paths:
      - .github/workflows/diagnose-claude-bundle-variants-v2-20260903.yml

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, sikhadenge-ci]
    timeout-minutes: 12
    environment: whatsapp-agent-production
    steps:
      - name: Fetch bundle variants read-only from production release
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${SSH_PORT:-}" ]] || SSH_PORT=22
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"; read -r _ kt km _ <<< "$SSH_HOST_KEY"; test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          ROOT='/var/www/sikhadenge.in/releases/production-ai-video-icons-hotfix-20260829-091916/.next/static/chunks/pages/masterclass/claude'
          ssh -p "$SSH_PORT" -i "$KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "cat '$ROOT/free-802d96fd8696db68.js'" > original.js
          ssh -p "$SSH_PORT" -i "$KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "cat '$ROOT/free-802d96fd8696db68-v315r-20260830-204006.js'" > v315r.js
          ssh -p "$SSH_PORT" -i "$KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "cat '$ROOT/free-802d96fd8696db68-v315r-20260830-204006-v316-20260830-204806.js'" > v316.js
          sha256sum original.js v315r.js v316.js
          python3 - <<'PY'
          from pathlib import Path
          for fn in ['original.js','v315r.js','v316.js']:
              s=Path(fn).read_text(errors='replace')
              print('\nFILE',fn,len(s))
              for n in ['CURRENT BATCH ADVANTAGE','Move from quick answers to','Master 25+ AI Tools','Why join this course','Specially designed for working professionals','Learn AI Tools by Doing']:
                  print(n, n in s)
          PY

      - name: Test hydration and final DOM for each bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent puppeteer-core
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"; export CHROME
          cat > test.js <<'JS'
          const puppeteer=require('puppeteer-core'),fs=require('fs');
          (async()=>{
            const current=/\/free-802d96fd8696db68-v315r-20260830-204006-v316-20260830-204806\.js(?:\?|$)/;
            const variants=[['baseline',null],['original','original.js'],['v315r','v315r.js'],['v316','v316.js']];
            const b=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']}); const out={};
            for(const [name,file] of variants){
              const p=await b.newPage(); await p.setViewport({width:1440,height:1000});
              if(file){ const body=fs.readFileSync(file); await p.setRequestInterception(true); p.on('request',r=>{if(current.test(r.url())) r.respond({status:200,contentType:'application/javascript',body}); else r.continue();}); }
              const errs=[]; p.on('pageerror',e=>errs.push(String(e))); p.on('console',m=>{if(m.type()==='error')errs.push(m.text())});
              await p.goto(`https://sikhadenge.in/masterclass/claude/free?v=bundle-variant-v2-${name}-20260903`,{waitUntil:'domcontentloaded',timeout:45000});
              await new Promise(r=>setTimeout(r,10000));
              const hyd=errs.filter(x=>/#418|#425|invariant=418|invariant=425/i.test(x));
              const state=await p.evaluate(()=>({h1:(document.querySelector('h1')?.innerText||'').trim(),h2:[...document.querySelectorAll('h2')].slice(0,10).map(x=>(x.innerText||'').trim()),jobs:document.querySelectorAll('#ai-video-job-impact-v80').length,skills:document.querySelectorAll('#ai-video-ai-opportunity-v85').length,master:(document.body.innerText||'').includes('Master 25+ AI Tools'),move:(document.body.innerText||'').includes('Move from quick answers'),current:(document.body.innerText||'').includes('CURRENT BATCH ADVANTAGE'),special:(document.body.innerText||'').includes('Specially designed for working professionals')}));
              out[name]={hydration:hyd.length,samples:hyd.slice(0,4),state};
              await p.screenshot({path:`${name}.png`,fullPage:true}); await p.close();
            }
            console.log('RESULT='+JSON.stringify(out,null,2)); fs.writeFileSync('bundle-variant-result.json',JSON.stringify(out,null,2)); await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node test.js

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: claude-bundle-variants-v2-20260903
          path: |
            bundle-variant-result.json
            baseline.png
            original.png
            v315r.png
            v316.png
          retention-days: 1
