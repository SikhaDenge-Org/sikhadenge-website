name: One-time Machine Evidence Dispatch e9f65a6

on:
  push:
    branches:
      - ops/machine-evidence-dispatch-e9f65a6-20260914
    paths:
      - ".github/workflows/ops-machine-evidence-dispatch-e9f65a6.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch-machine-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_SHA: e9f65a6b853385dad5712c212f51a6f1b9f56a18
      RELEASE_BRANCH: release/whatsapp-instagram-agent-flow-20260731
    steps:
      - name: Verify frozen release SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/release%2Fwhatsapp-instagram-agent-flow-20260731"
          json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$api")"
          current_sha="$(jq -r '.object.sha' <<<"$json")"
          printf 'CURRENT_RELEASE_SHA=%s\n' "$current_sha"
          printf 'TARGET_RELEASE_SHA=%s\n' "$TARGET_SHA"
          test "$current_sha" = "$TARGET_SHA"
          printf 'PASS: RELEASE_SHA_FROZEN\n'

      - name: Dispatch existing machine evidence workflow on release ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          payload="$(jq -cn --arg ref "$RELEASE_BRANCH" '{ref:$ref}')"
          endpoint="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/whatsapp-agent-phase17-stage2-machine-evidence.yml/dispatches"
          code="$(curl -sS -o /tmp/dispatch-response -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$endpoint" \
            -d "$payload")"
          printf 'DISPATCH_HTTP=%s\n' "$code"
          test "$code" = '204'
          printf 'PASS: MACHINE_EVIDENCE_WORKFLOW_DISPATCHED\n'
