name: Self-Hosted Runner Policy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforce:
    runs-on: [self-hosted, Linux, X64, sikhadenge-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical runner selectors
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          want='[self-hosted, Linux, X64, sikhadenge-ci]'
          bad=[]
          for p in Path('.github/workflows').glob('*.y*ml'):
              for i,line in enumerate(p.read_text(encoding='utf-8').splitlines(),1):
                  m=re.match(r'^\s*runs-on\s*:\s*(.+?)\s*$',line)
                  if m and m.group(1)!=want:
                      bad.append(f'{p}:{i}: {m.group(1)}')
          if bad:
              print('\n'.join(bad)); sys.exit(1)
          print('Canonical self-hosted runner policy: PASS')
          PY