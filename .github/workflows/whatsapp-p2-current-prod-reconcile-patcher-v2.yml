name: WhatsApp P2 Current Production Guard Patcher V2

on:
  push:
    branches:
      - phase/whatsapp-p2-current-prod-reconcile-20260924
    paths:
      - ".github/workflows/whatsapp-p2-current-prod-reconcile-patcher-v2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/whatsapp-p2-current-prod-reconcile-20260924
          fetch-depth: 0

      - name: Patch exact W6 guards only
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('.github/workflows/whatsapp-agent-phase17-w6-single-provider-canary.yml'),
              Path('.github/workflows/whatsapp-agent-phase17-w6-stale-queue-refresh.yml'),
          ]
          old_sha = 'EXPECTED_LIVE_SHA: 4b12c4923ec1d1b89e24588cb252b310b84e171b'
          new_sha = 'EXPECTED_LIVE_SHA: d43e634426c10020c6b3e670b6a5712b96902003'
          compare_line = '          test "$actual_dirty" = "$expected_dirty"'
          clean_line = '          test -z "$actual_dirty"'
          for path in paths:
              original = path.read_text()
              if original.count(old_sha) != 1:
                  raise SystemExit(f'{path}: old SHA pin count mismatch')
              lines = original.splitlines()
              starts = [i for i, line in enumerate(lines) if 'expected_dirty="$(printf ' in line]
              ends = [i for i, line in enumerate(lines) if line == compare_line]
              if len(starts) != 1 or len(ends) != 1 or starts[0] >= ends[0]:
                  raise SystemExit(f'{path}: dirty guard structure mismatch')
              lines = lines[:starts[0]] + [clean_line] + lines[ends[0] + 1:]
              text = '\n'.join(lines) + ('\n' if original.endswith('\n') else '')
              text = text.replace(old_sha, new_sha)
              if 'SEND_EXACTLY_ONE_INTERNAL_WHATSAPP_CANARY' in original and text.count('SEND_EXACTLY_ONE_INTERNAL_WHATSAPP_CANARY') != 1:
                  raise SystemExit('real-send authorization gate changed unexpectedly')
              path.write_text(text)
          PY
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n%s\n' \
            '.github/workflows/whatsapp-agent-phase17-w6-single-provider-canary.yml' \
            '.github/workflows/whatsapp-agent-phase17-w6-stale-queue-refresh.yml' | sort)"
          test "$changed" = "$expected"
          grep -Fxq '      EXPECTED_LIVE_SHA: d43e634426c10020c6b3e670b6a5712b96902003' .github/workflows/whatsapp-agent-phase17-w6-single-provider-canary.yml
          grep -Fxq '      EXPECTED_LIVE_SHA: d43e634426c10020c6b3e670b6a5712b96902003' .github/workflows/whatsapp-agent-phase17-w6-stale-queue-refresh.yml
          grep -Fq '          test -z "$actual_dirty"' .github/workflows/whatsapp-agent-phase17-w6-single-provider-canary.yml
          grep -Fq '          test -z "$actual_dirty"' .github/workflows/whatsapp-agent-phase17-w6-stale-queue-refresh.yml
          grep -Fq 'SEND_EXACTLY_ONE_INTERNAL_WHATSAPP_CANARY' .github/workflows/whatsapp-agent-phase17-w6-single-provider-canary.yml
          echo 'P2_GUARD_PATCH_V2=PASS'

      - name: Commit exact reconciliation and self-clean temporary patchers
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/whatsapp-agent-phase17-w6-single-provider-canary.yml \
            .github/workflows/whatsapp-agent-phase17-w6-stale-queue-refresh.yml
          git rm \
            .github/workflows/whatsapp-p2-current-prod-reconcile-patcher.yml \
            .github/workflows/whatsapp-p2-current-prod-reconcile-patcher-v2.yml
          git commit -m 'WhatsApp P2: reconcile W6 guards to current production lineage'
          git push origin HEAD:phase/whatsapp-p2-current-prod-reconcile-20260924
