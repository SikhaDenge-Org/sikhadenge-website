name: WhatsApp Agent Restore Exact Pre-Score Runtime

on:
  push:
    branches:
      - release/whatsapp-instagram-agent-flow-20260731
    paths:
      - ".github/workflows/whatsapp-agent-restore-pre-score-runtime.yml"

permissions:
  contents: read

concurrency:
  group: whatsapp-agent-production
  cancel-in-progress: false

jobs:
  restore-exact-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
      RUN_ID: exact-pre-score-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          for v in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_HOST_KEY; do
            test -n "${!v:-}" || { echo "Missing $v" >&2; exit 2; }
          done
          if [[ -z "${SSH_PORT:-}" ]]; then echo 'SSH_PORT=22' >> "$GITHUB_ENV"; SSH_PORT=22; fi
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"
          fi
          chmod 600 "$KEY"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          test -n "$key_material"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$KEY" >/dev/null

      - name: Restore exact compiled runtime from pre-change backup
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" \
            "RUN_ID='$RUN_ID' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          ROOT=/var/www/sikhadenge-whatsapp-agent/releases/reconcile-clean-28b813ca-20260915T043800Z/apps
          RUNTIME=$ROOT/whatsapp-agent-dashboard
          PRECHANGE=$ROOT/.whatsapp-agent-dashboard-before-v19-page02-v19-34945783070-1
          CURRENT_BACKUP=$ROOT/.whatsapp-agent-dashboard-before-exact-restore-$RUN_ID
          PM2_NAME=sikhadenge-whatsapp-agent
          LOCAL_URL=http://127.0.0.1:3100
          PUBLIC_URL=https://whatsapp.sikhadenge.in
          EXPECTED_BUILD=ZvzV6QBBngX3s_X5xxUnk
          SWITCHED=0

          rollback() {
            code=$?
            trap - ERR
            set +e
            echo "FAIL: exact runtime restore code=$code"
            if [[ "$SWITCHED" = 1 && -d "$CURRENT_BACKUP" ]]; then
              pm2 stop "$PM2_NAME" >/dev/null 2>&1 || true
              sleep 2
              [[ -d "$RUNTIME" ]] && mv "$RUNTIME" "$PRECHANGE.failed-$RUN_ID" || true
              mv "$CURRENT_BACKUP" "$RUNTIME" || true
              pm2 restart "$PM2_NAME" --update-env >/dev/null 2>&1 || true
              echo 'INFO: current runtime restored after failed exact rollback'
            fi
            exit "$code"
          }
          trap rollback ERR

          test -d "$RUNTIME"
          test -d "$PRECHANGE"
          test ! -e "$CURRENT_BACKUP"
          test -f "$PRECHANGE/.next/BUILD_ID"
          test -f "$PRECHANGE/.env"
          test "$(cat "$PRECHANGE/.next/BUILD_ID")" = "$EXPECTED_BUILD"
          echo "PASS: exact pre-change backup found build=$EXPECTED_BUILD"

          PM2_JSON=$(mktemp)
          pm2 jlist > "$PM2_JSON"
          PM2_CWD=$(node - "$PM2_NAME" "$PM2_JSON" <<'NODE'
          const fs = require('node:fs');
          const [name, file] = process.argv.slice(2);
          const app = JSON.parse(fs.readFileSync(file, 'utf8')).find(x => x.name === name);
          if (!app?.pm2_env?.pm_cwd) process.exit(3);
          process.stdout.write(String(app.pm2_env.pm_cwd));
          NODE
          )
          rm -f "$PM2_JSON"
          test "$PM2_CWD" = "$RUNTIME"

          pm2 stop "$PM2_NAME"
          for attempt in $(seq 1 20); do
            if ! ss -ltn | awk '{print $4}' | grep -Eq '(^|:)3100$'; then break; fi
            sleep 1
          done
          if ss -ltn | awk '{print $4}' | grep -Eq '(^|:)3100$'; then exit 34; fi

          mv "$RUNTIME" "$CURRENT_BACKUP"
          mv "$PRECHANGE" "$RUNTIME"
          SWITCHED=1
          test "$(cat "$RUNTIME/.next/BUILD_ID")" = "$EXPECTED_BUILD"
          pm2 restart "$PM2_NAME" --update-env

          READY=0
          for attempt in $(seq 1 30); do
            sleep 2
            login=$(curl --max-time 5 -sS -o /dev/null -w '%{http_code}' "$LOCAL_URL/login?exact-restore=$RUN_ID" || true)
            inbox=$(curl --max-time 5 -sS -o /dev/null -w '%{http_code}' "$LOCAL_URL/inbox?exact-restore=$RUN_ID" || true)
            echo "local $attempt login=$login inbox=$inbox"
            if [[ "$login" = 200 ]]; then
              case "$inbox" in 200|301|302|303|307|308) READY=1 ;; esac
            fi
            [[ "$READY" = 1 ]] && break
          done
          test "$READY" = 1
          test "$(cat "$RUNTIME/.next/BUILD_ID")" = "$EXPECTED_BUILD"

          public_login=$(curl --max-time 15 -sS -L -o /dev/null -w '%{http_code}' "$PUBLIC_URL/login?exact-restore=$RUN_ID" || true)
          test "$public_login" = 200
          public_inbox=$(curl --max-time 15 -sS -o /dev/null -w '%{http_code}' "$PUBLIC_URL/inbox?exact-restore=$RUN_ID" || true)
          case "$public_inbox" in 200|301|302|303|307|308) ;; *) exit 42 ;; esac

          SWITCHED=0
          trap - ERR
          echo "PASS: EXACT_PRE_SCORE_RUNTIME_RESTORED build=$EXPECTED_BUILD inbox=$public_inbox"
          REMOTE

      - name: Final public verification
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(curl --max-time 15 -sS -L -o /dev/null -w '%{http_code}' 'https://whatsapp.sikhadenge.in/login?exact-pre-score-final=1')" = 200
          code=$(curl --max-time 15 -sS -o /dev/null -w '%{http_code}' 'https://whatsapp.sikhadenge.in/inbox?exact-pre-score-final=1')
          case "$code" in 200|301|302|303|307|308) ;; *) exit 1 ;; esac
          echo "PASS: EXACT_PRE_SCORE_PUBLIC_HEALTHY inbox=$code"
