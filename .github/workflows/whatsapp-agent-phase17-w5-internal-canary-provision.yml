name: WhatsApp W5 Internal Canary Message Provision

on:
  push:
    branches:
      - release/whatsapp-instagram-agent-flow-20260731
    paths:
      - ".github/workflows/whatsapp-agent-phase17-w5-internal-canary-provision.yml"

permissions:
  contents: read

concurrency:
  group: whatsapp-w5-internal-canary-provision
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
      VERIFIED_CANARY_WA_ID: ${{ secrets.WHATSAPP_INTERNAL_CANARY_WA_ID }}
      EXPECTED_LIVE_SHA: 60cd180e7a728b4ac546777605b4257504df483a
      REVIEWED_EMAIL_INTERNAL_TEST_SHA256: d7dc9e6950379aca830830680778d71fc083bfeaa5fea67dd3117fc0696eda0e
      REVIEWED_EMAIL_READINESS_SHA256: a3c15e6b03e31ed9f4df38391a737a56a36625ae89c36f185a3d7df13fa8254c
      SELECTED_TEMPLATE: hello_world

    steps:
      - name: Checkout reviewed operator code
        uses: actions/checkout@v4

      - name: Validate pinned production inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          for v in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_HOST_KEY VERIFIED_CANARY_WA_ID; do
            test -n "${!v:-}"
          done
          [[ "$VERIFIED_CANARY_WA_ID" =~ ^[0-9]{6,20}$ ]]
          [[ "$EXPECTED_LIVE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REVIEWED_EMAIL_INTERNAL_TEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$REVIEWED_EMAIL_READINESS_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SELECTED_TEMPLATE" =~ ^[a-z0-9_]{1,512}$ ]]
          if [[ -z "${SSH_PORT:-}" ]]; then
            SSH_PORT=22
            echo 'SSH_PORT=22' >> "$GITHUB_ENV"
          fi
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          printf 'VERIFIED_CANARY_CONFIGURED=true\n'
          printf 'CANARY_IDENTIFIER_EMITTED=false\n'

      - name: Configure pinned production SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Transport reviewed canary provisioner
        shell: bash
        run: |
          set -Eeuo pipefail
          local_script="apps/whatsapp-agent-dashboard/scripts/whatsapp-phase22d-canary-message-provision.ts"
          test -f "$local_script"
          reviewed_sha="$(sha256sum "$local_script" | awk '{print $1}')"
          remote_script="/var/www/sikhadenge-whatsapp-agent/source/apps/whatsapp-agent-dashboard/scripts/.w5-canary-provision-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.ts"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$local_script" "$SSH_USER@$SSH_HOST:$remote_script"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "test -f '$remote_script' && test \"\$(sha256sum '$remote_script' | awk '{print \$1}')\" = '$reviewed_sha'"
          printf 'REVIEWED_W5_SCRIPT_REMOTE=%s\n' "$remote_script" >> "$GITHUB_ENV"
          printf 'REVIEWED_W5_SCRIPT_SHA256=%s\n' "$reviewed_sha" >> "$GITHUB_ENV"
          printf 'PASS: REVIEWED_W5_PROVISIONER_TRANSPORTED\n'

      - name: Guard production and provision one internal queued canary
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" \
            "EXPECTED_LIVE_SHA='$EXPECTED_LIVE_SHA' REVIEWED_EMAIL_INTERNAL_TEST_SHA256='$REVIEWED_EMAIL_INTERNAL_TEST_SHA256' REVIEWED_EMAIL_READINESS_SHA256='$REVIEWED_EMAIL_READINESS_SHA256' VERIFIED_CANARY_WA_ID='$VERIFIED_CANARY_WA_ID' SELECTED_TEMPLATE='$SELECTED_TEMPLATE' REVIEWED_W5_SCRIPT_REMOTE='$REVIEWED_W5_SCRIPT_REMOTE' REVIEWED_W5_SCRIPT_SHA256='$REVIEWED_W5_SCRIPT_SHA256' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/var/www/sikhadenge-whatsapp-agent/source
          APP="$ROOT/apps/whatsapp-agent-dashboard"
          ENV_FILE="$APP/.env"
          cd "$ROOT"

          live_sha="$(git rev-parse HEAD)"
          actual_dirty="$(git status --porcelain --untracked-files=no | sed '/^$/d' | sort)"
          expected_dirty="$(printf '%s\n%s\n' \
            ' M apps/whatsapp-agent-dashboard/scripts/email-automation-production-internal-test.sh' \
            ' M apps/whatsapp-agent-dashboard/scripts/email-inbound-production-readiness.ts' | sort)"
          test "$live_sha" = "$EXPECTED_LIVE_SHA"
          test "$actual_dirty" = "$expected_dirty"
          test "$(sha256sum "$APP/scripts/email-automation-production-internal-test.sh" | awk '{print $1}')" = "$REVIEWED_EMAIL_INTERNAL_TEST_SHA256"
          test "$(sha256sum "$APP/scripts/email-inbound-production-readiness.ts" | awk '{print $1}')" = "$REVIEWED_EMAIL_READINESS_SHA256"
          test -f "$REVIEWED_W5_SCRIPT_REMOTE"
          test "$(sha256sum "$REVIEWED_W5_SCRIPT_REMOTE" | awk '{print $1}')" = "$REVIEWED_W5_SCRIPT_SHA256"
          printf 'SOURCE_LIVE_SHA_MATCH=true\nSOURCE_TRACKED_DIRTY_COUNT=2\nSOURCE_REVIEWED_DIRTY_SET_MATCH=true\nWHATSAPP_RELEVANT_DIRTY_COUNT=0\n'

          pm2_json="$(pm2 jlist 2>/dev/null)"
          pm2_state="$(printf '%s' "$pm2_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s||"[]");process.stdout.write(String(a.find(x=>x.name==="sikhadenge-whatsapp-agent")?.pm2_env?.status||"missing"))})')"
          login_http="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 https://whatsapp.sikhadenge.in/login || true)"
          scheduler_outbound="$(printf '%s' "$pm2_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"[]").find(x=>x.name==="sikhadenge-whatsapp-automation-scheduler");process.stdout.write(String(p?.pm2_env?.WHATSAPP_AUTOMATION_OUTBOUND_DISPATCH_ENABLED??""))})')"
          scheduler_mode="$(printf '%s' "$pm2_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"[]").find(x=>x.name==="sikhadenge-whatsapp-automation-scheduler");process.stdout.write(String(p?.pm2_env?.WHATSAPP_OUTBOUND_MODE??""))})')"
          scheduler_kill="$(printf '%s' "$pm2_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"[]").find(x=>x.name==="sikhadenge-whatsapp-automation-scheduler");process.stdout.write(String(p?.pm2_env?.WHATSAPP_OUTBOUND_KILL_SWITCH??""))})')"
          test "$pm2_state" = online
          test "$login_http" = 200
          test "$scheduler_outbound" = false
          test "$scheduler_mode" = disabled
          test "$scheduler_kill" = on
          printf 'PM2_STATE=online\nLOGIN_HTTP=200\nSCHEDULER_OUTBOUND=false\nSCHEDULER_MODE=disabled\nSCHEDULER_KILL_SWITCH=on\n'

          test -f "$ENV_FILE"
          cd "$APP"
          set -a
          source .env
          set +a
          test "${WHATSAPP_OUTBOUND_MODE:-disabled}" != live
          test "${WHATSAPP_CUTOVER_APPROVED:-false}" != true
          test -z "${WHATSAPP_OUTBOUND_LIVE_ACK:-}"
          test "${WHATSAPP_OUTBOUND_KILL_SWITCH:-on}" = on
          printf 'BASE_OUTBOUND_MODE_NOT_LIVE=true\nBASE_CUTOVER_APPROVED=false\nBASE_LIVE_ACK_SET=false\nBASE_KILL_SWITCH=on\n'

          DB="$(node scripts/prisma-postgres-cli-url.mjs "$DATABASE_URL")"
          IFS='|' read -r launch_stage launch_mode launch_policy external_writes requested_external <<< "$(PGOPTIONS='-c default_transaction_read_only=on' psql "$DB" -X -v ON_ERROR_STOP=1 -A -F '|' -t <<'SQL'
          SELECT "stage", "mode", "writePolicy",
                 CASE WHEN "externalWritesAllowed" THEN 'true' ELSE 'false' END,
                 COALESCE("scope"->>'externalWritesRequested','false')
          FROM "EngageControlledLaunchState"
          WHERE "workspaceId"='engagews_default';
          SQL
          )"
          test -n "$launch_stage"
          test "$external_writes" = false
          test "$requested_external" = false
          printf 'CONTROLLED_LAUNCH_STAGE=%s\nCONTROLLED_LAUNCH_MODE=%s\nCONTROLLED_LAUNCH_POLICY=%s\n' "$launch_stage" "$launch_mode" "$launch_policy"
          printf 'EXTERNAL_WRITES_ALLOWED=false\nEXTERNAL_WRITES_REQUESTED=false\n'

          dry_file="$(mktemp)"
          provision_file="$(mktemp)"
          trap 'rm -f "$dry_file" "$provision_file"' EXIT

          PHASE22D_MODE=DRY_RUN \
          PHASE22D_VERIFIED_CANARY_WA_ID="$VERIFIED_CANARY_WA_ID" \
          npm exec -- tsx "$REVIEWED_W5_SCRIPT_REMOTE" > "$dry_file"

          node - "$dry_file" "$SELECTED_TEMPLATE" <<'NODE'
          const fs = require('node:fs');
          const [file, selected] = process.argv.slice(2);
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (data.mode !== 'DRY_RUN') process.exit(2);
          if (data.canaryConsentStatus !== 'OPTED_IN') process.exit(3);
          if (data.externalWhatsAppWriteSent !== false) process.exit(4);
          if (!data.controlledLaunch || data.controlledLaunch.externalWritesAllowed !== false) process.exit(5);
          if (!Array.isArray(data.approvedTemplateCandidates)) process.exit(6);
          if (!data.approvedTemplateCandidates.some((t) => t && t.name === selected)) process.exit(7);
          if (!Number.isInteger(data.approvedTemplateCandidateCount) || data.approvedTemplateCandidateCount < 1) process.exit(8);
          if (!Number.isInteger(data.activeAdminCount) || data.activeAdminCount < 1) process.exit(9);
          console.log(`APPROVED_ZERO_VARIABLE_TEMPLATE_COUNT=${data.approvedTemplateCandidateCount}`);
          console.log('SELECTED_TEMPLATE_READY=true');
          console.log(`ACTIVE_ADMIN_COUNT=${data.activeAdminCount}`);
          console.log(`SERVICE_WINDOW_OPEN=${data.serviceWindowOpen === true ? 'true' : 'false'}`);
          console.log('DRY_RUN_EXTERNAL_WHATSAPP_WRITE_SENT=false');
          NODE

          PHASE22D_MODE=PROVISION \
          PHASE22D_VERIFIED_CANARY_WA_ID="$VERIFIED_CANARY_WA_ID" \
          PHASE22D_TEMPLATE_NAME="$SELECTED_TEMPLATE" \
          PHASE22D_CONFIRM=PROVISION_ONE_INTERNAL_CANARY_MESSAGE \
          npm exec -- tsx "$REVIEWED_W5_SCRIPT_REMOTE" > "$provision_file"

          node - "$provision_file" "$SELECTED_TEMPLATE" <<'NODE'
          const fs = require('node:fs');
          const [file, selected] = process.argv.slice(2);
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (data.mode !== 'PROVISION') process.exit(2);
          if (data.templateName !== selected) process.exit(3);
          if (data.externalWhatsAppWriteSent !== false) process.exit(4);
          if (data.messageStatus !== 'QUEUED') process.exit(5);
          if (data.provisioned !== true && data.duplicate !== true) process.exit(6);
          console.log(`CANARY_MESSAGE_PROVISIONED=${data.provisioned === true ? 'true' : 'false'}`);
          console.log(`CANARY_MESSAGE_DUPLICATE=${data.duplicate === true ? 'true' : 'false'}`);
          console.log('CANARY_MESSAGE_STATUS=QUEUED');
          console.log('CANARY_MESSAGE_ID_EMITTED=false');
          NODE

          exact_queued_count="$(PGOPTIONS='-c default_transaction_read_only=on' psql "$DB" -X -v ON_ERROR_STOP=1 -v canary="$VERIFIED_CANARY_WA_ID" -v template="$SELECTED_TEMPLATE" -At <<'SQL'
          SELECT COUNT(*)
          FROM "WhatsAppMessage" m
          JOIN "WhatsAppConversation" c ON c.id=m."conversationId"
          JOIN "WhatsAppContact" ct ON ct.id=c."contactId"
          WHERE m.direction='OUTBOUND'
            AND m.status='QUEUED'
            AND m.type='TEMPLATE'
            AND m."metaMessageId" IS NULL
            AND ct."waId"=:'canary'
            AND ct.metadata #>> '{engageos,canary,designated}'='true'
            AND ct.metadata #>> '{engageos,canary,kind}'='INTERNAL_TEST'
            AND m."rawPayload" #>> '{outbound,templateName}'=:'template'
            AND m."rawPayload" #>> '{outbound,idempotencyKey}' LIKE 'phase22d-internal-canary:%';
          SQL
          )"
          test "$exact_queued_count" = 1
          printf 'EXACT_INTERNAL_CANARY_QUEUED_COUNT=1\n'

          pm2_json_after="$(pm2 jlist 2>/dev/null)"
          scheduler_outbound_after="$(printf '%s' "$pm2_json_after" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"[]").find(x=>x.name==="sikhadenge-whatsapp-automation-scheduler");process.stdout.write(String(p?.pm2_env?.WHATSAPP_AUTOMATION_OUTBOUND_DISPATCH_ENABLED??""))})')"
          scheduler_mode_after="$(printf '%s' "$pm2_json_after" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"[]").find(x=>x.name==="sikhadenge-whatsapp-automation-scheduler");process.stdout.write(String(p?.pm2_env?.WHATSAPP_OUTBOUND_MODE??""))})')"
          scheduler_kill_after="$(printf '%s' "$pm2_json_after" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"[]").find(x=>x.name==="sikhadenge-whatsapp-automation-scheduler");process.stdout.write(String(p?.pm2_env?.WHATSAPP_OUTBOUND_KILL_SWITCH??""))})')"
          test "$scheduler_outbound_after" = false
          test "$scheduler_mode_after" = disabled
          test "$scheduler_kill_after" = on

          printf 'DATABASE_WRITE_SCOPE=ONE_INTERNAL_CANARY_QUEUE_RECORD\n'
          printf 'PROVIDER_WRITE_REQUESTED=false\nEXTERNAL_WHATSAPP_WRITE_SENT=false\n'
          printf 'CANARY_IDENTIFIER_EMITTED=false\nPII_EMITTED=false\n'
          printf 'WHATSAPP_W5_INTERNAL_CANARY_PROVISION=PASS\n'
          REMOTE

      - name: Cleanup reviewed canary provisioner
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${REVIEWED_W5_SCRIPT_REMOTE:-}" && -f "$HOME/.ssh/whatsapp-production" ]]; then
            ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
              "$SSH_USER@$SSH_HOST" "rm -f '$REVIEWED_W5_SCRIPT_REMOTE'" || true
          fi
          exit 0
