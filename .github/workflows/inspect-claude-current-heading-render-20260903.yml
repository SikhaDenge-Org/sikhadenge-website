name: Inspect Claude Current Heading Render 20260903

on:
  push:
    paths:
      - .github/workflows/inspect-claude-current-heading-render-20260903.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64, sikhadenge-ci]
    timeout-minutes: 8
    steps:
      - name: Inspect rendered restored heading system
        shell: bash
        run: |
          set -Eeuo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          URL='https://sikhadenge.in/masterclass/claude/free?v=current-heading-after-v11-restore-20260903'
          DOM="$RUNNER_TEMP/claude-current.html"
          PNG="$RUNNER_TEMP/claude-current.png"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=18000 --dump-dom "$URL" > "$DOM"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=18000 --hide-scrollbars --window-size=1440,7000 --screenshot="$PNG" "$URL"
          echo '===== RESTORE MARKER ====='
          grep -o 'data-claude-heading-v11-restored="[0-9]*"' "$DOM" | head -5 || true
          echo '===== H2 INNER HTML ====='
          python3 - "$DOM" <<'PY'
          from pathlib import Path
          import re,sys
          s=Path(sys.argv[1]).read_text(errors='ignore')
          for i,m in enumerate(re.finditer(r'<h2([^>]*)>(.*?)</h2>',s,re.S)):
              attrs=m.group(1)
              inner=re.sub(r'\s+',' ',m.group(2)).strip()
              text=re.sub(r'<[^>]+>',' ',inner)
              text=re.sub(r'\s+',' ',text).strip()
              if text == 'Your privacy choices':
                  continue
              print('INDEX',i,'TEXT=',text[:130])
              print('ATTRS=',attrs[:300])
              print('INNER=',inner[:500])
          PY
          echo '===== COUNTS ====='
          echo "restore_script=$(grep -o '/claude-heading-v11-restore-current.js?v=old-v11-current-20260903' "$DOM" | wc -l || true)"
          echo "proof_jobs=$(grep -o 'id=\"ai-video-job-impact-v80\"' "$DOM" | wc -l || true)"
          echo "proof_skills=$(grep -o 'id=\"ai-video-ai-opportunity-v85\"' "$DOM" | wc -l || true)"
          cp "$DOM" "$GITHUB_WORKSPACE/claude-current.html"
          cp "$PNG" "$GITHUB_WORKSPACE/claude-current.png"
      - name: Upload current render
        uses: actions/upload-artifact@v4
        with:
          name: claude-current-heading-render-after-v11
          path: |
            claude-current.html
            claude-current.png
          retention-days: 1
