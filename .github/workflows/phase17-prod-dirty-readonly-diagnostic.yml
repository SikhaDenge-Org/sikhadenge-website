name: Phase17 Production Dirty Readonly Diagnostic

on:
  push:
    branches: [phase17-stage2-governance-v15-20260913]
    paths:
      - ".github/workflows/phase17-prod-dirty-readonly-diagnostic.yml"

permissions:
  contents: read

concurrency:
  group: whatsapp-agent-production
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
      EXPECTED_LIVE_SHA: f651d0182861c191c041b36e96902f20d5a6da2b
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          for v in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_HOST_KEY; do test -n "${!v:-}"; done
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; echo SSH_PORT=22 >> "$GITHUB_ENV"; fi
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$key" >/dev/null
      - name: Inventory tracked drift without reading file contents
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "EXPECTED_LIVE_SHA='$EXPECTED_LIVE_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          A=/var/www/sikhadenge-whatsapp-agent/source/apps/whatsapp-agent-dashboard
          root="$(git -C "$A" rev-parse --show-toplevel)"
          live="$(git -C "$root" rev-parse HEAD)"
          printf 'LIVE_SHA=%s\n' "$live"
          test "$live" = "$EXPECTED_LIVE_SHA"
          printf '%s\n' '--- TRACKED_STATUS ---'
          git -C "$root" status --short --untracked-files=no
          printf '%s\n' '--- TRACKED_PATHS ---'
          git -C "$root" diff HEAD --name-only --no-renames | LC_ALL=C sort
          printf '%s\n' '--- DIFF_NUMSTAT ---'
          git -C "$root" diff HEAD --numstat --no-renames
          printf '%s\n' '--- WORKTREE_DIFF_HASH ---'
          git -C "$root" diff HEAD --no-ext-diff --binary | sha256sum | awk '{print $1}'
          printf 'PASS: READONLY_DIRTY_DIAGNOSTIC_COMPLETE\n'
          REMOTE
