name: Audit Registration Trust Cue Owners 20260911

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-claude-registration-handoff-20260911.yml'

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, sikhadenge-ci]
    environment: whatsapp-agent-production
    timeout-minutes: 15
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"; echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"; test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"

      - name: Golden and Nginx read-only owner scan
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          sikhadenge-funnel-lockctl check
          sikhadenge-funnel-lockctl status | grep -E 'SEALED_AT|CLAUDE_PUBLIC_SHA|AI_PUBLIC_SHA|LOCK_STATE|LINKED_ASSETS|PROTECTED_SOURCE_FILES'
          SITE=/etc/nginx/sites-enabled/sikhadenge.in-ssl
          echo '===== REGISTRATION NGINX REFERENCES ====='
          grep -nE 'registration-stable|registration-native|register-one-step|funnel-attribution' "$SITE" | head -240 || true
          echo '===== SERVER STRING OWNERS ====='
          grep -RIl --binary-files=without-match -E '3 Hours Live|2 Hours Live|WhatsApp Joining Link|WhatsApp Community Access|5,00,000\+|Bonus Resources' /var/www/sikhadenge.in /etc/nginx/snippets 2>/dev/null | head -120 | while read -r f; do
            echo "--- OWNER $f"
            grep -nE '3 Hours Live|2 Hours Live|WhatsApp Joining Link|WhatsApp Community Access|5,00,000\+|Bonus Resources' "$f" | head -80 || true
          done
          REMOTE

      - name: Browser loaded-script owner scan
        shell: bash
        run: |
          set -Eeuo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent puppeteer-core
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"; export CHROME
          node <<'NODE'
          const puppeteer=require('puppeteer-core'),fs=require('fs');
          (async()=>{
            const b=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const p=await b.newPage(); await p.setViewport({width:1440,height:1000});
            await p.goto('https://sikhadenge.in/gen-ai-masterclass/register-one-step?source=claude-masterclass&owner_scan='+Date.now(),{waitUntil:'networkidle2',timeout:60000});
            await new Promise(r=>setTimeout(r,4500));
            const scripts=await p.evaluate(()=>[...document.scripts].map(s=>s.src).filter(Boolean));
            console.log('LOADED_SCRIPTS',JSON.stringify(scripts));
            const needles=['3 Hours Live','2 Hours Live','WhatsApp Joining Link','WhatsApp Community Access','5,00,000+','Bonus Resources','32 joined in last 24 hours','Updates automatically'];
            for(const u of scripts){
              try{
                const r=await fetch(u); if(!r.ok) continue; const text=await r.text(); const found=needles.filter(x=>text.includes(x));
                if(found.length){console.log('SCRIPT_OWNER',u,'FOUND',JSON.stringify(found),'SHA256_PENDING');
                  for(const x of found){let i=text.indexOf(x); console.log('CONTEXT',x,JSON.stringify(text.slice(Math.max(0,i-300),i+500)));}
                }
              }catch(e){}
            }
            const html=await p.content(); for(const x of needles) if(html.includes(x)){let i=html.indexOf(x);console.log('DOM_OWNER_CONTEXT',x,JSON.stringify(html.slice(Math.max(0,i-300),i+500)));}
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
