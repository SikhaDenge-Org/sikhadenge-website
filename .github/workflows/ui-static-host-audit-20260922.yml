name: UI Static Host Audit 20260922

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui-static-host-audit-20260922.yml'

permissions:
  contents: read

jobs:
  audit-host:
    runs-on: [self-hosted, Linux, X64, sikhadenge-ci]
    timeout-minutes: 8
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
    steps:
      - name: Validate access and audit static alignment
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${SSH_HOST:-}" && test -n "${SSH_USER:-}" && test -n "${SSH_PRIVATE_KEY:-}" && test -n "${SSH_HOST_KEY:-}"
          SSH_PORT="${SSH_PORT:-22}"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"; read -r _ kt km _ <<< "$SSH_HOST_KEY"; test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          ssh -p "$SSH_PORT" -i "$KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          export HOME=/root PM2_HOME=/root/.pm2
          echo 'HOST'; hostname; date; df -h /
          echo 'PM2'
          pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{for(const x of JSON.parse(s)){const e=x.pm2_env||{}; console.log([x.name||"",e.status||"",e.pm_cwd||"",e.pm_exec_path||"",e.PORT||""].join("|"))}})' || true
          echo 'NGINX'
          nginx -T 2>/dev/null | grep -nE 'server_name.*sikhadenge\.in|location .*_next|/_next/static|alias .*\.next|proxy_pass' | head -260 || true
          echo 'LINKS'
          find /var/www /opt -maxdepth 5 -type l -printf '%p -> %l\n' 2>/dev/null | grep -E 'sikhadenge|current|release' | head -220 || true
          echo 'BUILD_IDS'
          find /var/www /opt -maxdepth 7 -path '*/.next/BUILD_ID' -type f -print -exec sh -c 'printf "  "; cat "$1"' _ {} \; 2>/dev/null | head -300 || true
          echo 'ASSET_LOCATIONS'
          for f in a27533918508dbe3.css e69e5f6c5b9af5ee.css main-app-acedf842f6d2ac77.js page-0aa0d32a71eb4a20.js webpack-306a82c98f4f7895.js; do
            echo "--- $f"
            find /var/www /opt -type f -name "$f" -printf '%p %s\n' 2>/dev/null | head -50 || true
          done
          REMOTE
