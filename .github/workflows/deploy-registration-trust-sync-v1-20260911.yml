name: Deploy Registration Trust Sync V1 20260911
# QA matcher v2: trust labels are matched case-insensitively.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-registration-trust-sync-v1-20260911.yml'

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, sikhadenge-ci]
    environment: whatsapp-agent-production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Static validation
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n ops/deploy-registration-trust-sync-v1-20260911.sh
          node --check ops/qa-registration-trust-sync-v1-20260911.js
          grep -Fq "EXPECTED_SRC_SHA='13b891266630475342cd63ca28e5336d6b137b13490d6c13c3ddff71088fe592'" ops/deploy-registration-trust-sync-v1-20260911.sh
          grep -Fq "EXPECTED_CLAUDE='87f0dd7849d2f26b6eb1eb24a886f6faedb046bbbfd37414553761d3274d7355'" ops/deploy-registration-trust-sync-v1-20260911.sh
          grep -Fq '3 Hours Live' ops/deploy-registration-trust-sync-v1-20260911.sh
          grep -Fq '5,00,000+ SikhaDenge Community' ops/qa-registration-trust-sync-v1-20260911.js
          echo REGISTRATION_TRUST_SYNC_V1_STATIC_PASS

      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"; echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"; read -r _ kt km _ <<< "$SSH_HOST_KEY"; test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"

      - name: Locked preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          sikhadenge-funnel-lockctl check
          /usr/local/sbin/sikhadenge-funnel-golden-guard --deep
          STATUS="$(sikhadenge-funnel-lockctl status)"
          printf '%s\n' "$STATUS" | grep -E 'SEALED_AT|CLAUDE_PUBLIC_SHA|AI_PUBLIC_SHA|LOCK_STATE|LINKED_ASSETS|PROTECTED_SOURCE_FILES'
          test "$(printf '%s\n' "$STATUS" | awk -F= '/^LOCK_STATE=/{print $2}')" = LOCKED
          test "$(printf '%s\n' "$STATUS" | awk -F= '/^CLAUDE_PUBLIC_SHA=/{print $2}')" = 87f0dd7849d2f26b6eb1eb24a886f6faedb046bbbfd37414553761d3274d7355
          test "$(printf '%s\n' "$STATUS" | awk -F= '/^AI_PUBLIC_SHA=/{print $2}')" = b03ab6b210bceed43573d2037816ae8f8208969ea73cecaba60e14eef10c12d2
          systemctl is-enabled sikhadenge-funnel-golden-guard.timer
          systemctl is-active sikhadenge-funnel-golden-guard.timer
          REMOTE

      - name: Stage deploy script
        shell: bash
        run: |
          set -Eeuo pipefail
          scp -P "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes ops/deploy-registration-trust-sync-v1-20260911.sh "$SSH_USER@$SSH_HOST:/tmp/deploy-registration-trust-sync-v1-20260911.sh"

      - name: Controlled registration trust sync stage
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash /tmp/deploy-registration-trust-sync-v1-20260911.sh stage'

      - name: Browser QA desktop tablet mobile
        shell: bash
        run: |
          set -Eeuo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent puppeteer-core
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"; export CHROME
          node ops/qa-registration-trust-sync-v1-20260911.js

      - name: Reseal and lock Golden baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          sikhadenge-funnel-lockctl reseal
          sikhadenge-funnel-lockctl lock
          sikhadenge-funnel-lockctl check
          /usr/local/sbin/sikhadenge-funnel-golden-guard --deep
          sleep 3
          sikhadenge-funnel-lockctl check
          STATUS="$(sikhadenge-funnel-lockctl status)"
          printf '%s\n' "$STATUS" | grep -E 'SEALED_AT|CLAUDE_PUBLIC_SHA|AI_PUBLIC_SHA|LOCK_STATE|LINKED_ASSETS|PROTECTED_SOURCE_FILES'
          test "$(printf '%s\n' "$STATUS" | awk -F= '/^LOCK_STATE=/{print $2}')" = LOCKED
          test "$(printf '%s\n' "$STATUS" | awk -F= '/^CLAUDE_PUBLIC_SHA=/{print $2}')" = 87f0dd7849d2f26b6eb1eb24a886f6faedb046bbbfd37414553761d3274d7355
          test "$(printf '%s\n' "$STATUS" | awk -F= '/^AI_PUBLIC_SHA=/{print $2}')" = b03ab6b210bceed43573d2037816ae8f8208969ea73cecaba60e14eef10c12d2
          systemctl is-enabled sikhadenge-funnel-golden-guard.timer
          systemctl is-active sikhadenge-funnel-golden-guard.timer
          echo REGISTRATION_TRUST_SYNC_V1_RESEALED_LOCKED_PASS
          REMOTE

      - name: Post-lock browser regression
        shell: bash
        run: |
          set -Eeuo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"; export CHROME
          node ops/qa-registration-trust-sync-v1-20260911.js
          echo REGISTRATION_TRUST_SYNC_V1_POST_LOCK_PASS

      - name: Rollback on failure
        if: failure()
        shell: bash
        run: |
          set +e
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'if [ -f /tmp/deploy-registration-trust-sync-v1-20260911.sh ]; then bash /tmp/deploy-registration-trust-sync-v1-20260911.sh rollback; else sikhadenge-funnel-lockctl lock || true; fi'

      - name: Cleanup temp server files
        if: always()
        shell: bash
        run: |
          set +e
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'rm -f /tmp/deploy-registration-trust-sync-v1-20260911.sh /tmp/sikhadenge-registration-trust-sync-v1.state'
