name: Diagnose Claude Bundle Variants 20260903

on:
  push:
    paths:
      - .github/workflows/diagnose-claude-bundle-variants-20260903.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, sikhadenge-ci]
    timeout-minutes: 12
    steps:
      - name: Test original and patched page chunks without live changes
        shell: bash
        run: |
          set -Eeuo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent puppeteer-core
          BASE='https://sikhadenge.in/_next/static/chunks/pages/masterclass/claude'
          curl -fsS --max-time 30 "$BASE/free-802d96fd8696db68.js" -o original.js
          curl -fsS --max-time 30 "$BASE/free-802d96fd8696db68-v315r-20260830-204006.js" -o v315r.js
          curl -fsS --max-time 30 "$BASE/free-802d96fd8696db68-v315r-20260830-204006-v316-20260830-204806.js" -o v316.js
          sha256sum original.js v315r.js v316.js
          python3 - <<'PY'
          from pathlib import Path
          for fn in ['original.js','v315r.js','v316.js']:
              s=Path(fn).read_text(errors='replace')
              print('\nFILE',fn,len(s))
              for n in ['CURRENT BATCH ADVANTAGE','Move from quick answers to','Master 25+ AI Tools','Why join this course','Specially designed for working professionals','Learn AI Tools by Doing']:
                  print(n, n in s)
          PY
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"; export CHROME
          cat > test.js <<'JS'
          const puppeteer=require('puppeteer-core'),fs=require('fs');
          (async()=>{
            const current=/\/free-802d96fd8696db68-v315r-20260830-204006-v316-20260830-204806\.js(?:\?|$)/;
            const variants=[['baseline',null],['original','original.js'],['v315r','v315r.js'],['v316','v316.js']];
            const b=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']}); const out={};
            for(const [name,file] of variants){
              const p=await b.newPage(); await p.setViewport({width:1440,height:1000});
              if(file){
                const body=fs.readFileSync(file);
                await p.setRequestInterception(true);
                p.on('request',r=>{if(current.test(r.url())) r.respond({status:200,contentType:'application/javascript',body}); else r.continue();});
              }
              const errs=[]; p.on('pageerror',e=>errs.push(String(e))); p.on('console',m=>{if(m.type()==='error')errs.push(m.text())});
              await p.goto(`https://sikhadenge.in/masterclass/claude/free?v=bundle-variant-${name}-20260903`,{waitUntil:'domcontentloaded',timeout:45000});
              await new Promise(r=>setTimeout(r,10000));
              const hyd=errs.filter(x=>/#418|#425|invariant=418|invariant=425/i.test(x));
              const state=await p.evaluate(()=>({
                h1:(document.querySelector('h1')?.innerText||'').trim(),
                h2:[...document.querySelectorAll('h2')].slice(0,8).map(x=>(x.innerText||'').trim()),
                jobs:document.querySelectorAll('#ai-video-job-impact-v80').length,
                skills:document.querySelectorAll('#ai-video-ai-opportunity-v85').length,
                bodyHasMaster:(document.body.innerText||'').includes('Master 25+ AI Tools'),
                bodyHasMove:(document.body.innerText||'').includes('Move from quick answers'),
                bodyHasCurrent:(document.body.innerText||'').includes('CURRENT BATCH ADVANTAGE')
              }));
              out[name]={hydration:hyd.length,samples:hyd.slice(0,3),state}; await p.close();
            }
            console.log('RESULT='+JSON.stringify(out,null,2)); fs.writeFileSync('bundle-variant-result.json',JSON.stringify(out,null,2)); await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node test.js

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: claude-bundle-variants-20260903
          path: bundle-variant-result.json
          retention-days: 1
