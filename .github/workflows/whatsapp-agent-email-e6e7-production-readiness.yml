name: WhatsApp Agent Email E6 E7 Production Readiness

on:
  workflow_dispatch:
    inputs:
      deployed_sha:
        description: Exact production SHA to audit
        required: true
        type: string

permissions:
  contents: read

jobs:
  email-e6e7-production-readiness:
    concurrency:
      group: whatsapp-agent-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
      DEPLOYED_SHA: ${{ inputs.deployed_sha }}
      AUDIT_RUN_ID: email-e6e7-readiness-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Validate production access
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]]
          missing=0
          for variable_name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_HOST_KEY; do
            [[ -n "${!variable_name:-}" ]] || { echo "Missing production secret: $variable_name" >&2; missing=1; }
          done
          test "$missing" = "0"
          if [[ -z "${SSH_PORT:-}" ]]; then echo 'SSH_PORT=22' >> "$GITHUB_ENV"; fi

      - name: Configure pinned SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$key" >/dev/null

      - name: Audit E6 E7 production readiness
        shell: bash
        run: |
          set -o pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "DEPLOYED_SHA='$DEPLOYED_SHA' RUN_ID='$AUDIT_RUN_ID' bash -s" <<'REMOTE' | tee email-e6e7-readiness.log
          set -Eeuo pipefail
          APP=/var/www/sikhadenge-whatsapp-agent/source/apps/whatsapp-agent-dashboard
          BACKUP=/root/sikhadenge-backups/$RUN_ID
          test "$(id -u)" = "0"
          cd "$APP"
          test "$(git rev-parse HEAD)" = "$DEPLOYED_SHA"
          install -d -m 700 "$BACKUP"
          set -a
          source "$APP/.env"
          set +a
          set +e
          EMAIL_E6E7_WORKSPACE_ID=engagews_default npx tsx scripts/email-e6e7-production-readiness.ts | tee "$BACKUP/email-e6e7-readiness.json"
          code=${PIPESTATUS[0]}
          set -e
          printf 'EXIT_CODE=%s\n' "$code" > "$BACKUP/email-e6e7-readiness-result.txt"
          chmod 600 "$BACKUP"/*
          exit "$code"
          REMOTE

      - name: Collect protected evidence
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p email-e6e7-readiness-evidence
          for file_name in email-e6e7-readiness.json email-e6e7-readiness-result.txt; do
            scp -P "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              "$SSH_USER@$SSH_HOST:/root/sikhadenge-backups/${AUDIT_RUN_ID}/${file_name}" \
              "email-e6e7-readiness-evidence/${file_name}" >/dev/null 2>&1 || true
          done
          chmod -R go-rwx email-e6e7-readiness-evidence 2>/dev/null || true

      - name: Publish readiness summary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          json="email-e6e7-readiness-evidence/email-e6e7-readiness.json"
          {
            echo "## Email E6/E7 production readiness"
            echo
            echo "- Audited SHA: `$DEPLOYED_SHA`"
            if [[ -s "$json" ]]; then
              echo "- Status: **$(jq -r '.status' "$json")**"
              echo "- Runtime: `$(jq -r '.runtime.mode' "$json")`"
              echo "- Approved templates: `$(jq -r '.approvedTemplates' "$json")`"
              echo "- Campaigns: `$(jq -r '.campaigns.total' "$json")`"
              echo "- Sequences: `$(jq -r '.sequences.total' "$json")`"
              echo "- Queue pending: `$(jq -r '.automationQueue.pending' "$json")`"
              echo "- Queue failed: `$(jq -r '.automationQueue.failed' "$json")`"
              echo "- Active email suppressions: `$(jq -r '.deliverability.activeEmailSuppressions' "$json")`"
            else
              echo "- Status: **NO_EVIDENCE**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-agent-email-e6e7-readiness-${{ env.AUDIT_RUN_ID }}
          path: |
            email-e6e7-readiness.log
            email-e6e7-readiness-evidence
          if-no-files-found: error
          retention-days: 14
