name: Phase17 V17 Git Reconcile Capture

on:
  push:
    branches: [phase17-stage2-governance-v15-20260913]
    paths:
      - ".github/workflows/phase17-v17-git-reconcile-capture.yml"

permissions:
  actions: read
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_LIVE_SHA: f651d0182861c191c041b36e96902f20d5a6da2b
      EXPECTED_BUILD_ID: KQuYq7mmylMHVenC-3yeD
      CAPTURE_ARTIFACT_ID: "10321346195"
      TARGET_BRANCH: reconcile/whatsapp-login-v17-live-20260913
    steps:
      - name: Checkout isolated V15 reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1

      - name: Download and verify immutable quiescent V17 capture
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_LIVE_SHA"
          rm -rf /tmp/phase17-v17-capture
          mkdir -p /tmp/phase17-v17-capture
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CAPTURE_ARTIFACT_ID}/zip" \
            > /tmp/phase17-v17-capture.zip
          unzip -q /tmp/phase17-v17-capture.zip -d /tmp/phase17-v17-capture
          cd /tmp/phase17-v17-capture

          cmp -s pre-manifest.txt post-manifest.txt
          cmp -s local-sha256.txt remote-sha256.txt
          grep -Fxq "LIVE_SHA=${EXPECTED_LIVE_SHA}" post-manifest.txt
          grep -Fxq "NEXT_BUILD_ID=${EXPECTED_BUILD_ID}" post-manifest.txt
          grep -Fxq 'PUBLIC_LOGIN_HTTP=200' runtime-proof.txt
          grep -Fxq 'PUBLIC_V17_MARKERS=true' runtime-proof.txt
          sha256sum -c remote-sha256.txt
          printf 'PASS: IMMUTABLE_QUIESCENT_CAPTURE_VERIFIED\n'

      - name: Materialize exact eight captured files
        shell: bash
        run: |
          set -Eeuo pipefail
          src=/tmp/phase17-v17-capture
          files=(
            apps/whatsapp-agent-dashboard/app/layout.tsx
            apps/whatsapp-agent-dashboard/app/login-page01-left-image.css
            apps/whatsapp-agent-dashboard/app/login/page.tsx
            apps/whatsapp-agent-dashboard/next-env.d.ts
            apps/whatsapp-agent-dashboard/app/login-right-panel-v16.css
            apps/whatsapp-agent-dashboard/public/page01-hero-desktop-v17.png
            apps/whatsapp-agent-dashboard/public/page01-hero-tablet-v17.png
            apps/whatsapp-agent-dashboard/public/page01-hero-ultrawide-v17.png
          )
          for path in "${files[@]}"; do
            test -f "$src/$path"
            mkdir -p "$(dirname "$path")"
            cp "$src/$path" "$path"
          done
          sha256sum -c "$src/remote-sha256.txt"

      - name: Enforce exact eight-file reconciliation diff
        shell: bash
        run: |
          set -Eeuo pipefail
          expected="$(printf '%s\n' \
            apps/whatsapp-agent-dashboard/app/layout.tsx \
            apps/whatsapp-agent-dashboard/app/login-page01-left-image.css \
            apps/whatsapp-agent-dashboard/app/login-right-panel-v16.css \
            apps/whatsapp-agent-dashboard/app/login/page.tsx \
            apps/whatsapp-agent-dashboard/next-env.d.ts \
            apps/whatsapp-agent-dashboard/public/page01-hero-desktop-v17.png \
            apps/whatsapp-agent-dashboard/public/page01-hero-tablet-v17.png \
            apps/whatsapp-agent-dashboard/public/page01-hero-ultrawide-v17.png | LC_ALL=C sort)"
          actual="$(git status --porcelain --untracked-files=all | sed -E 's/^...//' | LC_ALL=C sort)"
          test "$actual" = "$expected"

          set +e
          diff_check="$(git diff --check -- \
            apps/whatsapp-agent-dashboard/app/layout.tsx \
            apps/whatsapp-agent-dashboard/app/login-page01-left-image.css \
            apps/whatsapp-agent-dashboard/app/login/page.tsx \
            apps/whatsapp-agent-dashboard/next-env.d.ts 2>&1)"
          diff_rc=$?
          set -e
          test "$diff_rc" -ne 0
          test "$(printf '%s\n' "$diff_check" | wc -l | tr -d ' ')" = "2"
          test "$(printf '%s\n' "$diff_check" | sed -n '1p')" = \
            'apps/whatsapp-agent-dashboard/app/login/page.tsx:36: trailing whitespace.'
          printf '%s\n' "$diff_check" | sed -n '2p' | grep -Eq '^\+[[:space:]]+$'
          printf 'KNOWN_BYTE_EXACT_WHITESPACE_EXCEPTION=app/login/page.tsx:36\n'
          printf 'PASS: EXACT_QUIESCENT_EIGHT_FILE_DIFF\n'

      - name: Commit exact V17 snapshot to isolated branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "SikhaDenge Release Reconciliation"
          git config user.email "251703707+maihoonankitsingh@users.noreply.github.com"
          git add -- \
            apps/whatsapp-agent-dashboard/app/layout.tsx \
            apps/whatsapp-agent-dashboard/app/login-page01-left-image.css \
            apps/whatsapp-agent-dashboard/app/login-right-panel-v16.css \
            apps/whatsapp-agent-dashboard/app/login/page.tsx \
            apps/whatsapp-agent-dashboard/next-env.d.ts \
            apps/whatsapp-agent-dashboard/public/page01-hero-desktop-v17.png \
            apps/whatsapp-agent-dashboard/public/page01-hero-tablet-v17.png \
            apps/whatsapp-agent-dashboard/public/page01-hero-ultrawide-v17.png
          git commit -m "reconcile(page01): capture exact quiescent live V17 source"
          git push origin "HEAD:$TARGET_BRANCH"
          printf 'RECONCILIATION_COMMIT_SHA=%s\n' "$(git rev-parse HEAD)"
