name: Phase17 V17 Moving Target Diagnostic

on:
  push:
    branches: [phase17-stage2-governance-v15-20260913]
    paths:
      - ".github/workflows/phase17-v17-git-reconcile-capture.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
    steps:
      - name: Configure pinned production SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          for v in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_HOST_KEY; do test -n "${!v:-}"; done
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; echo SSH_PORT=22 >> "$GITHUB_ENV"; fi
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Print current source and runtime identity read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" bash -s <<'REMOTE'
          set -Eeuo pipefail
          cd /var/www/sikhadenge-whatsapp-agent/source
          A=apps/whatsapp-agent-dashboard
          root="$(git -C "$A" rev-parse --show-toplevel)"
          printf 'LIVE_SHA=%s\n' "$(git -C "$root" rev-parse HEAD)"
          printf 'NEXT_BUILD_ID=%s\n' "$(cat "$A/.next/BUILD_ID")"
          stat -c 'NEXT_BUILD_ID_MTIME=%y' "$A/.next/BUILD_ID"
          printf 'TRACKED_DIRTY_PATHS_BEGIN\n'; git -C "$root" diff HEAD --name-only --no-renames | LC_ALL=C sort; printf 'TRACKED_DIRTY_PATHS_END\n'
          for path in \
            apps/whatsapp-agent-dashboard/app/layout.tsx \
            apps/whatsapp-agent-dashboard/app/login-page01-left-image.css \
            apps/whatsapp-agent-dashboard/app/login/page.tsx \
            apps/whatsapp-agent-dashboard/next-env.d.ts \
            apps/whatsapp-agent-dashboard/app/login-right-panel-v16.css \
            apps/whatsapp-agent-dashboard/public/page01-hero-desktop-v17.png \
            apps/whatsapp-agent-dashboard/public/page01-hero-tablet-v17.png \
            apps/whatsapp-agent-dashboard/public/page01-hero-ultrawide-v17.png; do
            printf 'CURRENT_FILE path=%s size=%s sha256=%s mtime=%s\n' "$path" "$(stat -c '%s' "$path")" "$(sha256sum "$path" | awk '{print $1}')" "$(stat -c '%y' "$path")"
          done
          tmp="$(mktemp)"; trap 'rm -f "$tmp"' EXIT
          http="$(curl -sS -L -o "$tmp" -w '%{http_code}' https://whatsapp.sikhadenge.in/login)"
          printf 'PUBLIC_LOGIN_HTTP=%s\nPUBLIC_HAS_V17_VERSION=%s\nPUBLIC_HAS_V17_SHELL=%s\n' "$http" "$(grep -q '20260913-211322' "$tmp" && echo true || echo false)" "$(grep -q 'page01-hero-v17-shell' "$tmp" && echo true || echo false)"
          REMOTE
