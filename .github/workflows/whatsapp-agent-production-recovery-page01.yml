name: WhatsApp Agent One-Time Page01 Production Recovery

on:
  push:
    branches:
      - release/whatsapp-instagram-agent-flow-20260731
    paths:
      - ".github/workflows/whatsapp-agent-production-recovery-page01.yml"

permissions:
  contents: read

concurrency:
  group: whatsapp-agent-production
  cancel-in-progress: false

jobs:
  recover-page01-production-drift:
    if: contains(github.event.head_commit.message, '[production-recovery-page01]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
      RECOVERY_RUN_ID: page01-recovery-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Validate production secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          missing=0
          for variable_name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_HOST_KEY; do
            if [[ -z "${!variable_name:-}" ]]; then
              printf 'Missing required production secret: %s\n' "$variable_name" >&2
              missing=1
            fi
          done
          test "$missing" = "0"
          if [[ -z "${SSH_PORT:-}" ]]; then
            printf 'SSH_PORT=22\n' >> "$GITHUB_ENV"
          fi

      - name: Configure pinned SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          private_key_file="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$private_key_file"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$private_key_file"
          fi
          chmod 600 "$private_key_file"
          [[ "$SSH_HOST" =~ ^[^[:space:]/]+$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          (( SSH_PORT >= 1 && SSH_PORT <= 65535 ))
          read -r _ supplied_key_type supplied_key_material _ <<< "$SSH_HOST_KEY"
          test "$supplied_key_type" = "ssh-ed25519"
          test -n "$supplied_key_material"
          canonical_host="[$SSH_HOST]:$SSH_PORT"
          printf '%s %s %s\n' "$canonical_host" "$supplied_key_type" "$supplied_key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$private_key_file" >/dev/null
          ssh-keygen -F "$canonical_host" -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Preserve and canonicalize exact Stage2 blocker drift
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -p "$SSH_PORT" \
            -i "$HOME/.ssh/whatsapp-production" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "RUN_ID='$RECOVERY_RUN_ID' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          LIVE_APP=/var/www/sikhadenge-whatsapp-agent/source/apps/whatsapp-agent-dashboard
          EXPECTED_LIVE_SHA=2b3efe35b8920082cc94dce989d1847842fb8825
          cd "$LIVE_APP"
          repo_root="$(git rev-parse --show-toplevel)"
          live_sha="$(git rev-parse HEAD)"
          test "$live_sha" = "$EXPECTED_LIVE_SHA"

          expected_paths=(
            apps/whatsapp-agent-dashboard/app/login-page01-left-image.css
            apps/whatsapp-agent-dashboard/app/login/page.tsx
            apps/whatsapp-agent-dashboard/next-env.d.ts
          )
          actual_paths="$(git -C "$repo_root" diff HEAD --name-only --no-renames | LC_ALL=C sort)"
          expected_list="$(printf '%s\n' "${expected_paths[@]}" | LC_ALL=C sort)"
          if [[ "$actual_paths" != "$expected_list" ]]; then
            printf 'FAIL: RECOVERY_DIRTY_PATH_SET_MISMATCH\n' >&2
            git -C "$repo_root" status --porcelain --untracked-files=no
            exit 41
          fi

          recovery_dir="/root/sikhadenge-backups/${RUN_ID}"
          patch_file="$recovery_dir/stage2-production-drift.patch"
          manifest_file="$recovery_dir/stage2-production-drift-manifest.txt"
          install -d -m 700 "$recovery_dir"
          git -C "$repo_root" diff HEAD --binary -- "${expected_paths[@]}" > "$patch_file"
          test -s "$patch_file"
          chmod 600 "$patch_file"
          patch_sha256="$(sha256sum "$patch_file" | awk '{print $1}')"
          {
            printf 'FORMAT_VERSION=2\n'
            printf 'RUN_ID=%s\n' "$RUN_ID"
            printf 'LIVE_SHA=%s\n' "$live_sha"
            printf 'PATCH_SHA256=%s\n' "$patch_sha256"
            printf 'CAPTURED_UTC=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            printf 'TRACKED_STATUS_BEGIN\n'
            git -C "$repo_root" status --porcelain --untracked-files=no -- "${expected_paths[@]}"
            printf 'TRACKED_STATUS_END\n'
            printf 'DIFF_NUMSTAT_BEGIN\n'
            git -C "$repo_root" diff HEAD --numstat --no-renames -- "${expected_paths[@]}"
            printf 'DIFF_NUMSTAT_END\n'
            for path in "${expected_paths[@]}"; do
              printf 'FILE path=%s mtime=%s working_sha256=%s head_blob=%s head_sha256=%s\n' \
                "$path" \
                "$(stat -c '%y' "$repo_root/$path")" \
                "$(sha256sum "$repo_root/$path" | awk '{print $1}')" \
                "$(git -C "$repo_root" rev-parse "HEAD:$path")" \
                "$(git -C "$repo_root" show "HEAD:$path" | sha256sum | awk '{print $1}')"
            done
          } > "$manifest_file"
          chmod 600 "$manifest_file"

          git -C "$repo_root" restore --source="$EXPECTED_LIVE_SHA" --worktree -- "${expected_paths[@]}"
          if [[ -n "$(git -C "$repo_root" status --porcelain --untracked-files=no)" ]]; then
            printf 'FAIL: RECOVERY_WORKTREE_NOT_CLEAN\n' >&2
            git -C "$repo_root" status --porcelain --untracked-files=no
            exit 42
          fi

          printf 'RECOVERY_PATCH_SHA256=%s\n' "$patch_sha256"
          printf 'RECOVERY_MANIFEST=%s\n' "$manifest_file"
          cat "$manifest_file"
          printf 'PASS: STAGE2_PRODUCTION_DRIFT_PRESERVED_AND_CANONICALIZED\n'
          REMOTE
