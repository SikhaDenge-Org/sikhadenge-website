name: WhatsApp Agent DR Readiness

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read

concurrency:
  group: whatsapp-agent-dr-readiness
  cancel-in-progress: false

jobs:
  dispatch-protected:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'main')
    runs-on: [self-hosted, Linux, X64, sikhadenge-ci]
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch DR audit on protected release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh workflow run whatsapp-agent-dr-readiness.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref release/whatsapp-instagram-agent-flow-20260731
          printf 'DISPATCHED_PROTECTED_RELEASE=true\n'

  verify:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'release/whatsapp-instagram-agent-flow-20260731'
    runs-on: [self-hosted, Linux, X64, sikhadenge-ci]
    timeout-minutes: 15
    environment: whatsapp-agent-production
    permissions:
      contents: read
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

    steps:
      - name: Configure pinned SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          port="${SSH_PORT:-22}"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$port" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Verify latest protected recovery point
        shell: bash
        run: |
          set -Eeuo pipefail
          port="${SSH_PORT:-22}"
          ssh -p "$port" -i "$HOME/.ssh/whatsapp-production" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'bash -s' > dr-readiness-evidence.txt <<'REMOTE'
          set -Eeuo pipefail
          APP=/var/www/sikhadenge-whatsapp-agent/source/apps/whatsapp-agent-dashboard
          cd "$APP"
          bash scripts/engageos-production-dr-verify.sh
          REMOTE
          test -s dr-readiness-evidence.txt
          grep -q 'PASS: PRODUCTION_DR_READINESS_VERIFIED' dr-readiness-evidence.txt
          cat dr-readiness-evidence.txt

      - name: Upload DR readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-agent-dr-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: dr-readiness-evidence.txt
          if-no-files-found: error
          retention-days: 30
