name: Email Phase A Runtime Truth Reconcile

on:
  push:
    branches:
      - release/whatsapp-instagram-agent-flow-20260731
    paths:
      - ".github/workflows/whatsapp-agent-email-phase-a-runtime-truth-reconcile.yml"

permissions:
  contents: read

concurrency:
  group: whatsapp-agent-production
  cancel-in-progress: false

jobs:
  phase-a-runtime-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
      RUN_ID: email-phase-a-truth-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Validate production access
        shell: bash
        run: |
          set -Eeuo pipefail
          missing=0
          for variable_name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_HOST_KEY; do
            [[ -n "${!variable_name:-}" ]] || { echo "Missing production secret: $variable_name" >&2; missing=1; }
          done
          test "$missing" = "0"
          if [[ -z "${SSH_PORT:-}" ]]; then echo 'SSH_PORT=22' >> "$GITHUB_ENV"; fi

      - name: Configure pinned SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$key" >/dev/null

      - name: Discover production truth and reconcile Email safety
        shell: bash
        run: |
          set -o pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            "$SSH_USER@$SSH_HOST" "RUN_ID='$RUN_ID' bash -s" <<'REMOTE' | tee email-phase-a-runtime-truth.log
          set -Eeuo pipefail
          ROOT=/var/www/sikhadenge-whatsapp-agent/source
          APP="$ROOT/apps/whatsapp-agent-dashboard"
          ENV_FILE="$APP/.env"
          PROCESS=sikhadenge-whatsapp-agent
          BACKUP=/root/sikhadenge-backups/$RUN_ID
          WORKSPACE_ID=engagews_default

          test "$(id -u)" = "0"
          test -d "$APP"
          test -f "$ENV_FILE"
          install -d -m 700 "$BACKUP"

          read_env() {
            node - "$ENV_FILE" "$1" <<'NODE'
          const fs=require('node:fs'); const [file,key]=process.argv.slice(2); let out='';
          for(const raw of fs.readFileSync(file,'utf8').split(/\r?\n/)){
            let line=raw.trim(); if(!line||line.startsWith('#')) continue;
            if(line.startsWith('export ')) line=line.slice(7).trim();
            const i=line.indexOf('='); if(i<1||line.slice(0,i).trim()!==key) continue;
            out=line.slice(i+1).trim();
            if(out.length>=2&&((out.startsWith('"')&&out.endsWith('"'))||(out.startsWith("'")&&out.endsWith("'")))) out=out.slice(1,-1);
          }
          process.stdout.write(out);
          NODE
          }

          LIVE_SHA="$(git -C "$ROOT" rev-parse HEAD)"
          [[ "$LIVE_SHA" =~ ^[0-9a-f]{40}$ ]]
          TRACKED_DIRTY_COUNT="$(git -C "$ROOT" status --porcelain --untracked-files=no | sed '/^$/d' | wc -l | tr -d ' ')"
          APP_BUILD_ID="$(cat "$APP/.next/BUILD_ID" 2>/dev/null || true)"
          PM2_FILE="$(mktemp)"
          trap 'rm -f "$PM2_FILE"' EXIT
          pm2 jlist > "$PM2_FILE"
          IFS='|' read -r PM2_PID PM2_STATUS PM2_CWD < <(
            node - "$PM2_FILE" <<'NODE'
          const fs=require('node:fs'); const rows=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const p=rows.find(x=>x.name==='sikhadenge-whatsapp-agent');
          process.stdout.write(p ? [p.pid||'',p.pm2_env?.status||'',p.pm2_env?.pm_cwd||''].join('|')+'\n' : '||\n');
          NODE
          )
          test -n "$PM2_PID"
          test "$PM2_STATUS" = "online"
          case "$PM2_CWD" in /var/www/sikhadenge-whatsapp-agent/*) ;; *) echo "FAIL: unexpected PM2 cwd" >&2; exit 20;; esac
          RUNTIME_BUILD_ID="$(cat "$PM2_CWD/.next/BUILD_ID" 2>/dev/null || true)"

          printf 'PHASE_A_LIVE_SHA=%s\n' "$LIVE_SHA"
          printf 'PHASE_A_TRACKED_DIRTY_COUNT=%s\n' "$TRACKED_DIRTY_COUNT"
          printf 'PHASE_A_APP_BUILD_ID=%s\n' "$APP_BUILD_ID"
          printf 'PHASE_A_PM2_PID=%s\n' "$PM2_PID"
          printf 'PHASE_A_PM2_STATUS=%s\n' "$PM2_STATUS"
          printf 'PHASE_A_PM2_CWD=%s\n' "$PM2_CWD"
          printf 'PHASE_A_RUNTIME_BUILD_ID=%s\n' "$RUNTIME_BUILD_ID"
          printf 'PHASE_A_APP_RUNTIME_BUILD_MATCH=%s\n' "$([[ -n "$APP_BUILD_ID" && "$APP_BUILD_ID" = "$RUNTIME_BUILD_ID" ]] && echo true || echo false)"

          before_runtime="$(read_env EMAIL_RUNTIME_ENABLED)"
          before_automation="$(read_env EMAIL_AUTOMATION_ENABLED)"
          before_mode="$(read_env EMAIL_RUNTIME_MODE)"
          before_external="$(read_env EMAIL_EXTERNAL_WRITES_ENABLED)"
          before_inbound="$(read_env EMAIL_INBOUND_SYNC_ENABLED)"
          printf 'PHASE_A_BEFORE_RUNTIME_ENABLED=%s\n' "${before_runtime:-unset}"
          printf 'PHASE_A_BEFORE_AUTOMATION_ENABLED=%s\n' "${before_automation:-unset}"
          printf 'PHASE_A_BEFORE_RUNTIME_MODE=%s\n' "${before_mode:-unset}"
          printf 'PHASE_A_BEFORE_EXTERNAL_WRITES=%s\n' "${before_external:-unset}"
          printf 'PHASE_A_BEFORE_INBOUND_SYNC=%s\n' "${before_inbound:-unset}"

          changed=false
          if [[ "$before_runtime" != "true" || "$before_automation" != "true" || "$before_mode" != "DRY_RUN" || "$before_external" != "false" || "$before_inbound" != "false" ]]; then
            cp -a "$ENV_FILE" "$BACKUP/.env.before"
            chmod 600 "$BACKUP/.env.before"
            node - "$ENV_FILE" <<'NODE'
          const fs=require('node:fs'),path=require('node:path'); const file=process.argv[2]; const stat=fs.statSync(file); const original=fs.readFileSync(file,'utf8');
          const desired={EMAIL_RUNTIME_ENABLED:'true',EMAIL_AUTOMATION_ENABLED:'true',EMAIL_RUNTIME_MODE:'DRY_RUN',EMAIL_EXTERNAL_WRITES_ENABLED:'false',EMAIL_INBOUND_SYNC_ENABLED:'false'};
          const keys=new Set(Object.keys(desired)); const kept=original.split(/\r?\n/).filter(raw=>{let line=raw.trim(); if(!line||line.startsWith('#')) return true; if(line.startsWith('export ')) line=line.slice(7).trim(); const i=line.indexOf('='); return i<1||!keys.has(line.slice(0,i).trim());});
          while(kept.length&&kept.at(-1)==='') kept.pop(); for(const [k,v] of Object.entries(desired)) kept.push(`${k}=${v}`); kept.push('');
          const tmp=path.join(path.dirname(file),`.${path.basename(file)}.${process.pid}.phase-a`); fs.writeFileSync(tmp,kept.join('\n'),{mode:stat.mode}); fs.chmodSync(tmp,stat.mode); try{fs.chownSync(tmp,stat.uid,stat.gid)}catch{} fs.renameSync(tmp,file);
          NODE
            pm2 restart "$PROCESS" --update-env >/dev/null
            sleep 3
            changed=true
          fi

          after_runtime="$(read_env EMAIL_RUNTIME_ENABLED)"
          after_automation="$(read_env EMAIL_AUTOMATION_ENABLED)"
          after_mode="$(read_env EMAIL_RUNTIME_MODE)"
          after_external="$(read_env EMAIL_EXTERNAL_WRITES_ENABLED)"
          after_inbound="$(read_env EMAIL_INBOUND_SYNC_ENABLED)"
          test "$after_runtime" = "true"
          test "$after_automation" = "true"
          test "$after_mode" = "DRY_RUN"
          test "$after_external" = "false"
          test "$after_inbound" = "false"
          pm2 jlist > "$PM2_FILE"
          IFS='|' read -r POST_PID POST_STATUS POST_CWD < <(
            node - "$PM2_FILE" <<'NODE'
          const fs=require('node:fs'); const rows=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const p=rows.find(x=>x.name==='sikhadenge-whatsapp-agent'); process.stdout.write(p?[p.pid||'',p.pm2_env?.status||'',p.pm2_env?.pm_cwd||''].join('|')+'\n':'||\n');
          NODE
          )
          test -n "$POST_PID"
          test "$POST_STATUS" = "online"
          test "$POST_CWD" = "$PM2_CWD"
          printf 'PHASE_A_SAFETY_RECONCILED=%s\n' "$changed"
          printf 'PHASE_A_RUNTIME_ENABLED=true\n'
          printf 'PHASE_A_AUTOMATION_ENABLED=true\n'
          printf 'PHASE_A_RUNTIME_MODE=DRY_RUN\n'
          printf 'PHASE_A_EXTERNAL_WRITES=false\n'
          printf 'PHASE_A_INBOUND_SYNC=false\n'

          latest_evidence=""
          latest_mtime=0
          shopt -s nullglob
          for candidate in /root/sikhadenge-backups/engageos-github-*/post-deploy-evidence.txt; do
            m="$(stat -c %Y "$candidate" 2>/dev/null || printf 0)"
            if [[ "$m" =~ ^[0-9]+$ ]] && (( m > latest_mtime )); then latest_mtime="$m"; latest_evidence="$candidate"; fi
          done
          shopt -u nullglob
          if [[ -n "$latest_evidence" ]]; then
            evidence_sha="$(awk -F= '$1=="RELEASE_SHA"{print $2;exit}' "$latest_evidence")"
            evidence_build="$(awk -F= '$1=="BUILD_ID"{print $2;exit}' "$latest_evidence")"
            printf 'PHASE_A_LATEST_GENERIC_EVIDENCE_PRESENT=true\n'
            printf 'PHASE_A_GENERIC_EVIDENCE_SHA=%s\n' "$evidence_sha"
            printf 'PHASE_A_GENERIC_EVIDENCE_BUILD_ID=%s\n' "$evidence_build"
            printf 'PHASE_A_GENERIC_EVIDENCE_SHA_MATCH=%s\n' "$([[ "$evidence_sha" = "$LIVE_SHA" ]] && echo true || echo false)"
            printf 'PHASE_A_GENERIC_EVIDENCE_BUILD_MATCH=%s\n' "$([[ -n "$evidence_build" && "$evidence_build" = "$RUNTIME_BUILD_ID" ]] && echo true || echo false)"
          else
            printf 'PHASE_A_LATEST_GENERIC_EVIDENCE_PRESENT=false\n'
          fi

          cd "$APP"
          scheduler_code=127
          if [[ -f scripts/email-automation-scheduler-verify.sh ]]; then
            set +e
            EXPECTED_RELEASE_SHA="$LIVE_SHA" ENV_FILE="$ENV_FILE" bash scripts/email-automation-scheduler-verify.sh | tee "$BACKUP/scheduler-verify.log"
            scheduler_code=${PIPESTATUS[0]}
            set -e
          fi
          printf 'PHASE_A_SCHEDULER_VERIFY_EXIT=%s\n' "$scheduler_code"

          set +e
          npm exec -- tsx -e 'import { prisma } from "./lib/db/prisma"; import { ManualEmailSendService } from "./modules/email-automation/application/manual-send-service"; (async()=>{ const rows=await prisma.engageEmailMessage.findMany({where:{status:"SENT",externalRequestSent:true,idempotencyKey:{startsWith:"internal-test-"}},orderBy:{createdAt:"desc"},take:50}); const m=rows.find((row:any)=>{const to=Array.isArray(row.toRecipients)?row.toRecipients:[];return to.some((x:any)=>String(x?.email||"").toLowerCase()==="ankitsingh@sikhadenge.in")&&Boolean(row.idempotencyKey)&&Boolean(row.providerMessageId)&&Boolean(row.sentAt)&&Boolean(row.templateId)&&Boolean(row.senderIdentityId);}); if(!m){console.log("PHASE_A_CANARY_STATUS=NOT_FOUND"); await prisma.$disconnect(); process.exit(2);} const replay=await new ManualEmailSendService().send({workspaceId:m.workspaceId,templateId:m.templateId!,manualSenderIdentityId:m.senderIdentityId,to:[{email:"ankitsingh@sikhadenge.in"}],idempotencyKey:m.idempotencyKey!,actorUserId:m.createdById}); const count=await prisma.engageEmailMessage.count({where:{workspaceId:m.workspaceId,idempotencyKey:m.idempotencyKey!}}); if(!replay.replayed||replay.message.id!==m.id||count!==1) throw new Error("idempotency replay contract failed"); console.log("PHASE_A_CANARY_STATUS=PASS"); console.log(`PHASE_A_CANARY_MESSAGE_ID=${m.id}`); console.log(`PHASE_A_CANARY_DUPLICATE_COUNT=${count}`); await prisma.$disconnect(); })().catch(async e=>{console.error(e);try{await prisma.$disconnect()}catch{}process.exit(1)});' | tee "$BACKUP/canary-idempotency.log"
          canary_code=${PIPESTATUS[0]}
          set -e
          printf 'PHASE_A_CANARY_VERIFY_EXIT=%s\n' "$canary_code"

          inbound_code=127
          if [[ -f scripts/email-inbound-production-readiness.ts ]]; then
            set +e
            EXPECTED_RELEASE_SHA="$LIVE_SHA" EMAIL_INBOUND_ACTIVATION_WORKSPACE_ID="$WORKSPACE_ID" npx tsx scripts/email-inbound-production-readiness.ts | tee "$BACKUP/inbound-readiness.json"
            inbound_code=${PIPESTATUS[0]}
            set -e
          fi
          printf 'PHASE_A_INBOUND_READINESS_EXIT=%s\n' "$inbound_code"

          printf 'LIVE_SHA=%s\nRUNTIME_BUILD_ID=%s\nRUNTIME_MODE=%s\nEXTERNAL_WRITES=%s\nAUTOMATION_ENABLED=%s\nINBOUND_SYNC=%s\nSCHEDULER_VERIFY_EXIT=%s\nCANARY_VERIFY_EXIT=%s\nINBOUND_READINESS_EXIT=%s\n' \
            "$LIVE_SHA" "$RUNTIME_BUILD_ID" "$after_mode" "$after_external" "$after_automation" "$after_inbound" "$scheduler_code" "$canary_code" "$inbound_code" > "$BACKUP/phase-a-result.txt"
          chmod 600 "$BACKUP"/* 2>/dev/null || true
          printf 'PHASE_A_EXTERNAL_EMAIL_SENT=false\n'
          printf 'PHASE_A_RUNTIME_TRUTH_RECONCILE=PASS\n'
          REMOTE

      - name: Collect protected Phase A evidence
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p email-phase-a-evidence
          for file_name in phase-a-result.txt scheduler-verify.log canary-idempotency.log inbound-readiness.json; do
            scp -P "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ConnectionAttempts=1 \
              "$SSH_USER@$SSH_HOST:/root/sikhadenge-backups/${RUN_ID}/${file_name}" "email-phase-a-evidence/${file_name}" >/dev/null 2>&1 || true
          done
          chmod -R go-rwx email-phase-a-evidence 2>/dev/null || true

      - name: Publish Phase A summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Email Phase A — runtime truth and safety'
            echo
            grep '^PHASE_A_' email-phase-a-runtime-truth.log | sed 's/^/- `/' | sed 's/$/`/' || true
            if [[ -f email-phase-a-evidence/phase-a-result.txt ]]; then
              echo
              echo '### Protected result'
              sed 's/^/- `/' email-phase-a-evidence/phase-a-result.txt | sed 's/$/`/'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload protected Phase A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email-phase-a-runtime-truth-${{ env.RUN_ID }}
          path: |
            email-phase-a-runtime-truth.log
            email-phase-a-evidence
          if-no-files-found: error
          retention-days: 30
