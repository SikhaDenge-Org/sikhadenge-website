name: Phase17 Production Dirty Paths Readonly

on:
  push:
    branches: [phase17-stage2-governance-v15-20260913]
    paths:
      - ".github/workflows/phase17-prod-dirty-paths-readonly.yml"

permissions:
  contents: read

jobs:
  paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
      EXPECTED_LIVE_SHA: f651d0182861c191c041b36e96902f20d5a6da2b
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          for v in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_HOST_KEY; do test -n "${!v:-}"; done
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; echo SSH_PORT=22 >> "$GITHUB_ENV"; fi
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Classify V17 dependencies and mtimes read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "EXPECTED_LIVE_SHA='$EXPECTED_LIVE_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          A=/var/www/sikhadenge-whatsapp-agent/source/apps/whatsapp-agent-dashboard
          root="$(git -C "$A" rev-parse --show-toplevel)"
          test "$(git -C "$root" rev-parse HEAD)" = "$EXPECTED_LIVE_SHA"
          printf 'TRACKED_DRIFT_MTIME_BEGIN\n'
          for path in \
            apps/whatsapp-agent-dashboard/app/layout.tsx \
            apps/whatsapp-agent-dashboard/app/login-page01-left-image.css \
            apps/whatsapp-agent-dashboard/app/login/page.tsx \
            apps/whatsapp-agent-dashboard/next-env.d.ts; do
            stat -c 'path=%n mtime=%y size=%s sha256=' "$root/$path" | tr -d '\n'; sha256sum "$root/$path" | awk '{print $1}'
          done
          printf 'TRACKED_DRIFT_MTIME_END\n'

          printf 'V17_DEPENDENCY_BEGIN\n'
          for path in \
            apps/whatsapp-agent-dashboard/app/login-right-panel-v16.css \
            apps/whatsapp-agent-dashboard/public/page01-hero-desktop-v17.png \
            apps/whatsapp-agent-dashboard/public/page01-hero-tablet-v17.png \
            apps/whatsapp-agent-dashboard/public/page01-hero-ultrawide-v17.png; do
            if git -C "$root" cat-file -e "HEAD:$path" 2>/dev/null; then tracked=yes; else tracked=no; fi
            if [[ -f "$root/$path" ]]; then
              printf 'path=%s tracked_in_head=%s present=yes ' "$path" "$tracked"
              stat -c 'mtime=%y size=%s' "$root/$path" | tr '\n' ' '
              printf 'sha256='; sha256sum "$root/$path" | awk '{print $1}'
            else
              printf 'path=%s tracked_in_head=%s present=no\n' "$path" "$tracked"
            fi
          done
          printf 'V17_DEPENDENCY_END\n'

          printf 'SCOPED_UNTRACKED_BEGIN\n'
          git -C "$root" status --short --untracked-files=all -- \
            apps/whatsapp-agent-dashboard/app/login-right-panel-v16.css \
            apps/whatsapp-agent-dashboard/public/page01-hero-desktop-v17.png \
            apps/whatsapp-agent-dashboard/public/page01-hero-tablet-v17.png \
            apps/whatsapp-agent-dashboard/public/page01-hero-ultrawide-v17.png
          printf 'SCOPED_UNTRACKED_END\n'

          printf 'PM2_SUMMARY_BEGIN\n'
          pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"[]").find(x=>x.name==="sikhadenge-whatsapp-agent"); if(!p){console.log("missing");return;} console.log(`status=${p.pm2_env?.status||""} restart_time=${p.pm2_env?.restart_time??""} pm_uptime=${p.pm2_env?.pm_uptime??""}`);})'
          printf 'PM2_SUMMARY_END\n'
          REMOTE
