name: Status Claude Hero Temp 20260910
on:
  push:
    branches: [main]
    paths: ['.github/workflows/status-claude-hero-temp-20260910.yml']
permissions:
  contents: read
env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
jobs:
  status:
    runs-on: [self-hosted, Linux, X64, sikhadenge-ci]
    environment: whatsapp-agent-production
    timeout-minutes: 5
    steps:
      - shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"; echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"; read -r _ kt km _ <<< "$SSH_HOST_KEY"; test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Read-only status
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -u
          echo '=== LOCK ==='; timeout 20 sikhadenge-funnel-lockctl status || true
          echo '=== ROUTE MARKER ==='; grep -n 'SIKHADENGE_CLAUDE_HERO_V1_20260910' /etc/nginx/sites-enabled/sikhadenge.in-ssl || true
          echo '=== HERO JS ==='; ls -l /var/www/sikhadenge.in/claude-hero-message-match-v1.js 2>/dev/null || true
          code=$(curl -L -sS --max-time 15 -o /tmp/c.html -w '%{http_code}' 'https://sikhadenge.in/masterclass/claude/free?status_hero=1' || true); echo "CLAUDE_HTTP=$code"
          python3 - /tmp/c.html <<'PY'
          import sys,re,html,os
          if not os.path.exists(sys.argv[1]): raise SystemExit(0)
          s=open(sys.argv[1],encoding='utf-8',errors='ignore').read(); m=re.search(r'<h1[^>]*>(.*?)</h1>',s,re.S|re.I)
          t=html.unescape(re.sub('<[^>]+>',' ',m.group(1) if m else '')); print('SERVER_H1='+re.sub(r'\s+',' ',t).strip())
          print('HERO_JS_IN_HTML='+str('claude-hero-message-match-v1.js' in s))
          PY
          echo '=== RECENT LOCK LOG ==='; tail -40 /var/log/sikhadenge-funnel-golden-lock.log 2>/dev/null || true
          REMOTE
