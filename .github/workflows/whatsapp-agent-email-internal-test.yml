# Lifecycle E3 internal-only test marker: 2026-09-17
name: WhatsApp Agent Email Internal Test

on:
  push:
    branches:
      - release/whatsapp-instagram-agent-flow-20260731
  workflow_dispatch:
    inputs:
      deployed_sha:
        description: Optional exact production SHA assertion; leave empty to discover the certified live runtime
        required: false
        type: string

permissions:
  contents: read

jobs:
  email-internal-test:
    concurrency:
      group: whatsapp-agent-production
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[email-internal-test]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
      REQUESTED_DEPLOYED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.deployed_sha || '' }}
      TEST_RUN_ID: email-internal-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Validate trigger and production secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -n "$REQUESTED_DEPLOYED_SHA" ]]; then
            [[ "$REQUESTED_DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]]
          fi
          missing=0
          for variable_name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_HOST_KEY; do
            [[ -n "${!variable_name:-}" ]] || { echo "Missing production secret: $variable_name" >&2; missing=1; }
          done
          test "$missing" = "0"
          if [[ -z "${SSH_PORT:-}" ]]; then echo 'SSH_PORT=22' >> "$GITHUB_ENV"; fi

      - name: Configure pinned SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$key" >/dev/null

      - name: Send one guarded internal email
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "REQUESTED_DEPLOYED_SHA='$REQUESTED_DEPLOYED_SHA' RUN_ID='$TEST_RUN_ID' bash -s" <<'REMOTE' | tee email-internal-test.log
          set -Eeuo pipefail
          APP=/var/www/sikhadenge-whatsapp-agent/source/apps/whatsapp-agent-dashboard
          test "$(id -u)" = "0"
          cd "$APP"

          DEPLOYED_SHA="$(git rev-parse HEAD)"
          [[ "$DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ -n "${REQUESTED_DEPLOYED_SHA:-}" ]]; then
            test "$DEPLOYED_SHA" = "$REQUESTED_DEPLOYED_SHA"
          fi

          latest_evidence=""
          latest_mtime=0
          shopt -s nullglob
          for candidate in /root/sikhadenge-backups/engageos-github-*/post-deploy-evidence.txt; do
            candidate_mtime="$(stat -c %Y "$candidate" 2>/dev/null || printf '0')"
            if [[ "$candidate_mtime" =~ ^[0-9]+$ ]] && (( candidate_mtime > latest_mtime )); then
              latest_mtime="$candidate_mtime"
              latest_evidence="$candidate"
            fi
          done
          shopt -u nullglob
          test -n "$latest_evidence"

          read_evidence_value() {
            local key="$1"
            awk -F= -v key="$key" '$1 == key {sub(/^[^=]*=/, ""); print; exit}' "$latest_evidence"
          }

          CERTIFIED_RELEASE_SHA="$(read_evidence_value RELEASE_SHA)"
          CERTIFIED_BUILD_ID="$(read_evidence_value BUILD_ID)"
          CERTIFIED_PM2_STATUS="$(read_evidence_value PM2_STATUS)"
          CERTIFIED_PM2_CWD="$(read_evidence_value PM2_CWD)"
          LIVE_BUILD_ID="$(cat "$APP/.next/BUILD_ID")"

          test "$CERTIFIED_RELEASE_SHA" = "$DEPLOYED_SHA"
          test -n "$CERTIFIED_BUILD_ID"
          test "$CERTIFIED_PM2_STATUS" = "online"
          test "$LIVE_BUILD_ID" = "$CERTIFIED_BUILD_ID"

          PM2_SNAPSHOT="$(mktemp)"
          trap 'rm -f "$PM2_SNAPSHOT"' EXIT
          pm2 jlist > "$PM2_SNAPSHOT"
          IFS='|' read -r LIVE_PM2_PID LIVE_PM2_STATUS LIVE_PM2_CWD < <(
            node - "$PM2_SNAPSHOT" <<'NODE'
          const fs=require('node:fs');
          const rows=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const p=rows.find(x=>x.name==='sikhadenge-whatsapp-agent');
          process.stdout.write(p ? [p.pid||'',p.pm2_env?.status||'',p.pm2_env?.pm_cwd||''].join('|') + '\n' : '||\n');
          NODE
          )

          test -n "$LIVE_PM2_PID"
          test "$LIVE_PM2_STATUS" = "online"
          test "$LIVE_PM2_CWD" = "$CERTIFIED_PM2_CWD"
          test "$(cat "$LIVE_PM2_CWD/.next/BUILD_ID")" = "$CERTIFIED_BUILD_ID"

          printf 'DISCOVERED_DEPLOYED_SHA=%s\n' "$DEPLOYED_SHA"
          printf 'CERTIFIED_BUILD_ID=%s\n' "$CERTIFIED_BUILD_ID"
          printf 'LIVE_PM2_PID=%s\n' "$LIVE_PM2_PID"

          APPLY=1 LIVE_APP="$APP" ENV_FILE="$APP/.env" EXPECTED_RELEASE_SHA="$DEPLOYED_SHA" RUN_ID="$RUN_ID" \
            EMAIL_INTERNAL_TEST_RECIPIENT="ankitsingh@sikhadenge.in" EMAIL_INTERNAL_TEST_SENDER="support@sikhadenge.in" \
            bash scripts/email-automation-production-internal-test.sh
          REMOTE

      - name: Reconcile post-test runtime to verified DRY_RUN
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "REQUESTED_DEPLOYED_SHA='$REQUESTED_DEPLOYED_SHA' RESTORE_RUN_ID='${TEST_RUN_ID}-restore' bash -s" <<'REMOTE' | tee email-internal-post-test-restore.log
          set -Eeuo pipefail
          APP=/var/www/sikhadenge-whatsapp-agent/source/apps/whatsapp-agent-dashboard
          test "$(id -u)" = "0"
          cd "$APP"

          DEPLOYED_SHA="$(git rev-parse HEAD)"
          [[ "$DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ -n "${REQUESTED_DEPLOYED_SHA:-}" ]]; then
            test "$DEPLOYED_SHA" = "$REQUESTED_DEPLOYED_SHA"
          fi

          APPLY=1 bash scripts/email-automation-scheduler-deactivate.sh
          APPLY=1 \
          LIVE_APP="$APP" \
          ENV_FILE="$APP/.env" \
          EXPECTED_RELEASE_SHA="$DEPLOYED_SHA" \
          RUN_ID="$RESTORE_RUN_ID" \
          MAX_FAILED_EVENTS=0 \
          bash scripts/email-automation-production-dryrun-activate.sh

          EXPECTED_RELEASE_SHA="$DEPLOYED_SHA" \
          ENV_FILE="$APP/.env" \
          MAX_FAILED_EVENTS=0 \
          bash scripts/email-automation-scheduler-verify.sh

          printf 'POST_TEST_DRYRUN_RECONCILE=PASS\n'
          printf 'RUNTIME_MODE=DRY_RUN\n'
          printf 'EXTERNAL_WRITES=false\n'
          printf 'SCHEDULER_ACTIVE=true\n'
          REMOTE

      - name: Collect protected test evidence
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p email-internal-test-evidence
          for file_name in internal-test-result.txt send.log; do
            scp -P "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ConnectionAttempts=1 \
              "$SSH_USER@$SSH_HOST:/root/sikhadenge-backups/${TEST_RUN_ID}/${file_name}" "email-internal-test-evidence/${file_name}" >/dev/null 2>&1 || true
          done
          chmod -R go-rwx email-internal-test-evidence 2>/dev/null || true

      - name: Upload protected test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-agent-email-internal-${{ env.TEST_RUN_ID }}
          path: |
            email-internal-test.log
            email-internal-post-test-restore.log
            email-internal-test-evidence
          if-no-files-found: error
          retention-days: 14
