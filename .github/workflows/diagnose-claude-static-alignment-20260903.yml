name: Diagnose Claude Static Alignment 20260903

on:
  push:
    paths:
      - .github/workflows/diagnose-claude-static-alignment-20260903.yml

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, sikhadenge-ci]
    timeout-minutes: 10
    environment: whatsapp-agent-production
    steps:
      - name: Inspect public client bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsS --max-time 30 'https://sikhadenge.in/masterclass/claude/free?v=static-align-20260903' -o public.html
          python3 - <<'PY' > bundle-url.txt
          from pathlib import Path
          import re
          s=Path('public.html').read_text(errors='replace')
          xs=re.findall(r'<script[^>]+src="([^"]+)"',s)
          for u in xs:
              if '/_next/static/chunks/pages/masterclass/claude/free-' in u:
                  print(u)
                  break
          PY
          BUNDLE="$(cat bundle-url.txt)"
          test -n "$BUNDLE"
          curl -fsS --max-time 30 "https://sikhadenge.in$BUNDLE" -o public-bundle.js
          echo "PUBLIC_BUNDLE_URL=$BUNDLE"
          sha256sum public-bundle.js
          wc -c public-bundle.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('public-bundle.js').read_text(errors='replace')
          for n in ['Master 25+ AI Tools','Build deeper work with','Why join this course','Specially designed for working professionals','CURRENT BATCH ADVANTAGE','Move from quick answers to structured, reviewable work','Claude AI']:
              print('PUBLIC_BUNDLE_HAS',repr(n),n in s)
          PY

      - name: Inspect production build and static routing read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${SSH_PORT:-}" ]] || SSH_PORT=22
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"; read -r _ kt km _ <<< "$SSH_HOST_KEY"; test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          BUNDLE="$(cat bundle-url.txt)"
          ssh -p "$SSH_PORT" -i "$KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" "BUNDLE='$BUNDLE' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          ROOT='/var/www/sikhadenge.in/releases/production-ai-video-icons-hotfix-20260829-091916'
          echo '=== BUILD ==='
          echo "ROOT=$ROOT"
          echo -n 'BUILD_ID='; cat "$ROOT/.next/BUILD_ID" || true
          echo '=== PAGE MANIFEST ==='
          python3 - "$ROOT" <<'PY'
          import json,sys
          from pathlib import Path
          r=Path(sys.argv[1])
          for f in [r/'.next/server/pages-manifest.json',r/'.next/build-manifest.json']:
              print('FILE',f)
              if f.exists():
                  d=json.loads(f.read_text())
                  if 'pages-manifest' in f.name:
                      print('CLAUDE_PAGE',d.get('/masterclass/claude/free'))
                  else:
                      print('CLAUDE_ASSETS',d.get('pages',{}).get('/masterclass/claude/free'))
          PY
          echo '=== LOCAL PAGE CHUNKS ==='
          find "$ROOT/.next/static/chunks/pages/masterclass/claude" -maxdepth 1 -type f -name 'free-*.js' -printf '%p %s bytes\n' 2>/dev/null || true
          find "$ROOT/.next/static/chunks/pages/masterclass/claude" -maxdepth 1 -type f -name 'free-*.js' -exec sha256sum {} \; 2>/dev/null || true
          echo '=== LOCAL BUNDLE TERMS ==='
          F="$(find "$ROOT/.next/static/chunks/pages/masterclass/claude" -maxdepth 1 -type f -name 'free-*.js' | head -1 || true)"
          if [[ -n "$F" ]]; then
            python3 - "$F" <<'PY'
          from pathlib import Path
          import sys
          s=Path(sys.argv[1]).read_text(errors='replace')
          for n in ['Master 25+ AI Tools','Build deeper work with','Why join this course','Specially designed for working professionals','CURRENT BATCH ADVANTAGE','Move from quick answers to structured, reviewable work','Claude AI']:
              print('LOCAL_BUNDLE_HAS',repr(n),n in s)
          PY
          fi
          echo '=== SOURCE TERMS ==='
          SRC="$ROOT/pages/masterclass/claude/free.tsx"
          if [[ -f "$SRC" ]]; then
            grep -nE 'Master 25\+ AI Tools|Build deeper work with|Why join this course|Specially designed for working professionals|CURRENT BATCH ADVANTAGE|Move from quick answers' "$SRC" || true
          else
            echo SOURCE_NOT_PRESENT
          fi
          echo '=== NGINX NEXT STATIC REFERENCES ==='
          grep -RniE 'location .*_next|/_next/static|alias .*\.next|proxy_pass.*3930|proxy_pass.*3955' /etc/nginx/sites-enabled/sikhadenge.in-ssl | head -120 || true
          echo '=== PUBLIC BUNDLE SERVER-SIDE ==='
          curl -fsS --max-time 20 "https://sikhadenge.in$BUNDLE" -o /tmp/public-claude-bundle.js
          sha256sum /tmp/public-claude-bundle.js
          echo '=== 3930 DIRECT HTML BUILD ID ==='
          curl -fsS --max-time 20 -H 'Host: sikhadenge.in' 'http://127.0.0.1:3930/masterclass/claude/free?direct=1' -o /tmp/direct3930.html
          python3 - <<'PY'
          from pathlib import Path
          import re,json,html
          s=Path('/tmp/direct3930.html').read_text(errors='replace')
          m=re.search(r'<script id="__NEXT_DATA__" type="application/json">(.*?)</script>',s,re.S)
          print('DIRECT_BYTES',len(s))
          if m:
              d=json.loads(html.unescape(m.group(1)))
              print('DIRECT_BUILD_ID',d.get('buildId'),'DIRECT_PAGE',d.get('page'))
          PY
          REMOTE

      - name: Upload public evidence
        uses: actions/upload-artifact@v4
        with:
          name: claude-static-alignment-20260903
          path: |
            public.html
            public-bundle.js
            bundle-url.txt
          retention-days: 1
