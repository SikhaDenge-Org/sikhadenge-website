name: WhatsApp Agent Phase17 Current Operator Evidence Audit

on:
  workflow_dispatch:
    inputs:
      expected_live_sha:
        description: Exact production release SHA to audit
        required: true
        type: string

permissions:
  contents: read

jobs:
  audit-current-operator-evidence:
    runs-on: [self-hosted, Linux, X64, sikhadenge-ci]
    timeout-minutes: 12
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
      EXPECTED_LIVE_SHA: ${{ inputs.expected_live_sha }}
      WORKSPACE_ID: engagews_default

    steps:
      - name: Validate exact SHA input
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$EXPECTED_LIVE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Configure pinned production SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          for v in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_HOST_KEY; do test -n "${!v:-}"; done
          if [[ -z "${SSH_PORT:-}" ]]; then echo SSH_PORT=22 >> "$GITHUB_ENV"; SSH_PORT=22; fi
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$key" >/dev/null

      - name: Audit exact-SHA governance evidence read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" \
            "EXPECTED_LIVE_SHA='$EXPECTED_LIVE_SHA' WORKSPACE_ID='$WORKSPACE_ID' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          A=/var/www/sikhadenge-whatsapp-agent/source/apps/whatsapp-agent-dashboard
          E="$A/.env"

          envv() {
            node - "$E" "$1" <<'NODE'
          const fs=require('node:fs'); const [file,key]=process.argv.slice(2);
          for(const raw of fs.readFileSync(file,'utf8').split(/\r?\n/)){
            let line=raw.trim(); if(!line||line.startsWith('#')) continue;
            if(line.startsWith('export ')) line=line.slice(7).trim();
            const i=line.indexOf('='); if(i<1||line.slice(0,i).trim()!==key) continue;
            let value=line.slice(i+1).trim();
            if(value.length>=2&&((value.startsWith('"')&&value.endsWith('"'))||(value.startsWith("'")&&value.endsWith("'")))) value=value.slice(1,-1);
            process.stdout.write(value); process.exit(0);
          }
          process.exit(1);
          NODE
          }

          live_sha="$(git -C "$A" rev-parse HEAD)"
          dirty="$(git -C "$A" status --porcelain --untracked-files=no | sed '/^$/d' | wc -l | tr -d ' ')"
          pm2_state="$(pm2 jlist 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"[]").find(x=>x.name==="sikhadenge-whatsapp-agent");process.stdout.write(String(p?.pm2_env?.status||"missing"))})')"
          login_http="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 https://whatsapp.sikhadenge.in/login || true)"
          printf 'LIVE_SHA=%s\nTRACKED_DIRTY_COUNT=%s\nPM2_STATE=%s\nLOGIN_HTTP=%s\n' "$live_sha" "$dirty" "$pm2_state" "$login_http"
          test "$live_sha" = "$EXPECTED_LIVE_SHA"
          test "$dirty" = "0"
          test "$pm2_state" = "online"
          test "$login_http" = "200"

          DB="$(node "$A/scripts/prisma-postgres-cli-url.mjs" "$(envv DATABASE_URL)")"
          q(){ psql "$DB" -X -v ON_ERROR_STOP=1 -Atqc "$1"; }

          state="$(psql "$DB" -X -v ON_ERROR_STOP=1 -A -F '|' -t -c "SELECT \"stage\",\"mode\",\"writePolicy\",\"externalWritesAllowed\",\"version\" FROM \"EngageControlledLaunchState\" WHERE \"workspaceId\"='${WORKSPACE_ID}'")"
          transitions="$(q "SELECT COUNT(*) FROM \"EngageControlledLaunchTransition\" WHERE \"workspaceId\"='${WORKSPACE_ID}'")"
          candidate_id="$(q "SELECT \"id\" FROM \"EngageChannelConnection\" WHERE \"workspaceId\"='${WORKSPACE_ID}' AND \"channel\"='WHATSAPP' AND \"status\"='CONNECTED' ORDER BY \"updatedAt\" DESC LIMIT 1")"
          printf 'CONTROLLED_LAUNCH_STATE=%s\nTRANSITION_COUNT=%s\nCURRENT_WHATSAPP_CANDIDATE_ID=%s\n' "$state" "$transitions" "$candidate_id"

          gate_count() {
            local action="$1" extra="${2:-}"
            q "SELECT COUNT(*) FROM \"EngageSecurityAuditEvent\" WHERE \"workspaceId\"='${WORKSPACE_ID}' AND \"action\"='${action}' AND \"outcome\"='VERIFIED' AND COALESCE(\"entityType\",'')='CONTROLLED_LAUNCH_GOVERNANCE' AND COALESCE(\"entityId\",'')='${EXPECTED_LIVE_SHA}' AND COALESCE(\"reasonCode\",'')='OPERATOR_VERIFIED_EXACT_SHA' AND COALESCE(\"actorId\",'')<>'' AND COALESCE(\"requestId\",'')<>'' AND COALESCE(\"metadata\"->>'liveSha','')='${EXPECTED_LIVE_SHA}' AND COALESCE(\"metadata\"->>'proofRef','')<>'' AND COALESCE(\"metadata\"->>'verifiedAt','')<>'' ${extra}"
          }
          machine_count() {
            local action="$1"
            q "SELECT COUNT(*) FROM \"EngageSecurityAuditEvent\" WHERE \"workspaceId\"='${WORKSPACE_ID}' AND \"action\"='${action}' AND \"outcome\"='VERIFIED' AND COALESCE(\"entityType\",'')='CONTROLLED_LAUNCH_GOVERNANCE' AND COALESCE(\"entityId\",'')='${EXPECTED_LIVE_SHA}' AND COALESCE(\"reasonCode\",'')='MACHINE_VERIFIED_EXACT_SHA' AND \"actorId\" IS NULL"
          }
          emit_gate() {
            local key="$1" count="$2"
            if [[ "$count" -gt 0 ]]; then printf '%s=PROVEN count=%s\n' "$key" "$count"; else printf '%s=UNPROVEN count=0\n' "$key"; fi
          }

          emit_gate PHASE17_CRITICAL_INCIDENT_REVIEW "$(gate_count PHASE17_CRITICAL_INCIDENT_REVIEW "AND COALESCE(\"metadata\"->>'unresolvedCriticalIncidents','')='0'")"
          emit_gate PHASE17_DUPLICATE_SEND_REVIEW "$(gate_count PHASE17_DUPLICATE_SEND_REVIEW "AND COALESCE(\"metadata\"->>'unexplainedDuplicateSends','')='0'")"
          emit_gate PHASE17_ROLLBACK_REHEARSAL "$(gate_count PHASE17_ROLLBACK_REHEARSAL "AND COALESCE(\"metadata\"->>'result','')='PASS'")"
          emit_gate PHASE17_MONITORING_ACTIVE "$(gate_count PHASE17_MONITORING_ACTIVE "AND COALESCE(\"metadata\"->>'monitoringStatus','')='ACTIVE'")"
          emit_gate PHASE17_STAGE2_SCOPE_APPROVED "$(gate_count PHASE17_STAGE2_SCOPE_APPROVED "AND COALESCE(\"metadata\"->>'candidateId','')='${candidate_id}' AND COALESCE(\"metadata\"->>'decision','')='APPROVED'")"
          emit_gate PHASE17_AUTHENTICATED_SMOKE "$(gate_count PHASE17_AUTHENTICATED_SMOKE "AND COALESCE(\"metadata\"->>'result','')='PASS' AND COALESCE(\"metadata\"->>'authenticated','')='true' AND COALESCE(\"metadata\"->>'readOnly','')='true' AND COALESCE(\"metadata\"->>'externalWritesAttempted','')='false'")"
          emit_gate PHASE17_SUPPORT_RUNBOOK_ACTIVE "$(gate_count PHASE17_SUPPORT_RUNBOOK_ACTIVE "AND COALESCE(\"metadata\"->>'runbookStatus','')='ACTIVE'")"
          emit_gate PHASE17_OBSERVATION_WINDOW_COMPLETE "$(gate_count PHASE17_OBSERVATION_WINDOW_COMPLETE "AND COALESCE(\"metadata\"->>'complete','')='true'")"
          emit_gate PHASE17_PRODUCTION_EVIDENCE_RECORDED "$(machine_count PHASE17_PRODUCTION_EVIDENCE_RECORDED)"
          emit_gate PHASE17_POLICY_VERIFIED "$(machine_count PHASE17_POLICY_VERIFIED)"

          operator_total="$(q "SELECT COUNT(DISTINCT \"action\") FROM \"EngageSecurityAuditEvent\" WHERE \"workspaceId\"='${WORKSPACE_ID}' AND \"entityId\"='${EXPECTED_LIVE_SHA}' AND \"reasonCode\"='OPERATOR_VERIFIED_EXACT_SHA' AND \"action\" IN ('PHASE17_CRITICAL_INCIDENT_REVIEW','PHASE17_DUPLICATE_SEND_REVIEW','PHASE17_ROLLBACK_REHEARSAL','PHASE17_MONITORING_ACTIVE','PHASE17_STAGE2_SCOPE_APPROVED','PHASE17_AUTHENTICATED_SMOKE','PHASE17_SUPPORT_RUNBOOK_ACTIVE','PHASE17_OBSERVATION_WINDOW_COMPLETE')")"
          printf 'OPERATOR_GATES_RECORDED=%s/8\n' "$operator_total"
          printf 'EXTERNAL_WRITE_SENT=false\n'
          printf 'PASS: PHASE17_CURRENT_OPERATOR_EVIDENCE_READONLY_AUDIT\n'
          REMOTE
