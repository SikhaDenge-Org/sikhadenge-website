name: Phase17 Production V17 Capture Readonly

on:
  push:
    branches: [phase17-stage2-governance-v15-20260913]
    paths:
      - ".github/workflows/phase17-prod-v17-capture-readonly.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
      EXPECTED_LIVE_SHA: f651d0182861c191c041b36e96902f20d5a6da2b
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          for v in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_HOST_KEY; do test -n "${!v:-}"; done
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; echo SSH_PORT=22 >> "$GITHUB_ENV"; fi
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Capture exact V17 source bundle read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p capture/apps/whatsapp-agent-dashboard/app/login capture/apps/whatsapp-agent-dashboard/public
          ssh -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "EXPECTED_LIVE_SHA='$EXPECTED_LIVE_SHA' bash -s" <<'REMOTE' > capture/manifest.txt
          set -Eeuo pipefail
          A=/var/www/sikhadenge-whatsapp-agent/source/apps/whatsapp-agent-dashboard
          root="$(git -C "$A" rev-parse --show-toplevel)"
          test "$(git -C "$root" rev-parse HEAD)" = "$EXPECTED_LIVE_SHA"
          tracked=(
            apps/whatsapp-agent-dashboard/app/layout.tsx
            apps/whatsapp-agent-dashboard/app/login-page01-left-image.css
            apps/whatsapp-agent-dashboard/app/login/page.tsx
            apps/whatsapp-agent-dashboard/next-env.d.ts
          )
          untracked=(
            apps/whatsapp-agent-dashboard/app/login-right-panel-v16.css
            apps/whatsapp-agent-dashboard/public/page01-hero-desktop-v17.png
            apps/whatsapp-agent-dashboard/public/page01-hero-tablet-v17.png
            apps/whatsapp-agent-dashboard/public/page01-hero-ultrawide-v17.png
          )
          actual="$(git -C "$root" diff HEAD --name-only --no-renames | LC_ALL=C sort)"
          expected="$(printf '%s\n' "${tracked[@]}" | LC_ALL=C sort)"
          test "$actual" = "$expected"
          for path in "${untracked[@]}"; do test -f "$root/$path"; ! git -C "$root" cat-file -e "HEAD:$path" 2>/dev/null; done
          printf 'FORMAT_VERSION=1\nLIVE_SHA=%s\n' "$EXPECTED_LIVE_SHA"
          printf 'NEXT_BUILD_ID='; cat "$A/.next/BUILD_ID"; printf '\n'
          for path in "${tracked[@]}" "${untracked[@]}"; do
            printf 'FILE path=%s size=%s sha256=%s mtime=%s tracked=%s\n' \
              "$path" "$(stat -c '%s' "$root/$path")" "$(sha256sum "$root/$path" | awk '{print $1}')" "$(stat -c '%y' "$root/$path")" \
              "$(git -C "$root" cat-file -e "HEAD:$path" 2>/dev/null && echo yes || echo no)"
          done
          printf 'TRACKED_DIFF_SHA256=%s\n' "$(git -C "$root" diff HEAD --binary -- "${tracked[@]}" | sha256sum | awk '{print $1}')"
          REMOTE
          base="${SSH_USER}@${SSH_HOST}:/var/www/sikhadenge-whatsapp-agent/source"
          scp -q -P "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$base/apps/whatsapp-agent-dashboard/app/layout.tsx" capture/apps/whatsapp-agent-dashboard/app/layout.tsx
          scp -q -P "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$base/apps/whatsapp-agent-dashboard/app/login-page01-left-image.css" capture/apps/whatsapp-agent-dashboard/app/login-page01-left-image.css
          scp -q -P "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$base/apps/whatsapp-agent-dashboard/app/login/page.tsx" capture/apps/whatsapp-agent-dashboard/app/login/page.tsx
          scp -q -P "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$base/apps/whatsapp-agent-dashboard/next-env.d.ts" capture/apps/whatsapp-agent-dashboard/next-env.d.ts
          scp -q -P "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$base/apps/whatsapp-agent-dashboard/app/login-right-panel-v16.css" capture/apps/whatsapp-agent-dashboard/app/login-right-panel-v16.css
          for f in page01-hero-desktop-v17.png page01-hero-tablet-v17.png page01-hero-ultrawide-v17.png; do
            scp -q -P "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$base/apps/whatsapp-agent-dashboard/public/$f" "capture/apps/whatsapp-agent-dashboard/public/$f"
          done
          (cd capture && sha256sum apps/whatsapp-agent-dashboard/app/layout.tsx apps/whatsapp-agent-dashboard/app/login-page01-left-image.css apps/whatsapp-agent-dashboard/app/login/page.tsx apps/whatsapp-agent-dashboard/next-env.d.ts apps/whatsapp-agent-dashboard/app/login-right-panel-v16.css apps/whatsapp-agent-dashboard/public/page01-hero-desktop-v17.png apps/whatsapp-agent-dashboard/public/page01-hero-tablet-v17.png apps/whatsapp-agent-dashboard/public/page01-hero-ultrawide-v17.png) > capture/local-sha256.txt
      - name: Upload exact V17 capture
        uses: actions/upload-artifact@v4
        with:
          name: phase17-production-v17-exact-capture
          path: capture
          if-no-files-found: error
          retention-days: 14
