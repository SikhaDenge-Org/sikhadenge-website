name: SA2 Dashboard Recovery Finalize 20260913

on:
  push:
    branches:
      - ops/sa2-dashboard-runtime-preflight-20260913
    paths:
      - '.github/workflows/sa2-dashboard-emergency-state-audit-20260913.yml'

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: whatsapp-agent-production
    timeout-minutes: 8
    steps:
      - name: Configure pinned production SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"; echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"; read -r _ kt km _ <<< "$SSH_HOST_KEY"; test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"

      - name: Verify recovered dashboard and persist PM2 state
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          APP='sikhadenge-dashboard-revenue'
          WA='sikhadenge-whatsapp-agent'
          OLD='/opt/sikhadenge-dashboard-releases/sa1-20260911-221949-d60ab5a4'
          EXPECTED_MIGRATION='20260913093357_sa2_whatsapp_conversation_identity_consent'

          read_pm2(){ pm2 jlist | node -e 'let b="";process.stdin.on("data",d=>b+=d);process.stdin.on("end",()=>{const p=JSON.parse(b).find(x=>x.name===process.argv[1]);if(!p)process.exit(3);const e=p.pm2_env||{};console.log([p.pid,e.status,e.pm_cwd,e.restart_time,e.unstable_restarts].join("|"))})' "$1"; }
          APP_STATE="$(read_pm2 "$APP")"; WA_STATE="$(read_pm2 "$WA")"
          IFS='|' read -r APP_PID APP_STATUS APP_CWD APP_RESTART APP_UNSTABLE <<< "$APP_STATE"
          IFS='|' read -r WA_PID WA_STATUS WA_CWD WA_RESTART WA_UNSTABLE <<< "$WA_STATE"
          echo "DASHBOARD_STATE=$APP_STATE"
          echo "WA_STATE=${WA_PID}|${WA_STATUS}|${WA_RESTART}|${WA_UNSTABLE}"
          test "$APP_STATUS" = online; test "$APP_CWD" = "$OLD"; test "$APP_RESTART" = 0; test "$APP_UNSTABLE" = 0
          test "$WA_PID" = 2568802; test "$WA_STATUS" = online; test "$WA_RESTART" = 47; test "$WA_UNSTABLE" = 0
          ROOT="$(curl --max-time 5 -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3400/)"; WA_HTTP="$(curl --max-time 5 -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/)"
          echo "DASHBOARD_HTTP=$ROOT"; echo "WA_HTTP=$WA_HTTP"
          case "$ROOT" in 2*|3*) ;; *) exit 10;; esac
          test "$WA_HTTP" = 307

          node - "$APP_PID" "$OLD" "$EXPECTED_MIGRATION" <<'NODE'
          const fs=require('fs');const {spawnSync}=require('child_process');const {createRequire}=require('module');
          const [pid,cwd,migration]=process.argv.slice(2);
          const env=Object.fromEntries(fs.readFileSync(`/proc/${pid}/environ`).toString().split('\0').filter(Boolean).map(s=>{const i=s.indexOf('=');return [s.slice(0,i),s.slice(i+1)]}));
          const enabled=v=>String(v||'').trim().toLowerCase()==='true';const bad=['SALES_AI_ENABLED','WHATSAPP_SA2_DOMAIN_PROCESSING_ENABLED','WHATSAPP_SA2_PRIVACY_ACTIONS_ENABLED','WHATSAPP_OUTBOUND_ENABLED','WHATSAPP_AI_REPLY_ENABLED','WHATSAPP_FOLLOWUP_ENABLED','WHATSAPP_PAYMENT_LINK_ACTION_ENABLED'];
          if(!enabled(env.WHATSAPP_INGEST_ENABLED)||bad.some(k=>enabled(env[k])))throw new Error('unsafe_runtime_flags');
          console.log('RECOVERED_FLAGS_SAFE=YES');
          const r=spawnSync('npm',['run','whatsapp:runtime-preflight'],{cwd,env:{...env,PWD:cwd},stdio:'inherit'});if(r.status!==0)throw new Error('runtime_preflight_failed_'+r.status);console.log('RUNTIME_PREFLIGHT_WITH_PROCESS_ENV=PASS');
          Object.assign(process.env,env);const req=createRequire(cwd+'/package.json');const {PrismaClient}=req('@prisma/client');const p=new PrismaClient();
          (async()=>{const t=await p.$queryRawUnsafe("SELECT count(*)::int AS count FROM pg_tables WHERE schemaname='public'");const s=await p.$queryRawUnsafe("SELECT count(*)::int AS count FROM pg_tables WHERE schemaname='public' AND tablename IN ('WhatsAppParticipant','WhatsAppConversation','WhatsAppConversationMessage','IdentityLinkDecision','WhatsAppConsent','WhatsAppSuppression','WhatsAppPrivacyEvent')");const i=await p.$queryRawUnsafe('SELECT count(*)::int AS count FROM "_prisma_migrations" WHERE finished_at IS NULL AND rolled_back_at IS NULL');const g=await p.$queryRawUnsafe('SELECT finished_at, rolled_back_at FROM "_prisma_migrations" WHERE migration_name=$1',migration);const x=await p.$queryRawUnsafe("SELECT count(*)::int AS count FROM pg_stat_activity WHERE pid<>pg_backend_pid() AND xact_start IS NOT NULL AND now()-xact_start > interval '5 minutes'");const ok=t[0].count===139&&s[0].count===7&&i[0].count===0&&x[0].count===0&&g.length===1&&g[0].finished_at&&!g[0].rolled_back_at;console.log(`DB_GATE=${ok?'PASS':'FAIL'}|PUBLIC=${t[0].count}|SA2=${s[0].count}|INCOMPLETE=${i[0].count}|LONG_TX=${x[0].count}`);if(!ok)process.exitCode=2})().finally(()=>p.$disconnect());
          NODE

          test "$(read_pm2 "$WA")" = "$WA_STATE"
          pm2 save >/dev/null
          echo 'PM2_SAVE=PASS'
          echo 'DASHBOARD_RECOVERY_EXIT_GATE=PASS'
          echo 'WA_UNCHANGED=PASS'
          REMOTE
