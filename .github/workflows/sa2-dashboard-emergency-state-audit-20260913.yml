name: SA2 Dashboard Emergency State Audit 20260913

on:
  push:
    branches:
      - ops/sa2-dashboard-runtime-preflight-20260913
    paths:
      - '.github/workflows/sa2-dashboard-emergency-state-audit-20260913.yml'

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: whatsapp-agent-production
    timeout-minutes: 10
    steps:
      - name: Configure pinned production SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"
          fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read-only production dashboard emergency audit
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -u
          APP='sikhadenge-dashboard-revenue'
          WA='sikhadenge-whatsapp-agent'
          OLD='/opt/sikhadenge-dashboard-releases/sa1-20260911-221949-d60ab5a4'
          RELEASES='/opt/sikhadenge-dashboard-releases'

          echo '=== READ ONLY EMERGENCY AUDIT ==='
          date -u '+UTC=%Y-%m-%dT%H:%M:%SZ'
          echo 'MUTATION=NONE'

          echo '--- PM2 TARGET SNAPSHOT ---'
          pm2 jlist | node -e '
            let b="";process.stdin.on("data",d=>b+=d);process.stdin.on("end",()=>{
              for(const p of JSON.parse(b)) if(["sikhadenge-dashboard-revenue","sikhadenge-whatsapp-agent"].includes(p.name)) {
                const e=p.pm2_env||{};
                console.log(JSON.stringify({name:p.name,pid:p.pid,status:e.status,cwd:e.pm_cwd,restart:e.restart_time,unstable:e.unstable_restarts,args:e.args,node_env:e.NODE_ENV,pm_exec_path:e.pm_exec_path,exec_interpreter:e.exec_interpreter,exec_mode:e.exec_mode}));
              }
            });'

          echo '--- SAVED PM2 DUMP CONTRACT ---'
          DUMP="$HOME/.pm2/dump.pm2"
          if [ -f "$DUMP" ]; then
            node - "$DUMP" "$APP" <<'NODE'
          const fs=require('fs');
          const [f,n]=process.argv.slice(2);
          const p=JSON.parse(fs.readFileSync(f,'utf8')).find(x=>x.name===n);
          if(!p){console.log('DUMP_ENTRY=NOT_FOUND');process.exit(0)}
          console.log(JSON.stringify({name:p.name,cwd:p.pm_cwd,pm_exec_path:p.pm_exec_path,exec_interpreter:p.exec_interpreter,args:p.args,script:p.script,exec_mode:p.exec_mode,node_args:p.node_args,namespace:p.namespace},null,2));
          NODE
          else echo 'DUMP_FILE=MISSING'; fi

          echo '--- SOCKETS ---'
          ss -ltnp 2>/dev/null | grep -E ':(3400|3100)\b' || true
          echo "HTTP_3400_ROOT=$(curl --max-time 5 -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3400/ 2>/dev/null || true)"
          echo "HTTP_3100_ROOT=$(curl --max-time 5 -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/ 2>/dev/null || true)"

          echo '--- RELEASES ---'
          test -d "$OLD" && echo "OLD_RELEASE_EXISTS=YES" || echo "OLD_RELEASE_EXISTS=NO"
          node -e 'const p=require(process.argv[1]); console.log("START_SCRIPT="+(p.scripts?.start||""))' "$OLD/package.json" 2>/dev/null || true
          find "$RELEASES" -maxdepth 1 -mindepth 1 -type d -name 'sa2-*' -printf '%f\n' 2>/dev/null | sort | tail -n 5 | sed 's/^/SA2_RELEASE=/' || true
          for d in "$RELEASES"/sa2-*; do
            [ -d "$d" ] || continue
            if [ -f "$d/.release-sha" ]; then printf 'SA2_RELEASE_SHA=%s|' "$(basename "$d")"; cat "$d/.release-sha"; fi
          done

          echo '--- DASHBOARD PM2 LOG TAIL ---'
          for f in "$HOME/.pm2/logs/${APP}-error.log" "$HOME/.pm2/logs/${APP}-out.log"; do
            echo "LOG_FILE=$(basename "$f")"
            if [ -f "$f" ]; then tail -n 80 "$f" | sed -E 's#(postgres(ql)?://)[^[:space:]]+#\1[REDACTED]#g; s#(DATABASE_URL=)[^[:space:]]+#\1[REDACTED]#g; s#(TOKEN|SECRET|PASSWORD|KEY)=([^[:space:]]+)#\1=[REDACTED]#g'; else echo 'MISSING'; fi
          done

          echo '--- SOURCE REPO READ ONLY ---'
          git -C /opt/sikhadenge-dashboard rev-parse HEAD 2>/dev/null | sed 's/^/SOURCE_HEAD=/' || true
          git -C /opt/sikhadenge-dashboard ls-remote origin refs/heads/main 2>/dev/null | awk '{print "REMOTE_MAIN=" $1}' || true
          git -C /opt/sikhadenge-dashboard status --porcelain=v1 --untracked-files=no 2>/dev/null | sha256sum | awk '{print "SOURCE_TRACKED_STATUS_HASH=" $1}' || true
          echo 'AUDIT_COMPLETE=YES'
          REMOTE
