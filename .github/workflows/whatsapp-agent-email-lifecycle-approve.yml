name: WhatsApp Agent Email Lifecycle Approval

on:
  push:
    branches:
      - release/whatsapp-instagram-agent-flow-20260731
  workflow_dispatch:
    inputs:
      deployed_sha:
        description: Exact production SHA to audit or operate against
        required: true
        type: string
      activate:
        description: Activate validated lifecycle flows instead of approval-only
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  approve-email-lifecycle:
    concurrency:
      group: whatsapp-agent-production
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[email-lifecycle-approve]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
      DEPLOYED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.deployed_sha || github.event.before }}
      APPROVAL_RUN_ID: email-lifecycle-approval-${{ github.run_id }}-${{ github.run_attempt }}
      ACTIVATE: ${{ github.event_name == 'workflow_dispatch' && inputs.activate || false }}
    steps:
      - name: Validate deployed SHA and production secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]]
          missing=0
          for variable_name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_HOST_KEY; do
            [[ -n "${!variable_name:-}" ]] || { echo "Missing production secret: $variable_name" >&2; missing=1; }
          done
          test "$missing" = "0"
          if [[ -z "${SSH_PORT:-}" ]]; then echo 'SSH_PORT=22' >> "$GITHUB_ENV"; fi

      - name: Configure pinned SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$key" >/dev/null
      - name: Approve reviewed lifecycle templates and pin draft flows
        if: env.ACTIVATE != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "DEPLOYED_SHA='$DEPLOYED_SHA' RUN_ID='$APPROVAL_RUN_ID' bash -s" <<'REMOTE' | tee email-lifecycle-approval.log
          set -Eeuo pipefail
          APP=/var/www/sikhadenge-whatsapp-agent/source/apps/whatsapp-agent-dashboard
          BACKUP_DIR="/root/sikhadenge-backups/${RUN_ID}"
          test "$(id -u)" = "0"
          cd "$APP"
          test "$(git rev-parse HEAD)" = "$DEPLOYED_SHA"
          install -d -m 700 "$BACKUP_DIR"
          set -a
          source "$APP/.env"
          set +a
          npx tsx scripts/email-lifecycle-approve.ts | tee "$BACKUP_DIR/result.log"
          grep -q '^EMAIL_LIFECYCLE_APPROVAL=PASS$' "$BACKUP_DIR/result.log"
          grep -q '"approvedTemplates":5' "$BACKUP_DIR/result.log"
          grep -q '"draftFlows":5' "$BACKUP_DIR/result.log"
          grep -q '"activated":false' "$BACKUP_DIR/result.log"
          printf 'PASS: EMAIL_LIFECYCLE_REVIEWED_TEMPLATES_APPROVED_FLOWS_STAY_DRAFT\n'
          REMOTE


      - name: Activate validated lifecycle flows under DRY_RUN guard
        if: env.ACTIVATE == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST"             "DEPLOYED_SHA='$DEPLOYED_SHA' RUN_ID='$APPROVAL_RUN_ID' bash -s" <<'REMOTE' | tee email-lifecycle-activation.log
          set -Eeuo pipefail
          APP=/var/www/sikhadenge-whatsapp-agent/source/apps/whatsapp-agent-dashboard
          BACKUP_DIR="/root/sikhadenge-backups/${RUN_ID}"
          test "$(id -u)" = "0"
          cd "$APP"
          test "$(git rev-parse HEAD)" = "$DEPLOYED_SHA"
          install -d -m 700 "$BACKUP_DIR"
          set -a
          source "$APP/.env"
          set +a
          test "${EMAIL_RUNTIME_MODE:-}" = "DRY_RUN"
          test "${EMAIL_RUNTIME_ENABLED:-false}" = "true"
          test "${EMAIL_AUTOMATION_ENABLED:-false}" = "true"
          test "${EMAIL_EXTERNAL_WRITES_ENABLED:-false}" != "true"
          npx tsx scripts/email-lifecycle-activate.ts | tee "$BACKUP_DIR/result.log"
          grep -q '^EMAIL_LIFECYCLE_ACTIVATION=PASS$' "$BACKUP_DIR/result.log"
          grep -q '"activeFlows":5' "$BACKUP_DIR/result.log"
          grep -q '"externalRequestSent":false' "$BACKUP_DIR/result.log"
          printf 'PASS: EMAIL_LIFECYCLE_ACTIVE_WITH_DRY_RUN_EXTERNAL_WRITE_GUARD
'
          REMOTE

      - name: Collect protected approval evidence
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p email-lifecycle-approval-evidence
          scp -P "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ConnectionAttempts=1 \
            "$SSH_USER@$SSH_HOST:/root/sikhadenge-backups/${APPROVAL_RUN_ID}/result.log" email-lifecycle-approval-evidence/result.log >/dev/null 2>&1 || true
          chmod -R go-rwx email-lifecycle-approval-evidence 2>/dev/null || true

      - name: Upload protected approval evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-agent-email-lifecycle-approval-${{ env.APPROVAL_RUN_ID }}
          path: |
            email-lifecycle-approval.log
            email-lifecycle-activation.log
            email-lifecycle-approval-evidence
          if-no-files-found: error
          retention-days: 14
