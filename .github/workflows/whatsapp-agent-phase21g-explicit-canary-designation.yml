name: WhatsApp Phase21G Explicit Canary Designation

on:
  workflow_dispatch:
    inputs:
      expected_live_sha:
        description: Exact protected WhatsApp release SHA currently deployed
        required: true
        type: string
      canary_wa_id:
        description: Exact internal/test WhatsApp waId to designate as canary
        required: true
        type: string
      confirmation:
        description: Type DESIGNATE_INTERNAL_CANARY
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  designate:
    concurrency:
      group: whatsapp-agent-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
      EXPECTED_LIVE_SHA: ${{ inputs.expected_live_sha }}
      RELEASE_BRANCH: release/whatsapp-instagram-agent-flow-20260731
      PHASE21G_CANARY_WA_ID: ${{ inputs.canary_wa_id }}
      PHASE21G_VERIFIED_CANARY_WA_ID: ${{ secrets.WHATSAPP_INTERNAL_CANARY_WA_ID }}
      PHASE21G_CONFIRM: ${{ inputs.confirmation }}

    steps:
      - name: Validate exact SHA and explicit inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$EXPECTED_LIVE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PHASE21G_CANARY_WA_ID" =~ ^[0-9]{6,20}$ ]]
          [[ "$PHASE21G_VERIFIED_CANARY_WA_ID" =~ ^[0-9]{6,20}$ ]]
          test "$PHASE21G_CANARY_WA_ID" = "$PHASE21G_VERIFIED_CANARY_WA_ID"
          test "$PHASE21G_CONFIRM" = "DESIGNATE_INTERNAL_CANARY"

          runs_json="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/workflows/whatsapp-agent-production-batch1.yml/runs?branch=$RELEASE_BRANCH&per_page=50")"
          deployed_sha=""

          while IFS='|' read -r run_id run_sha; do
            [[ -n "$run_id" && -n "$run_sha" ]] || continue
            jobs_json="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")"
            job_result="$(jq -r '(.jobs | map(select(.name == "production-batch-1")) | .[0].conclusion) // "not_found"' <<<"$jobs_json")"
            if [[ "$job_result" = "success" ]]; then
              deployed_sha="$run_sha"
              printf 'DEPLOYMENT_RUN_ID=%s\n' "$run_id"
              printf 'DEPLOYMENT_JOB_RESULT=%s\n' "$job_result"
              break
            fi
          done < <(
            jq -r '
              .workflow_runs
              | map(select(.status == "completed"))
              | sort_by(.created_at)
              | reverse
              | .[]
              | [.id, .head_sha]
              | @tsv
            ' <<<"$runs_json" | tr '\t' '|'
          )

          test -n "$deployed_sha"
          printf 'DEPLOYED_SHA=%s\n' "$deployed_sha"
          test "$deployed_sha" = "$EXPECTED_LIVE_SHA"

      - name: Configure pinned production SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          for v in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_HOST_KEY; do test -n "${!v:-}"; done
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; printf 'SSH_PORT=22\n' >> "$GITHUB_ENV"; fi
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          if [[ "$SSH_PORT" = "22" ]]; then canonical_host="$SSH_HOST"; else canonical_host="[$SSH_HOST]:$SSH_PORT"; fi
          printf '%s %s %s\n' "$canonical_host" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Transport reviewed designation script
        shell: bash
        run: |
          set -Eeuo pipefail
          local_script="apps/whatsapp-agent-dashboard/scripts/whatsapp-phase21g-designate-internal-canary.ts"
          test -f "$local_script"
          reviewed_sha="$(sha256sum "$local_script" | awk '{print $1}')"
          remote_script="/var/www/sikhadenge-whatsapp-agent/source/apps/whatsapp-agent-dashboard/scripts/.phase22c-designate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.ts"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$local_script" "$SSH_USER@$SSH_HOST:$remote_script"
          printf 'REVIEWED_DESIGNATION_SCRIPT_SHA256=%s\n' "$reviewed_sha" >> "$GITHUB_ENV"
          printf 'REVIEWED_DESIGNATION_SCRIPT_REMOTE_PATH=%s\n' "$remote_script" >> "$GITHUB_ENV"

      - name: Designate exact internal WhatsApp canary
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" \
            "EXPECTED_LIVE_SHA='$EXPECTED_LIVE_SHA' PHASE21G_CANARY_WA_ID='$PHASE21G_CANARY_WA_ID' PHASE21G_VERIFIED_CANARY_WA_ID='$PHASE21G_VERIFIED_CANARY_WA_ID' PHASE21G_CONFIRM='$PHASE21G_CONFIRM' REVIEWED_DESIGNATION_SCRIPT_REMOTE_PATH='$REVIEWED_DESIGNATION_SCRIPT_REMOTE_PATH' REVIEWED_DESIGNATION_SCRIPT_SHA256='$REVIEWED_DESIGNATION_SCRIPT_SHA256' bash -s" <<'REMOTE' | tee phase21g-canary-designation.txt
          set -Eeuo pipefail
          APP=/var/www/sikhadenge-whatsapp-agent/source/apps/whatsapp-agent-dashboard
          ENV_FILE="$APP/.env"
          test -f "$ENV_FILE"
          [[ "$REVIEWED_DESIGNATION_SCRIPT_REMOTE_PATH" == "$APP/scripts/.phase22c-designate-"*".ts" ]]
          trap 'rm -f "$REVIEWED_DESIGNATION_SCRIPT_REMOTE_PATH"' EXIT
          test -f "$REVIEWED_DESIGNATION_SCRIPT_REMOTE_PATH"
          test "$(sha256sum "$REVIEWED_DESIGNATION_SCRIPT_REMOTE_PATH" | awk '{print $1}')" = "$REVIEWED_DESIGNATION_SCRIPT_SHA256"
          printf 'REVIEWED_DESIGNATION_SCRIPT_VERIFIED=true\n'
          test "$(git -C "$APP" rev-parse HEAD)" = "$EXPECTED_LIVE_SHA"
          test "$(git -C "$APP" status --porcelain --untracked-files=no | wc -l)" -eq 0

          scheduler_json="$(pm2 jlist)"
          pm2v() {
            printf '%s' "$scheduler_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const [k]=process.argv.slice(1);const p=JSON.parse(s).find(x=>x.name==="sikhadenge-whatsapp-automation-scheduler");process.stdout.write(String(p?.pm2_env?.[k]??""))})' "$1"
          }
          test "$(pm2v AUTOMATION_RUNTIME_ENABLED)" = "false"
          test "$(pm2v AUTOMATION_ACTIONS_ENABLED)" = "false"
          test "$(pm2v WHATSAPP_AUTOMATION_OUTBOUND_DISPATCH_ENABLED)" = "false"
          test "$(pm2v WHATSAPP_OUTBOUND_MODE)" = "disabled"
          test "$(pm2v WHATSAPP_OUTBOUND_KILL_SWITCH)" = "on"

          export DATABASE_URL="$(node - "$ENV_FILE" <<'NODE'
          const fs=require("node:fs");
          const [file]=process.argv.slice(2);
          for(const raw of fs.readFileSync(file,"utf8").split(/\r?\n/)){
            let line=raw.trim();
            if(!line||line.startsWith("#")) continue;
            if(line.startsWith("export ")) line=line.slice(7).trim();
            const i=line.indexOf("=");
            if(i<1||line.slice(0,i).trim()!=="DATABASE_URL") continue;
            let value=line.slice(i+1).trim();
            if(value.length>=2&&((value.startsWith('"')&&value.endsWith('"'))||(value.startsWith("'")&&value.endsWith("'")))) value=value.slice(1,-1);
            process.stdout.write(value);
            process.exit(0);
          }
          process.exit(1);
          NODE
          )"
          test -n "$DATABASE_URL"

          cd "$APP"
          DB="$(node scripts/prisma-postgres-cli-url.mjs "$DATABASE_URL")"

          selected_operator_role="$(psql "$DB" -X -v ON_ERROR_STOP=1 -At -c "
            SELECT m.role
            FROM \"EngageWorkspaceMembership\" m
            JOIN \"DashboardUser\" u ON u.id = m.\"userId\"
            JOIN \"EngageWorkspace\" w ON w.id = m.\"workspaceId\"
            WHERE m.\"workspaceId\" = 'engagews_default'
              AND m.\"isActive\" = true
              AND u.\"isActive\" = true
              AND w.\"isActive\" = true
            ORDER BY m.role ASC, m.\"createdAt\" ASC
            LIMIT 1;")"
          [[ "$selected_operator_role" =~ ^(ADMIN|MANAGER|COUNSELOR)$ ]]
          printf 'SELECTED_AUDIT_OPERATOR_ROLE=%s\n' "$selected_operator_role"

          canary_contact_count="$(psql "$DB" -X -v ON_ERROR_STOP=1 -At -c "
            SELECT COUNT(DISTINCT c.id)
            FROM \"WhatsAppContact\" c
            JOIN \"EngageChannelConnection\" ec
              ON ec.id = c.\"metadata\" #>> '{engageos,whatsappIdentity,connectionId}'
             AND ec.\"workspaceId\" = 'engagews_default'
             AND ec.channel = 'WHATSAPP'
             AND ec.status IN ('CONNECTED','DEGRADED')
            WHERE c.\"waId\" = '$PHASE21G_CANARY_WA_ID'
              AND c.\"metadata\" #>> '{engageos,whatsappIdentity,workspaceId}' = 'engagews_default'
              AND EXISTS (
                SELECT 1 FROM \"WhatsAppConversation\" wc
                WHERE wc.\"contactId\" = c.id
                  AND lower(coalesce(wc.source,'whatsapp')) = 'whatsapp'
              );")"
          printf 'VERIFIED_CANARY_CONTACT_COUNT=%s\n' "$canary_contact_count"
          test "$canary_contact_count" = "1"

          PHASE21G_CANARY_WA_ID="$PHASE21G_CANARY_WA_ID" \
          PHASE21G_VERIFIED_CANARY_WA_ID="$PHASE21G_VERIFIED_CANARY_WA_ID" \
          PHASE21G_CONFIRM="$PHASE21G_CONFIRM" \
          npm exec -- tsx "$REVIEWED_DESIGNATION_SCRIPT_REMOTE_PATH"

          designation_count="$(psql "$DB" -X -v ON_ERROR_STOP=1 -At -c "
            SELECT COUNT(DISTINCT c.id)
            FROM \"WhatsAppContact\" c
            WHERE c.\"waId\" = '$PHASE21G_CANARY_WA_ID'
              AND c.\"metadata\" #>> '{engageos,canary,designated}' = 'true'
              AND c.\"metadata\" #>> '{engageos,canary,kind}' = 'INTERNAL_TEST'
              AND EXISTS (
                SELECT 1
                FROM \"WhatsAppConversation\" wc
                JOIN \"ConversationTagLink\" ctl ON ctl.\"conversationId\" = wc.id
                JOIN \"ConversationTag\" ct ON ct.id = ctl.\"tagId\"
                WHERE wc.\"contactId\" = c.id
                  AND ct.name = 'CANARY_INTERNAL_TEST'
              );")"
          printf 'DESIGNATED_CANARY_POSTCONDITION_COUNT=%s\n' "$designation_count"
          test "$designation_count" = "1"

          printf 'PM2_RUNTIME_FLAGS_MUTATED=false\n'
          printf 'EXTERNAL_WHATSAPP_WRITE_SENT=false\n'
          REMOTE

      - name: Upload designation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase21g-canary-designation-${{ inputs.expected_live_sha }}
          path: phase21g-canary-designation.txt
          if-no-files-found: error
          retention-days: 30
