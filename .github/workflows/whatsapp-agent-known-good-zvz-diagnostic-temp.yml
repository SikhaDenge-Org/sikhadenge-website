name: WhatsApp Agent Known Good ZVZ Diagnostic Temp

on:
  push:
    branches:
      - release/whatsapp-instagram-agent-flow-20260731
    paths:
      - ".github/workflows/whatsapp-agent-known-good-zvz-diagnostic-temp.yml"

permissions:
  contents: read

jobs:
  inspect-known-good:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${SSH_PORT:-}" ]]; then echo 'SSH_PORT=22' >> "$GITHUB_ENV"; SSH_PORT=22; fi
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$KEY" >/dev/null

      - name: Inspect exact known-good rollback artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          APP=/var/www/sikhadenge-whatsapp-agent/releases/reconcile-clean-28b813ca-20260915T043800Z/apps/whatsapp-agent-dashboard
          echo 'CANDIDATES_BEGIN'
          for d in \
            "$APP/.next-before-engageos-github-34950409366-1" \
            "$APP/.next-before-engageos-github-34947108888-1" \
            "$APP/.next.pre-inbox-v24-20260915-1041" \
            "$APP/.next-failed-engageos-github-34947108888-1"; do
            if test -f "$d/BUILD_ID"; then
              echo "BUILD=$(cat "$d/BUILD_ID") PATH=$d MTIME=$(stat -c '%y' "$d/BUILD_ID")"
            else
              echo "MISSING PATH=$d"
            fi
          done
          echo 'CANDIDATES_END'
          echo 'BACKUP_BUILD_IDS_BEGIN'
          find /root/sikhadenge-backups -maxdepth 3 -type f -name build-before.id -print 2>/dev/null | tail -n 80 | while read -r p; do printf 'BUILD=%s FILE=%s\n' "$(cat "$p" 2>/dev/null || true)" "$p"; done
          echo 'BACKUP_BUILD_IDS_END'
          REMOTE
