name: Phase17 Governance Audit Provenance Codemod

on:
  push:
    branches: [phase17-stage2-governance-v15-20260913]
    paths:
      - ".github/workflows/phase17-governance-audit-provenance-codemod.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase17-stage2-governance-v15-20260913
          fetch-depth: 0
      - name: Harden governance audit provenance checks
        shell: bash
        env:
          OLD_B64: ""
          NEW_B64: ""
        run: |
          set -Eeuo pipefail
          python - "$OLD_B64" "$NEW_B64" <<'PY'
          import base64, pathlib, sys
          path = pathlib.Path('.github/workflows/whatsapp-agent-phase17-stage2-governance-v15.yml')
          old = base64.b64decode(sys.argv[1]).decode()
          new = base64.b64decode(sys.argv[2]).decode()
          text = path.read_text()
          if text.count(old) != 1:
              raise SystemExit(f'expected one old governance block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          test "$(git diff --name-only)" = ".github/workflows/whatsapp-agent-phase17-stage2-governance-v15.yml"
          grep -F 'OPERATOR_VERIFIED_EXACT_SHA' .github/workflows/whatsapp-agent-phase17-stage2-governance-v15.yml >/dev/null
          grep -F 'MACHINE_VERIFIED_EXACT_SHA' .github/workflows/whatsapp-agent-phase17-stage2-governance-v15.yml >/dev/null
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/whatsapp-agent-phase17-stage2-governance-v15.yml
          git commit -m 'fix(phase17): align governance audit with evidence provenance'
          git push origin HEAD:phase17-stage2-governance-v15-20260913
