name: Phase17 1450fc02 Authorized Machine Evidence Record

on:
  push:
    branches:
      - ops/phase17-1450fc02-machine-evidence-record-authorized-20260917
    paths:
      - ".github/workflows/phase17-1450fc02-machine-evidence-record-authorized-temp.yml"

permissions:
  contents: read
  actions: read

jobs:
  record-authorized-machine-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: whatsapp-agent-production
    concurrency:
      group: whatsapp-agent-production
      cancel-in-progress: false
    env:
      EXPECTED_LIVE_SHA: 1450fc02c0b6f758b1928ac0a95f11d4cbb01743
      PRODUCTION_RUN_ID: "35220910067"
      PRODUCTION_RUN_NUMBER: "156"
      POLICY_RUN_ID: "35233083001"
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
      WORKSPACE_ID: engagews_default
    steps:
      - name: Checkout exact authorized SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_LIVE_SHA }}
          fetch-depth: 0

      - name: Verify exact GitHub production and policy provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_LIVE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"

          prod_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCTION_RUN_ID")"
          test "$(jq -r .head_sha <<<"$prod_json")" = "$EXPECTED_LIVE_SHA"
          test "$(jq -r .event <<<"$prod_json")" = "push"
          test "$(jq -r .status <<<"$prod_json")" = "completed"
          test "$(jq -r .conclusion <<<"$prod_json")" = "success"
          test "$(jq -r .run_number <<<"$prod_json")" = "$PRODUCTION_RUN_NUMBER"
          printf 'PRODUCTION_PROOF=run:%s number:%s event:push sha:%s conclusion:success\n' "$PRODUCTION_RUN_ID" "$PRODUCTION_RUN_NUMBER" "$EXPECTED_LIVE_SHA"

          policy_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$POLICY_RUN_ID")"
          test "$(jq -r .status <<<"$policy_json")" = "completed"
          test "$(jq -r .conclusion <<<"$policy_json")" = "success"
          policy_logs="$(gh run view "$POLICY_RUN_ID" --repo "$GITHUB_REPOSITORY" --log)"
          grep -F "EXPECTED_SHA=$EXPECTED_LIVE_SHA" <<<"$policy_logs" >/dev/null
          grep -F "ACTUAL_SHA=$EXPECTED_LIVE_SHA" <<<"$policy_logs" >/dev/null
          grep -F "PASS: PHASE17_1450FC02_EXACT_SHA_READONLY_VALIDATION" <<<"$policy_logs" >/dev/null
          grep -F "STATE_MUTATED=false" <<<"$policy_logs" >/dev/null
          grep -F "PRODUCTION_ACCESSED=false" <<<"$policy_logs" >/dev/null
          grep -F "EXTERNAL_WHATSAPP_WRITE_SENT=false" <<<"$policy_logs" >/dev/null
          printf 'POLICY_PROOF=run:%s exact_sha:%s conclusion:success\n' "$POLICY_RUN_ID" "$EXPECTED_LIVE_SHA"

      - name: Configure pinned production SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          for v in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_HOST_KEY; do test -n "${!v:-}"; done
          if [[ -z "${SSH_PORT:-}" ]]; then echo "SSH_PORT=22" >> "$GITHUB_ENV"; SSH_PORT=22; fi
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$key" >/dev/null

      - name: Guard, backup, dry-run, record exactly two machine proofs
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "EXPECTED_LIVE_SHA='$EXPECTED_LIVE_SHA' WORKSPACE_ID='$WORKSPACE_ID' PRODUCTION_RUN_ID='$PRODUCTION_RUN_ID' PRODUCTION_RUN_NUMBER='$PRODUCTION_RUN_NUMBER' POLICY_RUN_ID='$POLICY_RUN_ID' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          A=/var/www/sikhadenge-whatsapp-agent/source/apps/whatsapp-agent-dashboard
          E="$A/.env"

          envv() {
            node - "$E" "$1" <<'NODE'
          const fs=require('node:fs'); const [file,key]=process.argv.slice(2);
          for(const raw of fs.readFileSync(file,'utf8').split(/\r?\n/)){
            let line=raw.trim(); if(!line||line.startsWith('#')) continue;
            if(line.startsWith('export ')) line=line.slice(7).trim();
            const i=line.indexOf('='); if(i<1||line.slice(0,i).trim()!==key) continue;
            let v=line.slice(i+1).trim();
            if(v.length>=2&&((v.startsWith('"')&&v.endsWith('"'))||(v.startsWith("'")&&v.endsWith("'")))) v=v.slice(1,-1);
            process.stdout.write(v); process.exit(0);
          }
          process.exit(1);
          NODE
          }

          cd "$A"
          live_sha="$(git rev-parse HEAD)"
          dirty="$(git status --porcelain --untracked-files=no | sed '/^$/d' | wc -l | tr -d ' ')"
          printf 'LIVE_SHA=%s\nTRACKED_DIRTY_COUNT=%s\n' "$live_sha" "$dirty"
          test "$live_sha" = "$EXPECTED_LIVE_SHA"
          test "$dirty" = "0"

          outbound_mode="$(envv WHATSAPP_OUTBOUND_MODE 2>/dev/null || echo disabled)"
          cutover="$(envv WHATSAPP_CUTOVER_APPROVED 2>/dev/null || echo false)"
          live_ack="$(envv WHATSAPP_OUTBOUND_LIVE_ACK 2>/dev/null || true)"
          kill_switch="$(envv WHATSAPP_OUTBOUND_KILL_SWITCH 2>/dev/null || echo on)"
          printf 'OUTBOUND_MODE=%s\nCUTOVER_APPROVED=%s\nLIVE_ACK_SET=%s\nPROVIDER_KILL_SWITCH=%s\n' "$outbound_mode" "$cutover" "$([[ -n "$live_ack" ]] && echo true || echo false)" "$kill_switch"
          test "$outbound_mode" = "disabled"
          test "$cutover" = "false"
          test -z "$live_ack"
          test "$kill_switch" = "on"

          pm2_state="$(pm2 jlist 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"[]").find(x=>x.name==="sikhadenge-whatsapp-agent");process.stdout.write(String(p?.pm2_env?.status||"missing"))})')"
          login_http="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 https://whatsapp.sikhadenge.in/login || true)"
          printf 'PM2_STATE=%s\nLOGIN_HTTP=%s\n' "$pm2_state" "$login_http"
          test "$pm2_state" = "online"
          test "$login_http" = "200"

          database_url="$(envv DATABASE_URL)"
          test -n "$database_url"
          dburl="$(node scripts/prisma-postgres-cli-url.mjs "$database_url")"

          controlled="$(psql "$dburl" -X -v ON_ERROR_STOP=1 -Atqc "SELECT \"stage\"||'|'||\"mode\"||'|'||\"writePolicy\"||'|'||\"externalWritesAllowed\"||'|'||COALESCE(\"scope\"->>'externalWritesRequested','')||'|'||\"version\" FROM \"EngageControlledLaunchState\" WHERE \"workspaceId\"='${WORKSPACE_ID}';")"
          transitions="$(psql "$dburl" -X -Atqc "SELECT COUNT(*) FROM \"EngageControlledLaunchTransition\" WHERE \"workspaceId\"='${WORKSPACE_ID}';")"
          queued="$(psql "$dburl" -X -Atqc "SELECT COUNT(*) FROM \"WhatsAppMessage\" WHERE direction='OUTBOUND' AND status='QUEUED';")"
          approvals="$(psql "$dburl" -X -Atqc "SELECT COUNT(*) FROM \"EngageControlledLaunchOutboundApproval\" WHERE \"workspaceId\"='${WORKSPACE_ID}' AND \"consumedAt\" IS NULL AND \"revokedAt\" IS NULL AND \"expiresAt\">CURRENT_TIMESTAMP;")"
          pre_machine="$(psql "$dburl" -X -Atqc "SELECT COUNT(*) FROM \"EngageSecurityAuditEvent\" WHERE \"workspaceId\"='${WORKSPACE_ID}' AND \"entityId\"='${EXPECTED_LIVE_SHA}' AND \"reasonCode\"='MACHINE_VERIFIED_EXACT_SHA' AND outcome='VERIFIED';")"
          operator_count="$(psql "$dburl" -X -Atqc "SELECT COUNT(*) FROM \"EngageSecurityAuditEvent\" WHERE \"workspaceId\"='${WORKSPACE_ID}' AND \"entityId\"='${EXPECTED_LIVE_SHA}' AND \"reasonCode\"='OPERATOR_VERIFIED_EXACT_SHA' AND outcome='VERIFIED';")"
          printf 'CONTROLLED=%s\nTRANSITIONS=%s\nQUEUED_OUTBOUND=%s\nACTIVE_EXACT_MESSAGE_APPROVALS=%s\nPRE_MACHINE_EVIDENCE=%s\nCURRENT_SHA_OPERATOR_EVIDENCE=%s\n' "$controlled" "$transitions" "$queued" "$approvals" "$pre_machine" "$operator_count"
          test "$controlled" = "ONE_CONNECTED_ACCOUNT|SHADOW|NO_EXTERNAL_WRITES|f|false|2"
          test "$queued" = "0"
          test "$approvals" = "0"
          test "$pre_machine" = "0"

          ts="$(date -u +%Y%m%dT%H%M%SZ)"
          backup_dir=/var/backups/sikhadenge-whatsapp-agent
          mkdir -p "$backup_dir"
          backup="$backup_dir/phase17-machine-evidence-before-1450fc02-$ts.dump"
          pg_dump "$dburl" --format=custom --file="$backup"
          backup_sha="$(sha256sum "$backup" | awk '{print $1}')"
          backup_bytes="$(stat -c %s "$backup")"
          pg_restore -l "$backup" >/dev/null
          printf 'BACKUP_FILE=%s\nBACKUP_SHA256=%s\nBACKUP_BYTES=%s\nBACKUP_PG_RESTORE_LIST=PASS\n' "$(basename "$backup")" "$backup_sha" "$backup_bytes"

          test -f scripts/engageos-phase17-stage2-record-machine-evidence.ts

          NODE_ENV=production \
          DATABASE_URL="$database_url" \
          PHASE17_WORKSPACE_ID="$WORKSPACE_ID" \
          PHASE17_EXPECTED_LIVE_SHA="$EXPECTED_LIVE_SHA" \
          PHASE17_PRODUCTION_RUN_ID="$PRODUCTION_RUN_ID" \
          PHASE17_PRODUCTION_RUN_NUMBER="$PRODUCTION_RUN_NUMBER" \
          PHASE17_POLICY_RUN_ID="$POLICY_RUN_ID" \
          PHASE17_POLICY_COMMIT_SHA="$EXPECTED_LIVE_SHA" \
          npx --no-install tsx scripts/engageos-phase17-stage2-record-machine-evidence.ts
          echo 'PASS: PHASE17_MACHINE_EVIDENCE_DRY_RUN_NO_MUTATION'

          NODE_ENV=production \
          DATABASE_URL="$database_url" \
          PHASE17_WORKSPACE_ID="$WORKSPACE_ID" \
          PHASE17_EXPECTED_LIVE_SHA="$EXPECTED_LIVE_SHA" \
          PHASE17_PRODUCTION_RUN_ID="$PRODUCTION_RUN_ID" \
          PHASE17_PRODUCTION_RUN_NUMBER="$PRODUCTION_RUN_NUMBER" \
          PHASE17_POLICY_RUN_ID="$POLICY_RUN_ID" \
          PHASE17_POLICY_COMMIT_SHA="$EXPECTED_LIVE_SHA" \
          PHASE17_MACHINE_EVIDENCE_COMMIT=RECORD_MACHINE_VERIFIED_EVIDENCE \
          npx --no-install tsx scripts/engageos-phase17-stage2-record-machine-evidence.ts

          post_machine="$(psql "$dburl" -X -Atqc "SELECT COUNT(*) FROM \"EngageSecurityAuditEvent\" WHERE \"workspaceId\"='${WORKSPACE_ID}' AND \"entityId\"='${EXPECTED_LIVE_SHA}' AND \"reasonCode\"='MACHINE_VERIFIED_EXACT_SHA' AND outcome='VERIFIED';")"
          controlled_after="$(psql "$dburl" -X -Atqc "SELECT \"stage\"||'|'||\"mode\"||'|'||\"writePolicy\"||'|'||\"externalWritesAllowed\"||'|'||COALESCE(\"scope\"->>'externalWritesRequested','')||'|'||\"version\" FROM \"EngageControlledLaunchState\" WHERE \"workspaceId\"='${WORKSPACE_ID}';")"
          queued_after="$(psql "$dburl" -X -Atqc "SELECT COUNT(*) FROM \"WhatsAppMessage\" WHERE direction='OUTBOUND' AND status='QUEUED';")"
          approvals_after="$(psql "$dburl" -X -Atqc "SELECT COUNT(*) FROM \"EngageControlledLaunchOutboundApproval\" WHERE \"workspaceId\"='${WORKSPACE_ID}' AND \"consumedAt\" IS NULL AND \"revokedAt\" IS NULL AND \"expiresAt\">CURRENT_TIMESTAMP;")"
          printf 'POST_MACHINE_EVIDENCE=%s\nCONTROLLED_AFTER=%s\nQUEUED_OUTBOUND_AFTER=%s\nACTIVE_EXACT_MESSAGE_APPROVALS_AFTER=%s\n' "$post_machine" "$controlled_after" "$queued_after" "$approvals_after"
          test "$post_machine" = "2"
          test "$controlled_after" = "$controlled"
          test "$queued_after" = "0"
          test "$approvals_after" = "0"

          psql "$dburl" -X -Atqc "SELECT action||'|'||outcome||'|'||COALESCE(\"reasonCode\",'')||'|ACTOR_PRESENT='||CASE WHEN \"actorId\" IS NULL THEN 'false' ELSE 'true' END FROM \"EngageSecurityAuditEvent\" WHERE \"workspaceId\"='${WORKSPACE_ID}' AND \"entityId\"='${EXPECTED_LIVE_SHA}' AND \"reasonCode\"='MACHINE_VERIFIED_EXACT_SHA' AND outcome='VERIFIED' ORDER BY action;"

          echo 'PASS: PHASE17_1450FC02_MACHINE_EVIDENCE_EXACT_SHA_RECORDED'
          echo 'STATE_TRANSITIONED=false'
          echo 'OPERATOR_EVIDENCE_RECORDED=false'
          echo 'EXACT_MESSAGE_APPROVAL_CREATED=false'
          echo 'EXTERNAL_WHATSAPP_WRITE_SENT=false'
          REMOTE