name: Audit Registration V72 Path Fast 20260911

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-registration-v72-path-fast-20260911.yml'

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, sikhadenge-ci]
    environment: whatsapp-agent-production
    timeout-minutes: 8
    steps:
      - name: Resolve exact file path read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"; read -r _ kt km _ <<< "$SSH_HOST_KEY"; test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          ssh -p "$SSH_PORT" -i "$KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo '=== NGINX LOCATION / ALIAS ==='
          grep -Rns --include='*.conf' --include='sikhadenge.in-ssl' -E 'registration-stable-page1-v72|registration-stable-hot-v72|registration-native-suppress-v1' /etc/nginx 2>/dev/null | head -120
          echo '=== EXACT FILE CANDIDATES ==='
          find /var/www /opt -type f \( -name 'registration-stable-page1-v72.js' -o -name 'registration-stable-hot-v72.js' -o -name 'registration-native-suppress-v1-20260910.js' \) -print 2>/dev/null | head -80 | while read -r f; do
            printf '%s SHA=' "$f"; sha256sum "$f" | awk '{print $1}';
            grep -nF '3 Hours Live' "$f" | head -3 || true
            grep -nF '2 Hours Live' "$f" | head -3 || true
          done
          REMOTE
