name: Inspect Claude Hero Source Temp 20260910
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-claude-hero-source-temp-20260910.yml']
permissions:
  contents: read
env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64, sikhadenge-ci]
    environment: whatsapp-agent-production
    timeout-minutes: 6
    steps:
      - shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"; echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"; read -r _ kt km _ <<< "$SSH_HOST_KEY"; test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Locate public asset owner read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          NAME='free-802d96fd8696db68-v315r-20260830-204006-v316-20260830-204806.js'
          WANT='7646607dc0587c6e8081b92a9252f6c4982aae2da97480d44c4eff27c3a722e5'
          echo '=== ALL EXACT FILENAME COPIES ==='
          find /var/www /opt /srv -type f -name "$NAME" 2>/dev/null | while read -r f; do echo "FILE=$f SHA=$(sha256sum "$f"|awk '{print $1}') BYTES=$(wc -c <"$f")"; done
          echo '=== NGINX STATIC ROUTES ==='
          grep -RniE '_next/static|location.*_next|alias .*\.next|root .*sikhadenge' /etc/nginx/sites-enabled /etc/nginx/snippets 2>/dev/null | head -160 || true
          echo '=== PUBLIC RESPONSE HEADERS ==='
          curl -sSIL --max-time 20 "https://sikhadenge.in/_next/static/chunks/pages/masterclass/claude/$NAME?owner_audit=1" | sed -n '1,80p'
          echo '=== FIND SAME SHA AMONG EXACT-NAME COPIES ==='
          find /var/www /opt /srv -type f -name "$NAME" 2>/dev/null | while read -r f; do h=$(sha256sum "$f"|awk '{print $1}'); [[ "$h" = "$WANT" ]] && echo "SHA_OWNER=$f"; done
          REMOTE
