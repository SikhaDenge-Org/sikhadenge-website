name: Audit Community Tracking V72 Asset 20260911

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-community-tracking-v72-asset-20260911.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, sikhadenge-ci]
    environment: whatsapp-agent-production
    timeout-minutes: 6
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
    steps:
      - name: Trace exact V72 WhatsApp outbound function read only
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"; test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          ssh -p "$SSH_PORT" -i "$KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'python3 -' <<'PY'
          import re,hashlib,os
          p='/var/www/sikhadenge.in/registration-stable-v72-20260903-131023/registration-stable-hot-v72.js'
          s=open(p,encoding='utf-8',errors='ignore').read(); lines=s.splitlines()
          print('READ_ONLY=1'); print('FILE',p); print('SHA',hashlib.sha256(s.encode()).hexdigest())
          terms=[r'data-action="welcome"',r'AutoWhatsApp',r'WhatsApp',r'chat\.whatsapp\.com',r'wa\.me',r'window\.open',r'location\.(?:href|assign|replace)',r'open\s*\(',r'gtag\s*\(',r'fbq\s*\(']
          for t in terms: print('COUNT',t,len(re.findall(t,s,re.I)))
          rx=re.compile('|'.join(f'(?:{t})' for t in terms),re.I)
          hits=[i for i,l in enumerate(lines) if rx.search(l)]
          groups=[]
          for i in hits:
            a=max(0,i-14); b=min(len(lines),i+15)
            if groups and a<=groups[-1][1]+2: groups[-1]=(groups[-1][0],max(groups[-1][1],b))
            else: groups.append((a,b))
          for a,b in groups:
            print(f'--- {a+1}-{b} ---')
            for j in range(a,b): print(f'{j+1:5d}: {lines[j]}')
          print('V72_OUTBOUND_TRACE_PASS=1')
          PY
