name: Phase17 cf2b1c2 Machine Evidence Record Authorized Temp

on:
  push:
    branches:
      - ops/phase17-cf2b1c2-machine-evidence-record-authorized-20260917
    paths:
      - ".github/workflows/phase17-cf2b1c2-machine-evidence-record-authorized-temp.yml"

permissions:
  contents: read
  actions: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: whatsapp-agent-production
    concurrency:
      group: whatsapp-agent-production
      cancel-in-progress: false
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
      EXPECTED_LIVE_SHA: cf2b1c2f7bd66f8b7037e51240b1f84f8ce95484
      PRODUCTION_RUN_ID: "35214932774"
      PRODUCTION_RUN_NUMBER: "152"
      POLICY_RUN_ID: "35215488050"
      POLICY_JOB_ID: "105182848599"
      WORKSPACE_ID: engagews_default

    steps:
      - name: Verify GitHub provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          prod="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCTION_RUN_ID")"
          test "$(jq -r '.head_sha' <<<"$prod")" = "$EXPECTED_LIVE_SHA"
          test "$(jq -r '.status' <<<"$prod")" = "completed"
          test "$(jq -r '.conclusion' <<<"$prod")" = "success"
          test "$(jq -r '.run_number' <<<"$prod")" = "$PRODUCTION_RUN_NUMBER"
          printf 'PRODUCTION_PROOF=run:%s number:%s event:%s sha:%s conclusion:%s\n' \
            "$PRODUCTION_RUN_ID" "$PRODUCTION_RUN_NUMBER" "$(jq -r '.event' <<<"$prod")" "$EXPECTED_LIVE_SHA" "$(jq -r '.conclusion' <<<"$prod")"

          policy="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$POLICY_RUN_ID")"
          test "$(jq -r '.status' <<<"$policy")" = "completed"
          test "$(jq -r '.conclusion' <<<"$policy")" = "success"

          curl -fsSL -L -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$POLICY_JOB_ID/logs" > /tmp/phase17-policy.log
          grep -Fq "VALIDATED_SHA=$EXPECTED_LIVE_SHA" /tmp/phase17-policy.log
          grep -Fq "PASS: engageos phase17 stage2 governance evidence" /tmp/phase17-policy.log
          grep -Fq "PASS: engageos phase17 stage2 machine evidence policy" /tmp/phase17-policy.log
          grep -Fq "EngageOS Phase 17 controlled launch gates: PASS" /tmp/phase17-policy.log
          grep -Fq "EngageOS Phase17 production readiness policy test passed." /tmp/phase17-policy.log
          grep -Fq "EngageOS Phase17-G2 persisted outbound approval: PASS" /tmp/phase17-policy.log
          grep -Fq "EngageOS Phase17-G5 approved-flow operator governance: PASS" /tmp/phase17-policy.log
          grep -Fq "EngageOS Phase17-G6 governance observability: PASS" /tmp/phase17-policy.log
          grep -Fq "OBSERVABILITY_SMOKE_PASS=23" /tmp/phase17-policy.log
          grep -Fq "STATE_MUTATED=false" /tmp/phase17-policy.log
          grep -Fq "EXTERNAL_WHATSAPP_WRITE_SENT=false" /tmp/phase17-policy.log
          rm -f /tmp/phase17-policy.log
          printf 'POLICY_PROOF=run:%s job:%s exact_sha:%s conclusion:success\n' "$POLICY_RUN_ID" "$POLICY_JOB_ID" "$EXPECTED_LIVE_SHA"

      - name: Configure pinned production SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          for v in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_HOST_KEY; do test -n "${!v:-}"; done
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; echo "SSH_PORT=22" >> "$GITHUB_ENV"; fi
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$key" >/dev/null

      - name: Fresh guard backup record and verify exact-SHA machine evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "EXPECTED_LIVE_SHA='$EXPECTED_LIVE_SHA' PRODUCTION_RUN_ID='$PRODUCTION_RUN_ID' PRODUCTION_RUN_NUMBER='$PRODUCTION_RUN_NUMBER' POLICY_RUN_ID='$POLICY_RUN_ID' WORKSPACE_ID='$WORKSPACE_ID' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          A=/var/www/sikhadenge-whatsapp-agent/source/apps/whatsapp-agent-dashboard
          E="$A/.env"

          envv() {
            node - "$E" "$1" <<'NODE'
          const fs=require('node:fs'); const [file,key]=process.argv.slice(2);
          for(const raw of fs.readFileSync(file,'utf8').split(/\r?\n/)){
            let line=raw.trim(); if(!line||line.startsWith('#')) continue;
            if(line.startsWith('export ')) line=line.slice(7).trim();
            const i=line.indexOf('='); if(i<1||line.slice(0,i).trim()!==key) continue;
            let v=line.slice(i+1).trim();
            if(v.length>=2&&((v.startsWith('"')&&v.endsWith('"'))||(v.startsWith("'")&&v.endsWith("'")))) v=v.slice(1,-1);
            process.stdout.write(v); process.exit(0);
          }
          process.exit(1);
          NODE
          }

          cd "$A"
          live_sha="$(git rev-parse HEAD)"
          dirty="$(git status --porcelain --untracked-files=no | sed '/^$/d' | wc -l | tr -d ' ')"
          printf 'LIVE_SHA=%s\nTRACKED_DIRTY_COUNT=%s\n' "$live_sha" "$dirty"
          test "$live_sha" = "$EXPECTED_LIVE_SHA"
          test "$dirty" = "0"

          outbound="$(envv WHATSAPP_OUTBOUND_MODE 2>/dev/null || echo disabled)"
          cutover="$(envv WHATSAPP_CUTOVER_APPROVED 2>/dev/null || echo false)"
          live_ack="$(envv WHATSAPP_OUTBOUND_LIVE_ACK 2>/dev/null || true)"
          kill="$(envv WHATSAPP_OUTBOUND_KILL_SWITCH 2>/dev/null || echo on)"
          printf 'OUTBOUND_MODE=%s\nCUTOVER_APPROVED=%s\nLIVE_ACK_SET=%s\nPROVIDER_KILL_SWITCH=%s\n' \
            "$outbound" "$cutover" "$([[ -n "$live_ack" ]] && echo true || echo false)" "$kill"
          test "$outbound" = "disabled"
          test "$cutover" = "false"
          test -z "$live_ack"
          test "$kill" = "on"

          pm2_state="$(pm2 jlist 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"[]").find(x=>x.name==="sikhadenge-whatsapp-agent");process.stdout.write(String(p?.pm2_env?.status||"missing"))})')"
          login_http="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 https://whatsapp.sikhadenge.in/login || true)"
          printf 'PM2_STATE=%s\nLOGIN_HTTP=%s\n' "$pm2_state" "$login_http"
          test "$pm2_state" = "online"
          test "$login_http" = "200"

          database_url="$(envv DATABASE_URL)"
          test -n "$database_url"
          dburl="$(node scripts/prisma-postgres-cli-url.mjs "$database_url")"

          controlled="$(psql "$dburl" -X -Atqc "SELECT \"stage\"||'|'||\"mode\"||'|'||\"writePolicy\"||'|'||\"externalWritesAllowed\"||'|'||\"version\" FROM \"EngageControlledLaunchState\" WHERE \"workspaceId\"='$WORKSPACE_ID';")"
          transitions="$(psql "$dburl" -X -Atqc "SELECT COUNT(*) FROM \"EngageControlledLaunchTransition\" WHERE \"workspaceId\"='$WORKSPACE_ID';")"
          queued="$(psql "$dburl" -X -Atqc "SELECT COUNT(*) FROM \"WhatsAppMessage\" WHERE direction='OUTBOUND' AND status='QUEUED';")"
          approvals="$(psql "$dburl" -X -Atqc "SELECT COUNT(*) FROM \"EngageControlledLaunchOutboundApproval\" WHERE \"workspaceId\"='$WORKSPACE_ID' AND \"consumedAt\" IS NULL AND \"revokedAt\" IS NULL AND \"expiresAt\">CURRENT_TIMESTAMP;")"
          pre_count="$(psql "$dburl" -X -Atqc "SELECT COUNT(*) FROM \"EngageSecurityAuditEvent\" WHERE \"workspaceId\"='$WORKSPACE_ID' AND \"entityId\"='$EXPECTED_LIVE_SHA' AND \"reasonCode\"='MACHINE_VERIFIED_EXACT_SHA' AND outcome='VERIFIED' AND action IN ('PHASE17_PRODUCTION_EVIDENCE_RECORDED','PHASE17_POLICY_VERIFIED');")"
          printf 'CONTROLLED=%s\nTRANSITIONS=%s\nQUEUED_OUTBOUND=%s\nACTIVE_EXACT_MESSAGE_APPROVALS=%s\nPRE_MACHINE_EVIDENCE=%s\n' "$controlled" "$transitions" "$queued" "$approvals" "$pre_count"
          test "$controlled" = "ONE_CONNECTED_ACCOUNT|SHADOW|NO_EXTERNAL_WRITES|false|2"
          test "$transitions" = "2"
          test "$queued" = "0"
          test "$approvals" = "0"
          test "$pre_count" = "0" -o "$pre_count" = "2"

          NODE_ENV=production \
          DATABASE_URL="$database_url" \
          PHASE17_WORKSPACE_ID="$WORKSPACE_ID" \
          PHASE17_EXPECTED_LIVE_SHA="$EXPECTED_LIVE_SHA" \
          PHASE17_PRODUCTION_RUN_ID="$PRODUCTION_RUN_ID" \
          PHASE17_PRODUCTION_RUN_NUMBER="$PRODUCTION_RUN_NUMBER" \
          PHASE17_POLICY_RUN_ID="$POLICY_RUN_ID" \
          PHASE17_POLICY_COMMIT_SHA="$EXPECTED_LIVE_SHA" \
          npx --no-install tsx scripts/engageos-phase17-stage2-record-machine-evidence.ts | tee /tmp/phase17-machine-dryrun.log
          grep -Fq 'PASS: PHASE17_MACHINE_EVIDENCE_DRY_RUN_NO_MUTATION' /tmp/phase17-machine-dryrun.log
          rm -f /tmp/phase17-machine-dryrun.log

          if test "$pre_count" = "0"; then
            backup_dir=/var/backups/sikhadenge-whatsapp-agent/phase17-machine-evidence
            install -d -m 700 "$backup_dir"
            stamp="$(date -u +%Y%m%dT%H%M%SZ)"
            backup="$backup_dir/phase17-machine-evidence-before-${EXPECTED_LIVE_SHA:0:7}-$stamp.dump"
            pg_dump "$dburl" --format=custom --file="$backup"
            pg_restore -l "$backup" >/dev/null
            backup_sha="$(sha256sum "$backup" | awk '{print $1}')"
            backup_bytes="$(stat -c %s "$backup")"
            printf 'BACKUP_FILE=%s\nBACKUP_SHA256=%s\nBACKUP_BYTES=%s\nBACKUP_PG_RESTORE_LIST=PASS\n' "$(basename "$backup")" "$backup_sha" "$backup_bytes"

            test "$(git rev-parse HEAD)" = "$EXPECTED_LIVE_SHA"
            test "$(git status --porcelain --untracked-files=no | sed '/^$/d' | wc -l | tr -d ' ')" = "0"
            test "$(envv WHATSAPP_OUTBOUND_MODE 2>/dev/null || echo disabled)" = "disabled"
            test "$(envv WHATSAPP_CUTOVER_APPROVED 2>/dev/null || echo false)" = "false"
            test -z "$(envv WHATSAPP_OUTBOUND_LIVE_ACK 2>/dev/null || true)"
            test "$(envv WHATSAPP_OUTBOUND_KILL_SWITCH 2>/dev/null || echo on)" = "on"

            NODE_ENV=production \
            DATABASE_URL="$database_url" \
            PHASE17_WORKSPACE_ID="$WORKSPACE_ID" \
            PHASE17_EXPECTED_LIVE_SHA="$EXPECTED_LIVE_SHA" \
            PHASE17_PRODUCTION_RUN_ID="$PRODUCTION_RUN_ID" \
            PHASE17_PRODUCTION_RUN_NUMBER="$PRODUCTION_RUN_NUMBER" \
            PHASE17_POLICY_RUN_ID="$POLICY_RUN_ID" \
            PHASE17_POLICY_COMMIT_SHA="$EXPECTED_LIVE_SHA" \
            PHASE17_MACHINE_EVIDENCE_COMMIT=RECORD_MACHINE_VERIFIED_EVIDENCE \
            npx --no-install tsx scripts/engageos-phase17-stage2-record-machine-evidence.ts
          else
            echo 'MACHINE_EVIDENCE_ALREADY_RECORDED_IDEMPOTENT=true'
          fi

          post_count="$(psql "$dburl" -X -Atqc "SELECT COUNT(*) FROM \"EngageSecurityAuditEvent\" WHERE \"workspaceId\"='$WORKSPACE_ID' AND \"entityId\"='$EXPECTED_LIVE_SHA' AND \"reasonCode\"='MACHINE_VERIFIED_EXACT_SHA' AND outcome='VERIFIED' AND action IN ('PHASE17_PRODUCTION_EVIDENCE_RECORDED','PHASE17_POLICY_VERIFIED');")"
          post_actions="$(psql "$dburl" -X -Atqc "SELECT action||'|'||outcome||'|'||COALESCE(\"reasonCode\",'')||'|ACTOR_PRESENT='||CASE WHEN \"actorId\" IS NULL THEN 'false' ELSE 'true' END FROM \"EngageSecurityAuditEvent\" WHERE \"workspaceId\"='$WORKSPACE_ID' AND \"entityId\"='$EXPECTED_LIVE_SHA' AND \"reasonCode\"='MACHINE_VERIFIED_EXACT_SHA' AND outcome='VERIFIED' AND action IN ('PHASE17_PRODUCTION_EVIDENCE_RECORDED','PHASE17_POLICY_VERIFIED') ORDER BY action;")"
          controlled_after="$(psql "$dburl" -X -Atqc "SELECT \"stage\"||'|'||\"mode\"||'|'||\"writePolicy\"||'|'||\"externalWritesAllowed\"||'|'||\"version\" FROM \"EngageControlledLaunchState\" WHERE \"workspaceId\"='$WORKSPACE_ID';")"
          queued_after="$(psql "$dburl" -X -Atqc "SELECT COUNT(*) FROM \"WhatsAppMessage\" WHERE direction='OUTBOUND' AND status='QUEUED';")"
          approvals_after="$(psql "$dburl" -X -Atqc "SELECT COUNT(*) FROM \"EngageControlledLaunchOutboundApproval\" WHERE \"workspaceId\"='$WORKSPACE_ID' AND \"consumedAt\" IS NULL AND \"revokedAt\" IS NULL AND \"expiresAt\">CURRENT_TIMESTAMP;")"
          printf 'POST_MACHINE_EVIDENCE=%s\nCURRENT_SHA_MACHINE_EVENTS_BEGIN\n%s\nCURRENT_SHA_MACHINE_EVENTS_END\nCONTROLLED_AFTER=%s\nQUEUED_OUTBOUND_AFTER=%s\nACTIVE_EXACT_MESSAGE_APPROVALS_AFTER=%s\n' "$post_count" "$post_actions" "$controlled_after" "$queued_after" "$approvals_after"
          test "$post_count" = "2"
          test "$controlled_after" = "ONE_CONNECTED_ACCOUNT|SHADOW|NO_EXTERNAL_WRITES|false|2"
          test "$queued_after" = "0"
          test "$approvals_after" = "0"
          test "$(envv WHATSAPP_OUTBOUND_MODE 2>/dev/null || echo disabled)" = "disabled"
          test "$(envv WHATSAPP_CUTOVER_APPROVED 2>/dev/null || echo false)" = "false"
          test -z "$(envv WHATSAPP_OUTBOUND_LIVE_ACK 2>/dev/null || true)"
          test "$(envv WHATSAPP_OUTBOUND_KILL_SWITCH 2>/dev/null || echo on)" = "on"
          printf 'PASS: PHASE17_CF2B1C2_MACHINE_EVIDENCE_EXACT_SHA_RECORDED\nSTATE_TRANSITIONED=false\nOPERATOR_EVIDENCE_RECORDED=false\nEXACT_MESSAGE_APPROVAL_CREATED=false\nEXTERNAL_WHATSAPP_WRITE_SENT=false\n'
          REMOTE
