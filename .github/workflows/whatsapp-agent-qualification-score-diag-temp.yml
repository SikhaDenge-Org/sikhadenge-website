name: WhatsApp Agent Qualification Score Diagnostic Temp

on:
  push:
    branches:
      - release/whatsapp-instagram-agent-flow-20260731
    paths:
      - ".github/workflows/whatsapp-agent-qualification-score-diag-temp.yml"

permissions:
  contents: read

jobs:
  inspect-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${SSH_PORT:-}" ]]; then echo 'SSH_PORT=22' >> "$GITHUB_ENV"; SSH_PORT=22; fi
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$KEY" >/dev/null

      - name: Inspect failed isolated candidate only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          CANDIDATE=/var/www/sikhadenge-whatsapp-agent/releases/qualification-score-34954543308-1/apps/whatsapp-agent-dashboard
          LOG=/tmp/qualification-score-34954543308-1.log
          echo "CANDIDATE_EXISTS=$(test -d "$CANDIDATE" && echo yes || echo no)"
          echo "CANDIDATE_BUILD=$(cat "$CANDIDATE/.next/BUILD_ID" 2>/dev/null || true)"
          echo "NEXT_BIN=$(test -x "$CANDIDATE/node_modules/.bin/next" && echo yes || echo no)"
          echo "ENV_EXISTS=$(test -f "$CANDIDATE/.env" && echo yes || echo no)"
          echo 'STARTUP_LOG_BEGIN'
          tail -n 80 "$LOG" 2>/dev/null || true
          echo 'STARTUP_LOG_END'
          J=$(mktemp); pm2 jlist > "$J"
          RUNTIME=$(node - "$J" <<'NODE'
          const fs=require('node:fs');const p=JSON.parse(fs.readFileSync(process.argv[2],'utf8')).find(x=>x.name==='sikhadenge-whatsapp-agent');if(!p?.pm2_env?.pm_cwd)process.exit(2);process.stdout.write(p.pm2_env.pm_cwd);
          NODE
          ); rm -f "$J"
          echo "LIVE_BUILD=$(cat "$RUNTIME/.next/BUILD_ID")"
          echo "LIVE_LOGIN=$(curl --max-time 10 -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/login)"
          REMOTE
