name: WhatsApp Agent Inbox Rollback Diagnostic Temp

on:
  push:
    branches:
      - release/whatsapp-instagram-agent-flow-20260731
    paths:
      - ".github/workflows/whatsapp-agent-qualification-score-diag-temp.yml"

permissions:
  contents: read

jobs:
  inspect-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${SSH_PORT:-}" ]]; then echo 'SSH_PORT=22' >> "$GITHUB_ENV"; SSH_PORT=22; fi
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$KEY" >/dev/null

      - name: Inspect Inbox delta and PM2 metadata only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/var/www/sikhadenge-whatsapp-agent/releases
          CUR="$ROOT/reconcile-clean-28b813ca-20260915T043800Z/apps/whatsapp-agent-dashboard"
          PREV="$ROOT/reconcile-28b813ca-20260915T041236Z/apps/whatsapp-agent-dashboard"
          echo 'COMPONENT_DIFF_BEGIN'
          diff -u "$PREV/components/inbox/InboxDashboardV2.tsx" "$CUR/components/inbox/InboxDashboardV2.tsx" | head -n 260 || true
          echo 'COMPONENT_DIFF_END'
          echo 'LAYOUT_DIFF_BEGIN'
          diff -u "$PREV/app/layout.tsx" "$CUR/app/layout.tsx" | head -n 220 || true
          echo 'LAYOUT_DIFF_END'
          J=$(mktemp); pm2 jlist > "$J"
          node - "$J" <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync(process.argv[2],'utf8')).find(x=>x.name==='sikhadenge-whatsapp-agent');
          if(!p) process.exit(2);
          console.log('PM2_CWD='+String(p.pm2_env?.pm_cwd||''));
          console.log('PM2_SCRIPT='+String(p.pm2_env?.pm_exec_path||''));
          console.log('PM2_ARGS='+JSON.stringify(p.pm2_env?.args||[]));
          console.log('PM2_INTERPRETER='+String(p.pm2_env?.exec_interpreter||''));
          console.log('PM2_STATUS='+String(p.pm2_env?.status||''));
          NODE
          rm -f "$J"
          echo "CUR_BUILD=$(cat "$CUR/.next/BUILD_ID")"
          echo "PREV_BUILD=$(cat "$PREV/.next/BUILD_ID")"
          echo "PREV_ENV=$(test -f "$PREV/.env" && echo yes || echo no)"
          echo "PREV_NEXT=$(test -x "$PREV/node_modules/.bin/next" && echo yes || echo no)"
          REMOTE
