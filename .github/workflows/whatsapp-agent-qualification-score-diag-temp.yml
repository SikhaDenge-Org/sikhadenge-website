name: WhatsApp Agent Inbox Rollback Diagnostic Temp

on:
  push:
    branches:
      - release/whatsapp-instagram-agent-flow-20260731
    paths:
      - ".github/workflows/whatsapp-agent-qualification-score-diag-temp.yml"

permissions:
  contents: read

jobs:
  inspect-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${SSH_PORT:-}" ]]; then echo 'SSH_PORT=22' >> "$GITHUB_ENV"; SSH_PORT=22; fi
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$KEY" >/dev/null

      - name: Inventory every preserved Next build and known-good candidates read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/var/www/sikhadenge-whatsapp-agent
          J=$(mktemp); pm2 jlist > "$J"
          ACTIVE_CWD=$(node - "$J" <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync(process.argv[2],'utf8')).find(x=>x.name==='sikhadenge-whatsapp-agent');
          if(!p?.pm2_env?.pm_cwd) process.exit(2);
          process.stdout.write(p.pm2_env.pm_cwd);
          NODE
          )
          rm -f "$J"
          echo "ACTIVE_CWD=$ACTIVE_CWD"
          echo "ACTIVE_BUILD=$(cat "$ACTIVE_CWD/.next/BUILD_ID" 2>/dev/null || true)"
          echo 'ALL_BUILD_IDS_BEGIN'
          find "$ROOT" -type f -name BUILD_ID 2>/dev/null | while read -r p; do
            case "$p" in */node_modules/*) continue ;; esac
            build=$(cat "$p" 2>/dev/null || true)
            dir=${p%/BUILD_ID}
            printf '%s | %s | %s\n' "$build" "$(stat -c '%y' "$p" 2>/dev/null || true)" "$dir"
          done | sort -k2,3r | head -n 120
          echo 'ALL_BUILD_IDS_END'
          echo 'KNOWN_GOOD_SEARCH_BEGIN'
          grep -Rsl 'ZvzV6QBBngX3s_X5xxUnk' "$ROOT" /root/sikhadenge-backups 2>/dev/null | head -n 80 || true
          echo 'KNOWN_GOOD_SEARCH_END'
          echo 'ROLLBACK_MANIFESTS_BEGIN'
          find /root/sikhadenge-backups -maxdepth 3 -type f \( -name 'deploy-state.txt' -o -name 'build-before.id' -o -name 'source-before.sha' \) -print 2>/dev/null | sort | tail -n 120 | while read -r p; do echo "FILE=$p"; cat "$p" 2>/dev/null | head -n 30; done
          echo 'ROLLBACK_MANIFESTS_END'
          REMOTE
