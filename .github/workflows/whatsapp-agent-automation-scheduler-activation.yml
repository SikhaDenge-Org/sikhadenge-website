name: WhatsApp Automation Scheduler Activation

on:
  workflow_dispatch:
    inputs:
      expected_live_sha:
        description: Exact protected release SHA currently deployed
        required: true
        type: string
  workflow_run:
    workflows:
      - "WhatsApp Agent Production Batch 1"
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: whatsapp-automation-scheduler-activation
  cancel-in-progress: false

jobs:
  dispatch-protected-activation:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'release/whatsapp-instagram-agent-flow-20260731'
    runs-on: [self-hosted, Linux, X64, sikhadenge-ci]
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch protected release activation
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh workflow run whatsapp-agent-automation-scheduler-activation.yml             --repo "$GITHUB_REPOSITORY"             --ref release/whatsapp-instagram-agent-flow-20260731             -f expected_live_sha="$TARGET_SHA"
          printf 'DISPATCHED_PROTECTED_ACTIVATION_SHA=%s\n' "$TARGET_SHA"

  activate:
    if: github.event_name == 'workflow_dispatch'
    environment: whatsapp-agent-production
    runs-on: [self-hosted, Linux, X64, sikhadenge-ci]
    env:
      EXPECTED_LIVE_SHA: ${{ inputs.expected_live_sha }}
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
    steps:
      - name: Validate input and secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_LIVE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$SSH_HOST"
          test -n "$SSH_PORT"
          test -n "$SSH_USER"
          test -n "${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}"
          test -n "${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}"

      - name: Configure pinned SSH identity
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"

          private_key_file="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$private_key_file"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$private_key_file"
          fi
          chmod 600 "$private_key_file"

          [[ "$SSH_HOST" =~ ^[^[:space:]/]+$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          (( SSH_PORT >= 1 && SSH_PORT <= 65535 ))

          read -r _ supplied_key_type supplied_key_material _ <<< "$SSH_HOST_KEY"
          test "$supplied_key_type" = "ssh-ed25519"
          test -n "$supplied_key_material"
          printf '%s %s\n' "$supplied_key_type" "$supplied_key_material" |
            ssh-keygen -lf - -E sha256 >/dev/null

          canonical_host="[$SSH_HOST]:$SSH_PORT"
          printf '%s %s %s\n'             "$canonical_host"             "$supplied_key_type"             "$supplied_key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          ssh-keygen -y -f "$private_key_file" >/dev/null
          ssh-keygen -F "$canonical_host" -f "$HOME/.ssh/known_hosts" >/dev/null
          printf 'PASS: PINNED_HOST_KEY_CANONICALIZED\n'
          printf 'PASS: SSH_IDENTITY_CONFIGURED\n'

      - name: Activate fail-closed scheduler
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "EXPECTED_LIVE_SHA='$EXPECTED_LIVE_SHA' bash -s" <<'REMOTE' | tee phase21-scheduler-activation.txt
          set -euo pipefail
          LIVE_APP=/var/www/sikhadenge-whatsapp-agent/source/apps/whatsapp-agent-dashboard
          PROCESS=sikhadenge-whatsapp-automation-scheduler

          test "$(git -C "$LIVE_APP" rev-parse --is-inside-work-tree)" = "true"
          live_sha="$(git -C "$LIVE_APP" rev-parse HEAD)"
          test "$live_sha" = "$EXPECTED_LIVE_SHA"
          test "$(git -C "$LIVE_APP" status --porcelain --untracked-files=no | wc -l)" -eq 0
          test -f "$LIVE_APP/ecosystem.automation-scheduler.cjs"
          test -f "$LIVE_APP/scripts/whatsapp-automation-scheduler.ts"

          grep -q 'WHATSAPP_AUTOMATION_SCHEDULER_ENABLED: "true"' "$LIVE_APP/ecosystem.automation-scheduler.cjs"
          grep -q 'AUTOMATION_RUNTIME_ENABLED: "false"' "$LIVE_APP/ecosystem.automation-scheduler.cjs"
          grep -q 'AUTOMATION_ACTIONS_ENABLED: "false"' "$LIVE_APP/ecosystem.automation-scheduler.cjs"
          grep -q 'JOURNEY_RUNTIME_ENABLED: "false"' "$LIVE_APP/ecosystem.automation-scheduler.cjs"
          grep -q 'JOURNEY_ACTIONS_ENABLED: "false"' "$LIVE_APP/ecosystem.automation-scheduler.cjs"
          grep -q 'WHATSAPP_CAMPAIGNS_ENABLED: "false"' "$LIVE_APP/ecosystem.automation-scheduler.cjs"
          grep -q 'WHATSAPP_AUTOMATION_OUTBOUND_DISPATCH_ENABLED: "false"' "$LIVE_APP/ecosystem.automation-scheduler.cjs"
          grep -q 'WHATSAPP_OUTBOUND_MODE: "disabled"' "$LIVE_APP/ecosystem.automation-scheduler.cjs"
          grep -q 'WHATSAPP_OUTBOUND_KILL_SWITCH: "on"' "$LIVE_APP/ecosystem.automation-scheduler.cjs"

          cd "$LIVE_APP"
          export NODE_ENV=production
          export WHATSAPP_AUTOMATION_SCHEDULER_ENABLED=true
          export WHATSAPP_AUTOMATION_SCHEDULER_INTERVAL_MS=5000
          export AUTOMATION_RUNTIME_ENABLED=false
          export AUTOMATION_ACTIONS_ENABLED=false
          export JOURNEY_RUNTIME_ENABLED=false
          export JOURNEY_ACTIONS_ENABLED=false
          export WHATSAPP_CAMPAIGNS_ENABLED=false
          export WHATSAPP_AUTOMATION_OUTBOUND_DISPATCH_ENABLED=false
          export WHATSAPP_OUTBOUND_MODE=disabled
          export WHATSAPP_OUTBOUND_KILL_SWITCH=on
          export INTEGRATION_EXTERNAL_WRITES_ENABLED=false
          export AGENT_AUTO_REPLY_ENABLED=false
          export AGENT_IMMEDIATE_DISPATCH_ENABLED=false

          if pm2 describe "$PROCESS" >/dev/null 2>&1; then
            pm2 restart "$PROCESS" --update-env
            printf 'SCHEDULER_PM2_OPERATION=restart\n'
          else
            test -f "$LIVE_APP/node_modules/tsx/dist/cli.mjs"
            pm2 start "$LIVE_APP/node_modules/tsx/dist/cli.mjs" \
              --name "$PROCESS" \
              --cwd "$LIVE_APP" \
              --interpreter /usr/bin/node \
              -- scripts/whatsapp-automation-scheduler.ts
            printf 'SCHEDULER_PM2_OPERATION=start\n'
          fi
          pm2 save

          sleep 4
          state="$(pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s).find(x=>x.name==="sikhadenge-whatsapp-automation-scheduler");process.stdout.write(p?.pm2_env?.status||"missing")})')"
          test "$state" = "online"

          pm2 logs "$PROCESS" --lines 40 --nostream > /tmp/phase21-scheduler.log
          grep -q '"service":"sikhadenge-whatsapp-automation-scheduler"' /tmp/phase21-scheduler.log
          grep -Eq '"event":"(started|paused|cycle)"' /tmp/phase21-scheduler.log
          ! grep -q '"event":"uncaught_exception"' /tmp/phase21-scheduler.log

          printf 'LIVE_SHA=%s\n' "$live_sha"
          printf 'SCHEDULER_PROCESS=%s\n' "$PROCESS"
          printf 'SCHEDULER_PM2_STATE=%s\n' "$state"
          printf 'SCHEDULER_ENABLED=true\n'
          printf 'AUTOMATION_RUNTIME_ENABLED=false\n'
          printf 'AUTOMATION_ACTIONS_ENABLED=false\n'
          printf 'JOURNEY_RUNTIME_ENABLED=false\n'
          printf 'JOURNEY_ACTIONS_ENABLED=false\n'
          printf 'WHATSAPP_CAMPAIGNS_ENABLED=false\n'
          printf 'WHATSAPP_AUTOMATION_OUTBOUND_DISPATCH_ENABLED=false\n'
          printf 'WHATSAPP_OUTBOUND_MODE=disabled\n'
          printf 'WHATSAPP_OUTBOUND_KILL_SWITCH=on\n'
          printf 'EXTERNAL_WHATSAPP_WRITE_SENT=false\n'
          REMOTE

      - name: Upload activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase21-whatsapp-automation-scheduler-activation-${{ inputs.expected_live_sha }}
          path: phase21-scheduler-activation.txt
          if-no-files-found: warn
          retention-days: 30
