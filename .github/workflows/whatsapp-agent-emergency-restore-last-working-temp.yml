name: WhatsApp Agent Emergency Restore Last Working Temp

on:
  push:
    branches:
      - release/whatsapp-instagram-agent-flow-20260731
    paths:
      - ".github/workflows/whatsapp-agent-emergency-restore-last-working-temp.yml"

permissions:
  contents: read

concurrency:
  group: whatsapp-agent-emergency-last-working-rollback
  cancel-in-progress: false

jobs:
  emergency-restore-last-working:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
      EXPECTED_SOURCE_SHA: 28b813ca9936fe0b9d3874f7ebf6b0dfeef0b242
      EXPECTED_RUNTIME_BUILD: ZvzV6QBBngX3s_X5xxUnk

    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          for v in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_HOST_KEY; do test -n "${!v:-}"; done
          if [[ -z "${SSH_PORT:-}" ]]; then echo 'SSH_PORT=22' >> "$GITHUB_ENV"; SSH_PORT=22; fi
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = ssh-ed25519
          test -n "$key_material"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$KEY" >/dev/null

      - name: Wait for production SSH transport
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 10); do
            if ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'test "$(id -u)" = 0'; then
              echo "PASS: SSH_READY attempt=$attempt"
              exit 0
            fi
            echo "WAIT: SSH unavailable attempt=$attempt"
            sleep 8
          done
          echo 'FAIL: production SSH unavailable after retries' >&2
          exit 1

      - name: Restore exact pre-Batch1 application and PM2 runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" "EXPECTED_SOURCE_SHA='$EXPECTED_SOURCE_SHA' EXPECTED_RUNTIME_BUILD='$EXPECTED_RUNTIME_BUILD' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          LIVE_APP=/var/www/sikhadenge-whatsapp-agent/source/apps/whatsapp-agent-dashboard
          BACKUP_DIR=/root/sikhadenge-backups/engageos-github-34947108888-1
          PUBLIC_URL=https://whatsapp.sikhadenge.in
          DEPLOY_STATE="$BACKUP_DIR/deploy-state.txt"
          ROLLBACK_SCRIPT="$LIVE_APP/scripts/engageos-production-rollback.sh"

          test -f "$DEPLOY_STATE"
          test -f "$ROLLBACK_SCRIPT"
          state() { awk -F= -v k="$1" '$1==k{sub($1 "=","");print;exit}' "$DEPLOY_STATE"; }

          old_source="$(state OLD_SOURCE_SHA)"
          old_runtime_build="$(state OLD_RUNTIME_BUILD_ID)"
          runtime_app="$(state RUNTIME_APP)"
          runtime_old_next="$(state RUNTIME_OLD_NEXT)"
          old_next="$(state OLD_NEXT)"

          printf 'TARGET_OLD_SOURCE=%s\n' "$old_source"
          printf 'TARGET_OLD_RUNTIME_BUILD=%s\n' "$old_runtime_build"
          printf 'TARGET_RUNTIME_APP=%s\n' "$runtime_app"
          printf 'TARGET_RUNTIME_OLD_NEXT=%s\n' "$runtime_old_next"

          test "$old_source" = "$EXPECTED_SOURCE_SHA"
          test "$old_runtime_build" = "$EXPECTED_RUNTIME_BUILD"
          test "$runtime_app" = /var/www/sikhadenge-whatsapp-agent/releases/reconcile-clean-28b813ca-20260915T043800Z/apps/whatsapp-agent-dashboard
          test -d "$runtime_old_next"
          test -f "$runtime_old_next/BUILD_ID"
          test "$(cat "$runtime_old_next/BUILD_ID")" = "$EXPECTED_RUNTIME_BUILD"
          test -d "$old_next"
          echo 'PASS: BATCH1_ROLLBACK_ARTIFACTS_MATCH_LAST_WORKING_RUNTIME'

          LIVE_APP="$LIVE_APP" BACKUP_DIR="$BACKUP_DIR" PUBLIC_URL="$PUBLIC_URL" bash "$ROLLBACK_SCRIPT"

          PM2_JSON=$(mktemp)
          pm2 jlist > "$PM2_JSON"
          pm2_status=$(node - "$PM2_JSON" <<'NODE'
          const fs=require('node:fs');const a=JSON.parse(fs.readFileSync(process.argv[2],'utf8')).find(x=>x.name==='sikhadenge-whatsapp-agent');if(!a)process.exit(3);process.stdout.write(String(a.pm2_env?.status||''));
          NODE
          )
          pm2_cwd=$(node - "$PM2_JSON" <<'NODE'
          const fs=require('node:fs');const a=JSON.parse(fs.readFileSync(process.argv[2],'utf8')).find(x=>x.name==='sikhadenge-whatsapp-agent');if(!a?.pm2_env?.pm_cwd)process.exit(3);process.stdout.write(String(a.pm2_env.pm_cwd));
          NODE
          )
          rm -f "$PM2_JSON"
          runtime_build=$(cat "$pm2_cwd/.next/BUILD_ID")
          source_sha=$(git -C "$LIVE_APP" rev-parse HEAD)
          login=$(curl --max-time 20 -sS -L -o /dev/null -w '%{http_code}' "$PUBLIC_URL/login?exact-last-working=1")
          inbox=$(curl --max-time 20 -sS -o /dev/null -w '%{http_code}' "$PUBLIC_URL/inbox?exact-last-working=1")

          printf 'FINAL_PM2_STATUS=%s\n' "$pm2_status"
          printf 'FINAL_PM2_CWD=%s\n' "$pm2_cwd"
          printf 'FINAL_RUNTIME_BUILD=%s\n' "$runtime_build"
          printf 'FINAL_SOURCE_SHA=%s\n' "$source_sha"
          printf 'FINAL_LOGIN_HTTP=%s\n' "$login"
          printf 'FINAL_INBOX_HTTP=%s\n' "$inbox"

          test "$pm2_status" = online
          test "$runtime_build" = "$EXPECTED_RUNTIME_BUILD"
          test "$source_sha" = "$EXPECTED_SOURCE_SHA"
          test "$login" = 200
          case "$inbox" in 200|301|302|303|307|308) ;; *) exit 42 ;; esac
          echo 'PASS: EXACT_LAST_WORKING_PRODUCTION_RUNTIME_ACTIVE'
          REMOTE

      - name: Final public verification
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(curl --max-time 20 -sS -L -o /dev/null -w '%{http_code}' 'https://whatsapp.sikhadenge.in/login?restore-final=1')" = 200
          code=$(curl --max-time 20 -sS -o /dev/null -w '%{http_code}' 'https://whatsapp.sikhadenge.in/inbox?restore-final=1')
          case "$code" in 200|301|302|303|307|308) ;; *) exit 1 ;; esac
          echo "PASS: PUBLIC_LAST_WORKING_RUNTIME_HEALTHY inbox=$code"
