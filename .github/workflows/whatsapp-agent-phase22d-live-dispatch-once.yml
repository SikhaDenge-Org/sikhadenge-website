name: WhatsApp Phase22D One-Time Live Canary Dispatch
# Phase22D retry marker: prior same-push refresh correctly hit the <30m freshness guard; retry preserves the gate.

on:
  push:
    branches:
      - release/whatsapp-instagram-agent-flow-20260731
    paths:
      - .github/workflows/whatsapp-agent-phase22d-live-dispatch-once.yml

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_WORKFLOW: whatsapp-agent-phase17-single-message-canary.yml
      REFRESH_WORKFLOW: whatsapp-agent-phase22d-refresh-stale-canary-dryrun.yml
      TARGET_REF: release/whatsapp-instagram-agent-flow-20260731
      EXPECTED_LIVE_SHA: 4e4bcb0119f2096ee2f95c95862c5c0d797c1021
      EXPECTED_STATE_VERSION: "2"
      APPROVER_USER_ID: cmrxpasm00000kwyj1gcd6q3d
      APPROVAL_REASON: Phase22D exact designated internal canary production qualification; one message only.
    steps:
      - name: Wait for same-push fresh canary qualification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          refresh_run_id=""
          for attempt in $(seq 1 40); do
            sleep 3
            candidate="$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$REFRESH_WORKFLOW" --branch "$TARGET_REF" --event push --commit "$GITHUB_SHA" --limit 5 --json databaseId --jq '.[0].databaseId // 0')"
            if [[ "$candidate" != "0" ]]; then
              refresh_run_id="$candidate"
              break
            fi
          done
          test -n "$refresh_run_id"
          gh run watch "$refresh_run_id" -R "$GITHUB_REPOSITORY" --exit-status

          fresh_message_id=""
          for attempt in $(seq 1 20); do
            refresh_log="$(gh run view "$refresh_run_id" -R "$GITHUB_REPOSITORY" --log 2>/dev/null || true)"
            fresh_message_id="$(printf '%s\n' "$refresh_log" | sed -n 's/.*FRESH_MESSAGE_ID=\([A-Za-z0-9_-][A-Za-z0-9_-]*\).*/\1/p' | tail -n1)"
            if [[ "$fresh_message_id" =~ ^[A-Za-z0-9_-]{1,200}$ ]]; then
              break
            fi
            sleep 2
          done
          [[ "$fresh_message_id" =~ ^[A-Za-z0-9_-]{1,200}$ ]]
          test "$fresh_message_id" != "not-created"

          echo "REFRESH_RUN_ID=$refresh_run_id" >> "$GITHUB_ENV"
          echo "REFRESH_RUN_URL=https://github.com/$GITHUB_REPOSITORY/actions/runs/$refresh_run_id" >> "$GITHUB_ENV"
          echo "CANARY_MESSAGE_ID=$fresh_message_id" >> "$GITHUB_ENV"
          printf 'PHASE22D_FRESH_CANARY_READY=true\nREFRESH_RUN_ID=%s\nCANARY_MESSAGE_ID=%s\n' "$refresh_run_id" "$fresh_message_id"

      - name: Dispatch exact Phase22D one-message canary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          previous_ids="$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$TARGET_WORKFLOW" --branch "$TARGET_REF" --event workflow_dispatch --limit 20 --json databaseId --jq '.[].databaseId' | tr '\n' ' ')"
          gh workflow run "$TARGET_WORKFLOW" -R "$GITHUB_REPOSITORY" --ref "$TARGET_REF" \
            -f expected_release_sha="$EXPECTED_LIVE_SHA" \
            -f expected_state_version="$EXPECTED_STATE_VERSION" \
            -f message_id="$CANARY_MESSAGE_ID" \
            -f approved_by_user_id="$APPROVER_USER_ID" \
            -f approval_reason="$APPROVAL_REASON" \
            -f execute=true

          run_id=""
          for attempt in $(seq 1 40); do
            sleep 3
            while read -r candidate; do
              [[ -n "$candidate" ]] || continue
              if [[ " $previous_ids " != *" $candidate "* ]]; then
                run_id="$candidate"
                break 2
              fi
            done < <(gh run list -R "$GITHUB_REPOSITORY" --workflow "$TARGET_WORKFLOW" --branch "$TARGET_REF" --event workflow_dispatch --limit 20 --json databaseId --jq '.[].databaseId')
          done
          test -n "$run_id"
          echo "TARGET_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "TARGET_RUN_URL=https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id" >> "$GITHUB_ENV"
          printf 'PHASE22D_LIVE_CANARY_DISPATCHED=true\nTARGET_RUN_ID=%s\n' "$run_id"

      - name: Wait for exact one-message canary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh run watch "$TARGET_RUN_ID" -R "$GITHUB_REPOSITORY" --exit-status

      - name: Record Phase22D live canary evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test -n "${TARGET_RUN_ID:-}"
          status="$(gh run view "$TARGET_RUN_ID" -R "$GITHUB_REPOSITORY" --json status --jq '.status')"
          conclusion="$(gh run view "$TARGET_RUN_ID" -R "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')"
          {
            printf '## Phase22D exact internal canary live qualification\n\n'
            printf '%s\n' "- Refresh workflow run: $REFRESH_RUN_URL"
            printf '%s\n' "- Workflow run: $TARGET_RUN_URL"
            printf '%s\n' "- Run ID: $TARGET_RUN_ID"
            printf '%s\n' "- Expected live SHA: \`$EXPECTED_LIVE_SHA\`"
            printf '%s\n' "- Exact message ID: \`$CANARY_MESSAGE_ID\`"
            printf '%s\n' "- execute: \`true\`"
            printf '%s\n' "- Status: \`$status\`"
            printf '%s\n' "- Conclusion: \`$conclusion\`"
            printf '%s\n\n' "- Scope: exact designated INTERNAL_TEST canary only"
            printf '%s\n' "The dispatcher itself performs no provider call; production send authority remains inside the reviewed single-message operator, which restores SHADOW/no-external-writes after execution."
          } > phase22d-live-canary-ledger.md
          gh issue comment 65 -R "$GITHUB_REPOSITORY" --body-file phase22d-live-canary-ledger.md
          test "$status" = "completed"
          test "$conclusion" = "success"
