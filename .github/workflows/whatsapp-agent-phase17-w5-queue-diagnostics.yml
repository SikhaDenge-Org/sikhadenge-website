name: WhatsApp W5 Queue Diagnostics

on:
  push:
    branches:
      - release/whatsapp-instagram-agent-flow-20260731
    paths:
      - ".github/workflows/whatsapp-agent-phase17-w5-queue-diagnostics.yml"

permissions:
  contents: read

concurrency:
  group: whatsapp-w5-queue-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
      VERIFIED_CANARY_WA_ID: ${{ secrets.WHATSAPP_INTERNAL_CANARY_WA_ID }}
      EXPECTED_LIVE_SHA: 60cd180e7a728b4ac546777605b4257504df483a
      REVIEWED_EMAIL_INTERNAL_TEST_SHA256: d7dc9e6950379aca830830680778d71fc083bfeaa5fea67dd3117fc0696eda0e
      REVIEWED_EMAIL_READINESS_SHA256: a3c15e6b03e31ed9f4df38391a737a56a36625ae89c36f185a3d7df13fa8254c
      SELECTED_TEMPLATE: hello_world

    steps:
      - name: Validate pinned inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          for v in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_HOST_KEY VERIFIED_CANARY_WA_ID; do
            test -n "${!v:-}"
          done
          [[ "$VERIFIED_CANARY_WA_ID" =~ ^[0-9]{6,20}$ ]]
          [[ "$EXPECTED_LIVE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SELECTED_TEMPLATE" =~ ^[a-z0-9_]{1,512}$ ]]
          if [[ -z "${SSH_PORT:-}" ]]; then
            SSH_PORT=22
            echo 'SSH_PORT=22' >> "$GITHUB_ENV"
          fi
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          printf 'VERIFIED_CANARY_CONFIGURED=true\nCANARY_IDENTIFIER_EMITTED=false\n'

      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read-only production diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" \
            "EXPECTED_LIVE_SHA='$EXPECTED_LIVE_SHA' REVIEWED_EMAIL_INTERNAL_TEST_SHA256='$REVIEWED_EMAIL_INTERNAL_TEST_SHA256' REVIEWED_EMAIL_READINESS_SHA256='$REVIEWED_EMAIL_READINESS_SHA256' VERIFIED_CANARY_WA_ID='$VERIFIED_CANARY_WA_ID' SELECTED_TEMPLATE='$SELECTED_TEMPLATE' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/var/www/sikhadenge-whatsapp-agent/source
          APP="$ROOT/apps/whatsapp-agent-dashboard"
          cd "$ROOT"

          live_sha="$(git rev-parse HEAD)"
          actual_dirty="$(git status --porcelain --untracked-files=no | sed '/^$/d' | sort)"
          expected_dirty="$(printf '%s\n%s\n' \
            ' M apps/whatsapp-agent-dashboard/scripts/email-automation-production-internal-test.sh' \
            ' M apps/whatsapp-agent-dashboard/scripts/email-inbound-production-readiness.ts' | sort)"
          test "$live_sha" = "$EXPECTED_LIVE_SHA"
          test "$actual_dirty" = "$expected_dirty"
          test "$(sha256sum "$APP/scripts/email-automation-production-internal-test.sh" | awk '{print $1}')" = "$REVIEWED_EMAIL_INTERNAL_TEST_SHA256"
          test "$(sha256sum "$APP/scripts/email-inbound-production-readiness.ts" | awk '{print $1}')" = "$REVIEWED_EMAIL_READINESS_SHA256"
          printf 'SOURCE_LIVE_SHA_MATCH=true\nSOURCE_REVIEWED_DIRTY_SET_MATCH=true\nWHATSAPP_RELEVANT_DIRTY_COUNT=0\n'

          pm2_json="$(pm2 jlist 2>/dev/null)"
          scheduler_outbound="$(printf '%s' "$pm2_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"[]").find(x=>x.name==="sikhadenge-whatsapp-automation-scheduler");process.stdout.write(String(p?.pm2_env?.WHATSAPP_AUTOMATION_OUTBOUND_DISPATCH_ENABLED??""))})')"
          scheduler_mode="$(printf '%s' "$pm2_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"[]").find(x=>x.name==="sikhadenge-whatsapp-automation-scheduler");process.stdout.write(String(p?.pm2_env?.WHATSAPP_OUTBOUND_MODE??""))})')"
          scheduler_kill="$(printf '%s' "$pm2_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"[]").find(x=>x.name==="sikhadenge-whatsapp-automation-scheduler");process.stdout.write(String(p?.pm2_env?.WHATSAPP_OUTBOUND_KILL_SWITCH??""))})')"
          test "$scheduler_outbound" = false
          test "$scheduler_mode" = disabled
          test "$scheduler_kill" = on
          printf 'SCHEDULER_OUTBOUND=false\nSCHEDULER_MODE=disabled\nSCHEDULER_KILL_SWITCH=on\n'

          cd "$APP"
          set -a
          source .env
          set +a
          test "${WHATSAPP_OUTBOUND_MODE:-disabled}" != live
          test "${WHATSAPP_CUTOVER_APPROVED:-false}" != true
          test -z "${WHATSAPP_OUTBOUND_LIVE_ACK:-}"
          test "${WHATSAPP_OUTBOUND_KILL_SWITCH:-on}" = on
          DB="$(node scripts/prisma-postgres-cli-url.mjs "$DATABASE_URL")"

          PGOPTIONS='-c default_transaction_read_only=on' psql "$DB" -X -v ON_ERROR_STOP=1 -v canary="$VERIFIED_CANARY_WA_ID" -v template="$SELECTED_TEMPLATE" -A -F '=' -t <<'SQL'
          SELECT 'TARGET_COUNT', COUNT(*) FROM "WhatsAppContact" c
          WHERE c."waId"=:'canary'
            AND c."metadata" #>> '{engageos,whatsappIdentity,workspaceId}'='engagews_default'
            AND c."metadata" #>> '{engageos,canary,designated}'='true'
            AND c."metadata" #>> '{engageos,canary,kind}'='INTERNAL_TEST';

          SELECT 'OPTED_IN_COUNT', COUNT(*) FROM "WhatsAppContact" c
          WHERE c."waId"=:'canary' AND c."consentStatus"::text='OPTED_IN';

          SELECT 'OPTED_OUT_COUNT', COUNT(*) FROM "WhatsAppContact" c
          WHERE c."waId"=:'canary' AND c."optedOutAt" IS NOT NULL;

          SELECT 'IDENTITY_CONNECTION_LINK_COUNT', COUNT(*)
          FROM "WhatsAppContact" c
          JOIN "EngageChannelConnection" ec
            ON ec.id=c."metadata" #>> '{engageos,whatsappIdentity,connectionId}'
           AND ec."workspaceId"='engagews_default'
           AND ec.channel='WHATSAPP'
          WHERE c."waId"=:'canary';

          SELECT 'CONNECTION_READY_COUNT', COUNT(*)
          FROM "WhatsAppContact" c
          JOIN "EngageChannelConnection" ec
            ON ec.id=c."metadata" #>> '{engageos,whatsappIdentity,connectionId}'
           AND ec."workspaceId"='engagews_default'
           AND ec.channel='WHATSAPP'
          WHERE c."waId"=:'canary' AND ec.status IN ('CONNECTED','DEGRADED');

          SELECT 'TAGGED_CONVERSATION_COUNT', COUNT(*)
          FROM "WhatsAppConversation" wc
          JOIN "WhatsAppContact" c ON c.id=wc."contactId"
          JOIN "ConversationTagLink" ctl ON ctl."conversationId"=wc.id
          JOIN "ConversationTag" ct ON ct.id=ctl."tagId"
          WHERE c."waId"=:'canary'
            AND lower(coalesce(wc.source,'whatsapp'))='whatsapp'
            AND ct.name='CANARY_INTERNAL_TEST';

          SELECT 'APPROVED_TEMPLATE_COUNT', COUNT(*)
          FROM "WhatsAppTemplate"
          WHERE status='APPROVED' AND name=:'template';

          SELECT 'PHASE22D_QUEUE_TOTAL_COUNT', COUNT(*)
          FROM "WhatsAppMessage" m
          JOIN "WhatsAppConversation" wc ON wc.id=m."conversationId"
          JOIN "WhatsAppContact" c ON c.id=wc."contactId"
          WHERE c."waId"=:'canary'
            AND m.direction='OUTBOUND'
            AND m.type='TEMPLATE'
            AND m."rawPayload" #>> '{outbound,templateName}'=:'template'
            AND m."rawPayload" #>> '{outbound,idempotencyKey}' LIKE 'phase22d-internal-canary:%';

          SELECT 'PHASE22D_QUEUE_QUEUED_COUNT', COUNT(*)
          FROM "WhatsAppMessage" m
          JOIN "WhatsAppConversation" wc ON wc.id=m."conversationId"
          JOIN "WhatsAppContact" c ON c.id=wc."contactId"
          WHERE c."waId"=:'canary'
            AND m.direction='OUTBOUND'
            AND m.type='TEMPLATE'
            AND m.status='QUEUED'
            AND m."rawPayload" #>> '{outbound,templateName}'=:'template'
            AND m."rawPayload" #>> '{outbound,idempotencyKey}' LIKE 'phase22d-internal-canary:%';

          SELECT 'PHASE22D_QUEUE_WITH_META_ID_COUNT', COUNT(*)
          FROM "WhatsAppMessage" m
          JOIN "WhatsAppConversation" wc ON wc.id=m."conversationId"
          JOIN "WhatsAppContact" c ON c.id=wc."contactId"
          WHERE c."waId"=:'canary'
            AND m.direction='OUTBOUND'
            AND m.type='TEMPLATE'
            AND m."metaMessageId" IS NOT NULL
            AND m."rawPayload" #>> '{outbound,templateName}'=:'template'
            AND m."rawPayload" #>> '{outbound,idempotencyKey}' LIKE 'phase22d-internal-canary:%';

          SELECT 'CONTROLLED_LAUNCH_EXTERNAL_ALLOWED_COUNT', COUNT(*)
          FROM "EngageControlledLaunchState"
          WHERE "workspaceId"='engagews_default' AND "externalWritesAllowed"=true;

          SELECT 'CONTROLLED_LAUNCH_EXTERNAL_REQUESTED_COUNT', COUNT(*)
          FROM "EngageControlledLaunchState"
          WHERE "workspaceId"='engagews_default' AND COALESCE("scope"->>'externalWritesRequested','false')='true';
          SQL

          printf 'DATABASE_READONLY_DIAGNOSTIC=true\nDATABASE_WRITE_REQUESTED=false\nPROVIDER_WRITE_REQUESTED=false\nEXTERNAL_WHATSAPP_WRITE_SENT=false\n'
          printf 'CANARY_IDENTIFIER_EMITTED=false\nMESSAGE_IDENTIFIER_EMITTED=false\nPII_EMITTED=false\n'
          printf 'WHATSAPP_W5_QUEUE_DIAGNOSTICS=PASS\n'
          REMOTE
