name: Audit Last Best Funnel Backup 20260910

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-last-best-backup-20260910.yml

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, sikhadenge-ci]
    timeout-minutes: 8
    environment: whatsapp-agent-production
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${SSH_PORT:-}" ]] || SSH_PORT=22
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read-only exact main-page candidate audit
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo '=== CURRENT LIVE ==='
          curl -fsSL --max-time 20 'https://sikhadenge.in/masterclass/ai-video?audit=main-candidates' -o /tmp/live-ai.html
          echo "LIVE_SHA=$(sha256sum /tmp/live-ai.html | awk '{print $1}') LIVE_BYTES=$(wc -c </tmp/live-ai.html)"

          echo '=== SOURCE-FIRST V90/V90.1 RELEASES ==='
          shopt -s nullglob
          dirs=(/var/www/sikhadenge.in/releases/production-ai-video-source-first-*)
          printf 'COUNT=%s\n' "${#dirs[@]}"
          for d in "${dirs[@]}"; do
            echo "--- RELEASE=$d"
            stat -c 'DIR_MTIME=%y' "$d"
            f="$d/.next/server/pages/masterclass/ai-video.html"
            if [[ -f "$f" ]]; then
              echo "HTML_SHA=$(sha256sum "$f" | awk '{print $1}') BYTES=$(wc -c <"$f") HTML_MTIME=$(stat -c '%y' "$f")"
              echo "STYLE_TAGS=$(grep -o '<style' "$f" | wc -l) SCRIPT_TAGS=$(grep -o '<script' "$f" | wc -l)"
              for m in 'ai-video-hero-title' 'Create cinematic AI videos' '30 Crore' 'Six blocks' 'Understand the tools behind' 'Questions before you join live' 'Real learners' 'ai-video-audience-premium-v4-inline' 'ai-video-faq-premium-v3-inline'; do grep -Fqi "$m" "$f" && echo "YES|$m" || echo "NO|$m"; done
              grep -Eo '/ai-video-real-output-v77/[^" ]+/_next/static' "$f" | sort -u | head -5 || true
            else echo NO_HTML; fi
          done

          echo '=== ORIGINAL IMMUTABLE GOLDEN RELEASE ==='
          gd='/var/www/sikhadenge.in/releases/production-ai-workflow-premium-zero-build-20260829-110420'
          gf="$gd/.next/server/pages/masterclass/ai-video.html"
          if [[ -f "$gf" ]]; then
            echo "GOLDEN_SHA=$(sha256sum "$gf" | awk '{print $1}') BYTES=$(wc -c <"$gf") MTIME=$(stat -c '%y' "$gf") ATTR=$(lsattr -d "$gf" | awk '{print $1}')"
            echo "STYLE_TAGS=$(grep -o '<style' "$gf" | wc -l) SCRIPT_TAGS=$(grep -o '<script' "$gf" | wc -l)"
            for m in 'ai-video-hero-title' 'Create cinematic AI videos' '30 Crore' 'Six blocks' 'Understand the tools behind' 'Questions before you join live' 'Real learners'; do grep -Fqi "$m" "$gf" && echo "YES|$m" || echo "NO|$m"; done
          fi

          echo '=== ROOT GOLDEN ADS LIVE BACKUP ==='
          rb='/root/ai-video-GOLDEN-ADS-LIVE-20260903-125516'
          if [[ -e "$rb" ]]; then
            echo "ROOT_BACKUP_EXISTS=$rb"
            find "$rb" -maxdepth 2 -type f -printf '%TY-%Tm-%Td %TH:%TM:%TS|%s|%p\n' 2>/dev/null | sort | head -80
          else echo ROOT_BACKUP_MISSING; fi

          echo '=== PM2 DUMP REFERENCES ==='
          grep -nEi 'sikhadenge-ai-video-v90|sikhadenge-ai-workflow-premium|production-ai-video-source-first|production-ai-workflow-premium' /root/.pm2/dump.pm2 2>/dev/null | head -160 || true
          echo '=== COMPLETE ==='
          REMOTE

# target-audit: 20260910-0353