name: Trace Registration V72 Occlusion 20260910
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trace-registration-v72-occlusion-20260910.yml'
permissions:
  contents: read
jobs:
  trace:
    runs-on: [self-hosted, Linux, X64, sikhadenge-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public V72 hide and submit logic
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 5 --max-time 30 'https://sikhadenge.in/registration-stable-page1-v72.js?v=20260903-131023' -o /tmp/p.js
          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 5 --max-time 30 'https://sikhadenge.in/registration-stable-hot-v72.js?v=20260903-131023' -o /tmp/h.js
          echo "PAGE1_SHA=$(sha256sum /tmp/p.js|awk '{print $1}')"
          echo "HOT_SHA=$(sha256sum /tmp/h.js|awk '{print $1}')"
          for r in '7160,7340' '7525,7835' '8170,8500' '9250,9565'; do echo "=== PAGE1 RANGE $r ==="; nl -ba /tmp/p.js | sed -n "${r}p"; done
          for r in '1860,2035' '2140,2265' '2260,2395' '2440,2515'; do echo "=== HOT RANGE $r ==="; nl -ba /tmp/h.js | sed -n "${r}p"; done
      - name: Browser hit-test and keyboard audit
        shell: bash
        run: |
          set -Eeuo pipefail
          npm init -y >/dev/null 2>&1; npm install --silent puppeteer-core
          CHROME="$(command -v google-chrome || command -v chromium)"; export CHROME
          node <<'NODE'
          const pptr=require('puppeteer-core');
          (async()=>{const b=await pptr.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          for(const [name,w,h,m] of [['desktop',1440,1000,false],['mobile',390,844,true]]){const p=await b.newPage();await p.setViewport({width:w,height:h,isMobile:m,hasTouch:m});await p.goto('https://sikhadenge.in/gen-ai-masterclass/register-one-step?source=claude-masterclass&occ='+Date.now(),{waitUntil:'networkidle2',timeout:60000});await new Promise(r=>setTimeout(r,4000));
          const s=await p.evaluate(()=>{const n=x=>(x||'').replace(/\s+/g,' ').trim();const btns=[...document.querySelectorAll('button,input[type=submit]')],old=btns.find(e=>/Register for\s*₹1999/i.test(n(e.textContent||e.value))),neu=btns.find(e=>/Continue\s*—\s*2 quick questions/i.test(n(e.textContent||e.value))),root=neu?.closest('[id]')||neu?.closest('.sdv2-wrap')?.parentElement;const r=old.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,top=document.elementFromPoint(x,y);const chain=[];for(let e=top;e&&chain.length<6;e=e.parentElement)chain.push({tag:e.tagName,id:e.id||'',cls:typeof e.className==='string'?e.className:'',text:n(e.textContent).slice(0,120)});return {oldCenter:[Math.round(x),Math.round(y)],topAtOldCenter:chain,root:{id:root?.id||'',cls:root?.className||'',z:getComputedStyle(root).zIndex,position:getComputedStyle(root).position},old:{tabindex:old.tabIndex,disabled:old.disabled,ariaHidden:old.getAttribute('aria-hidden'),inert:old.inert,formAriaHidden:old.closest('form')?.getAttribute('aria-hidden'),formInert:old.closest('form')?.inert},nativeMain:{ariaHidden:document.querySelector('main.jsx-2cf9d7bc188cfd41')?.getAttribute('aria-hidden'),inert:document.querySelector('main.jsx-2cf9d7bc188cfd41')?.inert},overflow:getComputedStyle(document.documentElement).overflow};});
          const focus=[];for(let i=0;i<18;i++){await p.keyboard.press('Tab');focus.push(await p.evaluate(()=>{const e=document.activeElement;return {tag:e?.tagName,id:e?.id||'',ph:e?.getAttribute?.('placeholder')||'',text:(e?.textContent||e?.value||'').replace(/\s+/g,' ').trim().slice(0,100)}}));}console.log('OCCLUSION',name,JSON.stringify({s,focus}));await p.close();}await b.close();console.log('V72_OCCLUSION_TRACE_PASS')})().catch(e=>{console.error(e);process.exit(1)});
          NODE
