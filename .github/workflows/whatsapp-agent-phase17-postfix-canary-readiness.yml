name: WhatsApp Agent Phase17 Postfix Canary Readiness

on:
  push:
    branches:
      - ops/phase17-canary-readiness-20260917
    paths:
      - ".github/workflows/whatsapp-agent-phase17-postfix-canary-readiness.yml"

permissions:
  contents: read

concurrency:
  group: whatsapp-agent-phase17-postfix-canary-readiness
  cancel-in-progress: true

jobs:
  readonly-postfix-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
      EXPECTED_RELEASE_SHA: a297e1e00c817312150686b09225392eac46ec69
    steps:
      - uses: actions/checkout@v4

      - name: Configure pinned production SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          for v in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_HOST_KEY; do test -n "${!v:-}"; done
          if [[ -z "${SSH_PORT:-}" ]]; then echo SSH_PORT=22 >> "$GITHUB_ENV"; SSH_PORT=22; fi
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$key" >/dev/null

      - name: Verify post-fix canary readiness with zero external writes
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "EXPECTED_RELEASE_SHA='$EXPECTED_RELEASE_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          APP=/var/www/sikhadenge-whatsapp-agent/source/apps/whatsapp-agent-dashboard
          cd "$APP"
          test "$(git rev-parse HEAD)" = "$EXPECTED_RELEASE_SHA"
          test "$(git status --porcelain --untracked-files=no | sed '/^$/d' | wc -l | tr -d ' ')" = "0"
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://whatsapp.sikhadenge.in/login)" = "200"
          test "$(pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);process.stdout.write(a.find(x=>x.name==="sikhadenge-whatsapp-agent")?.pm2_env?.status||"")})')" = "online"

          set -a; source .env; set +a
          test "${WHATSAPP_OUTBOUND_MODE:-disabled}" != "live"
          test "${WHATSAPP_CUTOVER_APPROVED:-false}" != "true"
          test -z "${WHATSAPP_OUTBOUND_LIVE_ACK:-}"
          test "${WHATSAPP_OUTBOUND_KILL_SWITCH:-on}" = "on"

          parity="$(npx tsx scripts/engageos-whatsapp-provider-binding-reconcile.ts)"
          printf '%s\n' "$parity"
          printf '%s' "$parity" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const o=JSON.parse(s); if(o.mode!=="DRY_RUN"||o.contactsScanned!==2168||o.mappingsNeedingRepairBefore!==0||o.mappingsNeedingRepairAfter!==0||o.externalWhatsAppWriteSent!==false||o.parityPassed!==true) process.exit(2); console.log("PASS: PROVIDER_BINDING_PARITY");})'

          npx tsx tests/engageos-phase17-g1-outbound-guard.test.ts

          snapshot="$(node - <<'NODE'
          const {PrismaClient}=require('@prisma/client'); const p=new PrismaClient();
          (async()=>{const [state,queued,approvals,flows,ledger,conn]=await Promise.all([
            p.engageControlledLaunchState.findUnique({where:{workspaceId:'engagews_default'}}),
            p.whatsAppMessage.count({where:{direction:'OUTBOUND',status:'QUEUED'}}),
            p.engageControlledLaunchOutboundApproval.count({where:{workspaceId:'engagews_default',consumedAt:null,revokedAt:null,expiresAt:{gt:new Date()}}}),
            p.engageControlledLaunchApprovedFlow.count({where:{workspaceId:'engagews_default',revokedAt:null}}),
            p.engageControlledLaunchAutopilotRecipient.count({where:{workspaceId:'engagews_default'}}),
            p.engageChannelConnection.findFirst({where:{workspaceId:'engagews_default',channel:'WHATSAPP',status:{in:['CONNECTED','DEGRADED']}},select:{id:true,externalAccountId:true,status:true}}),
          ]); const scope=state?.scope||{}; console.log(JSON.stringify({state:[state?.stage,state?.mode,state?.writePolicy,state?.externalWritesAllowed,scope.externalWritesRequested,state?.version].join('|'),queued,approvals,flows,ledger,connectionActive:Boolean(conn),connectionStatus:conn?.status||null}));})().finally(()=>p.$disconnect());
          NODE
          )"
          printf '%s\n' "$snapshot"
          printf '%s' "$snapshot" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const o=JSON.parse(s); if(o.state!=="ONE_CONNECTED_ACCOUNT|SHADOW|NO_EXTERNAL_WRITES|false|false|2"||o.queued!==0||o.approvals!==0||o.flows!==0||o.ledger!==0||!o.connectionActive) process.exit(2); console.log("PASS: POSTFIX_CANARY_READINESS_STATE");})'
          printf 'EXTERNAL_WRITE_SENT=false\n'
          printf 'PASS: PHASE17_POSTFIX_CANARY_READINESS\n'
          REMOTE
