name: B2B Partner Intake CI

on:
  pull_request:
    paths:
      - "app/enroll/**"
      - "pages/api/b2b/enroll/**"
      - "lib/b2b-intake-config.ts"
      - "docs/B2B_PARTNER_INTAKE.md"
      - ".github/workflows/b2b-partner-intake-ci.yml"
  push:
    branches: [main]
    paths:
      - "app/enroll/**"
      - "pages/api/b2b/enroll/**"
      - "lib/b2b-intake-config.ts"
      - "docs/B2B_PARTNER_INTAKE.md"
      - ".github/workflows/b2b-partner-intake-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, Linux, X64, sikhadenge-ci]
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: package-lock.json
          package-manager-cache: false

      - name: Install exact dependencies
        run: npm ci

      - name: TypeScript gate
        run: npx tsc --noEmit

      - name: Production build gate
        run: npm run build
