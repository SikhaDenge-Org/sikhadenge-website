name: Diagnose Claude Build Alignment 20260903

on:
  push:
    paths:
      - .github/workflows/diagnose-claude-build-alignment-20260903.yml

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, sikhadenge-ci]
    timeout-minutes: 10
    environment: whatsapp-agent-production
    steps:
      - name: Inspect public SSR and client page bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          URL='https://sikhadenge.in/masterclass/claude/free?v=build-align-20260903'
          curl -fsS --max-time 30 "$URL" -o public.html
          python3 - <<'PY'
          from pathlib import Path
          import re,json,html
          s=Path('public.html').read_text(errors='replace')
          print('HTML_BYTES',len(s))
          for needle in ['Master 25+ AI Tools','Build deeper work with','Why join this course?','Specially designed for working professionals','Move from quick answers to structured, reviewable work.']:
              print('SSR_HAS',repr(needle), needle in s)
          m=re.search(r'<script id="__NEXT_DATA__" type="application/json">(.*?)</script>',s,re.S)
          if m:
              d=json.loads(html.unescape(m.group(1)))
              print('BUILD_ID',d.get('buildId'))
              print('PAGE',d.get('page'))
          scripts=re.findall(r'<script[^>]+src="([^"]+)"',s)
          page=[u for u in scripts if '/_next/static/chunks/pages/' in u and ('claude' in u or 'masterclass' in u)]
          print('PAGE_SCRIPTS',json.dumps(page))
          Path('page-scripts.txt').write_text('\n'.join(page))
          PY
          while IFS= read -r u; do
            [[ -n "$u" ]] || continue
            case "$u" in http*) full="$u";; *) full="https://sikhadenge.in$u";; esac
            echo "--- BUNDLE $full"
            curl -fsS --max-time 30 "$full" -o bundle.js
            wc -c bundle.js
            python3 - <<'PY'
          from pathlib import Path
          s=Path('bundle.js').read_text(errors='replace')
          for needle in ['Master 25+ AI Tools','Build deeper work with','Why join this course?','Specially designed for working professionals','Move from quick answers to structured, reviewable work.','CURRENT BATCH ADVANTAGE']:
              print('BUNDLE_HAS',repr(needle),needle in s)
          PY
          done < page-scripts.txt

      - name: Inspect production exact route and local upstream read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${SSH_PORT:-}" ]] || SSH_PORT=22
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"; test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          ssh -p "$SSH_PORT" -i "$KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/etc/nginx/sites-enabled/sikhadenge.in-ssl')
          s=p.read_text()
          route='location = /masterclass/claude/free {'
          a=s.find(route); b=s.find('\n    }',a)
          seg=s[a:b+6] if a>=0 and b>=0 else ''
          print('ROUTE_BEGIN'); print(seg); print('ROUTE_END')
          m=re.search(r'proxy_pass\s+([^;]+);',seg)
          print('PROXY_PASS',m.group(1) if m else 'NONE')
          if m:
              print('UPSTREAM_HINT',m.group(1))
          PY
          echo 'PM2_BEGIN'
          export PM2_HOME=/root/.pm2
          pm2 jlist 2>/dev/null | python3 -c 'import json,sys; d=json.load(sys.stdin); print("\n".join(f"{x.get("name")} pid={x.get("pid")} cwd={x.get("pm2_env",{}).get("pm_cwd")} script={x.get("pm2_env",{}).get("pm_exec_path")} status={x.get("pm2_env",{}).get("status")}" for x in d))' || true
          echo 'PM2_END'
          REMOTE

      - name: Upload diagnostic text
        uses: actions/upload-artifact@v4
        with:
          name: claude-build-alignment-20260903
          path: |
            public.html
            page-scripts.txt
            bundle.js
          retention-days: 1
