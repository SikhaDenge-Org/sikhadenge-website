name: Verify Home Single Scroll Live 20260904
on:
  push:
    paths:
      - '.github/workflows/verify-home-single-scroll-live-20260904.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, sikhadenge-ci]
    timeout-minutes: 12
    steps:
      - name: Clean Chrome live verification
        shell: bash
        run: |
          set -Eeuo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          TMP="$(mktemp -d)"
          cd "$TMP"
          npm init -y >/dev/null 2>&1
          npm install playwright-core@1.55.0 --no-save >/dev/null 2>&1
          echo '' | base64 -d > qa.js
          CHROME="$CHROME" node qa.js
