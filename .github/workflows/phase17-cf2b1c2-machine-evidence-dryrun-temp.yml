name: Phase17 cf2b1c2 Machine Evidence Dry Run Temp
on:
  push:
    branches:
      - ops/phase17-cf2b1c2-readonly-validation-20260917
    paths:
      - .github/workflows/phase17-cf2b1c2-machine-evidence-dryrun-temp.yml
permissions:
  contents: read
jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
    steps:
      - name: Configure pinned production SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          for v in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_HOST_KEY; do test -n "${!v:-}"; done
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; echo "SSH_PORT=22" >> "$GITHUB_ENV"; fi
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$key" >/dev/null
      - name: Dry-run exact-SHA machine evidence recorder
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          A=/var/www/sikhadenge-whatsapp-agent/source/apps/whatsapp-agent-dashboard
          E="$A/.env"
          envv(){ node - "$E" "$1" <<'NODE'
          const fs=require('node:fs'); const [file,key]=process.argv.slice(2); for(const raw of fs.readFileSync(file,'utf8').split(/\r?\n/)){ let line=raw.trim(); if(!line||line.startsWith('#')) continue; if(line.startsWith('export ')) line=line.slice(7).trim(); const i=line.indexOf('='); if(i<1||line.slice(0,i).trim()!==key) continue; let v=line.slice(i+1).trim(); if(v.length>=2&&((v.startsWith('"')&&v.endsWith('"'))||(v.startsWith("'")&&v.endsWith("'")))) v=v.slice(1,-1); process.stdout.write(v); process.exit(0);} process.exit(1);
          NODE
          }
          cd "$A"
          live="$(git rev-parse HEAD)"
          dirty="$(git status --porcelain --untracked-files=no | sed '/^$/d' | wc -l | tr -d ' ')"
          printf 'LIVE_SHA=%s\nTRACKED_DIRTY_COUNT=%s\n' "$live" "$dirty"
          test "$live" = 'cf2b1c2f7bd66f8b7037e51240b1f84f8ce95484'
          test "$dirty" = '0'
          printf 'OUTBOUND_MODE=%s\n' "$(envv WHATSAPP_OUTBOUND_MODE 2>/dev/null || echo disabled)"
          printf 'CUTOVER=%s\n' "$(envv WHATSAPP_CUTOVER_APPROVED 2>/dev/null || echo false)"
          printf 'KILL_SWITCH=%s\n' "$(envv WHATSAPP_OUTBOUND_KILL_SWITCH 2>/dev/null || echo on)"
          database_url="$(envv DATABASE_URL)"
          NODE_ENV=production DATABASE_URL="$database_url" PHASE17_WORKSPACE_ID=engagews_default PHASE17_EXPECTED_LIVE_SHA='cf2b1c2f7bd66f8b7037e51240b1f84f8ce95484' PHASE17_PRODUCTION_RUN_ID='35214932774' PHASE17_PRODUCTION_RUN_NUMBER='152' PHASE17_POLICY_RUN_ID='35215488050' PHASE17_POLICY_COMMIT_SHA='cf2b1c2f7bd66f8b7037e51240b1f84f8ce95484' npx --no-install tsx scripts/engageos-phase17-stage2-record-machine-evidence.ts
          printf 'STATE_MUTATED=false\nEXTERNAL_WHATSAPP_WRITE_SENT=false\n'
          REMOTE
