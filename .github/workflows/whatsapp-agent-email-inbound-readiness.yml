name: WhatsApp Agent Email Inbound Readiness

on:
  push:
    branches:
      - release/whatsapp-instagram-agent-flow-20260731
    paths:
      - "apps/whatsapp-agent-dashboard/docs/email-inbound-live-readiness-trigger.md"
  workflow_dispatch:
    inputs:
      deployed_sha:
        description: Optional exact deployed SHA assertion; leave empty to discover live runtime
        required: false
        type: string

permissions:
  contents: read

jobs:
  email-inbound-readiness:
    concurrency:
      group: whatsapp-agent-email-inbound-readiness
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
      REQUESTED_DEPLOYED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.deployed_sha || '' }}
      AUDIT_RUN_ID: email-inbound-readiness-${{ github.run_id }}-${{ github.run_attempt }}
      ACTIVATION_WORKSPACE_ID: engagews_default
    steps:
      - name: Validate trigger and production secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -n "$REQUESTED_DEPLOYED_SHA" ]]; then
            [[ "$REQUESTED_DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]]
          fi
          [[ "$ACTIVATION_WORKSPACE_ID" == "engagews_default" ]]
          missing=0
          for variable_name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_HOST_KEY; do
            [[ -n "${!variable_name:-}" ]] || { echo "Missing production secret: $variable_name" >&2; missing=1; }
          done
          test "$missing" = "0"
          if [[ -z "${SSH_PORT:-}" ]]; then echo 'SSH_PORT=22' >> "$GITHUB_ENV"; fi

      - name: Configure pinned SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$key" >/dev/null

      - name: Audit production inbound readiness
        shell: bash
        run: |
          set -o pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "REQUESTED_DEPLOYED_SHA='$REQUESTED_DEPLOYED_SHA' RUN_ID='$AUDIT_RUN_ID' WORKSPACE_ID='$ACTIVATION_WORKSPACE_ID' bash -s" <<'REMOTE' | tee email-inbound-readiness.log
          set -Eeuo pipefail
          APP=/var/www/sikhadenge-whatsapp-agent/source/apps/whatsapp-agent-dashboard
          BACKUP=/root/sikhadenge-backups/$RUN_ID
          test "$(id -u)" = "0"
          cd "$APP"
          install -d -m 700 "$BACKUP"

          DEPLOYED_SHA="$(git rev-parse HEAD)"
          [[ "$DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ -n "${REQUESTED_DEPLOYED_SHA:-}" ]]; then
            test "$DEPLOYED_SHA" = "$REQUESTED_DEPLOYED_SHA"
          fi

          latest_evidence=""
          latest_mtime=0
          shopt -s nullglob
          for candidate in /root/sikhadenge-backups/engageos-github-*/post-deploy-evidence.txt; do
            candidate_mtime="$(stat -c %Y "$candidate" 2>/dev/null || printf '0')"
            if [[ "$candidate_mtime" =~ ^[0-9]+$ ]] && (( candidate_mtime > latest_mtime )); then
              latest_mtime="$candidate_mtime"
              latest_evidence="$candidate"
            fi
          done
          shopt -u nullglob
          test -n "$latest_evidence"
          read_evidence_value() {
            local key="$1"
            awk -F= -v key="$key" '$1 == key {sub(/^[^=]*=/, ""); print; exit}' "$latest_evidence"
          }
          CERTIFIED_RELEASE_SHA="$(read_evidence_value RELEASE_SHA)"
          CERTIFIED_BUILD_ID="$(read_evidence_value BUILD_ID)"
          CERTIFIED_PM2_STATUS="$(read_evidence_value PM2_STATUS)"
          CERTIFIED_PM2_CWD="$(read_evidence_value PM2_CWD)"
          LIVE_BUILD_ID="$(cat "$APP/.next/BUILD_ID")"
          test "$CERTIFIED_RELEASE_SHA" = "$DEPLOYED_SHA"
          test -n "$CERTIFIED_BUILD_ID"
          test "$CERTIFIED_PM2_STATUS" = "online"
          test "$LIVE_BUILD_ID" = "$CERTIFIED_BUILD_ID"

          PM2_SNAPSHOT="$(mktemp)"
          trap 'rm -f "$PM2_SNAPSHOT"' EXIT
          pm2 jlist > "$PM2_SNAPSHOT"
          IFS='|' read -r START_PM2_PID START_PM2_STATUS START_PM2_CWD < <(
            node - "$PM2_SNAPSHOT" <<'NODE'
          const fs=require('node:fs');
          const rows=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const p=rows.find(x=>x.name==='sikhadenge-whatsapp-agent');
          process.stdout.write(p ? [p.pid||'',p.pm2_env?.status||'',p.pm2_env?.pm_cwd||''].join('|') + '\n' : '||\n');
          NODE
          )
          test "$START_PM2_STATUS" = "online"
          test -n "$START_PM2_PID"
          test "$START_PM2_CWD" = "$CERTIFIED_PM2_CWD"
          test "$(cat "$START_PM2_CWD/.next/BUILD_ID")" = "$CERTIFIED_BUILD_ID"

          printf 'DISCOVERED_DEPLOYED_SHA=%s\n' "$DEPLOYED_SHA"
          printf 'CERTIFIED_BUILD_ID=%s\n' "$CERTIFIED_BUILD_ID"
          printf 'START_PM2_PID=%s\n' "$START_PM2_PID"

          set -a
          source "$APP/.env"
          set +a
          set +e
          EXPECTED_RELEASE_SHA="$DEPLOYED_SHA" EMAIL_INBOUND_ACTIVATION_WORKSPACE_ID="$WORKSPACE_ID" npx tsx scripts/email-inbound-production-readiness.ts | tee "$BACKUP/inbound-readiness.json"
          readiness_code=${PIPESTATUS[0]}
          set -e

          END_DEPLOYED_SHA="$(git rev-parse HEAD)"
          END_BUILD_ID="$(cat "$APP/.next/BUILD_ID")"
          pm2 jlist > "$PM2_SNAPSHOT"
          IFS='|' read -r END_PM2_PID END_PM2_STATUS END_PM2_CWD < <(
            node - "$PM2_SNAPSHOT" <<'NODE'
          const fs=require('node:fs');
          const rows=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const p=rows.find(x=>x.name==='sikhadenge-whatsapp-agent');
          process.stdout.write(p ? [p.pid||'',p.pm2_env?.status||'',p.pm2_env?.pm_cwd||''].join('|') + '\n' : '||\n');
          NODE
          )
          stable_code=0
          if [[ "$END_DEPLOYED_SHA" != "$DEPLOYED_SHA" || "$END_BUILD_ID" != "$CERTIFIED_BUILD_ID" || "$END_PM2_PID" != "$START_PM2_PID" || "$END_PM2_STATUS" != "online" || "$END_PM2_CWD" != "$START_PM2_CWD" ]]; then
            stable_code=3
          fi
          {
            printf 'READINESS_EXIT_CODE=%s\n' "$readiness_code"
            printf 'RUNTIME_STABLE_EXIT_CODE=%s\n' "$stable_code"
            printf 'DEPLOYED_SHA=%s\n' "$DEPLOYED_SHA"
            printf 'BUILD_ID=%s\n' "$CERTIFIED_BUILD_ID"
          } > "$BACKUP/inbound-readiness-result.txt"
          chmod 600 "$BACKUP"/*
          if (( stable_code != 0 )); then exit "$stable_code"; fi
          exit "$readiness_code"
          REMOTE

      - name: Collect protected readiness evidence
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p email-inbound-readiness-evidence
          for file_name in inbound-readiness.json inbound-readiness-result.txt; do
            scp -P "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ConnectionAttempts=1 \
              "$SSH_USER@$SSH_HOST:/root/sikhadenge-backups/${AUDIT_RUN_ID}/${file_name}" "email-inbound-readiness-evidence/${file_name}" >/dev/null 2>&1 || true
          done
          chmod -R go-rwx email-inbound-readiness-evidence 2>/dev/null || true

      - name: Publish readiness summary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          json_file="email-inbound-readiness-evidence/inbound-readiness.json"
          result_file="email-inbound-readiness-evidence/inbound-readiness-result.txt"
          {
            echo "## Email inbound production readiness"
            echo
            audited_sha="$(awk -F= '/^DISCOVERED_DEPLOYED_SHA=/{print $2}' email-inbound-readiness.log | tail -1 || true)"
            if [[ -z "$audited_sha" ]]; then audited_sha="${REQUESTED_DEPLOYED_SHA:-unknown}"; fi
            echo "- Audited SHA: \`$audited_sha\`"
            if [[ -f "$json_file" ]]; then
              status="$(jq -r '.status // "UNKNOWN"' "$json_file")"
              account="$(jq -r '.activationAccount // "unknown"' "$json_file")"
              workspace="$(jq -r '.activationWorkspaceId // "unknown"' "$json_file")"
              mode="$(jq -r '.inboundMode // "unknown"' "$json_file")"
              runtime="$(jq -r '.runtimeMode // "unknown"' "$json_file")"
              sync="$(jq -r '.inboundSyncEnabled // false' "$json_file")"
              access="$(jq -r '.checks.gmailInboundReadAccess // false' "$json_file")"
              cursor="$(jq -r '.cursorReadyGmailConnections // 0' "$json_file")"
              echo "- Status: **$status**"
              echo "- Activation account: \`$account\`"
              echo "- Activation workspace: \`$workspace\`"
              echo "- Inbound mode: \`$mode\`"
              echo "- Runtime mode: \`$runtime\`"
              echo "- Inbound sync enabled: \`$sync\`"
              echo "- Gmail read access: \`$access\`"
              echo "- Cursor-ready Gmail connections: \`$cursor\`"
              echo
              echo "### Blockers"
              blockers="$(jq -r '.blockers[]? // empty' "$json_file")"
              if [[ -n "$blockers" ]]; then
                while IFS= read -r blocker; do echo "- $blocker"; done <<< "$blockers"
              else
                echo "- None"
              fi
            else
              echo "- Status: **NO_EVIDENCE**"
              echo "- Readiness evidence was not collected."
            fi
            if [[ -f "$result_file" ]]; then
              echo
              echo "- $(cat "$result_file")"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload protected readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-agent-email-inbound-readiness-${{ env.AUDIT_RUN_ID }}
          path: |
            email-inbound-readiness.log
            email-inbound-readiness-evidence
          if-no-files-found: error
          retention-days: 14
