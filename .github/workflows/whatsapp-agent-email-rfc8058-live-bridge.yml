# Activation checkpoint: 2026-09-23 retry-3
name: Email RFC8058 Live Bridge

on:
  push:
    branches:
      - release/whatsapp-instagram-agent-flow-20260731
    paths:
      - .github/workflows/whatsapp-agent-email-rfc8058-live-bridge.yml

permissions:
  contents: read

concurrency:
  group: whatsapp-agent-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
      EXPECTED_OLD_SHA: 4e4bcb0119f2096ee2f95c95862c5c0d797c1021
      TARGET_REF: production/email-rfc8058-20260923
      TARGET_SHA: e3b9289abb92217bfdcf26d9f4097895106a956b
      EXPECTED_GMAIL_MIME_BLOB: e4fc52f4c353fc282862192c4c4ccef995dad0bd
      EXPECTED_UNSUB_ROUTE_BLOB: 667870f367f31e7cf3ec09e3d203cc2c45035315
      EXPECTED_UNSUB_SERVICE_BLOB: 4b302af6ce8e317251ed35a3a2dd0209077c62eb
      REVIEWED_EMAIL_INTERNAL_TEST_SHA256: d7dc9e6950379aca830830680778d71fc083bfeaa5fea67dd3117fc0696eda0e
      REVIEWED_EMAIL_READINESS_SHA256: a3c15e6b03e31ed9f4df38391a737a56a36625ae89c36f185a3d7df13fa8254c

    steps:
      - name: Configure pinned production SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          for variable_name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_HOST_KEY; do
            test -n "${!variable_name:-}"
          done
          if [[ -z "${SSH_PORT:-}" ]]; then
            SSH_PORT=22
            echo 'SSH_PORT=22' >> "$GITHUB_ENV"
          fi
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/email-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Execute reviewed Email-only hotfix on exact live lineage
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/email-production" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            "$SSH_USER@$SSH_HOST" \
            "EXPECTED_OLD_SHA='$EXPECTED_OLD_SHA' TARGET_REF='$TARGET_REF' TARGET_SHA='$TARGET_SHA' EXPECTED_GMAIL_MIME_BLOB='$EXPECTED_GMAIL_MIME_BLOB' EXPECTED_UNSUB_ROUTE_BLOB='$EXPECTED_UNSUB_ROUTE_BLOB' EXPECTED_UNSUB_SERVICE_BLOB='$EXPECTED_UNSUB_SERVICE_BLOB' REVIEWED_EMAIL_INTERNAL_TEST_SHA256='$REVIEWED_EMAIL_INTERNAL_TEST_SHA256' REVIEWED_EMAIL_READINESS_SHA256='$REVIEWED_EMAIL_READINESS_SHA256' bash -s" <<'REMOTE' | tee email-rfc8058-live-bridge.txt
          set -Eeuo pipefail
          ROOT=/var/www/sikhadenge-whatsapp-agent/source
          cd "$ROOT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_OLD_SHA"
          git fetch --no-tags origin "$TARGET_REF"
          test "$(git rev-parse FETCH_HEAD)" = "$TARGET_SHA"
          deploy_script=/tmp/email-rfc8058-live-deploy-${TARGET_SHA}.sh
          git show "$TARGET_SHA:apps/whatsapp-agent-dashboard/scripts/email-rfc8058-live-deploy.sh" > "$deploy_script"
          chmod 700 "$deploy_script"
          trap 'rm -f "$deploy_script"' EXIT
          bash "$deploy_script"
          rm -f "$deploy_script"
          trap - EXIT
          REMOTE

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email-rfc8058-live-bridge-${{ github.run_id }}-${{ github.run_attempt }}
          path: email-rfc8058-live-bridge.txt
          if-no-files-found: error
          retention-days: 30
