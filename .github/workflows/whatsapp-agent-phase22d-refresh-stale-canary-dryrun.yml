name: WhatsApp Phase22D Refresh Stale Canary And DRY_RUN
# Phase22D retry marker: prior same-push refresh correctly hit the <30m freshness guard; retry preserves the gate.

on:
  push:
    branches:
      - release/whatsapp-instagram-agent-flow-20260731
    paths:
      - .github/workflows/whatsapp-agent-phase22d-refresh-stale-canary-dryrun.yml

permissions:
  contents: read
  issues: write

jobs:
  refresh-and-dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
      VERIFIED_CANARY_WA_ID: ${{ secrets.WHATSAPP_INTERNAL_CANARY_WA_ID }}
      EXPECTED_LIVE_SHA: 4e4bcb0119f2096ee2f95c95862c5c0d797c1021
      EXPECTED_STATE_VERSION: "2"
      STALE_MESSAGE_ID: cmuccwo4y0005kw7qu3800ogx

    steps:
      - name: Checkout reviewed refresh operators
        uses: actions/checkout@v4

      - name: Validate fixed refresh inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$EXPECTED_LIVE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$STALE_MESSAGE_ID" =~ ^[A-Za-z0-9_-]{1,200}$ ]]
          [[ "$VERIFIED_CANARY_WA_ID" =~ ^[0-9]{6,20}$ ]]
          for value in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_HOST_KEY; do
            test -n "${!value:-}"
          done
          if [[ -z "${SSH_PORT:-}" ]]; then
            SSH_PORT=22
            echo 'SSH_PORT=22' >> "$GITHUB_ENV"
          fi
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]

      - name: Configure pinned production SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Transport reviewed refresh and canary executors
        shell: bash
        run: |
          set -Eeuo pipefail
          refresh_local="apps/whatsapp-agent-dashboard/scripts/whatsapp-phase22d-refresh-canary-message.ts"
          canary_local="apps/whatsapp-agent-dashboard/scripts/engageos-phase17-single-message-canary.ts"
          reviewed_email_drift_local="apps/whatsapp-agent-dashboard/scripts/email-inbound-production-readiness.ts"
          test -f "$refresh_local"
          test -f "$canary_local"
          test -f "$reviewed_email_drift_local"
          reviewed_email_drift_sha="$(sha256sum "$reviewed_email_drift_local" | awk '{print $1}')"
          echo "REVIEWED_EMAIL_DRIFT_SHA256=$reviewed_email_drift_sha" >> "$GITHUB_ENV"

          refresh_remote="/var/www/sikhadenge-whatsapp-agent/source/apps/whatsapp-agent-dashboard/scripts/.phase22d-refresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.ts"
          canary_remote="/var/www/sikhadenge-whatsapp-agent/source/apps/whatsapp-agent-dashboard/scripts/.phase22d-canary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.ts"
          refresh_sha="$(sha256sum "$refresh_local" | awk '{print $1}')"
          canary_sha="$(sha256sum "$canary_local" | awk '{print $1}')"

          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "cat > '$refresh_remote'" < "$refresh_local"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "cat > '$canary_remote'" < "$canary_local"

          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "test \"\$(sha256sum '$refresh_remote' | cut -d ' ' -f1)\" = '$refresh_sha' && test \"\$(sha256sum '$canary_remote' | cut -d ' ' -f1)\" = '$canary_sha'"

          echo "REVIEWED_REFRESH_REMOTE=$refresh_remote" >> "$GITHUB_ENV"
          echo "REVIEWED_REFRESH_SHA256=$refresh_sha" >> "$GITHUB_ENV"
          echo "REVIEWED_CANARY_REMOTE=$canary_remote" >> "$GITHUB_ENV"
          echo "REVIEWED_CANARY_SHA256=$canary_sha" >> "$GITHUB_ENV"

      - name: Verify fail-closed runtime before fresh queue
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" \
            "EXPECTED_LIVE_SHA='$EXPECTED_LIVE_SHA' REVIEWED_EMAIL_DRIFT_SHA256='$REVIEWED_EMAIL_DRIFT_SHA256' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          APP=/var/www/sikhadenge-whatsapp-agent/source/apps/whatsapp-agent-dashboard
          cd "$APP"
          live_sha="$(git rev-parse HEAD)"
          tracked_dirty="$(git status --porcelain --untracked-files=no | sed '/^$/d')"
          tracked_dirty_count="$(printf '%s\n' "$tracked_dirty" | sed '/^$/d' | wc -l | tr -d ' ')"
          pm2_state="$(pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);process.stdout.write(a.find(x=>x.name==="sikhadenge-whatsapp-agent")?.pm2_env?.status||"")})')"
          login_http=""
          for attempt in 1 2 3 4 5; do
            login_http="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 https://whatsapp.sikhadenge.in/login || true)"
            if [[ "$login_http" = "200" ]]; then
              break
            fi
            sleep 2
          done
          printf 'PRE_REFRESH_LIVE_SHA=%s\n' "$live_sha"
          printf 'PRE_REFRESH_TRACKED_DIRTY_COUNT=%s\n' "$tracked_dirty_count"
          if [[ "$tracked_dirty_count" != "0" ]]; then
            printf 'PRE_REFRESH_TRACKED_DIRTY_FILES_BEGIN\n%s\nPRE_REFRESH_TRACKED_DIRTY_FILES_END\n' "$tracked_dirty"
          fi
          printf 'PRE_REFRESH_PM2_STATE=%s\nPRE_REFRESH_LOGIN_HTTP=%s\n' "$pm2_state" "$login_http"
          test "$live_sha" = "$EXPECTED_LIVE_SHA"
          if [[ "$tracked_dirty_count" = "0" ]]; then
            printf 'PRE_REFRESH_REVIEWED_EMAIL_DRIFT=false\n'
          else
            allowed_dirty_line=" M apps/whatsapp-agent-dashboard/scripts/email-inbound-production-readiness.ts"
            test "$tracked_dirty_count" = "1"
            test "$tracked_dirty" = "$allowed_dirty_line"
            [[ "$REVIEWED_EMAIL_DRIFT_SHA256" =~ ^[0-9a-f]{64}$ ]]
            live_email_drift_sha="$(sha256sum scripts/email-inbound-production-readiness.ts | awk '{print $1}')"
            printf 'PRE_REFRESH_REVIEWED_EMAIL_DRIFT=true\n'
            printf 'PRE_REFRESH_REVIEWED_EMAIL_DRIFT_SHA256=%s\n' "$live_email_drift_sha"
            test "$live_email_drift_sha" = "$REVIEWED_EMAIL_DRIFT_SHA256"
          fi
          test "$pm2_state" = "online"
          test "$login_http" = "200"

          set -a
          source .env
          set +a
          outbound_mode="${WHATSAPP_OUTBOUND_MODE:-disabled}"
          cutover_approved="${WHATSAPP_CUTOVER_APPROVED:-false}"
          live_ack="${WHATSAPP_OUTBOUND_LIVE_ACK:-}"
          kill_switch="${WHATSAPP_OUTBOUND_KILL_SWITCH:-on}"
          printf 'PRE_REFRESH_OUTBOUND_MODE=%s\nPRE_REFRESH_CUTOVER_APPROVED=%s\nPRE_REFRESH_LIVE_ACK_SET=%s\nPRE_REFRESH_KILL_SWITCH=%s\n' \
            "$outbound_mode" "$cutover_approved" "$([[ -n "$live_ack" ]] && echo true || echo false)" "$kill_switch"
          test "$outbound_mode" != "live"
          test "$cutover_approved" != "true"
          test -z "$live_ack"
          test "$kill_switch" = "on"

          scheduler_outbound="$(pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"[]").find(x=>x.name==="sikhadenge-whatsapp-automation-scheduler");process.stdout.write(String(p?.pm2_env?.WHATSAPP_AUTOMATION_OUTBOUND_DISPATCH_ENABLED??""))})')"
          scheduler_mode="$(pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"[]").find(x=>x.name==="sikhadenge-whatsapp-automation-scheduler");process.stdout.write(String(p?.pm2_env?.WHATSAPP_OUTBOUND_MODE??""))})')"
          scheduler_kill="$(pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"[]").find(x=>x.name==="sikhadenge-whatsapp-automation-scheduler");process.stdout.write(String(p?.pm2_env?.WHATSAPP_OUTBOUND_KILL_SWITCH??""))})')"
          printf 'PRE_REFRESH_SCHEDULER_OUTBOUND=%s\nPRE_REFRESH_SCHEDULER_MODE=%s\nPRE_REFRESH_SCHEDULER_KILL=%s\n' \
            "$scheduler_outbound" "$scheduler_mode" "$scheduler_kill"
          test "$scheduler_outbound" = "false"
          test "$scheduler_mode" = "disabled"
          test "$scheduler_kill" = "on"

          DB="$(node scripts/prisma-postgres-cli-url.mjs "$DATABASE_URL")"
          state="$(psql "$DB" -X -v ON_ERROR_STOP=1 -A -F '|' -t -c "SELECT \"stage\",\"mode\",\"writePolicy\",CASE WHEN \"externalWritesAllowed\" THEN 'true' ELSE 'false' END,COALESCE((\"scope\"->>'externalWritesRequested'),'false'),\"version\" FROM \"EngageControlledLaunchState\" WHERE \"workspaceId\"='engagews_default';")"
          IFS='|' read -r stage mode policy external requested version <<< "$state"
          test "$stage" = "ONE_CONNECTED_ACCOUNT"
          test "$mode" = "SHADOW"
          test "$policy" = "NO_EXTERNAL_WRITES"
          test "$external" = "false"
          test "$requested" = "false"
          printf 'PRE_REFRESH_STATE=%s\nSCHEDULER_OUTBOUND_ISOLATION_VERIFIED=true\n' "$state"
          REMOTE

      - name: Supersede stale canary and queue one fresh internal canary
        id: refresh
        shell: bash
        run: |
          set -Eeuo pipefail
          refresh_output="$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" \
            "EXPECTED_LIVE_SHA='$EXPECTED_LIVE_SHA' STALE_MESSAGE_ID='$STALE_MESSAGE_ID' VERIFIED_CANARY_WA_ID='$VERIFIED_CANARY_WA_ID' REVIEWED_REFRESH_REMOTE='$REVIEWED_REFRESH_REMOTE' REVIEWED_REFRESH_SHA256='$REVIEWED_REFRESH_SHA256' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          APP=/var/www/sikhadenge-whatsapp-agent/source/apps/whatsapp-agent-dashboard
          cd "$APP"
          test "$(git rev-parse HEAD)" = "$EXPECTED_LIVE_SHA"
          [[ "$REVIEWED_REFRESH_REMOTE" == "$APP/scripts/.phase22d-refresh-"*".ts" ]]
          test -f "$REVIEWED_REFRESH_REMOTE"
          test "$(sha256sum "$REVIEWED_REFRESH_REMOTE" | awk '{print $1}')" = "$REVIEWED_REFRESH_SHA256"
          set -a
          source .env
          set +a
          test "${WHATSAPP_OUTBOUND_MODE:-disabled}" != "live"
          test "${WHATSAPP_OUTBOUND_KILL_SWITCH:-on}" = "on"
          PHASE22D_VERIFIED_CANARY_WA_ID="$VERIFIED_CANARY_WA_ID" \
          PHASE22D_STALE_MESSAGE_ID="$STALE_MESSAGE_ID" \
          PHASE22D_REFRESH_CONFIRM=REFRESH_ONE_STALE_INTERNAL_CANARY_MESSAGE \
          npm exec -- tsx "$REVIEWED_REFRESH_REMOTE"
          REMOTE
          )"
          printf '%s\n' "$refresh_output" | tee phase22d-refresh-canary.json
          fresh_message_id="$(printf '%s' "$refresh_output" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const o=JSON.parse(s);if(o.externalWhatsAppWriteSent!==false||o.messageStatus!=="QUEUED"||!o.messageId)process.exit(2);process.stdout.write(o.messageId)})')"
          [[ "$fresh_message_id" =~ ^[A-Za-z0-9_-]{1,200}$ ]]
          echo "FRESH_MESSAGE_ID=$fresh_message_id" >> "$GITHUB_ENV"
          printf 'FRESH_MESSAGE_ID=%s\nEXTERNAL_WHATSAPP_WRITE_SENT=false\n' "$fresh_message_id"

      - name: Run exact fresh canary DRY_RUN
        id: dryrun
        shell: bash
        run: |
          set -Eeuo pipefail
          message_b64="$(printf '%s' "$FRESH_MESSAGE_ID" | base64 -w0)"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" \
            "EXPECTED_LIVE_SHA='$EXPECTED_LIVE_SHA' MESSAGE_B64='$message_b64' VERIFIED_CANARY_WA_ID='$VERIFIED_CANARY_WA_ID' REVIEWED_CANARY_REMOTE='$REVIEWED_CANARY_REMOTE' REVIEWED_CANARY_SHA256='$REVIEWED_CANARY_SHA256' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          APP=/var/www/sikhadenge-whatsapp-agent/source/apps/whatsapp-agent-dashboard
          cd "$APP"
          test "$(git rev-parse HEAD)" = "$EXPECTED_LIVE_SHA"
          [[ "$REVIEWED_CANARY_REMOTE" == "$APP/scripts/.phase22d-canary-"*".ts" ]]
          test -f "$REVIEWED_CANARY_REMOTE"
          test "$(sha256sum "$REVIEWED_CANARY_REMOTE" | awk '{print $1}')" = "$REVIEWED_CANARY_SHA256"
          set -a
          source .env
          set +a

          test "${WHATSAPP_OUTBOUND_MODE:-disabled}" != "live"
          test "${WHATSAPP_CUTOVER_APPROVED:-false}" != "true"
          test -z "${WHATSAPP_OUTBOUND_LIVE_ACK:-}"
          test "${WHATSAPP_OUTBOUND_KILL_SWITCH:-on}" = "on"

          scheduler_outbound="$(pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"[]").find(x=>x.name==="sikhadenge-whatsapp-automation-scheduler");process.stdout.write(String(p?.pm2_env?.WHATSAPP_AUTOMATION_OUTBOUND_DISPATCH_ENABLED??""))})')"
          scheduler_mode="$(pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"[]").find(x=>x.name==="sikhadenge-whatsapp-automation-scheduler");process.stdout.write(String(p?.pm2_env?.WHATSAPP_OUTBOUND_MODE??""))})')"
          scheduler_kill="$(pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"[]").find(x=>x.name==="sikhadenge-whatsapp-automation-scheduler");process.stdout.write(String(p?.pm2_env?.WHATSAPP_OUTBOUND_KILL_SWITCH??""))})')"
          test "$scheduler_outbound" = "false"
          test "$scheduler_mode" = "disabled"
          test "$scheduler_kill" = "on"

          message_id="$(printf '%s' "$MESSAGE_B64" | base64 --decode)"
          DB="$(node scripts/prisma-postgres-cli-url.mjs "$DATABASE_URL")"
          canary_count="$(psql "$DB" -X -v ON_ERROR_STOP=1 -At -c "
            SELECT COUNT(*)
            FROM \"WhatsAppMessage\" m
            JOIN \"WhatsAppConversation\" c ON c.id=m.\"conversationId\"
            JOIN \"WhatsAppContact\" ct ON ct.id=c.\"contactId\"
            WHERE m.id='${message_id}'
              AND m.direction='OUTBOUND'
              AND m.status='QUEUED'
              AND m.type='TEMPLATE'
              AND m.\"metaMessageId\" IS NULL
              AND ct.\"waId\"='$VERIFIED_CANARY_WA_ID'
              AND ct.metadata #>> '{engageos,canary,designated}'='true'
              AND ct.metadata #>> '{engageos,canary,kind}'='INTERNAL_TEST'
              AND m.\"rawPayload\" #>> '{outbound,templateName}'='hello_world'
              AND m.\"rawPayload\" #>> '{outbound,idempotencyKey}' LIKE 'phase22d-internal-canary:%';")"
          test "$canary_count" = "1"

          parity="$(npx tsx scripts/engageos-whatsapp-provider-binding-reconcile.ts)"
          printf '%s\n' "$parity"
          printf '%s' "$parity" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const o=JSON.parse(s);if(o.mode!=="DRY_RUN"||!Number.isInteger(o.contactsScanned)||o.contactsScanned<1||o.mappingsNeedingRepairBefore!==0||o.mappingsNeedingRepairAfter!==0||o.externalWhatsAppWriteSent!==false||o.parityPassed!==true)process.exit(2);console.log("PASS: PROVIDER_BINDING_PARITY contactsScanned="+o.contactsScanned);})'
          npx tsx tests/engageos-phase17-g1-outbound-guard.test.ts

          PHASE17_CANARY_MODE=DRY_RUN \
          PHASE17_CANARY_WORKSPACE_ID=engagews_default \
          PHASE17_CANARY_MESSAGE_ID="$message_id" \
          npm exec -- tsx "$REVIEWED_CANARY_REMOTE"
          printf 'EXTERNAL_WHATSAPP_WRITE_SENT=false\n'
          printf 'PASS: PHASE22D_FRESH_CANARY_DRY_RUN\n'
          REMOTE

      - name: Final fail-closed production verification
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          message_b64="$(printf '%s' "${FRESH_MESSAGE_ID:-}" | base64 -w0)"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" \
            "EXPECTED_LIVE_SHA='$EXPECTED_LIVE_SHA' MESSAGE_B64='$message_b64' VERIFIED_CANARY_WA_ID='$VERIFIED_CANARY_WA_ID' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          APP=/var/www/sikhadenge-whatsapp-agent/source/apps/whatsapp-agent-dashboard
          cd "$APP"
          test "$(git rev-parse HEAD)" = "$EXPECTED_LIVE_SHA"
          set -a
          source .env
          set +a
          test "${WHATSAPP_OUTBOUND_MODE:-disabled}" != "live"
          test "${WHATSAPP_CUTOVER_APPROVED:-false}" != "true"
          test -z "${WHATSAPP_OUTBOUND_LIVE_ACK:-}"
          test "${WHATSAPP_OUTBOUND_KILL_SWITCH:-on}" = "on"

          scheduler_outbound="$(pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"[]").find(x=>x.name==="sikhadenge-whatsapp-automation-scheduler");process.stdout.write(String(p?.pm2_env?.WHATSAPP_AUTOMATION_OUTBOUND_DISPATCH_ENABLED??""))})')"
          scheduler_mode="$(pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"[]").find(x=>x.name==="sikhadenge-whatsapp-automation-scheduler");process.stdout.write(String(p?.pm2_env?.WHATSAPP_OUTBOUND_MODE??""))})')"
          scheduler_kill="$(pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"[]").find(x=>x.name==="sikhadenge-whatsapp-automation-scheduler");process.stdout.write(String(p?.pm2_env?.WHATSAPP_OUTBOUND_KILL_SWITCH??""))})')"
          test "$scheduler_outbound" = "false"
          test "$scheduler_mode" = "disabled"
          test "$scheduler_kill" = "on"

          DB="$(node scripts/prisma-postgres-cli-url.mjs "$DATABASE_URL")"
          state="$(psql "$DB" -X -v ON_ERROR_STOP=1 -A -F '|' -t -c "SELECT \"stage\",\"mode\",\"writePolicy\",CASE WHEN \"externalWritesAllowed\" THEN 'true' ELSE 'false' END,COALESCE((\"scope\"->>'externalWritesRequested'),'false'),\"version\" FROM \"EngageControlledLaunchState\" WHERE \"workspaceId\"='engagews_default';")"
          printf 'FINAL_CONTROLLED_LAUNCH_STATE=%s\n' "$state"
          IFS='|' read -r stage mode policy external requested version <<< "$state"
          test "$stage" = "ONE_CONNECTED_ACCOUNT"
          test "$mode" = "SHADOW"
          test "$policy" = "NO_EXTERNAL_WRITES"
          test "$external" = "false"
          test "$requested" = "false"

          message_id="$(printf '%s' "$MESSAGE_B64" | base64 --decode)"
          if [[ -n "$message_id" ]]; then
            approvals="$(psql "$DB" -X -v ON_ERROR_STOP=1 -Atqc "SELECT COUNT(*) FROM \"EngageControlledLaunchOutboundApproval\" WHERE \"workspaceId\"='engagews_default' AND \"messageId\"='${message_id}' AND \"consumedAt\" IS NULL AND \"revokedAt\" IS NULL AND \"expiresAt\">NOW();")"
            message_state="$(psql "$DB" -X -v ON_ERROR_STOP=1 -A -F '|' -t -c "SELECT m.\"status\",CASE WHEN m.\"metaMessageId\" IS NULL THEN 'false' ELSE 'true' END FROM \"WhatsAppMessage\" m JOIN \"WhatsAppConversation\" c ON c.id=m.\"conversationId\" JOIN \"WhatsAppContact\" ct ON ct.id=c.\"contactId\" WHERE m.id='${message_id}' AND ct.\"waId\"='$VERIFIED_CANARY_WA_ID';")"
            printf 'ACTIVE_MESSAGE_APPROVALS=%s\nFRESH_CANARY_MESSAGE_STATE=%s\n' "$approvals" "$message_state"
            test "$approvals" = "0"
            test "$message_state" = "QUEUED|false"
          fi

          parity="$(npx tsx scripts/engageos-whatsapp-provider-binding-reconcile.ts)"
          printf '%s' "$parity" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const o=JSON.parse(s);if(o.mappingsNeedingRepairBefore!==0||o.externalWhatsAppWriteSent!==false||o.parityPassed!==true)process.exit(2);console.log("PASS: FINAL_PROVIDER_BINDING_PARITY");})'
          printf 'PASS: PHASE22D_REFRESH_FINAL_SAFETY\n'
          REMOTE

      - name: Record refresh and DRY_RUN evidence
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DRYRUN_OUTCOME: ${{ steps.dryrun.outcome }}
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
        run: |
          set -Eeuo pipefail
          fresh_message_id="${FRESH_MESSAGE_ID:-not-created}"
          {
            printf '## Phase22D fresh internal canary DRY_RUN\n\n'
            printf '%s\n' "- Workflow run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            printf '%s\n' "- Stale message ID: \`$STALE_MESSAGE_ID\`"
            printf '%s\n' "- Fresh message ID: \`$fresh_message_id\`"
            printf '%s\n' "- Refresh step: \`$REFRESH_OUTCOME\`"
            printf '%s\n' "- DRY_RUN step: \`$DRYRUN_OUTCOME\`"
            printf '%s\n\n' "- External WhatsApp provider send requested: **false**"
            printf '%s\n' "The stale internal canary is superseded before the fresh no-send qualification."
          } > phase22d-fresh-dryrun-ledger.md
          gh issue comment 65 -R "$GITHUB_REPOSITORY" --body-file phase22d-fresh-dryrun-ledger.md

      - name: Cleanup reviewed operators
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          if [[ -f "$HOME/.ssh/whatsapp-production" ]]; then
            if [[ -n "${REVIEWED_REFRESH_REMOTE:-}" ]]; then
              ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" \
                -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
                "$SSH_USER@$SSH_HOST" "rm -f '$REVIEWED_REFRESH_REMOTE'" || true
            fi
            if [[ -n "${REVIEWED_CANARY_REMOTE:-}" ]]; then
              ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" \
                -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
                "$SSH_USER@$SSH_HOST" "rm -f '$REVIEWED_CANARY_REMOTE'" || true
            fi
          fi
          exit 0
