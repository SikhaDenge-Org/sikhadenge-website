name: Phase17 Governance Readiness Audit Temp
on:
  push:
    branches:
      - ops/phase17-governance-readiness-audit-20260917
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: whatsapp-agent-production
    concurrency:
      group: whatsapp-agent-production-readonly-audit
      cancel-in-progress: false
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
    steps:
      - name: Configure pinned production SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          for v in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_HOST_KEY; do test -n "${!v:-}"; done
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; echo "SSH_PORT=22" >> "$GITHUB_ENV"; fi
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/whatsapp-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$key" >/dev/null
      - name: Audit production governance readiness read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/whatsapp-production" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          A=/var/www/sikhadenge-whatsapp-agent/source/apps/whatsapp-agent-dashboard
          E="$A/.env"
          envv() {
            node - "$E" "$1" <<'NODE'
          const fs=require('node:fs'); const [file,key]=process.argv.slice(2);
          for(const raw of fs.readFileSync(file,'utf8').split(/\r?\n/)){
            let line=raw.trim(); if(!line||line.startsWith('#')) continue;
            if(line.startsWith('export ')) line=line.slice(7).trim();
            const i=line.indexOf('='); if(i<1||line.slice(0,i).trim()!==key) continue;
            let v=line.slice(i+1).trim();
            if(v.length>=2&&((v.startsWith('"')&&v.endsWith('"'))||(v.startsWith("'")&&v.endsWith("'")))) v=v.slice(1,-1);
            process.stdout.write(v); process.exit(0);
          }
          process.exit(1);
          NODE
          }
          cd "$A"
          live_sha="$(git rev-parse HEAD)"
          dirty="$(git status --porcelain --untracked-files=no | sed '/^$/d' | wc -l | tr -d ' ')"
          printf 'LIVE_SHA=%s\nTRACKED_DIRTY_COUNT=%s\n' "$live_sha" "$dirty"
          printf 'OUTBOUND_MODE=%s\n' "$(envv WHATSAPP_OUTBOUND_MODE 2>/dev/null || echo disabled)"
          printf 'CUTOVER_APPROVED=%s\n' "$(envv WHATSAPP_CUTOVER_APPROVED 2>/dev/null || echo false)"
          printf 'LIVE_ACK_SET='; test -n "$(envv WHATSAPP_OUTBOUND_LIVE_ACK 2>/dev/null || true)" && echo true || echo false
          printf 'PROVIDER_KILL_SWITCH=%s\n' "$(envv WHATSAPP_OUTBOUND_KILL_SWITCH 2>/dev/null || echo on)"
          database_url="$(envv DATABASE_URL)"
          test -n "$database_url"
          dburl="$(node scripts/prisma-postgres-cli-url.mjs "$database_url")"
          psql "$dburl" -X -v ON_ERROR_STOP=1 -Atqc "
          SELECT 'CONTROLLED='||\"stage\"||'|'||\"mode\"||'|'||\"writePolicy\"||'|'||\"externalWritesAllowed\"||'|'||\"version\" FROM \"EngageControlledLaunchState\" WHERE \"workspaceId\"='engagews_default';
          SELECT 'TRANSITIONS='||COUNT(*) FROM \"EngageControlledLaunchTransition\" WHERE \"workspaceId\"='engagews_default';
          SELECT 'CURRENT_SHA_MACHINE_EVIDENCE='||COUNT(*) FROM \"EngageSecurityAuditEvent\" WHERE \"workspaceId\"='engagews_default' AND \"entityId\"='$live_sha' AND \"reasonCode\"='MACHINE_VERIFIED_EXACT_SHA' AND outcome='VERIFIED';
          SELECT 'CURRENT_SHA_OPERATOR_EVIDENCE='||COUNT(*) FROM \"EngageSecurityAuditEvent\" WHERE \"workspaceId\"='engagews_default' AND \"entityId\"='$live_sha' AND \"reasonCode\"='OPERATOR_VERIFIED_EXACT_SHA' AND outcome='VERIFIED';
          SELECT 'QUEUED_OUTBOUND='||COUNT(*) FROM \"WhatsAppMessage\" WHERE direction='OUTBOUND' AND status='QUEUED';
          SELECT 'ACTIVE_EXACT_MESSAGE_APPROVALS='||COUNT(*) FROM \"EngageControlledLaunchOutboundApproval\" WHERE \"workspaceId\"='engagews_default' AND \"consumedAt\" IS NULL AND \"revokedAt\" IS NULL AND \"expiresAt\">CURRENT_TIMESTAMP;
          "
          actions=(
            PHASE17_CRITICAL_INCIDENT_REVIEW
            PHASE17_DUPLICATE_SEND_REVIEW
            PHASE17_ROLLBACK_REHEARSAL
            PHASE17_MONITORING_ACTIVE
            PHASE17_STAGE2_SCOPE_APPROVED
            PHASE17_AUTHENTICATED_SMOKE
            PHASE17_SUPPORT_RUNBOOK_ACTIVE
            PHASE17_OBSERVATION_WINDOW_COMPLETE
          )
          for action in "${actions[@]}"; do
            count="$(psql "$dburl" -X -Atqc "SELECT COUNT(*) FROM \"EngageSecurityAuditEvent\" WHERE \"workspaceId\"='engagews_default' AND \"entityId\"='$live_sha' AND action='$action' AND outcome='VERIFIED' AND \"reasonCode\"='OPERATOR_VERIFIED_EXACT_SHA';")"
            printf 'OPERATOR_GATE_%s=%s\n' "$action" "$count"
          done
          echo 'CURRENT_SHA_VERIFIED_EVENTS_BEGIN'
          psql "$dburl" -X -Atqc "SELECT action||'|'||outcome||'|'||COALESCE(\"reasonCode\",'')||'|ACTOR_PRESENT='||CASE WHEN \"actorId\" IS NULL THEN 'false' ELSE 'true' END FROM \"EngageSecurityAuditEvent\" WHERE \"workspaceId\"='engagews_default' AND \"entityId\"='$live_sha' AND outcome='VERIFIED' ORDER BY action;"
          echo 'CURRENT_SHA_VERIFIED_EVENTS_END'
          echo 'PHASE17_ASSETS_BEGIN'
          git ls-tree -r --name-only HEAD | grep -Ei '(phase17.*(runbook|rollback|observab|smoke|monitor|governance|approval)|support.*runbook|runbook.*support)' | head -120 || true
          echo 'PHASE17_ASSETS_END'
          if test -f tests/engageos-phase17-g2-outbound-approval.test.ts; then
            echo 'G2_TEST_BEGIN'
            npx --no-install tsx tests/engageos-phase17-g2-outbound-approval.test.ts
            echo 'G2_TEST_END'
          else
            echo 'G2_TEST_FILE=false'
          fi
          if test -f scripts/engageos-phase17-approval-only-readiness.ts; then
            echo 'APPROVAL_ONLY_READINESS_SCRIPT=true'
            set +e
            NODE_ENV=production DATABASE_URL="$database_url" PHASE17_WORKSPACE_ID=engagews_default PHASE17_EXPECTED_LIVE_SHA="$live_sha" PHASE17_APPROVAL_ENGINE_PROOF=G2_EXACT_MESSAGE_APPROVAL_FAIL_CLOSED_VERIFIED npx --no-install tsx scripts/engageos-phase17-approval-only-readiness.ts
            rc=$?
            set -e
            printf 'APPROVAL_ONLY_READINESS_EXIT=%s\n' "$rc"
          else
            echo 'APPROVAL_ONLY_READINESS_SCRIPT=false'
          fi
          printf 'STATE_MUTATED=false\nEXTERNAL_WHATSAPP_WRITE_SENT=false\n'
          REMOTE
